openapi: 3.1.0
info:
  title: Nightscout API v4 (proposed)
  version: 0.1.0-proposed
  license:
    name: AGPL 3
    url: https://www.gnu.org/licenses/agpl.txt
  description: |
    **Proposed, not released.** The v4 surface exactly as the platform specifications define it
    (`docs/30-design/platform/spec/`, alignment `main` `6e6223f26`), with the routes that
    cgm-remote-monitor draft PR [#8857](https://github.com/nightscout/cgm-remote-monitor/pull/8857)
    serves at `3be98536` behind `CONTROLLER_REGISTRATION` (off by default). Nothing here is on
    cgm-remote-monitor `dev`. The current API is described beside it in
    `specs/openapi/upstream/cgm-remote-monitor/api-v1.yaml` and `api-v3.yaml`.

    Every operation carries three extensions, also written at the top of its description:

    - `x-status`: `in-pr-8857` (served by #8857 at `3be98536`), `specified` (rules and
      conformance cases, no hub serves it), or `open` (defined elsewhere in this repository, with
      its path or placement undecided).
    - `x-spec-rules`: the rule and section ids the operation implements.
    - `x-listener`: the listener that serves it, from authority AU2 (decision D16): `data` is
      `ns-api` (devices, clients, viewers), `tenant-admin` is `ns-tenant-admin` (the tenant owner,
      a second bound socket inside `ns-api`), `operator` is `ns-admin`. Under
      `TENANCY_MODE=single` there is one listener and the owner's actions are taken there with
      `API_SECRET` (`x-single`). No v4 operation in the specifications is served on `operator`.

    Paths and permission names are proposals, as the specifications say. Bodies are the JSON
    Schemas in `specs/sync/`, referenced rather than copied; the command and proposal bodies have
    no JSON Schema file yet and are written here from the member tables of commands §7.1.

    The statistics operations come from the statistics API proposal, not the platform
    specifications; they are `open` because the proposal writes them under `/api/v3/stats/` and the
    v4 placement is a recommendation, not a decision.

    Operations the specifications describe without a path (typed record writes and reads, the
    plan operations, the owner's view of who acts for the person, the tenant-owner configuration
    surface, the operator's tenant lifecycle) are not listed here; they are in
    `docs/30-design/platform/v4-surface-and-nocturne-2026-10-26.md` as open.
servers:
  - url: https://{site}
    description: >-
      Data listener: `ns-api` under `TENANCY_MODE=multi` (the tenant is resolved from the host),
      or the one listener of a `single` site.
    variables:
      site:
        default: nightscout.example.org
        description: The site's (or the tenant's) host name.
x-tenant-admin-server: &tenantAdminServer
  url: https://{tenantAdmin}
  description: >-
    Tenant-owner listener `ns-tenant-admin`: a second bound socket inside `ns-api` on its own bind
    address (decided 2026-10-16); the address is not specified. On a `single` site this is the one
    listener, with `API_SECRET`.
  variables:
    tenantAdmin:
      default: tenant-admin.example.org
      description: The owner listener's host (and port); deployment-specific.
tags:
  - name: Discovery
    description: >-
      Unauthenticated, cacheable documents about the hub software (registration §2, §4). The same
      on every tenant host; never lists a tenant's registrations.
  - name: Registrations
    description: >-
      The product resource `<submit.href>/<vendor>/<product>`: a controller's registration, keyed
      by (vendor, product) within a tenant (registration §5).
  - name: Definitions and instances
    description: >-
      Content-addressed definitions and leased running copies of a product (registration §7–§9,
      decision D19).
  - name: Owner actions
    description: >-
      The tenant owner's actions on registrations and instances (authority §4). Served on
      `ns-tenant-admin`; on `single`, on the one listener with `API_SECRET`. An owner action on the
      data listener with any other credential is 403 `not-authorised`.
  - name: Commands
    description: >-
      The command record (commands §4, §5, §7). The hub routes and records; it never decides
      whether a change is safe and never alters what was asked (D18).
  - name: Proposals
    description: >-
      A proposal and its approval in front of a command (commands §6).
  - name: Statistics
    description: >-
      Computed reads over stored glucose and treatment records, from the statistics API proposal
      (`docs/sdqctl-proposals/statistics-api-proposal.md`, REQ-STATS-001 to 004), which writes
      them at `/api/v3/stats/*`. Placed here under `/api/v4/statistics/` as the comparison page
      recommends; the placement, the segment name and the time-zone rule are open.
paths:
  /.well-known/nightscout/sync:
    get:
      tags: [Discovery]
      operationId: getSyncCapabilities
      summary: Read the hub capability document
      description: |
        **Status:** in PR #8857 (`lib/registration/index.js:136`, `:157`). **Listener:** data,
        unauthenticated. **Rules:** registration §4, CM31.

        What the hub reads and stores: grammar majors, interpreted members, horizons, type
        keywords, limits, the well-known catalogue, and, when offered, `submit`, `instances` and
        `commands`. A controller reads it at launch and after a controller release, never on a
        timer. #8857 serves no `commands` member, so a controller offers no hub command path.
      x-status: in-pr-8857
      x-spec-rules: [registration §4, CM31]
      x-listener: [data]
      x-credential: none
      security: []
      responses:
        '200':
          description: The capability document. Cache-Control `public, max-age=3600` in #8857.
          content:
            application/json:
              schema:
                $ref: ../../sync/hub-capabilities.schema.json
        '404':
          $ref: '#/components/responses/NotOffered'
  /.well-known/nightscout/controllers:
    get:
      tags: [Discovery]
      operationId: getWellKnownCatalogue
      summary: Read the well-known controller catalogue
      description: |
        **Status:** in PR #8857 (`lib/registration/index.js:137`). **Listener:** data,
        unauthenticated. **Rules:** registration §2, §4 (`wellKnown.catalogue`).

        The index of the well-known registrations the hub ships (generated from measurement), the
        shared slot list and the catalogue mappings for older controller versions.
      x-status: in-pr-8857
      x-spec-rules: [registration §2, registration §4, registration §16 Q2]
      x-listener: [data]
      x-credential: none
      security: []
      responses:
        '200':
          description: >-
            The catalogue index. Its shape is #8857's (`lib/registration/index.js:113-121`); the
            specifications give its members inside the capability document's `wellKnown`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellKnownCatalogue'
        '404':
          $ref: '#/components/responses/NotOffered'
  /.well-known/nightscout/controllers/{kindId}:
    get:
      tags: [Discovery]
      operationId: getWellKnownRegistration
      summary: Read one well-known registration
      description: |
        **Status:** in PR #8857 (`lib/registration/index.js:49`, `:138-140`). **Listener:** data,
        unauthenticated. **Rules:** registration §2, §4 (`wellKnown.kinds[].href`).

        The specifications give each kind an `href`; #8857 serves it at this path, with `kindId`
        one of `loop`, `trio`, `androidaps`.
      x-status: in-pr-8857
      x-spec-rules: [registration §2, registration §4]
      x-listener: [data]
      x-credential: none
      security: []
      parameters:
        - name: kindId
          in: path
          required: true
          description: The catalogue entry's `id`.
          schema:
            type: string
            examples: [loop]
      responses:
        '200':
          description: A well-known registration in the registration grammar.
          content:
            application/json:
              schema:
                $ref: ../../sync/controller-state-model.schema.json
        '404':
          $ref: '#/components/responses/NotOffered'
  /api/v4/registrations/{vendor}/{product}:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    put:
      tags: [Registrations]
      operationId: putRegistration
      summary: Create or update a controller's registration
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:266`). **Listener:** data.
        **Credential:** `api:registrations:create`; an update also needs the binding.
        **Rules:** registration §5.1–§5.4, §6, G1–G5; authority §3, §5, AU4.

        `If-None-Match: *` creates, `If-Match: <etag>` updates; no precondition is 428. Checks run
        in order: authorisation (403), preconditions (428, 412), the owner's block (403
        `blocked-by-owner`), the registration as a whole (422, 413), then each element. The outcome
        is `accepted` or `partial` (201 on create, 200 on update), and the reply names the
        `definitionId` the hub computed. A retry of stored content is a 200 no-op.
      x-status: in-pr-8857
      x-spec-rules: [registration §5.1, registration §5.2, registration §5.3, registration §5.4, AU4, authority §3, authority §5]
      x-listener: [data]
      x-single: one listener; `API_SECRET` may register and is recorded as `api-secret`
      x-credential: api:registrations:create, plus the binding to update
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../sync/controller-state-model.schema.json
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '201':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '413':
          $ref: '#/components/responses/Registration'
        '422':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
    get:
      tags: [Registrations]
      operationId: getRegistration
      summary: Read a registration with its current element results
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:336`; it requires
        `api:registrations:create`). **Listener:** data. **Rules:** registration §5.1, §5.4.

        The stored registration with its element results as evaluated against the hub's current
        capabilities, its binding and credential kind. An element's result can change after a hub
        upgrade while the stored registration and its etag do not.
      x-status: in-pr-8857
      x-spec-rules: [registration §5.1, registration §5.4]
      x-listener: [data]
      x-credential: api:registrations:create
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '404':
          $ref: '#/components/responses/Registration'
    delete:
      tags: [Registrations]
      operationId: retireRegistration
      summary: Retire a registration
      description: |
        **Status:** in PR #8857 for the controller (`lib/registration/products.js:271`); the
        owner's retire is served there as `POST …/retire` instead (see that operation).
        **Listener:** data for the bound controller; tenant-admin for the owner (registration §5.1,
        and `registration-submit.schema.json` `request`: "`retire` is `DELETE`").
        **Credential:** the bound controller with `api:registrations:delete`; or the owner.
        **Rules:** registration §5.1, §5.5; authority §4.

        Retiring sets the state to `retired`, changes the etag, and keeps the declaration, binding
        and stored data; namespaces stay claimed until the owner frees them. `If-Match` required.
      x-status: in-pr-8857
      x-spec-rules: [registration §5.1, registration §5.5, authority §4]
      x-listener: [data, tenant-admin]
      x-single: one listener; the owner is whoever presents `API_SECRET`
      x-credential: api:registrations:delete and the binding (controller); the owner (tenant-admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '404':
          $ref: '#/components/responses/Registration'
        '409':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/definitions/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/definitionId'
    put:
      tags: [Definitions and instances]
      operationId: putDefinition
      summary: Add a definition to a product, immutably
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:277`). **Listener:** data.
        **Credential:** the credential the product is bound to, with `api:registrations:create`.
        **Rules:** registration §7; identity §2; D19.

        `If-None-Match: *` only. The body's hash must equal the path id (422
        `definition-id-mismatch`). The owner never adds one. Adding a definition never changes the
        product resource or its etag; an identical retry is a 200 no-op.
      x-status: in-pr-8857
      x-spec-rules: [registration §7, identity §2, D19]
      x-listener: [data]
      x-credential: api:registrations:create and the product's binding
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../sync/controller-state-model.schema.json
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '201':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '404':
          $ref: '#/components/responses/Registration'
        '409':
          $ref: '#/components/responses/Registration'
        '422':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/instances/{instanceId}:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/instanceId'
    put:
      tags: [Definitions and instances]
      operationId: putInstance
      summary: Create, renew or change an instance
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:283`). **Listener:** data.
        **Credential:** any credential with `api:registrations:create`; an existing instance's
        binding to renew. **Rules:** registration §8–§10, §11; authority §3, §6; identity §2.

        The body names a stored definition, roles `{channel, role, provenance}` and labels. Each
        create or renewal sets `leaseExpiresAt` (capability `instances.leaseSeconds`). A role is
        refused per role (`role-held`, `unknown-channel`, `not-a-command-channel`,
        `not-registration-owner` for a `device` command sink, …), never the instance. The owner
        never writes an instance.
      x-status: in-pr-8857
      x-spec-rules: [registration §8, registration §9, registration §10, authority §3, authority §6, identity §2]
      x-listener: [data]
      x-credential: api:registrations:create; the instance's binding to renew
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../sync/controller-instance.schema.json
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '201':
          $ref: '#/components/responses/Instance'
        '403':
          $ref: '#/components/responses/Instance'
        '404':
          $ref: '#/components/responses/Instance'
        '409':
          $ref: '#/components/responses/Instance'
        '412':
          $ref: '#/components/responses/Instance'
        '422':
          $ref: '#/components/responses/Instance'
        '428':
          $ref: '#/components/responses/Instance'
    delete:
      tags: [Definitions and instances]
      operationId: deleteInstance
      summary: Release an instance and all its roles
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:289`). **Listener:** data.
        **Credential:** the credential the instance is bound to, with `api:registrations:delete`.
        **Rules:** registration §7, §8.

        `If-Match` the instance's etag. Records it wrote keep its id.
      x-status: in-pr-8857
      x-spec-rules: [registration §7, registration §8]
      x-listener: [data]
      x-credential: api:registrations:delete and the instance's binding
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '403':
          $ref: '#/components/responses/Instance'
        '404':
          $ref: '#/components/responses/Instance'
        '412':
          $ref: '#/components/responses/Instance'
        '428':
          $ref: '#/components/responses/Instance'
  /api/v4/registrations/instances:
    get:
      tags: [Owner actions]
      operationId: listInstances
      summary: The owner's listing of instances, overlaps and registrations
      description: |
        **Status:** in PR #8857 at this path (`lib/registration/products.js:295`); authority §4
        names the listing and gives no path. **Listener:** tenant-admin; on `single`,
        `API_SECRET`. **Rules:** authority §4, §8; registration §8, §9.

        Every instance with its roles, labels and liveness; the overlaps (channel, role, claimant,
        holder); `registrations` with `boundTo`, `credentialKind` and `bindingEvent`;
        `slotNameObservations`; observed aliases only with `includeWithheld=true`.
      x-status: in-pr-8857
      x-spec-rules: [authority §4, authority §8, registration §8, registration §9]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - name: includeWithheld
          in: query
          required: false
          description: Include withheld members (observed aliases).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '403':
          $ref: '#/components/responses/Instance'
  /api/v4/registrations/{vendor}/{product}/retire:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    post:
      tags: [Owner actions]
      operationId: ownerRetire
      summary: Retire a registration (the owner, as #8857 serves it)
      description: |
        **Status:** in PR #8857 only (`lib/registration/negotiate.js:742` lists `retire` among the
        owner's `POST` actions). The specifications give the owner's retire as `DELETE` on the
        product resource (registration §5.1; `registration-submit.schema.json` `request`); this
        difference is an open decision on the comparison page. **Listener:** tenant-admin; on
        `single`, `API_SECRET`. **Rules:** authority §4, registration §5.5.
      x-status: in-pr-8857
      x-spec-rules: [authority §4, registration §5.5]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '404':
          $ref: '#/components/responses/Registration'
        '409':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/block:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    post:
      tags: [Owner actions]
      operationId: ownerBlock
      summary: Block a registration, or an identity with nothing stored
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:307`). **Listener:** tenant-admin;
        on `single`, `API_SECRET`. **Rules:** authority §4; registration §5.1, §5.2.

        State `blocked`, recording `blockedFrom`; the controller's writes and typed writes are
        refused 403 `blocked-by-owner`. `If-Match`, or `If-None-Match: *` to block an identity
        with nothing stored.
      x-status: in-pr-8857
      x-spec-rules: [authority §4, registration §5.1, registration §5.2]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/ifNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '201':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/unblock:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    post:
      tags: [Owner actions]
      operationId: ownerUnblock
      summary: Unblock a registration
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:307`). **Listener:** tenant-admin;
        on `single`, `API_SECRET`. **Rules:** authority §4.

        Restores the interrupted state (`active` or `retired`); removes a pre-emptive block; never
        reactivates a retired registration.
      x-status: in-pr-8857
      x-spec-rules: [authority §4]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/release:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    post:
      tags: [Owner actions]
      operationId: ownerRelease
      summary: Release a registration from its subject
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:307`). **Listener:** tenant-admin;
        on `single`, `API_SECRET`. **Rules:** authority §3, §4, §6.

        `boundTo: null`; the next credential with the permission that updates it is bound
        (`bindingEvent: next-writer`). Drops `device` command-sink roles that no longer match.
      x-status: in-pr-8857
      x-spec-rules: [authority §3, authority §4, authority §6]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '428':
          $ref: '#/components/responses/Registration'
  /api/v4/registrations/{vendor}/{product}/transfer:
    parameters:
      - $ref: '#/components/parameters/vendor'
      - $ref: '#/components/parameters/product'
    post:
      tags: [Owner actions]
      operationId: ownerTransfer
      summary: Bind a registration to a named subject
      description: |
        **Status:** in PR #8857 (`lib/registration/products.js:325-331`). **Listener:**
        tenant-admin; on `single`, `API_SECRET`. **Rules:** authority §3, §4, §6.

        Binds to `transferTo`; drops `device` command-sink roles of instances that no longer match
        the binding, except roles granted by `transfer-role`.
      x-status: in-pr-8857
      x-spec-rules: [authority §3, authority §4, authority §6]
      x-listener: [tenant-admin]
      x-single: one listener with `API_SECRET`
      x-credential: the tenant owner
      servers:
        - *tenantAdminServer
      security:
        - tenantOwner: []
        - apiSecret: []
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferTo]
              properties:
                transferTo:
                  $ref: ../../sync/registration-submit.schema.json#/$defs/binding
      responses:
        '200':
          $ref: '#/components/responses/Registration'
        '403':
          $ref: '#/components/responses/Registration'
        '412':
          $ref: '#/components/responses/Registration'
        '422':
