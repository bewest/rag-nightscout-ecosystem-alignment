      tags: [Commands]
      operationId: listOutstanding
      summary: The outstanding list for a channel
      description: |
        **Status:** specified, not served. **Listener:** data. **Credential:**
        `api:commands:read`, `api:commands:create` or `api:proposals:read`. **Rules:** CM24, CM30,
        CM32.

        Every open proposal and every command that is not final on the channel, the doses since,
        and each live holder of the channel's sink with its fetch bound. A follower can see the
        queue without acting on it.
      x-status: specified
      x-spec-rules: [CM24, CM30, CM32]
      x-listener: [data]
