      x-spec-rules: [CM1, CM2, CM3, CM4, CM5, CM6, CM30, CM32]
      x-listener: [data]
      x-credential: api:commands:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandSend'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '201':
          $ref: '#/components/responses/CommandAccepted'
        '403':
          $ref: '#/components/responses/Refusal'
        '404':
          $ref: '#/components/responses/Refusal'
        '409':
          $ref: '#/components/responses/Refusal'
        '413':
          $ref: '#/components/responses/Refusal'
        '422':
          $ref: '#/components/responses/Refusal'
