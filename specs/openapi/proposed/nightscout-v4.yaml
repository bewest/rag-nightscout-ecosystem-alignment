        AU2 puts clients on the data listener). **Credential:** `api:commands:create`.
        **Rules:** CM1–CM6, CM30, CM32; commands §2.

        The hub checks only that the channel accepts commands, the routing, the expiry, the size
        and the sender's permission; it never checks a dose, a limit or the therapy state, and it
        never changes the payload (CM5). A re-send with the same `requestId` answers 200 with the
        first `commandId`.
