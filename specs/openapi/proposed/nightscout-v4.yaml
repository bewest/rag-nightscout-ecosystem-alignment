  /api/v4/statistics/current:
    get:
      tags: [Statistics]
      operationId: getCurrentStatistics
      summary: Current glucose and recent statistics
      description: |
        **Status:** open: REQ-STATS-005 of the statistics API proposal defines it at
        `/api/v3/stats/current`; no platform specification and no
        conformance case covers it. **Listener:** data. **Credential:** read.

        Listed in the proposal's endpoint table and as the `nightscout://stats/current` MCP resource; the proposal gives no response schema.
      x-status: open
      x-listener: [data]
      x-credential: read (`readable` today, AU5; Nocturne's equivalent is `reports.read`)
      x-spec-rules: [REQ-STATS-005]
      parameters:
        - $ref: '#/components/parameters/statsFrom'
        - $ref: '#/components/parameters/statsTo'
        - $ref: '#/components/parameters/statsUnits'
        - $ref: '#/components/parameters/statsTargetLow'
        - $ref: '#/components/parameters/statsTargetHigh'
      responses:
        '200':
          description: The statistics.
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Refusal'
security:
  - subjectToken: []
  - apiSecret: []
components:
  securitySchemes:
    subjectToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A subject's token on the data listener: the native per-tenant credential of a device,
        uploader or client (AU1). Registrations and instances bind to the subject, never the token
        (AU4).
    apiSecret:
      type: apiKey
      in: header
      name: api-secret
      description: >-
        The SHA-1 of `API_SECRET`, on a `single` site only; there is no deployment-wide secret
        under `TENANCY_MODE=multi` (AU3, D13). On `single` it is also the owner's credential.
    tenantOwner:
      type: http
      scheme: bearer
      description: >-
        The tenant owner's credential on `ns-tenant-admin`. Its form is not specified: native
        today, Ory Kratos if D17 row 2 lands (adopted in principle, gated).
  parameters:
    statsFrom:
      name: from
      in: query
      required: false
      description: Start (ISO 8601); default 14 days ago (statistics API proposal).
      schema:
        type: string
        format: date-time
    statsTo:
      name: to
      in: query
      required: false
      description: End (ISO 8601); default now.
      schema:
        type: string
        format: date-time
    statsUnits:
      name: units
      in: query
      required: false
      description: Glucose units; default from the profile.
      schema:
        type: string
        enum: [mg/dL, mmol/L]
    statsTargetLow:
      name: targetLow
      in: query
      required: false
      description: Low threshold; default from the profile.
      schema:
        type: number
    statsTargetHigh:
      name: targetHigh
      in: query
      required: false
      description: High threshold; default from the profile.
      schema:
        type: number
    vendor:
      name: vendor
      in: path
      required: true
      description: The registration's `metadata.vendor`, percent-encoded.
      schema:
        type: string
    product:
      name: product
      in: path
      required: true
      description: The registration's `metadata.product`, percent-encoded.
      schema:
        type: string
    definitionId:
      name: definitionId
      in: path
      required: true
      description: The definition's content address (identity §2).
      schema:
        $ref: ../../sync/controller-instance.schema.json#/$defs/definitionId
    instanceId:
      name: instanceId
      in: path
      required: true
      description: A random lowercase UUID v4 the controller generates once per running copy (identity §2).
      schema:
        $ref: ../../sync/controller-instance.schema.json#/$defs/instanceId
    commandId:
      name: commandId
      in: path
      required: true
      description: The id the hub assigned when it recorded the command (CM1).
      schema:
        type: string
    proposalId:
      name: proposalId
      in: path
      required: true
      description: The id the hub assigned when it recorded the proposal (CM11).
      schema:
        type: string
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: The current etag; quoted or bare. Every write carries exactly one precondition.
      schema:
        type: string
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`*` to create; every write carries exactly one precondition.'
      schema:
        type: string
        const: '*'
  responses:
    NotOffered:
      description: >-
        The hub does not offer this (in #8857, `CONTROLLER_REGISTRATION` is off).
    Registration:
      description: >-
        The registration response: `outcome` `accepted`, `partial`, `rejected`,
        `precondition-failed`, `retired`, `applied` or `not-found`, with reasons, element results
        and the current etag.
      content:
        application/json:
          schema:
            $ref: ../../sync/registration-submit.schema.json#/$defs/response
    Instance:
      description: >-
        The instance response: an instance with its lease and per-role results, an owner action's
        result, or the owner's listing.
      content:
        application/json:
          schema:
            $ref: ../../sync/registration-submit.schema.json#/$defs/instanceResponse
    CommandAccepted:
      description: The command recorded (201), or the first one for a repeated `requestId` (200).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAccepted'
    CancelResult:
      description: '`cancelled` (200), or the command''s state with `cancelRequested: true` (202).'
      content:
        application/json:
          schema:
            type: object
            required: [state]
            properties:
              state:
                $ref: '#/components/schemas/CommandState'
              cancelRequested:
                type: boolean
    ProposalState:
      description: The proposal's new state.
      content:
        application/json:
          schema:
            type: object
            properties:
              state:
                $ref: '#/components/schemas/ProposalStateName'
    Refusal:
      description: >-
        A refusal: the first applicable of another tenant (404), permission and ownership (403),
        content (413, 422), then state (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
  schemas:
    DailyStatistics:
      type: object
      description: REQ-STATS-001, from the proposal's example.
      properties:
        date:
          type: string
          format: date
        entries:
          type: object
          properties:
            count: {type: integer}
            gaps: {type: integer}
            coverage: {type: number}
        glucose:
          $ref: '#/components/schemas/GlucoseSummary'
        percentiles:
          $ref: '#/components/schemas/Percentiles'
        ranges:
          type: object
          additionalProperties:
            type: object
            properties:
              count: {type: integer}
              percent: {type: number}
              threshold: {type: number}
              low: {type: number}
              high: {type: number}
        estimates:
          $ref: '#/components/schemas/Estimates'
    GlucoseSummary:
      type: object
      properties:
        mean: {type: number}
        median: {type: number}
        min: {type: number}
        max: {type: number}
        stdDev: {type: number}
        cv: {type: number}
        gvi: {type: number}
        pgs: {type: number}
    Percentiles:
      type: object
      properties:
        p10: {type: number}
        p25: {type: number}
        p50: {type: number}
        p75: {type: number}
        p90: {type: number}
    Estimates:
      type: object
      properties:
        a1c_dcct: {type: number}
        a1c_ifcc: {type: number}
        gmi: {type: number}
    Period:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        days: {type: integer}
    PeriodSummary:
      type: object
      description: REQ-STATS-002, from the proposal's example.
      properties:
        period:
          $ref: '#/components/schemas/Period'
        glucose:
          $ref: '#/components/schemas/GlucoseSummary'
        ranges:
          type: object
          additionalProperties:
            type: number
        estimates:
          $ref: '#/components/schemas/Estimates'
        variability:
          type: object
          properties:
            meanDailyChange: {type: number}
            meanHourlyChange: {type: number}
            fluctuationRate5: {type: number}
            fluctuationRate10: {type: number}
    HourlyDistribution:
      type: object
      description: REQ-STATS-003, from the proposal's example.
      properties:
        period:
          $ref: '#/components/schemas/Period'
        hours:
          type: array
          items:
            type: object
            properties:
              hour: {type: integer, minimum: 0, maximum: 23}
              count: {type: integer}
              mean: {type: number}
              percentiles:
                $ref: '#/components/schemas/Percentiles'
    TreatmentSummary:
      type: object
      description: REQ-STATS-004, from the proposal's example.
      properties:
        period:
          $ref: '#/components/schemas/Period'
        insulin:
          type: object
          additionalProperties:
            type: number
        carbs:
          type: object
          additionalProperties:
            type: number
        ratios:
          type: object
          additionalProperties:
            type: number
    WellKnownCatalogue:
      type: object
      description: As #8857 serves it (`lib/registration/index.js:113-121`).
      required: [apiVersion, kind, kinds]
      properties:
        apiVersion:
          const: nightscout.dev/sync/v1
        kind:
          const: WellKnownCatalogue
        kinds:
          type: array
          items:
            type: object
            required: [id, vendor, product, href]
            properties:
              id:
                type: string
              vendor:
                type: string
              product:
                type: string
              href:
                type: string
        slots:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        mappings:
          type: array
          items:
            type: object
    PinRequest:
      type: object
      description: authority §4, registration §12.
      required: [element]
      properties:
        element:
          type: string
          description: The element id (registration §5.3).
        version:
          type: string
          description: A version some stored definition stores; required to pin.
    Initiator:
      description: >-
        Who started it, in the controller's vocabulary (state and intent S8): a shared value or
        `{value: other, controllerTerm}`.
      oneOf:
        - type: string
        - $ref: ../../sync/controller-instance.schema.json#/$defs/otherTerm
    Product:
      type: object
      required: [vendor, product]
      properties:
        vendor:
          type: string
        product:
          type: string
    CommandState:
      type: string
      description: commands §4–§5. `fetched` is a receipt, not an outcome; the last four are the controller's.
      enum: [pending, not-routed, fetched, unconfirmed, undeliverable, expired, cancelled, acknowledged, succeeded, failed, refused]
    ProposalStateName:
      type: string
      enum: [open, approved, rejected, withdrawn, expired]
    CommandSend:
      type: object
      description: commands §7.1, Send. Members not listed are ignored (G1).
      required: [channel, payload, expiresAt]
      properties:
        channel:
          type: string
        product:
          $ref: '#/components/schemas/Product'
        payload:
          description: Stored exactly as received (CM1, CM5).
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
        initiator:
          $ref: '#/components/schemas/Initiator'
    CommandAccepted:
      type: object
      description: commands §7.1, reply 201.
      required: [commandId, state]
      properties:
        commandId:
          type: string
        state:
          $ref: '#/components/schemas/CommandState'
        fetchWithinSeconds:
          type: integer
        mayExpireUnfetched:
          type: boolean
        outstanding:
          $ref: '#/components/schemas/OutstandingList'
    OutstandingItem:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        proposer:
          type: string
        initiator:
          $ref: '#/components/schemas/Initiator'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
    OutstandingList:
      type: object
      description: CM24.
      properties:
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingItem'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingItem'
        dosesSince:
          type: array
          items: {}
        destinations:
          type: object
          additionalProperties:
            type: object
            properties:
              fetchWithinSeconds:
                type: integer
    Command:
      type: object
      description: The command record (commands §4).
      properties:
        commandId:
          type: string
        channel:
          type: string
        payload: {}
        payloadHash:
          type: string
        expiresAt:
          type: string
          format: date-time
        initiator:
          $ref: '#/components/schemas/Initiator'
        state:
          $ref: '#/components/schemas/CommandState'
        cancelRequested:
          type: boolean
        proposalId:
          type: string
        basedOn:
          type: string
    FetchResult:
      type: object
      description: commands §7.1, Fetch.
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'
        cancels:
          type: array
          items:
            type: object
            required: [commandId]
            properties:
              commandId:
                type: string
    Report:
      type: object
      description: commands §7.1, Report (CM7).
      required: [state, payloadHash]
      properties:
        state:
          type: string
          enum: [acknowledged, succeeded, failed, refused]
        payloadHash:
          type: string
        reason:
          type: string
        record:
          description: When enacted, the identity of the record that shows the effect.
    ProposalCreate:
      type: object
      description: commands §7.1, Propose (CM11).
      required: [proposer, channel, payload, basedOn, expiresAt]
      properties:
        proposer:
          type: string
          description: The proposing instance's `instanceId`.
        channel:
          type: string
        product:
          $ref: '#/components/schemas/Product'
        instanceId:
          type: string
        payload: {}
        basedOn:
          type: string
          description: The state version of the target product the proposer read (state and intent A12).
        expiresAt:
          type: string
          format: date-time
    Proposal:
      allOf:
        - $ref: '#/components/schemas/ProposalCreate'
        - type: object
          properties:
            proposalId:
              type: string
            payloadHash:
              type: string
            state:
              $ref: '#/components/schemas/ProposalStateName'
    Approve:
      type: object
      description: commands §7.1, Approve (CM13).
      required: [payloadHash]
      properties:
        payloadHash:
          type: string
        initiator:
          $ref: '#/components/schemas/Initiator'
    Evaluation:
      type: object
      description: CM16. Its members are not specified; an evaluation is evidence.
    Refusal:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: An open vocabulary (registration §5.3); a client treats an unknown code as a refusal.
        commandId:
          type: string
          description: For a command refused at routing (CM1).
        detail:
          type: string
