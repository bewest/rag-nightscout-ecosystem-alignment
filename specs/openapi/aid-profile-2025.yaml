openapi: 3.0.3
info:
  title: AID Profile Collection - De Facto 2025
  version: 2025.2.0
  description: |
    OpenAPI specification for the Nightscout `profile` collection documenting
    the de facto standard as implemented across AID systems circa 2025.
    
    ## Current Limitations
    - No distinction between prescribed, desired, and effective profiles
    - AAPS ProfileSwitch semantics differ from Loop overrides (GAP-002)
    - Profile percentage and timeshift not standardized
    
    ## Proposals
    - See `docs/60-research/profile-model-evolution-proposal.md` for 2026 improvements
    
    ## Source References
    - Deep Dive: `docs/60-research/profile-therapy-settings-comparison.md`
    - Nightscout: `externals/cgm-remote-monitor/lib/profile/profilefunctions.js`

    ## Changelog

    ### 2025.2.0 — corrected against measured data

    Reconciled against 202 real profile documents from 11 Nightscout sites
    (`reports/schema-census/profile.census.json`). Evidence and method:
    `docs/30-design/nightscout-typed-schema-evidence-2026-09-10.md`.

    - `mills`, `carbs_hr`, `delay`: now accept `string`; that is how 99% of
      live documents write them
    - `units`: enum widened; added a per-profile `store.{}.units`, which is
      present in 100% of documents on all 11 sites and was undeclared
    - added `LoopSettings` and `LoopOverride`: a 26-path subtree written by
      10 of 11 sites into 99% of their profile documents, previously
      undescribed

    Two fields inside `LoopSettings` are marked as sensitive rather than
    merely typed: `deviceToken` is an APNs credential, and
    `bundleIdentifier` embeds the builder's Apple Developer Team ID.

    Fields carry `x-aid-evidence` pointing at the census record that
    justifies them. Re-derive with `make schema`.

  contact:
    name: AID Alignment Workspace
  license:
    name: AGPL-3.0

servers:
  - url: /api/v3

paths:
  /profile:
    get:
      summary: Get profile documents
      operationId: getProfiles
      tags: [profile]
      responses:
        '200':
          description: Array of profile documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileDocument'

components:
  schemas:
    ProfileDocument:
      type: object
      description: |
        Profile document containing one or more named profiles.
        The `store` object maps profile names to their settings.
      required:
        - defaultProfile
        - store
      properties:
        _id:
          type: string
        identifier:
          type: string
        created_at:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
          description: When this profile becomes effective
        defaultProfile:
          type: string
          description: Name of the default profile in store
          example: Default
        store:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Profile'
          description: Map of profile name → profile settings
        loopSettings:
          $ref: '#/components/schemas/LoopSettings'
        units:
          type: string
          enum: [mg/dl, mg/dL, mmol, mmol/L]
          description: |
            Glucose display units.

            Enum widened to cover live data. Three specs in this repo declared
            three different vocabularies (`[mg, mmol]` in entries, `[mg/dl,
            mmol]` here) and the corpus contains `mg/dL`, `mg/dl` and
            `mmol/L` — none matching any declaration. Settling on one
            vocabulary is an ecosystem question; until then a reader must
            accept all of these.
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            observed: [mg/dL, mg/dl, mmol/L]
        enteredBy:
          type: string
        mills:
          type: [string, integer]
          description: |
            Epoch milliseconds.

            Declared `integer` by the 2025 spec and observed as a **string in
            200 of 202 profile documents (99%)** across all 11 sites in the
            2026-04 corpus. Both forms must be read.
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            observed: {string: 200, integer: 2}
            sites: 11

        # API v3 metadata
        utcOffset:
          type: integer
          x-aid-req: [REQ-SYNC-039]
        srvCreated:
          type: integer
          format: int64
          x-aid-req: [REQ-SYNC-050]
        srvModified:
          type: integer
          format: int64
          x-aid-req: [REQ-SYNC-049, REQ-SYNC-060]
        isValid:
          type: boolean
          default: true
          x-aid-req: [REQ-SYNC-040, REQ-SYNC-061]

    Profile:
      type: object
      description: |
        Individual profile settings. Contains time-varying arrays
        for basal, ISF, and carb ratio.
      properties:
        timezone:
          type: string
          description: IANA timezone name
          example: America/New_York
        dia:
          type: number
          description: |
            Duration of Insulin Action in HOURS.
            Minimum 5 hours enforced by all AID systems for exponential model.
          minimum: 2
          maximum: 10
          x-aid-controllers:
            Loop: Settings.insulinModelSettings.effectDuration
            AAPS: Profile.dia
            Trio: settings.dia
          x-aid-gap: GAP-INS-002
          x-aid-gap-note: DIA not synced to treatments for retrospective analysis

        # Time-varying arrays
        basal:
          type: array
          items:
            $ref: '#/components/schemas/TimedValue'
          description: Scheduled basal rates (U/hr) by time of day
          x-aid-req: [REQ-PROF-005, REQ-PROF-006]
          x-aid-gap: GAP-PROF-006
          x-aid-gap-note: Time format differs - Nightscout uses "HH:MM" string, controllers use numeric offsets
          x-aid-controllers:
            Loop: BasalRateSchedule (TimeInterval seconds)
            AAPS: ProfileSwitch.basalBlocks (timeAsSeconds int)
            Trio: basal array (from NS)
            oref0: basalprofile_data (minutes int)
        sens:
          type: array
          items:
            $ref: '#/components/schemas/TimedValue'
          description: |
            Insulin Sensitivity Factor by time of day.
            Units depend on glucose display units (mg/dL or mmol/L per U).
          x-aid-controllers:
            Loop: insulinSensitivitySchedule
            AAPS: ProfileSealed.getIsfList()
            Trio: profile.sensitivity
        carbratio:
          type: array
          items:
            $ref: '#/components/schemas/TimedValue'
          description: |
            Carb Ratio (g/U) by time of day.
            Note: Some systems use I:C (insulin per carbs), others C:I (carbs per insulin).
          x-aid-controllers:
            Loop: carbRatioSchedule (g/U)
            AAPS: ProfileSealed.getIcList() (g/U)
            Trio: profile.carbRatio (g/U)
        target_low:
          type: array
          items:
            $ref: '#/components/schemas/TimedValue'
          description: Lower target glucose by time of day
        target_high:
          type: array
          items:
            $ref: '#/components/schemas/TimedValue'
          description: Upper target glucose by time of day

        # Additional settings
        carbs_hr:
          type: [string, number]
          description: |
            Carb absorption rate (g/hr) - legacy, rarely used.

            Written as a string in 99% of profile documents in the 2026-04
            corpus, not as a number.
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            observed: {string: 200, integer: 2}
            sites: 11
        delay:
          type: [string, integer]
          description: |
            Delay before carb absorption starts (minutes).

            Written as a string in 99% of profile documents, as with
            `carbs_hr`.
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            observed: {string: 200, integer: 2}
            sites: 11
        units:
          type: string
          enum: [mg/dl, mg/dL, mmol, mmol/L]
          description: |
            Per-profile glucose display units, distinct from the document's
            top-level `units`.

            Present in **100% of profile documents on all 11 sites** and
            entirely undeclared before this revision — the highest-confidence
            omission the census found in this collection.
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            doc_frequency: 1.0
            sites: 11
            observed: [mg/dL, mg/dl, mmol/L]
        startDate:
          type: string
          format: date-time
          description: When this named profile becomes effective.
          x-aid-evidence: {doc_frequency: 0.0099, sites: 1}

        # Insulin model (2026 extension candidate)
        insulinPeakTime:
          type: integer
          description: |
            Insulin activity peak time in minutes.
            Not standardized across systems.
          x-aid-gap: GAP-INS-003
          x-aid-gap-note: Peak time not captured in Nightscout profile
          x-aid-controllers:
            Loop: Fixed per insulin type preset
            AAPS: Free Peak plugin allows 35-120 minutes
            oref0: Configurable 50-120 min (rapid) or 35-100 min (ultra-rapid)
        insulinCurve:
          type: string
          description: |
            Insulin curve model name.
            All major AID systems use exponential model.
          enum:
            - rapid-acting
            - ultra-rapid
            - bilinear
            - exponential
          x-aid-2026: true
          x-aid-gap: GAP-INS-004

    LoopSettings:
      type: object
      description: |
        Loop's therapy-settings block, written into the profile document
        alongside `store`.

        This is the **attribute-flattening** camp described in
        `docs/sdqctl-proposals/x-aid-extensions-convention-proposal.md`,
        measured: a 26-path subtree that 10 of 11 sites in the 2026-04 corpus
        write into 99% of their profile documents, and that no spec in this
        repo described before this revision.

        Documented here because it exists and consumers must read it, not as
        an endorsement of flattening vendor settings into the shared document
        shape.
      x-aid-evidence:
        source: reports/schema-census/profile.census.json
        doc_frequency: 0.990
        sites: 10
      properties:
        dosingEnabled:
          type: boolean
          description: Whether closed-loop dosing is enabled.
        dosingStrategy:
          type: string
          description: |
            Dosing strategy. Observed values are automaticBolus and
            tempBasalOnly.
        maximumBasalRatePerHour:
          type: number
          description: Safety limit on temp basal rate (U/hr).
        maximumBolus:
          type: number
          description: Safety limit on a single bolus (U).
        minimumBGGuard:
          type: number
          description: Suspend threshold (mg/dL).
        preMealTargetRange:
          type: array
          description: Two-element [low, high] pre-meal target in mg/dL.
          items:
            type: number
        overridePresets:
          type: array
          description: User-defined override presets.
          items:
            $ref: '#/components/schemas/LoopOverride'
        scheduleOverride:
          allOf:
            - $ref: '#/components/schemas/LoopOverride'
          description: The currently scheduled or active override, if any.
        bundleIdentifier:
          type: string
          description: |
            The app bundle identifier of the Loop build that wrote this
            profile. Contains the builder's Apple Developer Team ID; treat as
            an identifier and do not display or log it.
        deviceToken:
          type: string
          description: |
            APNs device token for remote commands. A credential-grade value:
            never log, display, or copy into derived data.

    LoopOverride:
      type: object
      description: A Loop override preset or an active override.
      properties:
        name:
          type: string
          description: User-chosen name. Personal data; do not aggregate.
        symbol:
          type: string
          description: |
            User-chosen emoji for the override. Personal data — a person's
            symbol vocabulary fingerprints them across documents.
        duration:
          type: integer
          description: Duration in seconds; 0 means indefinite.
        insulinNeedsScaleFactor:
          type: number
          description: Multiplier applied to insulin needs (1.0 = unchanged).
        targetRange:
          type: array
          description: Two-element [low, high] target range in mg/dL.
          items:
            type: number

    TimedValue:
      type: object
      description: |
        Time-value pair for schedule items (basal, ISF, CR, targets).
        Controllers must convert between string time and numeric offsets.
        See GAP-PROF-006 for format differences.
      required:
        - time
        - value
      properties:
        time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          description: Time of day in HH:MM format (24-hour)
          example: "08:00"
        value:
          type: number
          description: Value at this time
        timeAsSeconds:
          type: integer
          description: |
            Seconds since midnight (alternative representation).
            Controllers use this internally: Loop/AAPS (seconds), oref0 (minutes).
          x-aid-gap: GAP-PROF-006

    # =========================================================================
    # PROFILE SWITCH (Treatment-based profile activation)
    # =========================================================================
    ProfileSwitch:
      type: object
      description: |
        AAPS Profile Switch event. Semantically different from Loop overrides.
        See GAP-002 for detailed analysis.
        Note: Loop/Trio upload to `profile` collection only, not treatments (GAP-SYNC-026).
      x-aid-gap: GAP-002
      x-aid-gap-note: ProfileSwitch vs Override semantic mismatch
      x-aid-controllers:
        AAPS: ProfileSwitch entity → treatments collection
        Loop: N/A (uploads to profile collection only)
        Trio: N/A (uploads to profile collection only)
      properties:
        eventType:
          const: Profile Switch
        profile:
          type: string
          description: Profile name to switch to
        percentage:
          type: integer
          minimum: 30
          maximum: 200
          default: 100
          description: |
            Profile percentage adjustment.
            100 = normal, 150 = 50% more insulin, 50 = half insulin.
          x-aid-gap: GAP-SYNC-028
          x-aid-gap-note: Percentage not portable to Loop/Trio
          x-aid-controllers:
            AAPS: First-class field
            Loop: Not supported (uses override multiplier)
            Trio: Uses oref1 profile_percentage
        timeshift:
          type: integer
          description: |
            Time shift in hours.
            Shifts the profile schedule forward/backward.
          x-aid-gap: GAP-SYNC-028
          x-aid-controllers:
            AAPS: First-class field
            Loop: Not supported
            Trio: Not supported
        duration:
          type: integer
          description: Duration in minutes (0 = permanent until next switch)
        profileJson:
          type: string
          description: |
            Optional inline profile JSON.
            AAPS embeds complete profile; increases document size (GAP-SYNC-027).
          x-aid-gap: GAP-SYNC-027
        created_at:
          type: string
          format: date-time

    # =========================================================================
    # 2026 EXTENSION: PROFILE MODEL EVOLUTION
    # =========================================================================
    ProfileExtended:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          description: |
            2026 Extension: Enhanced profile model with intent tracking.
            Addresses GAP-002 and Profile Model Evolution proposal.
          properties:
            intent:
              type: string
              enum:
                - switch
                - percentage_adjustment
                - time_shift
                - temporary_modification
              description: |
                2026 Extension: Semantic intent of profile change.
                Addresses ProfileSwitch vs Override confusion.
              x-aid-2026: true
              x-aid-gap: GAP-002
            baseProfile:
              type: string
              description: |
                2026 Extension: Name of base profile being modified.
                Distinguishes modified profile from new profile.
              x-aid-2026: true
            modifiers:
              type: object
              description: |
                2026 Extension: Active modifiers on base profile.
              x-aid-2026: true
              properties:
                percentage:
                  type: integer
                  description: Percentage adjustment (100 = normal)
                timeShiftHours:
                  type: integer
                  description: Schedule shift in hours
                targetOverride:
                  type: object
                  properties:
                    low:
                      type: number
                    high:
                      type: number
                isfMultiplier:
                  type: number
                  description: ISF adjustment multiplier
            source:
              type: string
              enum: [prescribed, user, controller, caregiver]
              description: |
                2026 Extension: Who set this profile.
              x-aid-2026: true
            authority:
              type: string
              description: |
                2026 Extension: System with authority over profile.
              x-aid-2026: true
