openapi: 3.0.3
info:
  title: AID Entries Collection - De Facto 2025
  version: 2025.2.0
  description: |
    OpenAPI specification for the Nightscout `entries` collection documenting
    the de facto standard as implemented across AID systems circa 2025.
    
    ## Data Flow
    - **Producers**: xDrip+, xDrip4iOS, DiaBLE, Spike, AAPS (rebroadcast)
    - **Consumers**: Loop, Trio, AAPS, Nightscout web, follower apps
    
    ## Source References
    - Nightscout API v3: `externals/cgm-remote-monitor/lib/api3/swagger.yaml`
    - Deep Dive: `docs/10-domain/entries-deep-dive.md`

    ## Changelog

    ### 2025.2.0 — corrected against measured data

    Reconciled against 896,589 real entry documents from 11 Nightscout sites
    (`reports/schema-census/entries.census.json`). Evidence and method:
    `docs/30-design/nightscout-typed-schema-evidence-2026-09-10.md`.

    - `date`: `integer` -> `number` (61.5% of live values are fractional)
    - `direction`: enum extended with `NONE`
    - `trend`, `trendRate`, `isCalibration`: added; each on 10 of 11 sites
    - `units`: enum widened to the union of the three inconsistent
      declarations across our own specs and the values in live data

    Fields carry `x-aid-evidence` pointing at the census record that
    justifies them. Re-derive with `make schema`.
    
  contact:
    name: AID Alignment Workspace
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v3
    description: Nightscout API v3

paths:
  /entries:
    get:
      summary: Search glucose entries
      operationId: searchEntries
      tags: [entries]
      parameters:
        - $ref: '#/components/parameters/dateFilter'
        - $ref: '#/components/parameters/typeFilter'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Array of entry documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'

components:
  parameters:
    dateFilter:
      name: date$gte
      in: query
      schema:
        type: integer
      description: Filter entries >= epoch milliseconds
    typeFilter:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/EntryType'
      description: Filter by entry type
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        maximum: 1000
      description: Maximum documents to return
    skip:
      name: skip
      in: query
      schema:
        type: integer
        default: 0
      description: Documents to skip for pagination
    sort:
      name: sort$desc
      in: query
      schema:
        type: string
        default: date
      description: Field to sort by descending

  schemas:
    EntryType:
      type: string
      enum: [sgv, mbg, cal]
      description: |
        Entry classification:
        - `sgv`: Sensor Glucose Value (CGM reading)
        - `mbg`: Meter Blood Glucose (fingerstick)
        - `cal`: Calibration record
      x-aid-source: externals/cgm-remote-monitor/lib/api3/swagger.yaml

    Direction:
      type: string
      enum:
        - DoubleUp
        - SingleUp
        - FortyFiveUp
        - Flat
        - FortyFiveDown
        - SingleDown
        - DoubleDown
        - NOT COMPUTABLE
        - RATE OUT OF RANGE
        - NONE
      description: |
        Glucose trend direction. Maps to rate of change:
        - DoubleUp: > 3 mg/dL/min
        - SingleUp: 2-3 mg/dL/min
        - FortyFiveUp: 1-2 mg/dL/min
        - Flat: -1 to 1 mg/dL/min
        - FortyFiveDown: -1 to -2 mg/dL/min
        - SingleDown: -2 to -3 mg/dL/min
        - DoubleDown: < -3 mg/dL/min
      x-aid-controllers:
        Loop: GlucoseTrend enum (upUpUp, upUp, up, flat, down, downDown, downDownDown)
        AAPS: TrendArrow enum (includes TRIPLE_UP, TRIPLE_DOWN not in Nightscout)
        Trio: Direction enum (includes tripleUp, tripleDown)
        xDrip: Numeric enum 1-9
      x-aid-gap: GAP-ENTRY-001
      x-aid-gap-note: Triple arrows (TRIPLE_UP, TRIPLE_DOWN) in AAPS/Trio map to DoubleUp/DoubleDown, losing granularity
      x-aid-evidence:
        source: reports/schema-census/entries.census.json
        note: >-
          `NONE` added from observation: it appears in live data on multiple
          sites and was absent from the declared enum.

    NoiseLevel:
      type: integer
      minimum: 0
      maximum: 5
      description: |
        Signal quality indicator:
        - 0: None/unknown
        - 1: Clean
        - 2: Light
        - 3: Medium
        - 4: Heavy
        - 5: Noise blocked reading
      x-aid-source: docs/10-domain/entries-deep-dive.md#noise-level-mapping

    Entry:
      type: object
      required:
        - type
        - date
        - dateString
      properties:
        _id:
          type: string
          description: MongoDB document ID (ObjectId as string in v1, any string in v3)
          x-aid-controllers:
            v1: MongoDB ObjectId
            v3: Server-assigned identifier
        identifier:
          type: string
          description: |
            API v3 primary key. Server-assigned, immutable after creation.
            Used for document addressing in v3 endpoints.
          x-aid-req: [REQ-SYNC-037]
          x-aid-source: externals/cgm-remote-monitor/lib/api3/generic/update/validate.js
          x-aid-controllers:
            AAPS: Uses identifier field
            Loop: Does not use (v1 only)
            Trio: Does not use (v1 only)
        type:
          $ref: '#/components/schemas/EntryType'
        sgv:
          type: number
          description: |
            Sensor glucose value in mg/dL.
            Required when type=sgv.
          x-aid-controllers:
            Loop: quantity (HKQuantity)
            AAPS: value
            Trio: sgv
            xDrip: calculated_value
        mbg:
          type: number
          description: |
            Meter blood glucose value in mg/dL.
            Required when type=mbg.
        direction:
          $ref: '#/components/schemas/Direction'
        date:
          type: number
          description: |
            Epoch milliseconds timestamp.

            Declared `number`, not `integer`: 551,257 of 896,589 values in the
            2026-04 corpus (61.5%), on 11 of 11 sites, carry a fractional part —
            a 13-digit epoch millisecond value with 1-4 decimal places. A
            conforming reader MUST accept a fractional value here; a conforming
            writer SHOULD emit a whole number.
          x-aid-req: [REQ-TREAT-042, REQ-INTEROP-001]
          x-aid-evidence:
            source: reports/schema-census/entries.census.json
            observed: {integer: 345332, number: 551257}
            sites: 11
            note: >-
              Same defect class as Trio PR #1476; not confined to one client.
              See docs/30-design/nightscout-typed-schema-evidence-2026-09-10.md §4.1
          x-aid-controllers:
            Loop: startDate (converted)
            AAPS: timestamp
            Trio: date
            xDrip: timestamp
        dateString:
          type: string
          format: date-time
          description: ISO 8601 timestamp
        device:
          type: string
          description: |
            Source device identifier. Format varies by uploader.
          x-aid-req: [REQ-INTEROP-003]
          examples:
            - xDrip-DexcomG6
            - share2
            - loop://iPhone
            - openaps://AAPS
          x-aid-controllers:
            Loop: provenanceIdentifier
            AAPS: sourceSensor
            xDrip: sensor_uuid
        noise:
          $ref: '#/components/schemas/NoiseLevel'
        filtered:
          type: number
          description: |
            Filtered raw sensor value. Used for calibration algorithms.
            Typically only populated by xDrip+.
          x-aid-controllers:
            AAPS: Not used
            Loop: Not used
            xDrip: filtered_data
        unfiltered:
          type: number
          description: |
            Unfiltered raw sensor value. Used for calibration algorithms.
            Typically only populated by xDrip+.
          x-aid-controllers:
            AAPS: Not used
            Loop: Not used
            xDrip: raw_data
        rssi:
          type: integer
          description: Signal strength indicator (dBm)
        delta:
          type: number
          description: |
            Change from previous reading (mg/dL).
            Computed field, not always present.
        scale:
          type: number
          description: Calibration scale factor (for type=cal)
        intercept:
          type: number
          description: Calibration intercept (for type=cal)
        slope:
          type: number
          description: Calibration slope (for type=cal)
        sysTime:
          type: string
          format: date-time
          description: System time when reading was captured (Dexcom Share)
        units:
          type: string
          enum: [mg, mg/dl, mg/dL, mmol, mmol/L]
          description: |
            Glucose unit indicator.
            Note: Values are always stored as mg/dL; this is display preference.

            The enum is the union of three mutually inconsistent declarations
            and what live data contains: this spec declared `[mg, mmol]`,
            aid-profile-2025.yaml declared `[mg/dl, mmol]`, and the corpus
            holds `mg/dL`, `mg/dl` and `mmol/L`. No declared enum matched any
            other, or the data. Reconciling these three to one vocabulary is
            an ecosystem question, not a spec edit; until then a reader must
            accept all five.
          x-aid-gap: GAP-ENTRY-002
          x-aid-gap-note: Unit field usage is inconsistent across uploaders
          x-aid-evidence:
            source: reports/schema-census/profile.census.json
            observed_in_profiles: [mg/dL, mg/dl, mmol/L]

        # Fields in universal use that the 2025 spec omitted. Each was
        # measured on 10 of 11 sites in the 2026-04 corpus; see
        # docs/30-design/nightscout-typed-schema-evidence-2026-09-10.md §4.1.
        trend:
          type: integer
          description: |
            Numeric trend code, written alongside `direction` by most
            uploaders. Dexcom-style 0-9 scale.
          x-aid-evidence:
            source: reports/schema-census/entries.census.json
            doc_frequency: 0.7164
            sites: 10
        trendRate:
          type: number
          description: |
            Rate of change in mg/dL/min. More precise than `direction`.

            Previously declared only on `EntryExtended` as a 2026 extension
            (GAP-ENTRY-003); it is already in production use and belongs on
            the base schema.
          x-aid-evidence:
            source: reports/schema-census/entries.census.json
            doc_frequency: 0.4599
            sites: 10
            note: fractional in 365,867 of 412,355 values
        isCalibration:
          type: boolean
          description: |
            Marks a reading produced by, or immediately following, a sensor
            calibration.
          x-aid-evidence:
            source: reports/schema-census/entries.census.json
            doc_frequency: 0.6190
            sites: 10

        # API v3 metadata fields
        utcOffset:
          type: integer
          description: Timezone offset in minutes from UTC
        app:
          type: string
          description: Origin application identifier
        srvCreated:
          type: integer
          format: int64
          description: Server creation timestamp (epoch ms)
        srvModified:
          type: integer
          format: int64
          description: Server modification timestamp (epoch ms)
        subject:
          type: string
          description: Creating user/token identifier
        modifiedBy:
          type: string
          description: Last modifier identifier
        isValid:
          type: boolean
          default: true
          description: |
            Soft-delete flag. false = document is deleted.
            Only visible via history endpoint or explicit query.
          x-aid-source: externals/cgm-remote-monitor/lib/api3/generic/delete/operation.js
        isReadOnly:
          type: boolean
          default: false
          description: Lock document permanently (HTTP 422 on modify attempts)

    # Extension schemas for 2026 alignment
    EntryExtended:
      allOf:
        - $ref: '#/components/schemas/Entry'
        - type: object
          properties:
            sourceCalibration:
              type: string
              description: |
                2026 Extension: Calibration algorithm used.
                Addresses GAP-CGM-001 (calibration provenance not tracked).
              enum:
                - native
                - xdrip_native
                - xdrip_oop
                - libre_oop
                - g6_native
              x-aid-2026: true
              x-aid-gap: GAP-CGM-001
            sensorId:
              type: string
              description: |
                2026 Extension: Unique sensor session identifier.
                Enables grouping readings by sensor session.
              x-aid-2026: true
              x-aid-gap: GAP-CGM-002
            transmitterId:
              type: string
              description: |
                2026 Extension: CGM transmitter identifier.
                For Dexcom G6/G7, Libre with transmitter.
              x-aid-2026: true
              x-aid-gap: GAP-CGM-003
            trendRate:
              type: number
              description: |
                2026 Extension: Numeric rate of change (mg/dL/min).
                More precise than direction string.
              x-aid-2026: true
              x-aid-gap: GAP-ENTRY-003
