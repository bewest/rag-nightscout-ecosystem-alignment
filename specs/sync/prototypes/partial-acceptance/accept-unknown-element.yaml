id: accept-unknown-element
description: >-
  An approval naming an element the proposal does not have, an approval
  accepting nothing, and a proposal with two elements under one id are each
  refused; the refused approvals leave the proposal open, and a correct
  approval afterwards succeeds. V3 has no element list in its approval: the
  extra element changes the whole hash, and accepting nothing is a partial
  approval.
plan:
  frame:
    kind: plan
    days: [mon, tue, wed, thu, fri]
    endDate: "2026-11-30"
    confirmation: morning
  elements:
    - id: eating-soon
      content: {kind: temporary-target, startOffsetMinutes: -60, durationMinutes: 60, target: {low: 80, high: 80, units: mg/dL}}
    - id: meal
      content: {kind: meal, time: "12:30", carbs: {grams: 45}, bolus: with-meal}
steps:
  - {kind: propose, subject: agent}
  - kind: approve
    subject: person
    proposal: p1
    accept: [eating-soon, snack]
    claimed: {snack: {kind: meal, time: "15:00", carbs: {grams: 15}, bolus: with-meal}}
  - {kind: approve, subject: person, proposal: p1, accept: []}
  - {kind: propose, subject: agent, duplicate: meal}
  - {kind: approve, subject: person, proposal: p1, accept: [eating-soon, meal]}
expected:
  V1,V2:
    steps:
      - {status: 201, proposalId: p1}
      - {status: 409, code: unknown-element}
      - {status: 422, code: nothing-accepted}
      - {status: 422, code: duplicate-element}
      - {status: 201, commandId: c1}
    proposals:
      p1: {state: approved, accepted: [eating-soon, meal], declined: []}
    enacted: {}
  V3:
    steps:
      - {status: 201, proposalId: p1}
      - {status: 409, code: hash-mismatch}
      - {status: 422, code: partial-not-supported}
      - {status: 422, code: duplicate-element}
      - {status: 201, commandId: c1}
    proposals:
      p1: {state: approved, accepted: [eating-soon, meal], declined: []}
    enacted: {}
