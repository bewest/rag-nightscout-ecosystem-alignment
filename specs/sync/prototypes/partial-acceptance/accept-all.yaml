id: accept-all
description: >-
  The person accepts both elements. Every variant makes one command carrying
  both; a second delivery of the same commandId is not enacted again (CM21).
plan:
  frame:
    kind: plan
    days: [mon, tue, wed, thu, fri]
    endDate: "2026-11-30"
    confirmation: morning
  elements:
    - id: eating-soon
      content: {kind: temporary-target, startOffsetMinutes: -60, durationMinutes: 60, target: {low: 80, high: 80, units: mg/dL}}
    - id: meal
      content: {kind: meal, time: "12:30", carbs: {grams: 45}, bolus: with-meal}
steps:
  - {kind: propose, subject: agent}
  - {kind: approve, subject: person, proposal: p1, accept: [eating-soon, meal]}
  - {kind: deliver, command: c1}
  - {kind: deliver, command: c1}
expected:
  V1,V2,V3:
    steps:
      - {status: 201, proposalId: p1}
      - {status: 201, commandId: c1}
      - {state: succeeded, elements: [eating-soon, meal]}
      - {state: ignored, reason: duplicate}
    proposals:
      p1: {state: approved, accepted: [eating-soon, meal], declined: []}
    enacted:
      c1: [eating-soon, meal]
