id: v3-client-oid-refused
title: 'API v3 refuses a client `{"$oid": …}` `_id`'
description: 'I2. A carrier write over API v3 sends an extended-JSON `{"$oid": …}` `_id`, which API v1
  keeps as the ObjectId. API v3 refuses a client-supplied `_id` with 400, whatever its form, and nothing
  is written (maintainer, 2026-10-25; BF-170, #8845). A v3 client names its records by `identifier`.'
control: v3-identifier-written
