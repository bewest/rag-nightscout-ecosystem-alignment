id: rejected-unsupported-availability
title: A kind declared experimental is rejected by a hub that does not store experimental
  kinds
description: Rule 5. The kind falls back to its wire carrier; the extension is accepted.
cell: newer-controller/newer-hub
control: accepted
capabilities:
  apiVersion: nightscout.dev/sync/v1
  kind: HubCapabilities
  hub:
    product: Example Hub
    version: 0.0.0-test
  grammar:
    versions:
    - apiVersion: nightscout.dev/sync/v1
      major: 1
      minor: 1
    interprets:
    - apiVersion
    - kind
    - metadata
    - spec
  horizons:
    classes:
    - cycle
    - span
    - effective-dated
    - definition
    - aggregate
    availability:
    - released
    - dev-only
  typeFragment:
    keywords:
    - type
    - enum
    - minimum
    - maximum
    - format
    - items
    - properties
    - required
    - description
  limits:
    maxRegistrationBytes: 65536
    maxExtensions: 8
    maxFieldsPerExtension: 32
    maxTypeDepth: 4
  wellKnown:
    catalogue: /.well-known/nightscout/controllers
    kinds: []
  submit:
    href: /api/v4/registrations
    tiers:
    - controller-owned
    permissions:
      submit: api:registrations:create
      retire: api:registrations:delete
hubState:
  registrations: []
submitter:
  credentialKind: subject
  subject: subject-test-controller-a
  permissions:
  - api:registrations:create
  namespaceRoots:
  - com.example.negotiation
registration:
  apiVersion: nightscout.dev/sync/v1
  kind: ControllerStateModel
  metadata:
    vendor: Example
    product: NegotiationController
    algorithmFamily: other
    tier: controller-owned
    versionRange: 1.0.0-test
  spec:
    cadence:
      nominalSeconds: 300
    documents:
    - collection: devicestatus
      discriminator:
        path: example
        test: is-object
      decomposesTo:
      - ApsSnapshot
    stateSpans:
    - category: Override
      kind: ExampleOverride
      slot: override
      states:
      - scheduled
      - active
      - ended
      version: '1'
      wire: &id001
        collection: treatments
        eventType: Temporary Override
        durationField: duration
        durationUnit: minutes
      availability: experimental
    extensions:
      com.example.negotiation.targets:
        version: '1'
        carrier:
          collection: settings
          documentIdentifier: example-targets
        fields:
        - name: target
          type:
            type: number
            minimum: 70
            maximum: 180
          unit: mg/dL
          sensitivity:
            level: descriptive
            category: therapy-setting
    sensitivity:
      unlabelledPolicy: withhold
grammarValid: true
request:
  action: submit
  identity:
    vendor: Example
    product: NegotiationController
  preconditions:
