  response:
    apiVersion: nightscout.dev/sync/v1
    kind: RegistrationResponse
    status: 201
    outcome: partial
    noop: false
    definitionId: sha256:19d78ed7cfe099129a60fbe376ed18247f61289c1395c6eb742ef915e97ab5c6
    registration:
      vendor: Example
      product: NegotiationController
      versionRange: 1.0.0-test
      state: active
      etag: sha256:a39cee5ef3ff4f2391ea2d6f7855b2ec6409acb91d1df115acfd962882b339f8
      boundTo:
        kind: subject
        subject: subject-test-controller-a
      credentialKind: subject
    ignored: []
    elements:
