# SYNTHETIC CONFORMANCE CASE. Describes no real controller, product or person.
# Contract: docs/30-design/platform/nightscout-hub-sync-architecture-2026-09-11.md §3.5.
# Schema: specs/sync/registration-submit.schema.json#/$defs/conformanceCase.
# Checked by tools/nsschema/test_registration_negotiation.py; `detail` strings are
# not compared.
id: hub-without-submit
title: 'A hub that publishes capabilities but takes no submissions: the controller writes
  its carriers'
description: The capability document has no submit member, for example while a hub's feature
  flag is off. The controller submits nothing.
cell: newer-controller/older-hub
capabilities:
  apiVersion: nightscout.dev/sync/v1
  kind: HubCapabilities
  hub:
    product: Example Hub
    version: 0.0.0-test
  grammar:
    versions:
    - apiVersion: nightscout.dev/sync/v1
      major: 1
      minor: 1
    interprets:
    - apiVersion
    - kind
    - metadata
    - spec
  horizons:
    classes:
    - cycle
    - span
    - effective-dated
    - definition
    - aggregate
    availability:
    - released
    - dev-only
    - experimental
  typeFragment:
    keywords:
    - type
    - enum
    - minimum
    - maximum
    - format
    - items
    - properties
    - required
    - description
  limits:
    maxRegistrationBytes: 65536
    maxExtensions: 8
    maxFieldsPerExtension: 32
    maxTypeDepth: 4
  wellKnown:
    catalogue: /.well-known/nightscout/controllers
    kinds: []
hubState:
  registrations: []
submitter:
  credentialKind: subject
  subject: subject-test-controller-a
  permissions:
  - api:registrations:create
  namespaceRoots:
  - com.example.negotiation
registration:
  apiVersion: nightscout.dev/sync/v1
  kind: ControllerStateModel
  metadata:
    vendor: Example
    product: NegotiationController
    algorithmFamily: other
    tier: controller-owned
    versionRange: 1.0.0-test
  spec:
    cadence:
      nominalSeconds: 300
    documents:
    - collection: devicestatus
      discriminator:
        path: example
        test: is-object
      decomposesTo:
      - ApsSnapshot
    stateSpans:
    - category: Override
      kind: ExampleOverride
      slot: override
      states:
      - scheduled
      - active
      - ended
      version: '1'
      wire: &id001
        collection: treatments
        eventType: Temporary Override
        durationField: duration
        durationUnit: minutes
    extensions:
      com.example.negotiation.targets:
        version: '1'
        carrier: &id002
          collection: settings
          documentIdentifier: example-targets
        fields:
        - name: target
          type:
            type: number
            minimum: 70
            maximum: 180
          unit: mg/dL
          sensitivity:
            level: descriptive
            category: therapy-setting
    sensitivity:
      unlabelledPolicy: withhold
grammarValid: true
request: null
expected:
  controllerWouldSubmit: false
  response: null
  fallback:
    stateSpans/ExampleOverride:
      write: carrier
      carrier: *id001
    extensions/com.example.negotiation.targets:
      write: carrier
      carrier: *id002
