    - dev-only
    - experimental
  typeFragment:
    keywords:
    - type
    - enum
    - minimum
    - maximum
    - format
    - items
    - properties
    - required
    - description
  limits:
    maxRegistrationBytes: 65536
    maxExtensions: 8
    maxFieldsPerExtension: 32
    maxTypeDepth: 4
  wellKnown:
    catalogue: /.well-known/nightscout/controllers
    kinds: []
  submit:
