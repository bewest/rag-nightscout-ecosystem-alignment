id: accepted-dual-write-view-served
title: When the hub serves a projected carrier view, an element with a dual-write link is
  written typed only
description: 'Decision 7. The hub reports carrierView served for the override kind: older
  readers get the projected view, so the controller writes typed only and no carrier.'
cell: newer-controller/newer-hub
