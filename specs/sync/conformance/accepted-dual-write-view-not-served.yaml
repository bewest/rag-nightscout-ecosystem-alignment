id: accepted-dual-write-view-not-served
title: An accepted element with a dual-write link and no projected view is written typed and
  as its carrier
description: Decision 7. The hub accepts the override kind but reports no carrierView for
  it (absent means not served), and the kind declares a dual-write link, so the controller
  writes each record typed and as its wire carrier, linked by the controller's record id.
  The extension declares no link and is written typed only. SPEC-REG-INSTANCE scopes the link
  by instance. Control for accepted-dual-write-view-served.
cell: newer-controller/newer-hub
