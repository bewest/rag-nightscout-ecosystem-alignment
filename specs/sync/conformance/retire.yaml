id: retire
title: The owning controller retires its registration; stored data is kept
description: DELETE with If-Match. The registration's state becomes retired and its declaration
  is kept, frozen, so data already stored under it stays readable as declared; no typed write
  is accepted for it. The controller writes its carriers from then on.
cell: newer-controller/newer-hub
