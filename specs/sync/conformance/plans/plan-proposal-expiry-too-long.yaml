# Synthetic. SPEC-PLANS; plans §3. Times are seconds; expectations authored by hand.
id: plan-proposal-expiry-too-long
title: A plan proposal open beyond plans.maxProposalSeconds is refused
rules:
- PN1
- CM3
description: 'expiresAt is one second beyond maxProposalSeconds (172800) after the request: 422 expiry-too-long,
  nothing recorded.'
control: plan-proposal-open-past-command-expiry
mode: single
maxExpirySeconds: 3600
riskClasses:
  ControllerA:
    eatingSoon: R1
    schoolOverride: R2
    exerciseTarget: R3
    mealBolus: R4
    basalProfile: R5
    maxBolus: R6
channelVersions:
  A:
    ControllerA:
      override:
      - - 0
        - v1
      example/bolus:
      - - 0
        - b1
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      example/plans:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - example/plans
declares:
  A:
    example/plans:
    - ControllerA
subjects:
  s-person:
    tenant: A
    person: true
    permissions:
    - api:commands:create
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-risk:
    tenant: A
    permissions:
    - api:proposals:read
  s-follower:
    tenant: A
    permissions:
    - api:commands:read
  s-nobody:
    tenant: A
    permissions: []
maxProposalSeconds: 172800
calls:
- at: 10
  kind: proposePlan
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: example/plans
  product: ControllerA
  expiresAt: 172811
  basedOn:
    override: v1
    example/bolus: b1
  plan:
    elements:
    - id: soon
      kind: eatingSoon
      channel: override
      path: standing
      content:
        target: eating-soon
    - id: meal
      kind: mealBolus
      channel: example/bolus
      path: per-occurrence
      content:
        bolus: usual-lunch
    trigger:
      weekdays: lunch
    startsAt: 100
    endsAt: 100000
    requiredReviews: []
expected:
  calls:
  - status: 422
    code: expiry-too-long
  commands: {}
  proposals: {}
  plans: {}
