# Synthetic. SPEC-PLANS; plans §4. Times are seconds; expectations authored by hand.
id: plan-approve-after-proposal-expiry
title: A plan approved after its proposal expired is refused
rules:
- PN1
- PN7
- CM13
description: The proposal expires at 25; the approval at 30 is 409 proposal-expired
  and the proposal is expired at the end.
control: plan-proposed-and-approved
mode: single
maxExpirySeconds: 3600
riskClasses:
  ControllerA:
    eatingSoon: R1
    schoolOverride: R2
    exerciseTarget: R1
    mealBolus: R4
    basalProfile: R5
    maxBolus: R6
channelVersions:
  A:
    ControllerA:
      override:
      - - 0
        - v1
      example/bolus:
      - - 0
        - b1
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      example/plans:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - example/plans
declares:
  A:
    example/plans:
    - ControllerA
subjects:
  s-person:
    tenant: A
    person: true
    permissions:
    - api:commands:create
  s-care:
    tenant: A
    permissions:
    - api:commands:create
    delegate: true
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-risk:
    tenant: A
    permissions:
    - api:proposals:read
  s-follower:
    tenant: A
    permissions:
    - api:commands:read
  s-nobody:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: proposePlan
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: example/plans
  product: ControllerA
  expiresAt: 25
  basedOn:
    override: v1
    example/bolus: b1
  plan:
    elements:
    - id: soon
      kind: eatingSoon
      channel: override
      path: standing
      content:
        target: eating-soon
    - id: meal
      kind: mealBolus
      channel: example/bolus
      path: per-occurrence
      content:
        bolus: usual-lunch
    trigger:
      weekdays: lunch
    startsAt: 100
    endsAt: 100000
    requiredReviews: []
- at: 29
  kind: evaluate
  tenant: A
  subject: s-risk
  proposal: p1
  review: independent-check
  note: independent check
- at: 30
  kind: approvePlan
  tenant: A
  subject: s-person
  proposal: p1
  accepts:
  - element: soon
    hash: element:soon
  - element: meal
    hash: element:meal
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 201
  - status: 409
    code: proposal-expired
  commands: {}
  proposals:
    p1:
      state: expired
  plans: {}
