id: owner-unblock-retired
title: Unblocking a registration that was retired before the block leaves it retired
description: 'Decision 5, a rule chosen by SPEC-REG-DECISIONS: unblocking restores the state
  the block interrupted, so a registration retired before the block stays retired. Unblocking
  never reactivates what the controller or the owner retired; the controller reactivates it
  with a PUT and the retired etag, as before.'
