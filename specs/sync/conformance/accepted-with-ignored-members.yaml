id: accepted-with-ignored-members
title: Members the grammar does not define, and members this hub does not interpret, are ignored
description: Rule 1. The hub implements grammar v1.0 and does not interpret document horizons.
  Two members are unknown to the grammar. The registration is accepted; the ignored members
  are listed, at registration level or under the element that holds them, and kept as written.
cell: newer-controller/newer-hub
capabilities:
  apiVersion: nightscout.dev/sync/v1
  kind: HubCapabilities
  hub:
    product: Example Hub
    version: 0.0.0-test
  grammar:
    versions:
    - apiVersion: nightscout.dev/sync/v1
      major: 1
      minor: 0
    interprets:
    - apiVersion
    - kind
    - metadata
    - spec.cadence
    - spec.documents.*.collection
    - spec.documents.*.discriminator
    - spec.documents.*.decomposesTo
    - spec.documents.*.paths
    - spec.stateSpans
    - spec.composition
    - spec.commands
    - spec.replayInputs
    - spec.settings
    - spec.queryProfile
    - spec.sensitivity
    - spec.extensions
  horizons:
    classes:
    - cycle
    - span
    - effective-dated
    - definition
    - aggregate
    availability:
    - released
    - dev-only
    - experimental
  typeFragment:
    keywords:
    - type
    - enum
    - minimum
    - maximum
    - format
    - items
    - properties
    - required
    - description
  limits:
    maxRegistrationBytes: 65536
    maxExtensions: 8
    maxFieldsPerExtension: 32
    maxTypeDepth: 4
  wellKnown:
    catalogue: /.well-known/nightscout/controllers
    kinds: []
  submit:
    href: /api/v4/registrations
    tiers:
    - controller-owned
    permissions:
      submit: api:registrations:create
      retire: api:registrations:delete
hubState:
  registrations: []
submitter:
  credentialKind: subject
  subject: subject-test-controller-a
  permissions:
  - api:registrations:create
  namespaceRoots:
  - com.example.negotiation
registration:
  apiVersion: nightscout.dev/sync/v1
  kind: ControllerStateModel
  metadata:
    vendor: Example
    product: NegotiationController
    algorithmFamily: other
    tier: controller-owned
    versionRange: 1.0.0-test
  spec:
    cadence:
      nominalSeconds: 300
    documents:
    - collection: devicestatus
      discriminator:
        path: example
        test: is-object
      decomposesTo:
      - ApsSnapshot
      horizon:
        class: cycle
    stateSpans:
    - category: Override
      kind: ExampleOverride
      slot: override
      states:
      - scheduled
      - active
      - ended
      version: '1'
      wire:
        collection: treatments
        eventType: Temporary Override
        durationField: duration
        durationUnit: minutes
      futureSpanMember: true
    extensions:
      com.example.negotiation.targets:
        version: '1'
        carrier:
          collection: settings
          documentIdentifier: example-targets
        fields:
        - name: target
          type:
            type: number
            minimum: 70
            maximum: 180
          unit: mg/dL
          sensitivity:
            level: descriptive
            category: therapy-setting
    sensitivity:
      unlabelledPolicy: withhold
    futureGrammarMember:
      note: a member a later v1 grammar might define
grammarValid: true
request:
  action: submit
  identity:
    vendor: Example
    product: NegotiationController
  preconditions:
    ifNoneMatch: '*'
expected:
  controllerWouldSubmit: true
  response:
    apiVersion: nightscout.dev/sync/v1
    kind: RegistrationResponse
    status: 201
    outcome: accepted
    noop: false
    registration:
      vendor: Example
      product: NegotiationController
      versionRange: 1.0.0-test
      state: active
      etag: sha256:a19968fc66c25ca7cdf5cf5f91461beaa19b8e1f51f96ccc34bdcb531ee96680
      boundTo:
        kind: subject
        subject: subject-test-controller-a
      credentialKind: subject
    ignored:
    - spec.documents.0.horizon
    - spec.futureGrammarMember
    elements:
    - element: stateSpans/ExampleOverride
      result: accepted-with-ignored-members
      ignored:
      - spec.stateSpans.0.futureSpanMember
    - element: extensions/com.example.negotiation.targets
      result: accepted
  fallback:
    stateSpans/ExampleOverride:
      write: typed
    extensions/com.example.negotiation.targets:
      write: typed
