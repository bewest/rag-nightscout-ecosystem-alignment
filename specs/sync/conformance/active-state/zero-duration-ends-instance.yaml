# Synthetic. SPEC-ACTIVE-STATE; state and intent §6. Expectations authored by hand.
id: zero-duration-ends-instance
title: A zero-duration record ends the instance active at its time and is not an instance
rules:
- A5
control: no-end-marker
description: Shaped like a careportal or nightguard temporary target cancel. cgm-remote-monitor truncates
  the target; Nocturne records the cancel as an open span of its own (LAB-HUB-ACTIVE-STATE).
declarations:
- product: ControllerA
  stateSpans:
  - category: TemporaryTarget
    kind: TempTarget
    slot: temporaryTarget
    exclusiveWithinSlot: true
    supersedes: true
    states:
    - active
    - ended
    wire:
      collection: treatments
      eventType: Temporary Target
      identity:
      - _id
      durationField: duration
      durationUnit: minutes
      endedEncoding: zero-duration-record
records:
- product: ControllerA
  collection: treatments
  op: write
  doc:
    _id: a1
    eventType: Temporary Target
    created_at: '2026-10-18T10:00:00Z'
    duration: 60
- product: ControllerA
  collection: treatments
  op: write
  doc:
    _id: a2
    eventType: Temporary Target
    created_at: '2026-10-18T10:20:00Z'
    duration: 0
expected:
  instances:
  - product: ControllerA
    kind: TempTarget
    layer: requested
    key: _id=a1
    start: '2026-10-18T10:00:00Z'
    end: '2026-10-18T10:20:00Z'
    endReason: cancelled
  activeAt:
  - at: '2026-10-18T10:10:00Z'
    active:
    - product: ControllerA
      kind: TempTarget
      layer: requested
      key: _id=a1
      start: '2026-10-18T10:00:00Z'
      end: '2026-10-18T10:20:00Z'
  - at: '2026-10-18T10:30:00Z'
    active: []
