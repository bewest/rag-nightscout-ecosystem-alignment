# Synthetic. SPEC-ACTIVE-STATE; state and intent §6. Expectations authored by hand.
id: overlay-returns-to-open-ended
title: A timed instance applies over an open-ended one, which applies again when it ends
rules:
- A8
control: supersedes-without-overlay
description: Shaped like AndroidAPS's running mode, which declares overlay. The timed-profile-switch fallback
  cgm-remote-monitor and Nocturne disagree on needs the same declaration.
declarations:
- product: ControllerA
  stateSpans:
  - category: LoopMode
    kind: RunningMode
    slot: runningMode
    exclusiveWithinSlot: true
    wire:
      collection: treatments
      eventType: OpenAPS Offline
      identity:
      - identifier
      durationField: duration
      durationUnit: minutes
      indefinite:
        field: durationType
        value: indefinite
      endedEncoding: amend-duration
    overlay: true
records:
- product: ControllerA
  collection: treatments
  op: write
  doc:
    identifier: m1
    eventType: OpenAPS Offline
    created_at: '2026-10-18T09:00:00Z'
    durationType: indefinite
- product: ControllerA
  collection: treatments
  op: write
  doc:
    identifier: m2
    eventType: OpenAPS Offline
    created_at: '2026-10-18T10:00:00Z'
    duration: 30
expected:
