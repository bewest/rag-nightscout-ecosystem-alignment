# Synthetic. SPEC-ACTIVE-STATE; state and intent §6. Expectations authored by hand.
id: repost-same-identity-amends
title: A re-post with the same identity amends the instance it names
rules:
- A2
- A5
control: different-identity-supersedes
description: Shaped like Trio's temporary target, which ends early by re-posting the same created_at with
  the actual duration.
declarations:
- product: ControllerA
  stateSpans:
  - category: TemporaryTarget
    kind: TempTarget
    slot: temporaryTarget
    exclusiveWithinSlot: true
    supersedes: true
    states:
    - active
    - ended
    wire:
      collection: treatments
      eventType: Temporary Target
      identity:
      - created_at
      - eventType
      durationField: duration
      durationUnit: minutes
      endedEncoding: repost-same-created_at
records:
- product: ControllerA
  collection: treatments
  op: write
  doc:
    _id: x1
    eventType: Temporary Target
    created_at: '2026-10-18T10:00:00Z'
    duration: 60
- product: ControllerA
  collection: treatments
  op: write
  doc:
    _id: x1
    eventType: Temporary Target
    created_at: '2026-10-18T10:00:00Z'
    duration: 20
expected:
  instances:
  - product: ControllerA
    kind: TempTarget
    layer: requested
    key: created_at=2026-10-18T10:00:00Z|eventType=Temporary Target
    start: '2026-10-18T10:00:00Z'
    end: '2026-10-18T10:20:00Z'
    endReason: cancelled
  activeAt:
  - at: '2026-10-18T10:10:00Z'
    active:
    - product: ControllerA
      kind: TempTarget
      layer: requested
      key: created_at=2026-10-18T10:00:00Z|eventType=Temporary Target
      start: '2026-10-18T10:00:00Z'
      end: '2026-10-18T10:20:00Z'
  - at: '2026-10-18T10:30:00Z'
    active: []
