# SYNTHETIC CONFORMANCE CASE. Describes no real controller, product or person.
# Contract: docs/30-design/platform/nightscout-hub-sync-architecture-2026-09-11.md §3.5.
# Schema: specs/sync/registration-submit.schema.json#/$defs/conformanceCase.
