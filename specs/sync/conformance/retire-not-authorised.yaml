#
# CHANGED 2026-10-15 (SPEC-REG-DECISIONS, decision 4). Until then this case asserted
# that retiring needs namespace roots covering every namespace of the registration
# (403 not-authorised at spec.extensions.<ns>). Retire is now authorised by the
# binding plus api:registrations:delete, and namespace ownership no longer decides it:
# that old request now succeeds (retire-roots-not-required), and another subject is
# refused not-registration-owner (retire-not-registration-owner). This case now
# asserts the missing-permission 403.
