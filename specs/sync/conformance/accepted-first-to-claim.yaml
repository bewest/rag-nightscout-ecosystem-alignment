id: accepted-first-to-claim
title: A submitter with no stated namespace roots claims a namespace no registration on the
  tenant holds
description: 'Decision 1: first to claim, per tenant. The credential states no namespace roots,
  so the hub does not restrict it; no other registration on the tenant declares the namespace,
  so the extension is accepted. The namespace string proves nothing about authorship: readers
  attribute the typed records to this registration and its bound credential. Control for rejected-namespace-claimed-first-to-claim.'
