# Synthetic. SPEC-REG-COMMANDS; commands §2. Times are seconds; expectations authored by hand.
id: route-inferred-from-declaring-product
title: A command naming no product goes to the one product declaring the channel
rules:
- CM1
description: With one declaring product, a command without `product` is routed to that product's holder.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  payload:
    action: start
    preset: example
  expiresAt: 600
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  commands:
    c1:
      state: pending
      destination: i-ctl-a
