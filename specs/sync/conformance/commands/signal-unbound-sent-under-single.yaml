# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: signal-unbound-sent-under-single
title: Under single, the one tenant is always bound and the signal is sent
rules:
- CM19
- CM27
description: 'Control for signal-unbound-withheld-under-multi: the same calls under single. The signal
  changes nothing on the record: c1 stays pending until the fetch.'
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: signal
  bound: null
  command: c1
- at: 12
  kind: read
  tenant: A
  command: c1
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 25
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: socket
    carries: {}
  - status: 200
    state: pending
  - status: 200
    commands:
    - c1
  - status: 200
    state: fetched
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
