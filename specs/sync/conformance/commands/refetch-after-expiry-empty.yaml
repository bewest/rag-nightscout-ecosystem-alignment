# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: refetch-after-expiry-empty
title: A fetched command with no report is not returned at or after its expiry
rules:
- CM26
- CM3
description: c1 is fetched at 11 and never reported; a fetch at 120, after its expiry at 100, returns
  nothing, and c1 reads unconfirmed.
control: fetch-reply-lost-refetch-delivers
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 11
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 120
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 121
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  - status: 200
    commands: []
  - status: 200
    state: unconfirmed
  commands:
    c1:
      state: unconfirmed
      destination: i-ctl-a
