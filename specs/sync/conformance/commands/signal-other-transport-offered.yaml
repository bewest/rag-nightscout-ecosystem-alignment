# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: signal-other-transport-offered
title: A live transport in the other form is used when both sides name it
rules:
- CM28
- CM27
description: The hub lists the socket and an other transport; i-ctl-a listens on the other one, and the
  signal goes by it, carrying nothing.
mode: single
maxExpirySeconds: 3600
liveTransports:
- socket
- &id001
  value: other
  controllerTerm: example-mqtt
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - *id001
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: signal
  bound: A
  command: c1
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: *id001
    carries: {}
  - status: 200
    commands:
    - c1
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
