# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: enact-refused-then-redelivered-ignored
title: A command refused on its first delivery is not enacted on a later one
rules:
- CM21
description: The first delivery of c1 arrives altered and is refused hash-mismatch;
  an intact second delivery is ignored, because the controller decides each commandId
  once.
control: enact-identical-payload-succeeds
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 21
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: other
- at: 30
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  - state: refused
    reason: hash-mismatch
  - state: ignored
    reason: duplicate
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
