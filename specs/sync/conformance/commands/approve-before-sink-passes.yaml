# Synthetic. SPEC-REG-COMMANDS; commands §6. Times are seconds; expectations authored by hand.
id: approve-before-sink-passes
title: An approval before the sink passes routes to the instance recorded at proposal
rules:
- CM13
description: 'Control for approve-after-sink-passed-unnamed: the approval is at 25, while i-ctl-a still
  holds the sink.'
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 30
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
  i-ctl-a2:
    tenant: A
    subject: s-ctl-a2
    product: ControllerA
    definitionId: sha256:d-a2
    simulated: false
    sinks:
      override:
      - 30
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-ctl-a2:
    tenant: A
    permissions: []
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 25
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
end: 25
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 201
    commandId: c1
    state: pending
  proposals:
    p1:
      state: approved
  commands:
    c1:
      state: pending
      destination: i-ctl-a
      proposalId: p1
