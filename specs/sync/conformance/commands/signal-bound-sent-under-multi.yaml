# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: signal-bound-sent-under-multi
title: Under multi, a signal inside a request bound to the command's tenant is sent
rules:
- CM19
- CM27
description: The signal is sent inside the request that accepted the command, bound to A. After the destination
  reports acknowledged nothing waits for it, so a later signal is not sent.
control: signal-unbound-withheld-under-multi
mode: multi
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 10
  kind: signal
  bound: A
  command: c1
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 22
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: acknowledged
- at: 25
  kind: signal
  bound: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: socket
    carries: {}
  - status: 200
    commands:
    - c1
  - status: 200
  - signalled: false
    reason: nothing-waiting
  commands:
    c1:
      state: acknowledged
      destination: i-ctl-a
