# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-after-role-lost-is-empty
title: An instance that no longer holds the role fetches an empty list
rules:
- CM18
- CM2
description: i-ctl-a held command-sink over [0, 20); c1 was routed to it at 10 and not fetched. Its fetch
  at 30 is 200 with no commands.
control: fetch-before-role-lost
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 20
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 30
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands: []
  commands:
    c1:
      state: undeliverable
      destination: i-ctl-a
