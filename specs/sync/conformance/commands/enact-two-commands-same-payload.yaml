# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: enact-two-commands-same-payload
title: Two commands with the same payload are two commands
rules:
- CM21
- CM4
- CM24
description: A sender sends the same payload twice without a requestId (CM4); the
  controller enacts each commandId once, so both are enacted. The outstanding list,
  not CM21, is what shows the sender the first.
control: enact-push-then-fetch-once
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 12
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 21
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
- at: 22
  kind: enact
  instance: i-ctl-a
  command: c2
  received:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 201
    commandId: c2
    state: pending
    outstanding:
      proposals: []
      commands:
      - c1
      dosesSince: []
  - status: 200
    commands:
    - c1
    - c2
  - state: succeeded
  - state: succeeded
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
    c2:
      state: fetched
      destination: i-ctl-a
