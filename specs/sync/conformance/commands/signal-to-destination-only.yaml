# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: signal-to-destination-only
title: A signal goes to the command's destination only, and carries nothing
rules:
- CM27
description: Two controllers on tenant A listen on the socket; c1 is routed to i-ctl-a. The signal goes
  to i-ctl-a alone and carries no payload, hash or commandId; i-ctl-b's fetch returns nothing.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
  i-ctl-b:
    tenant: A
    subject: s-ctl-b
    product: ControllerB
    definitionId: sha256:d-b
    simulated: false
    sinks:
      example/slot:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-ctl-b:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: signal
  bound: A
  command: c1
- at: 12
  kind: fetch
  tenant: A
  subject: s-ctl-b
  instance: i-ctl-b
- at: 13
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: socket
    carries: {}
  - status: 200
    commands: []
  - status: 200
    commands:
    - c1
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
