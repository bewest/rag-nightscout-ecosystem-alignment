# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: expiry-within-fetch-bound-flagged
title: A command that expires within its destination's fetch bound is accepted and flagged
rules:
- CM30
- CM3
- CM5
description: c1 expires 120 s after it is sent, and i-ctl-a may go 360 s between fetches. The hub accepts
  it unchanged, with mayExpireUnfetched in the reply and on the record; never fetched, it ends expired.
control: expiry-beyond-fetch-bound-not-flagged
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
    cadence:
      nominalSeconds: 300
      maxDeferralSeconds: 60
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 130
- at: 200
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 360
    mayExpireUnfetched: true
  - status: 200
    state: expired
  commands:
    c1:
      state: expired
      destination: i-ctl-a
      mayExpireUnfetched: true
