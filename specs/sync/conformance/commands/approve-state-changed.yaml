# Synthetic. SPEC-REG-COMMANDS; commands §6. Times are seconds; expectations authored by hand.
id: approve-state-changed
title: An approval after the target's state version moved is refused
rules:
- CM15
description: 'p1 is based on v1; ControllerA''s state version changes to v2 at 40, before the approval
  at 50: 409 state-changed.'
control: approve-state-unchanged
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
    - - 40
      - v2
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 50
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 409
    code: state-changed
  proposals:
    p1:
      state: open
  commands: {}
