# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: signalled-then-lapse-undeliverable
title: A signalled command whose destination lapses before fetching is undeliverable
rules:
- CM2
- CM27
- CM9
description: c1 is signalled to i-ctl-a, which loses command-sink at 20 without fetching. A signal hands
  nothing over, so c1 is undeliverable, a final state, and a later report is 409 already-final.
control: fetched-then-lapse-report-accepted
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 20
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 10
  kind: signal
  bound: A
  command: c1
- at: 25
  kind: read
  tenant: A
  command: c1
- at: 30
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
- at: 35
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: socket
    carries: {}
  - status: 200
    state: undeliverable
  - status: 409
    code: already-final
  - status: 200
    state: undeliverable
  commands:
    c1:
      state: undeliverable
      destination: i-ctl-a
