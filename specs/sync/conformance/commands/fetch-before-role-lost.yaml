# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-before-role-lost
title: The same instance fetches while it holds the role
rules:
- CM18
- CM2
description: 'Control for fetch-after-role-lost-is-empty: the fetch is at 15, before the role ends at
  20.'
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 20
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 15
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
end: 30
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
