# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: request-id-same-payload-returns-first
title: Re-sending the same requestId and payload returns the first command
rules:
- CM4
description: The second request carries the same requestId and an identical payload; it returns c1 with
  its current state (fetched) and creates nothing.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
  requestId: r1
- at: 15
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 20
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
  requestId: r1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 200
    commands:
    - c1
  - status: 200
    commandId: c1
    state: fetched
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
