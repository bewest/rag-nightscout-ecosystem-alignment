# Synthetic. SPEC-REG-COMMANDS; commands §2. Times are seconds; expectations authored by hand.
id: route-latest-instance-not-destination
title: The product's latest instance is not a destination unless it holds the sink
rules:
- CM1
description: i-ctl-a held command-sink over [0, 5); i-ctl-a2, a later instance of the same product, holds
  none. A command at 10 is refused, not routed to the later instance.
control: route-to-holder
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 5
  i-ctl-a2:
    tenant: A
    subject: s-ctl-a2
    product: ControllerA
    definitionId: sha256:d-a2
    simulated: false
    sinks: {}
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-ctl-a2:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
expected:
  calls:
  - status: 409
    code: no-command-destination
    commandId: c1
  commands:
    c1:
      state: not-routed
      destination: null
