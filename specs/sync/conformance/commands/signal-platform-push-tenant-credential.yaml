# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: signal-platform-push-tenant-credential
title: A platform push is a signal sent with the tenant's own credential
rules:
- CM20
- CM27
description: i-ctl-a listens for a platform push; tenant A holds its own credential for it, so the signal
  is sent by platform push, carrying nothing.
mode: single
maxExpirySeconds: 3600
liveTransports:
- socket
- apns
pushCredentials:
  A:
  - apns
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - apns
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: signal
  bound: A
  command: c1
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - signalled: true
    to: i-ctl-a
    via: apns
    carries: {}
  - status: 200
    commands:
    - c1
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
