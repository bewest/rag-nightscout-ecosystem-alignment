# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: pushed-then-lapse-unconfirmed
title: A command handed to a push and then losing its destination is unconfirmed, and a report replaces
  it
rules:
- CM2
- CM9
description: c1 is pushed to i-ctl-a, which loses command-sink at 20 without fetching. The controller
  may have it, so c1 reads unconfirmed, not undeliverable; i-ctl-a's subject then reports succeeded, which
  is accepted and replaces unconfirmed.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 20
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 10
  kind: push
  bound: A
  command: c1
  via: socket
- at: 25
  kind: read
  tenant: A
  command: c1
- at: 30
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
- at: 35
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - sent: true
  - status: 200
    state: unconfirmed
  - status: 200
  - status: 200
    state: succeeded
  commands:
    c1:
      state: succeeded
      destination: i-ctl-a
