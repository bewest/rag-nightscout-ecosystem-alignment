# Synthetic. SPEC-REG-COMMANDS; commands §2. Times are seconds; expectations authored by hand.
id: route-lapsed-holder-not-destination
title: A lapsed former holder is never a destination
rules:
- CM1
description: The instance held command-sink over [0, 5); a command at 10 is refused no-command-destination.
control: route-to-holder
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 5
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 20
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 409
    code: no-command-destination
    commandId: c1
  - status: 200
    state: not-routed
  commands:
    c1:
      state: not-routed
      destination: null
