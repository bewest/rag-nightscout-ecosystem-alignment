# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-reply-lost-refetch-delivers
title: A fetch whose reply was lost is answered again by the next fetch
rules:
- CM26
- CM21
description: The reply to the fetch at 11 never reaches the controller; c1 is fetched at the hub. The
  controller's next fetch returns c1 again, and it enacts and reports it.
control: refetch-after-acknowledged-empty
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 11
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 12
  kind: read
  tenant: A
  command: c1
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 21
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
- at: 22
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  - status: 200
    state: fetched
  - status: 200
    commands:
    - c1
  - state: succeeded
  - status: 200
  commands:
    c1:
      state: succeeded
      destination: i-ctl-a
