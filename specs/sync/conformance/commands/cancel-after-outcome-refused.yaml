# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: cancel-after-outcome-refused
title: A command already enacted cannot be cancelled
rules:
- CM25
- CM9
description: 'c1 is reported succeeded before the cancel arrives: 409 already-final,
  and the outcome stands.'
control: cancel-pending-is-final
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 15
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 16
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
- at: 17
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
- at: 20
  kind: cancel
  tenant: A
  subject: s-care
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 200
    commands:
    - c1
  - state: succeeded
  - status: 200
  - status: 409
    code: already-final
  commands:
    c1:
      state: succeeded
      destination: i-ctl-a
