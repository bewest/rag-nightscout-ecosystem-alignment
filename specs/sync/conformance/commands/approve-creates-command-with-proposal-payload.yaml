# Synthetic. SPEC-REG-COMMANDS; commands §6. Times are seconds; expectations authored by hand.
id: approve-creates-command-with-proposal-payload
title: An approval creates one command carrying the proposal's payload
rules:
- CM13
- CM14
- CM1
description: s-care approves p1 naming the proposal's payload. One command is created with proposalId
  p1, routed to the holder; the controller's hash check over the proposal's payload passes, so the command's
  hash is the proposal's.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 50
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
- at: 55
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 60
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  - state: succeeded
  proposals:
    p1:
      state: approved
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
      proposalId: p1
