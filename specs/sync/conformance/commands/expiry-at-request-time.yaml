# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: expiry-at-request-time
title: An expiry equal to the request's time is refused
rules:
- CM3
description: 'A command at 10 with expiresAt 10 is not after the request''s time: 422 expiry-required,
  no id.'
control: expiry-one-second-after-request
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 10
expected:
  calls:
  - status: 422
    code: expiry-required
  commands: {}
