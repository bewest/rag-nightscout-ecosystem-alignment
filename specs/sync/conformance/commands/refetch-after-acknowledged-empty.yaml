# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: refetch-after-acknowledged-empty
title: After the controller reports, a fetch no longer returns the command
rules:
- CM26
description: c1 is fetched and acknowledged; the next fetch returns nothing.
control: fetch-reply-lost-refetch-delivers
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
    liveTransports:
    - socket
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 11
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 12
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: acknowledged
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    commands:
    - c1
  - status: 200
  - status: 200
    commands: []
  commands:
    c1:
      state: acknowledged
      destination: i-ctl-a
