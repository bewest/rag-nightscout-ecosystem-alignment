# Synthetic. SPEC-REG-COMMANDS; commands §2. Times are seconds; expectations authored by hand.
id: route-ambiguous-declared-channel
title: An unshared channel declared by two products needs a product
rules:
- CM1
description: Two products declare `override` and the command names neither; refused 409 ambiguous-command-destination
  and recorded as not-routed.
control: route-ambiguous-resolved-by-product
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-ctl-b:
    tenant: A
    subject: s-ctl-b
    product: ControllerB
    definitionId: sha256:d-b
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
    - ControllerB
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  payload:
    action: start
    preset: example
  expiresAt: 600
expected:
  calls:
  - status: 409
    code: ambiguous-command-destination
    commandId: c1
  commands:
    c1:
      state: not-routed
      destination: null
