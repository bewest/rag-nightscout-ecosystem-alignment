    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-ctl-b:
    tenant: B
    subject: s-ctl-b
    product: ControllerA
    definitionId: sha256:d-b
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
