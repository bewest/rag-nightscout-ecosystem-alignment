# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-instance-own-tenant
title: The destination fetches on its own tenant
rules:
- CM6
- CM18
description: 'Control for fetch-instance-other-tenant-404: i-ctl-a''s subject fetches on tenant A.'
mode: multi
maxExpirySeconds: 3600
instances:
