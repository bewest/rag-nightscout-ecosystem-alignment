# Synthetic. SPEC-REG-COMMANDS; commands §6. Times are seconds; expectations authored by hand.
id: approve-rejected-proposal
title: A rejected proposal cannot be approved
rules:
- CM13
- CM14
description: 's-care rejects p1, then approves it: 409 proposal-closed.'
control: approve-creates-command-with-proposal-payload
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 30
  kind: reject
  tenant: A
  subject: s-care
  proposal: p1
- at: 50
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 200
  - status: 409
    code: proposal-closed
  proposals:
    p1:
      state: rejected
  commands: {}
