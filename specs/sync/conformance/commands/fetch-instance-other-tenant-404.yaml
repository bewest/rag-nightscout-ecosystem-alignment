# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-instance-other-tenant-404
title: A fetch naming an instance on another tenant is 404
rules:
- CM6
- CM18
description: 'The tenant-B controller''s subject fetches on tenant B naming i-ctl-a, a tenant-A instance:
  404, as for an instance that does not exist, and c1 is not fetched.'
control: fetch-instance-own-tenant
mode: multi
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-ctl-b:
    tenant: B
    subject: s-ctl-b
    product: ControllerA
    definitionId: sha256:d-b
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
  B:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-ctl-b:
    tenant: B
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 20
  kind: fetch
  tenant: B
  subject: s-ctl-b
  instance: i-ctl-a
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 404
  commands:
    c1:
      state: pending
      destination: i-ctl-a
