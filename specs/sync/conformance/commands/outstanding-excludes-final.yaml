# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: outstanding-excludes-final
title: A command with a final outcome is not outstanding
rules:
- CM24
description: c1 is fetched, enacted and reported succeeded; the follower's list is
  then empty, and so are the doses since.
control: outstanding-lists-open-items
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-follower:
    tenant: A
    permissions:
    - api:commands:read
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
doseRecords:
  A:
    ControllerA:
    - 25
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 15
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 16
  kind: enact
  instance: i-ctl-a
  command: c1
  received:
    action: start
    preset: example
- at: 17
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
- at: 30
  kind: outstanding
  tenant: A
  subject: s-follower
  channel: override
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 200
    commands:
    - c1
  - state: succeeded
  - status: 200
  - status: 200
    proposals: []
    commands: []
    dosesSince: []
  commands:
    c1:
      state: succeeded
      destination: i-ctl-a
