# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: sent-and-fetched-are-not-success
title: A push and a fetch are receipts, not outcomes
rules:
- CM9
- CM17
description: c1 is pushed and fetched and no outcome is reported; its state at the end is fetched, never
  succeeded.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: push
  bound: A
  command: c1
  via: socket
- at: 12
  kind: read
  tenant: A
  command: c1
- at: 15
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 20
  kind: read
  tenant: A
  command: c1
end: 500
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - sent: true
  - status: 200
    state: sent
  - status: 200
    commands:
    - c1
  - status: 200
    state: fetched
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
