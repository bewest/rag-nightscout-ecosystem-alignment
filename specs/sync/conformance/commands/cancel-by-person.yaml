# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: cancel-by-person
title: The person cancels a caregiver's pending command
rules:
- CM25
description: s-person, who acts for the person whose therapy the tenant holds, cancels
  c1, which s-care sent.
control: cancel-by-other-subject-refused
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-person:
    tenant: A
    person: true
    permissions: []
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 20
  kind: cancel
  tenant: A
  subject: s-person
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 200
    state: cancelled
  commands:
    c1:
      state: cancelled
      destination: i-ctl-a
