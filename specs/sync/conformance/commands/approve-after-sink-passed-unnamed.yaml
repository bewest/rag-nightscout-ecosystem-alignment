# Synthetic. SPEC-REG-COMMANDS; commands §6. Times are seconds; expectations authored by hand.
id: approve-after-sink-passed-unnamed
title: An approval after the sink passed to another instance is refused, even with no instanceId named
rules:
- CM13
description: 'p1 names no instanceId and is routed to i-ctl-a at 20. At 30 command-sink passes to i-ctl-a2
  of the same product; the approval at 50 would reach a device the proposer did not read: 409 destination-changed,
  no command, p1 stays open.'
control: approve-before-sink-passes
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 30
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
  i-ctl-a2:
    tenant: A
    subject: s-ctl-a2
    product: ControllerA
    definitionId: sha256:d-a2
    simulated: false
    sinks:
      override:
      - 30
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
  s-ctl-a2:
    tenant: A
    permissions: []
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 50
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 409
    code: destination-changed
  proposals:
    p1:
      state: open
  commands: {}
