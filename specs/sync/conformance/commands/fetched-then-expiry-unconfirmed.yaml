# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: fetched-then-expiry-unconfirmed
title: A fetched command with no outcome becomes unconfirmed at its expiry
rules:
- CM3
description: c1 is fetched at 20 and nothing is reported; at its expiry at 100 it becomes unconfirmed,
  never expired, because the controller may have enacted it.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 90
  kind: read
  tenant: A
  command: c1
- at: 150
  kind: read
  tenant: A
  command: c1
end: 150
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 200
    commands:
    - c1
  - status: 200
    state: fetched
  - status: 200
    state: unconfirmed
  commands:
    c1:
      state: unconfirmed
      destination: i-ctl-a
