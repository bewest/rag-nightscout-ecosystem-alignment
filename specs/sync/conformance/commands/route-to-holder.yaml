# Synthetic. SPEC-REG-COMMANDS; commands §2. Times are seconds; expectations authored by hand.
id: route-to-holder
title: A command naming the product goes to the instance holding command-sink
rules:
- CM1
description: The live device instance holding command-sink on the channel, on the command's tenant, is
  the destination.
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 20
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    state: pending
  commands:
    c1:
      state: pending
      destination: i-ctl-a
