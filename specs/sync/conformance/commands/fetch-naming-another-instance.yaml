# Synthetic. SPEC-REG-COMMANDS; commands §7. Times are seconds; expectations authored by hand.
id: fetch-naming-another-instance
title: A fetch naming an instance that is not the credential's own is refused
rules:
- CM18
description: 's-ctl-b fetches as i-ctl-a: 403 not-registration-owner, and c1 is not fetched.'
control: fetch-returns-own-commands
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-ctl-b:
    tenant: A
    subject: s-ctl-b
    product: ControllerB
    definitionId: sha256:d-b
    simulated: false
    sinks:
      target:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
    target:
    - ControllerB
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-ctl-b:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 11
  kind: command
  tenant: A
  subject: s-care
  channel: target
  product: ControllerB
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 20
  kind: fetch
  tenant: A
  subject: s-ctl-b
  instance: i-ctl-a
- at: 21
  kind: fetch
  tenant: A
  subject: s-ctl-b
  instance: i-ctl-b
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - status: 201
    commandId: c2
    state: pending
  - status: 403
    code: not-registration-owner
  - status: 200
    commands:
    - c2
  commands:
    c1:
      state: pending
      destination: i-ctl-a
    c2:
      state: fetched
      destination: i-ctl-b
