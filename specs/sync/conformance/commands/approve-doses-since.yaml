# Synthetic. SPEC-REG-COMMANDS; commands §6, §5. Times are seconds; expectations authored by hand.
id: approve-doses-since
title: An approval is refused when a dose arrived after the proposal was made
rules:
- CM22
description: A dose record for ControllerA reaches the hub at 30, after p1 was made
  at 20; the approval at 50 is refused doses-since and p1 stays open.
control: approve-doses-before-proposal
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
  i-agent:
    tenant: A
    subject: s-agent
    product: AgentTool
    definitionId: sha256:d-agent
    sinks: {}
    proposes:
    - override
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
  s-agent:
    tenant: A
    permissions:
    - api:proposals:create
stateVersions:
  A:
    ControllerA:
    - - 0
      - v1
doseRecords:
  A:
    ControllerA:
    - 30
calls:
- at: 20
  kind: propose
  tenant: A
  subject: s-agent
  instance: i-agent
  channel: override
  payload:
    action: start
    preset: example
  basedOn: v1
  expiresAt: 100
- at: 50
  kind: approve
  tenant: A
  subject: s-care
  proposal: p1
  approves:
    action: start
    preset: example
expected:
  calls:
  - status: 201
    proposalId: p1
  - status: 409
    code: doses-since
  proposals:
    p1:
      state: open
  commands: {}
