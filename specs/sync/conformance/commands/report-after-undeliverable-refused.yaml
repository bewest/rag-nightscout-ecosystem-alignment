# Synthetic. SPEC-REG-COMMANDS; commands §5. Times are seconds; expectations authored by hand.
id: report-after-undeliverable-refused
title: 'A report after undeliverable is refused: the state is final'
rules:
- CM2
- CM9
description: Nothing is fetched before i-ctl-a loses command-sink at 20, so c1 is undeliverable,
  a final state; a later report from i-ctl-a's subject is 409 already-final.
control: fetched-then-lapse-report-accepted
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - 20
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 600
- at: 25
  kind: read
  tenant: A
  command: c1
- at: 30
  kind: report
  tenant: A
  subject: s-ctl-a
  command: c1
  state: succeeded
- at: 35
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
    fetchWithinSeconds: 30
  - status: 200
    state: undeliverable
  - status: 409
    code: already-final
  - status: 200
    state: undeliverable
  commands:
    c1:
      state: undeliverable
      destination: i-ctl-a
