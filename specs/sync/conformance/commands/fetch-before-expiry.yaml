# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: fetch-before-expiry
title: A command fetched before its expiry is delivered
rules:
- CM3
description: 'Control for fetch-after-expiry-is-empty: the same calls 100 s earlier.'
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
  expiresAt: 100
- at: 40
  kind: push
  bound: A
  command: c1
  via: socket
- at: 50
  kind: fetch
  tenant: A
  subject: s-ctl-a
  instance: i-ctl-a
- at: 60
  kind: read
  tenant: A
  command: c1
expected:
  calls:
  - status: 201
    commandId: c1
    state: pending
  - sent: true
  - status: 200
    commands:
    - c1
  - status: 200
    state: fetched
  commands:
    c1:
      state: fetched
      destination: i-ctl-a
