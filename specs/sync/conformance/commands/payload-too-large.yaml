# Synthetic. SPEC-REG-COMMANDS; commands §4. Times are seconds; expectations authored by hand.
id: payload-too-large
title: A payload over maxPayloadBytes is refused and not recorded
rules:
- CM5
description: 'maxPayloadBytes is 64; the payload''s canonical JSON is over 100 bytes: 413 payload-too-large,
  no id.'
control: payload-within-limit
mode: single
maxExpirySeconds: 3600
instances:
  i-ctl-a:
    tenant: A
    subject: s-ctl-a
    product: ControllerA
    definitionId: sha256:d-a
    simulated: false
    sinks:
      override:
      - 0
      - null
declares:
  A:
    override:
    - ControllerA
subjects:
  s-care:
    tenant: A
    permissions:
    - api:commands:create
  s-ctl-a:
    tenant: A
    permissions: []
maxPayloadBytes: 64
calls:
- at: 10
  kind: command
  tenant: A
  subject: s-care
  channel: override
  product: ControllerA
  payload:
    action: start
    preset: example
    note: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  expiresAt: 600
expected:
  calls:
  - status: 413
    code: payload-too-large
  commands: {}
