id: create-retry-noop
title: A create retried with identical content succeeds as a no-op
description: 'The first create succeeded but its response was lost. The retry carries If-None-Match:
  * and the same registration; the change has already been applied, so the hub answers 200
  with noop and the unchanged etag (RFC 9110 §13.1.1 allows this for If-Match; the contract
  applies the same rule to If-None-Match).'
