# STPA of the platform specifications (queue item SPEC-STPA-PLATFORM).
# Contributor-facing. Read with docs/30-design/platform/spec/control-loops.md, which draws each
# loop and says what the analysis found; tools/nsschema/test_stpa.py checks this file.
#
# status:
#   covered     a rule in a specification prevents it, and a conformance case or check shows it
#   uncased     a rule prevents it; no case shows it yet
#   controller  the controller's own validation prevents it (D18); `evidence` says where
#   gap         no rule prevents it; `open` names the specification's open item that carries it
#
# constraints name a rule id from a specification table (CM3, I5, A7, ...) or a section,
# written "<spec> §N". verification names cases under specs/sync/conformance/ or checks
# written tools/...py::test_name.

losses:
  LOSS-1: Harm to the person with diabetes from insulin delivered or withheld (hypoglycaemia, hyperglycaemia, ketoacidosis).
  LOSS-2: Loss of the ability to say afterwards what was asked, by whom, and what was enacted, for care, incident review or regulatory review.
  LOSS-3: Disclosure of health data, or of control over therapy, to someone the person did not authorise.

hazards:
  HAZ-1:
    text: Insulin delivery, or a therapy setting, that the person or someone they authorised did not intend at that time, including the same change enacted twice.
    losses: [LOSS-1]
  HAZ-2:
    text: A therapy change someone intended is not made, while the people relying on it believe it was.
    losses: [LOSS-1]
  HAZ-3:
    text: A person, controller or agent acts on a picture of delivered insulin, active therapy or a command's fate that differs from what happened.
    losses: [LOSS-1, LOSS-2]
  HAZ-4:
    text: Control over therapy, or health data, reaches someone not authorised for it, such as another tenant or a reader promoted to an actor.
    losses: [LOSS-1, LOSS-3]
  HAZ-5:
    text: The record cannot show what was asked, by whom, what was enacted, and when.
    losses: [LOSS-2]

loops:
  command:
    title: A remote command
    specs: [commands §2, commands §4, commands §5, commands §7]
    actions:
      CA-CMD-SEND: {by: sender, to: hub, text: send a command for a channel}
      CA-CMD-CANCEL: {by: sender, to: hub, text: cancel a command that is no longer wanted}
      CA-CMD-DELIVER: {by: hub, to: controller, text: deliver a command in a fetch, after a fetch-now signal or on the controller's own cadence}
      CA-CMD-ENACT: {by: controller, to: pump, text: enact a delivered command}
    feedback:
      FB-CMD-STATE: {from: hub, to: sender, text: the command's state and outcome}
  proposal:
    title: A proposal and its approval
    specs: [commands §6, authority §7]
    actions:
      CA-PROP-PROPOSE: {by: proposer, to: hub, text: propose a change}
      CA-PROP-APPROVE: {by: approver, to: hub, text: approve a proposal, which creates a command}
      CA-PROP-EVALUATE: {by: evaluator, to: hub, text: attach an evaluation}
  routing:
    title: Which instance receives commands
    specs: [registration §8, registration §9, authority §4, authority §6]
    actions:
      CA-ROUTE-GRANT: {by: hub, to: routing, text: grant or keep a command-sink role}
      CA-ROUTE-REBIND: {by: owner, to: hub, text: transfer or release a product, or transfer a role}
  sync:
    title: Records written, matched and read back
    specs: [identity §1, identity §3, sync-transport §2, sync-transport §4, records §2, state-intent §2]
    actions:
      CA-SYNC-STORE: {by: hub, to: store, text: store, match or merge a written record}
      CA-SYNC-SERVE: {by: hub, to: reader, text: serve a history page or a socket event}
      CA-SYNC-DOWNLOAD: {by: hub, to: controller, text: serve treatments other clients wrote to a controller that acts on them (S10 treatment-download)}
  state:
    title: What is active, as the hub reports it
    specs: [state-intent §6]
    feedback:
      FB-STATE-ACTIVE: {from: hub, to: reader, text: the active intents and the state version}
  definitions:
    title: Controller-owned definitions
    specs: [registration §5, registration §7, authority §5]
    actions:
      CA-DEF-ACCEPT: {by: hub, to: store, text: accept a registration, definition or element}
  authority:
    title: Credentials, permissions and delegation
    specs: [authority §2, authority §3, authority §4, authority §7]
    actions:
      CA-AUTH-GRANT: {by: owner, to: hub, text: grant a credential or permission}
      CA-OWNER-ADMIN: {by: owner, to: hub, text: block, retire, free namespaces or pin a version}
      CA-OP-CONFIG: {by: operator, to: hub, text: set the hub's limits and tenancy mode}
  plan:
    title: A plan, approved once and run by the controller
    specs: [plans §3, plans §4, plans §5, plans §6, plans §7]
    actions:
      CA-PLAN-PROPOSE: {by: proposer, to: hub, text: propose a plan}
      CA-PLAN-APPROVE: {by: approver, to: hub, text: approve a plan's elements}
      CA-PLAN-CONFIRM: {by: proposer, to: hub, text: confirm an occurrence under the plan's grant}
      CA-PLAN-OCCURRENCE: {by: approver, to: hub, text: approve one occurrence of a per-occurrence element}
      CA-PLAN-STOP: {by: person, to: hub, text: skip an occurrence or end the plan}
      CA-PLAN-RUN: {by: controller, to: pump, text: run an occurrence}
    feedback:
      FB-PLAN-MIRROR: {from: hub, to: reader, text: the plan's mirror and its occurrences}

# For each control action, every STPA type is either a UCA below or listed here with why it is
# not hazardous on its own.
considered:
  CA-CMD-SEND:
    not-provided: Not sending is the sender's decision; a command the hub refuses at routing is recorded not-routed and answered (CM1).
    duration: A command is one request; how long its effect lasts is in its payload, which the controller reads and the hub does not (CM5).
  CA-CMD-CANCEL:
    provided: A cancel before hand-over is final, and after hand-over it is a request the controller decides once (CM25, CM21); a cancel is never enacted on the pump.
    timing: A cancel after an outcome is refused already-final and the outcome stands (CM25).
    duration: A cancel is one event.
  CA-CMD-DELIVER:
    duration: Delivery is one event; a command delivered more than once is under provided.
  CA-CMD-ENACT:
    duration: How long an enacted override or temporary target runs is the controller's, checked by its own validation (D18).
  CA-PROP-PROPOSE:
    not-provided: A proposal not made changes nothing.
    timing: A proposal's timing is checked at approval (CM13, CM15), where it can act.
    duration: A proposal's life is its expiry, required as a command's is (CM11).
  CA-PROP-APPROVE:
    not-provided: An approval not given leaves the proposal to expire, which its proposer and readers see; the person can act directly.
    duration: An approval is one event.
  CA-PROP-EVALUATE:
    not-provided: An evaluation is evidence and never required.
    timing: An evaluation changes nothing whenever it arrives (CM16).
    duration: An evaluation is one event.
  CA-ROUTE-GRANT:
    timing: Grants happen at renewal; a late grant is the lapse case under provided.
  CA-ROUTE-REBIND:
    not-provided: A rebind not made leaves routing as it was, which the owner's listing shows.
    timing: A rebind takes effect at once (authority §6).
    duration: A rebind is one event.
  CA-SYNC-STORE:
    not-provided: A write the hub does not store is answered with an error, and the client's re-send is safe because it matches (I5).
    timing: A store's time is the server's (T3) and a record's own time is its own field (I3), both covered under provided.
    duration: A store is one event.
  CA-SYNC-DOWNLOAD:
    not-provided: An entry not downloaded is not acted on; the person can enter it on the controller.
    duration: A download is one event; what the entry starts lasts as the controller decides.
  CA-DEF-ACCEPT:
    not-provided: A refused element is written as its carrier and stays readable (registration §6).
    timing: Acceptance is at submission; a stored record keeps its definition (T13).
    duration: A definition is stored until retention (registration §14).
  FB-CMD-STATE:
    delayed: A late outcome replaces unconfirmed (CM9); a sender who acts before it arrives is UCA-CMD-001.
  FB-STATE-ACTIVE:
    absent: A kind whose records cannot be read is reported unreadable, not shown as having nothing active (A11).
  CA-AUTH-GRANT:
    not-provided: A permission not granted refuses the request, which the requester sees.
    timing: A grant takes effect when made; revocation reaching what is already open is UCA-SYNC-SERVE-005.
  CA-OWNER-ADMIN:
    not-provided: An action not taken leaves the registration as it was, which the owner's listing shows.
    timing: Each action takes effect at once (authority §4).
    duration: A block or retire lasts until the owner reverses it, which the listing shows.
  CA-OP-CONFIG:
    not-provided: Without a setting the hub uses its default.
    timing: A setting applies to requests after it.
    duration: A setting lasts until changed.

  CA-PLAN-PROPOSE:
    not-provided: Without a plan the person acts in the moment, as with commands.
    timing: A plan proposed early waits within its proposal expiry (PN1) and is checked at approval (PN7).
  CA-PLAN-APPROVE:
    not-provided: A plan not approved never reaches the controller.
    duration: An approval is one event; the plan's life is its end date (UCA-PLAN-004).
  CA-PLAN-CONFIRM:
    not-provided: An occurrence that needs a confirmation and gets none does not run, and the controller reports it missed (PN10, PN11).
    duration: A confirmation is one event and expires at its occurrence (PN12).
  CA-PLAN-OCCURRENCE:
    not-provided: A per-occurrence element without its approval does not run (PN13).
    duration: An approval is one event and expires at its occurrence (PN13).
  CA-PLAN-STOP:
    duration: A skip is one occurrence; an end lasts until the controller reports ended (PN16).
  CA-PLAN-RUN:
    not-provided: An occurrence that does not run is reported withdrawn or missed (PN11); not running when a criterion cannot be evaluated with fresh data is the fail-closed outcome FL1 chooses (PN10).
    duration: How long an occurrence's intent runs is its element's bounds, which the controller checks (PN10).
  FB-PLAN-MIRROR:
    delayed: A plan command handed over without a report leaves the mirror approved, and the person can still end the plan (PN9, PN16).

ucas:
  # --- command ---
  - id: UCA-CMD-001
    action: CA-CMD-SEND
    type: provided
    text: A sender sends a second command for the same intent while the first is pending, fetched or unconfirmed, and both are enacted.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM3, CM4, CM24]
    status: gap
    open: commands §9
    note: CM24 shows the sender what is outstanding with each reply, and nothing refuses a second command; a command without a requestId is always new, and the controller's own check (CM23) is the last guard for doses.
  - id: UCA-CMD-002
    action: CA-CMD-SEND
    type: provided
    text: A retry of one request is treated as a new command.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM4]
    status: covered
    verification: [commands/request-id-same-payload-returns-first, commands/request-id-reordered-keys-same-hash, commands/request-id-different-payload-refused]
  - id: UCA-CMD-003
    action: CA-CMD-SEND
    type: timing
    text: A command is enacted long after it was sent, when the sender's reason for it no longer holds.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM3, CM10]
    status: covered
    verification: [commands/expiry-required, commands/expiry-too-long, commands/fetch-after-expiry-is-empty, commands/enact-after-expiry-refused, tools/nsschema/test_commands.py::test_never_after_expiry]
  - id: UCA-CMD-004
    action: CA-CMD-DELIVER
    type: provided
    text: A command reaches an instance other than the live device holder of the channel's command sink, such as a lapsed former holder, the newest instance, or a simulator.
    hazards: [HAZ-1]
    severity: S4
    constraints: [commands §2, CM1, CM2]
    status: covered
    verification: [commands/route-lapsed-holder-not-destination, commands/route-latest-instance-not-destination, commands/route-simulated-sink-not-destination, commands/undeliverable-not-rerouted]
  - id: UCA-CMD-005
    action: CA-CMD-DELIVER
    type: provided
    text: A command reaches an instance on another tenant, or a signal for one tenant is sent outside a request bound to it or with another tenant's or the deployment's push credentials.
    hazards: [HAZ-4, HAZ-1]
    severity: S4
    constraints: [CM6, CM19, CM20]
    status: covered
    verification: [commands/route-other-tenant-holder-not-used, commands/fetch-instance-other-tenant-404, commands/signal-unbound-withheld-under-multi, commands/signal-bound-other-tenant-withheld, commands/signal-platform-push-no-tenant-credential, tools/nsschema/test_commands.py::test_never_another_tenant, tools/nsschema/test_commands.py::test_never_signalled_unbound]
  - id: UCA-CMD-006
    action: CA-CMD-DELIVER
    type: provided
    text: One command is delivered more than once, by fetches that return it until the controller reports (CM26), and the controller enacts it each time.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM18, CM21, CM26]
    status: covered
    verification: [commands/enact-refetched-once, commands/enact-after-restart-once, commands/enact-refused-then-redelivered-ignored, tools/nsschema/test_commands.py::test_never_enacted_twice]
    note: Delivery is at least once by design (CM26); CM21 makes the controller decide each commandId once, across restarts. Today's controllers meet it in different ways (commands §8).
  - id: UCA-CMD-007
    action: CA-CMD-DELIVER
    type: provided
    text: The payload a controller receives differs from the one the sender sent.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM5, CM10]
    status: covered
    verification: [commands/hub-does-not-judge-payload, commands/enact-hash-mismatch-refused, commands/enact-identical-payload-succeeds]
    note: The hash detects a change in transit or storage; binding a payload to its sender or approver end to end needs a signature (CM10).
  - id: UCA-CMD-008
    action: CA-CMD-DELIVER
    type: not-provided
    text: A fetch-now signal or a fetch reply is lost and the destination never receives the command, or the sender reads the signal as delivery.
    hazards: [HAZ-2, HAZ-3]
    severity: S2
    constraints: [CM17, CM26, CM27]
    status: covered
    verification: [commands/signal-lost-fetch-delivers, commands/fetch-reply-lost-refetch-delivers, commands/signal-and-fetch-are-not-success]
  - id: UCA-CMD-009
    action: CA-CMD-DELIVER
    type: timing
    text: A command is signalled or fetched at or after its expiry.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM3]
    status: covered
    verification: [commands/fetch-after-expiry-is-empty, tools/nsschema/test_commands.py::test_never_after_expiry]
  - id: UCA-CMD-010
    action: CA-CMD-ENACT
    type: provided
    text: A controller enacts a remote command that its own limits, or a recent local action, should have refused.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM5, CM10]
    status: controller
    evidence: The hub never judges a dose (CM5, D18). Each controller that accepts a remote dose applies its own limits and authenticates the sender (commands §8); the existing constraint SC-REMOTE-002 (traceability/stpa/cross-project-patterns.md) asks a controller to refuse a remote command after a recent local action.
  - id: UCA-CMD-011
    action: CA-CMD-ENACT
    type: provided
    text: A controller enacts part of a command, such as storing a meal's carbs and refusing its bolus, and reports one final state.
    hazards: [HAZ-3]
    severity: S3
    constraints: [CM9]
    status: gap
    open: commands §9
  - id: UCA-CMD-012
    action: CA-CMD-ENACT
    type: timing
    text: A controller enacts a command past its expiry because the hub's clock and its own differ.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM10]
    status: covered
    verification: [commands/enact-after-expiry-refused]
  - id: UCA-CMD-013
    action: CA-CMD-ENACT
    type: not-provided
    text: A controller does not enact a command it reported as succeeded, such as a bolus the pump later fails.
    hazards: [HAZ-2, HAZ-3]
    severity: S3
    constraints: [CM9]
    status: gap
    open: commands §9
    note: CM9 refuses a report after a final state, so AndroidAPS's late delivery failure after success cannot be recorded (commands §8).
  - id: FB-CMD-001
    action: FB-CMD-STATE
    type: incorrect
    text: A command that was handed over reads expired or undeliverable, and the sender sends it again.
    hazards: [HAZ-3, HAZ-1]
    severity: S4
    constraints: [CM2, CM3]
    status: covered
    verification: [commands/fetched-then-expiry-unconfirmed, commands/fetched-then-lapse-report-accepted, commands/report-on-unconfirmed-after-expiry-accepted]
  - id: FB-CMD-002
    action: FB-CMD-STATE
    type: incorrect
    text: A command reads succeeded because a subject other than the destination's bound subject reported it.
    hazards: [HAZ-3]
    severity: S3
    constraints: [CM7]
    status: covered
    verification: [commands/report-from-other-subject-refused, commands/report-other-tenant-404]
  - id: FB-CMD-003
    action: FB-CMD-STATE
    type: incorrect
    text: A command reads as done because it was signalled or fetched.
    hazards: [HAZ-3]
    severity: S3
    constraints: [CM7, CM17]
    status: covered
    verification: [commands/signal-and-fetch-are-not-success, commands/report-state-sent-invalid, commands/report-state-fetched-invalid]
  - id: FB-CMD-004
    action: FB-CMD-STATE
    type: absent
    text: The sender learns nothing after the hub accepts a command, with no record of it and no outcome.
    hazards: [HAZ-3, HAZ-5]
    severity: S3
    constraints: [CM1, CM7]
    status: covered
    verification: [commands/report-from-destination-accepted, commands/route-no-holder]
    note: Today's Loop route is outside these rules (commands §8); there a 200 means only that the push service accepted the push.

  - id: UCA-CMD-014
    action: CA-CMD-DELIVER
    type: provided
    text: A process other than the destination that holds its credential, such as another app sharing API_SECRET under single, fetches the command, which moves it to fetched and out of the controller's next fetch, or reports its outcome.
    hazards: [HAZ-2, HAZ-3]
    severity: S3
    constraints: [CM7, CM18]
    status: gap
    open: commands §9
    note: CM7 and CM18 check the subject; under single every holder of the secret is one subject.
  - id: UCA-CMD-015
    action: CA-CMD-CANCEL
    type: not-provided
    text: A sender cannot cancel a pending command after the reason for it went away, such as a meal not eaten.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM3, CM25]
    status: covered
    verification: [commands/cancel-pending-is-final, commands/cancel-after-fetch-is-a-request, commands/cancel-by-person, tools/nsschema/test_commands.py::test_never_delivered_after_cancel]

  # --- proposal ---
  - id: UCA-PROP-001
    action: CA-PROP-PROPOSE
    type: provided
    text: A credential or tool that may only read proposes a change.
    hazards: [HAZ-4]
    severity: S3
    constraints: [CM12]
    status: covered
    verification: [commands/propose-without-permission, commands/propose-without-role, commands/propose-with-another-subjects-instance]
  - id: UCA-PROP-002
    action: CA-PROP-PROPOSE
    type: provided
    text: A proposer floods a channel with proposals, and the approver approves from habit rather than reading.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM11]
    status: gap
    open: commands §9
  - id: UCA-PROP-003
    action: CA-PROP-APPROVE
    type: provided
    text: An approval creates a command whose payload differs from the one the approver approved.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM13]
    status: covered
    verification: [commands/approve-hash-mismatch, commands/approve-creates-command-with-proposal-payload, tools/nsschema/test_commands.py::test_approved_command_carries_approved_hash]
  - id: UCA-PROP-004
    action: CA-PROP-APPROVE
    type: provided
    text: An approver approves a payload whose meaning they misread, such as its units or which product it is for, because nothing declares the payload's shape for a display to render.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM5]
    status: gap
    open: commands §9
  - id: UCA-PROP-005
    action: CA-PROP-APPROVE
    type: provided
    text: An approval reaches a device other than the one whose state the proposer read.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM13]
    status: covered
    verification: [commands/approve-destination-changed, commands/approve-after-sink-passed-unnamed, commands/approve-no-holder]
  - id: UCA-PROP-006
    action: CA-PROP-APPROVE
    type: provided
    text: An approval is given after the controller's reported intents changed from the ones the proposal was based on.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM15]
    status: covered
    verification: [commands/approve-state-changed, commands/approve-state-changed-named-product]
  - id: UCA-PROP-007
    action: CA-PROP-APPROVE
    type: provided
    text: Two proposals on one channel are approved before the controller reports either, so both pass the state-version check and both are enacted.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM15]
    status: gap
    open: commands §9
    note: A state version changes only when the controller's records reach the hub (A12), so it cannot see a command that is approved and not yet enacted.
  - id: UCA-PROP-008
    action: CA-PROP-APPROVE
    type: provided
    text: An approval is enacted under a different definition from the one the proposal was made against, after the destination instance renewed under a new definitionId.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM11, CM13, S12]
    status: gap
    open: commands §9
    note: CM11 records the destination's definitionId; CM13 refuses destination-changed only when the instance differs.
  - id: UCA-PROP-009
    action: CA-PROP-APPROVE
    type: provided
    text: The proposer approves its own proposal.
    hazards: [HAZ-1, HAZ-4]
    severity: S3
    constraints: [CM14]
    status: covered
    verification: [commands/self-approval-refused, commands/approve-without-command-permission]
  - id: UCA-PROP-010
    action: CA-PROP-APPROVE
    type: timing
    text: A proposal is approved after its expiry.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM13]
    status: covered
    verification: [commands/approve-after-proposal-expiry, commands/approved-command-has-proposal-expiry]
  - id: UCA-PROP-011
    action: CA-PROP-EVALUATE
    type: provided
    text: An evaluation changes a proposal's state or approves it.
    hazards: [HAZ-1]
    severity: S3
    constraints: [CM16]
    status: covered
    verification: [commands/evaluation-does-not-change-proposal, commands/evaluate-without-read]

  - id: UCA-PROP-012
    action: CA-PROP-APPROVE
    type: provided
    text: A dose proposal is approved after the person dosed locally, because the state version covers intents and not doses or carbs.
    hazards: [HAZ-1]
    severity: S4
    constraints: [A12, CM15, CM22]
    status: covered
    verification: [commands/approve-doses-since, commands/approve-doses-before-proposal]
    note: CM22 refuses an approval when a dose or carb record arrived after the proposal; it is limited by the upload lag, and the controller's own check is CM23.
  - id: UCA-PROP-013
    action: CA-PROP-APPROVE
    type: provided
    text: Two approvers approve one proposal and two commands are created.
    hazards: [HAZ-1]
    severity: S4
    constraints: [CM13]
    status: covered
    verification: [commands/approve-approved-proposal]
    note: The case shows a second approval refused; atomicity under concurrent approvals is open (commands §9).

  # --- routing ---
  - id: UCA-ROUTE-001
    action: CA-ROUTE-GRANT
    type: provided
    text: A device command-sink role goes to an instance not bound to the product, such as another subject's development build.
    hazards: [HAZ-1, HAZ-4]
    severity: S4
    constraints: [authority §6]
    status: covered
    verification: [instances/instance-command-sink-not-registration-owner, instances/command-not-routed-to-other-subject-simulator]
  - id: UCA-ROUTE-002
    action: CA-ROUTE-GRANT
    type: provided
    text: Two instances, such as an old and a new phone, both hold a channel's device command sink and both enact.
    hazards: [HAZ-1]
    severity: S4
    constraints: [registration §9]
    status: covered
    verification: [instances/instance-role-held, instances/instance-overlap-listed]
  - id: UCA-ROUTE-003
    action: CA-ROUTE-GRANT
    type: provided
    text: A lapsed or dropped role passes to the newest instance without its own claim or the owner's transfer.
    hazards: [HAZ-1]
