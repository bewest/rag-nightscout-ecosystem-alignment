    type: provided
    text: An occurrence runs although live location or activity shows the meal is not happening.
    hazards: [HAZ-1]
    severity: S4
    constraints: [PN10, PN4]
    status: controller
    evidence: The plan's withdrawal criteria are recorded at approval (PN4); the controller evaluates them with data it judges fresh and does not run an occurrence it cannot evaluate (PN10). The proposing agent can also skip it (PN14).
  - id: UCA-PLAN-025
    action: CA-PLAN-RUN
    type: provided
    text: An occurrence runs twice, once on its confirmation and again on its approval.
    hazards: [HAZ-1]
    severity: S4
    constraints: [PN17, CM21]
    status: controller
    evidence: The controller runs each occurrence key at most once, whatever confirmations and approvals arrive for it (PN17), as it decides each command once (CM21).
  - id: UCA-PLAN-026
    action: CA-PLAN-RUN
    type: timing
    text: An occurrence runs after the plan's end date.
    hazards: [HAZ-1]
    severity: S3
    constraints: [PN15]
    status: controller
    evidence: The controller ends the plan at endsAt and runs no occurrence after it (PN15); the hub refuses confirmations and approvals at or past endsAt (PN12).
  - id: UCA-PLAN-027
    action: CA-PLAN-RUN
    type: provided
    text: The hub sends an occurrence at its time, deciding when therapy changes.
    hazards: [HAZ-1]
    severity: S4
    constraints: [PN10]
    status: covered
    verification: [tools/nsschema/test_plans.py::test_every_command_comes_from_a_call]
  - id: FB-PLAN-001
    action: FB-PLAN-MIRROR
    type: incorrect
    text: The mirror shows a plan active that the controller refused, failed or never reported holding.
    hazards: [HAZ-3]
    severity: S3
    constraints: [PN9, PN11]
    status: covered
    verification: [plans/plan-held-active, plans/plan-refused-by-controller, plans/plan-failed-report-refuses-plan]
  - id: FB-PLAN-002
    action: FB-PLAN-MIRROR
    type: incorrect
    text: The mirror's occurrences are moved by someone other than the controller that holds the plan.
    hazards: [HAZ-3]
    severity: S3
    constraints: [PN11, CM7]
    status: covered
    verification: [plans/plan-report-by-other-subject, plans/plan-report-on-refused-plan]
  - id: FB-PLAN-003
    action: FB-PLAN-MIRROR
    type: absent
    text: A caregiver looking at the bolus channel does not see a plan's pending bolus and sends one of their own.
    hazards: [HAZ-3, HAZ-1]
    severity: S4
    constraints: [PN18, CM24]
    status: covered
