  - id: UCA-ROUTE-008
    action: CA-ROUTE-GRANT
    type: duration
    text: A phone that no longer has the pump keeps the command sink until its lease lapses, and commands sent in that window go to it.
    hazards: [HAZ-2]
    severity: S2
    constraints: [CM2, CM7, authority §4]
    status: controller
    evidence: A lease is minutes long, longer than moving a pump between phones takes. A command routed there is never re-routed (CM2); the controller on that phone cannot reach the pump and reports failed, which the sender sees (CM7); the owner can move the role at once with transfer-role (authority §4).

  # --- sync ---
  - id: UCA-SYNC-STORE-001
    action: CA-SYNC-STORE
    type: provided
    text: A re-sent dose or carb record is stored twice, and a reader, or a controller that downloads treatments, counts it twice.
    hazards: [HAZ-3, HAZ-1]
    severity: S4
    constraints: [I5, T1, T7]
    status: covered
    verification: [quirks/carrier-resend-identifier-first, quirks/carrier-resend-matches-identifier, quirks/typed-write-resend-same-ids]
    note: The ecosystem's existing UCA-BOLUS-003 and UCA-CARB-001 (traceability/stpa/cross-project-patterns.md) are the controller side of this.
  - id: UCA-SYNC-STORE-002
    action: CA-SYNC-STORE
    type: provided
    text: Two different doses sent with one identifier are merged into one record, and the second dose disappears from every reader's history.
    hazards: [HAZ-3]
    severity: S4
    constraints: [I1, I6]
    status: controller
    evidence: An identifier names one record (I6) and is the client's to assign (I1); a hub cannot tell a re-send from a different record that reuses an identifier, so uniqueness is the writing client's.
  - id: UCA-SYNC-STORE-003
    action: CA-SYNC-STORE
    type: provided
    text: A re-send after a delete brings back a dose record the person deleted as wrong.
    hazards: [HAZ-3]
    severity: S3
    constraints: [I5, identity §3]
    status: gap
    open: identity §5
    note: Identity §3 stores a re-send of a soft-deleted record again; ID-DELETE-REUSE-DECISION is open.
  - id: UCA-SYNC-STORE-004
    action: CA-SYNC-STORE
    type: provided
    text: A stored record is converted to another definition version, or a quirk mapping is applied, without a record of it.
    hazards: [HAZ-3, HAZ-5]
    severity: S2
    constraints: [T13, Q3]
    status: covered
    verification: [instances/project-no-mapping, quirks/carrier-uuid-id-moved]
  - id: UCA-SYNC-STORE-005
    action: CA-SYNC-STORE
    type: provided
    text: A setting the controller did not publish is stored with a default value, and a replay or reader takes it as the controller's.
    hazards: [HAZ-3]
    severity: S2
    constraints: [R6]
    status: covered
    verification: [tools/nsschema/test_nsschema.py::test_settings_schema_is_valid_and_accepts_a_partial_publication]
  - id: UCA-SYNC-STORE-006
    action: CA-SYNC-STORE
    type: provided
    text: A reader times a record by when the hub received it, the time in its `_id`, rather than its own time field.
    hazards: [HAZ-3]
    severity: S3
    constraints: [I3, A3]
    status: covered
    verification: [quirks/typed-write-assigns-objectid, active-state/applied-duration-in-declared-unit]
  - id: UCA-SYNC-SERVE-001
    action: CA-SYNC-SERVE
    type: not-provided
    text: A history read skips a record, at a page boundary or while a write is in flight, and the reader never sees that dose.
    hazards: [HAZ-3]
    severity: S3
    constraints: [T6, T9]
    status: covered
    verification: [sync-transport/equal-values-at-page-boundary, sync-transport/in-flight-write-not-skipped, sync-transport/truncated-above-watermark-no-stall]
  - id: UCA-SYNC-SERVE-002
    action: CA-SYNC-SERVE
    type: not-provided
    text: A client that follows the socket alone misses writes that never reach it.
    hazards: [HAZ-3]
    severity: S3
    constraints: [T10, T12]
    status: covered
    verification: [sync-transport/socket-resume-after-disconnect, sync-transport/write-without-event-not-lost]
    note: T10 makes history the record and the socket a fast path; which writes reach the socket is open (T12).
  - id: UCA-SYNC-SERVE-003
    action: CA-SYNC-SERVE
    type: provided
    text: A history page includes records the credential may not read.
    hazards: [HAZ-4]
    severity: S3
    constraints: [T5]
    status: covered
    verification: [sync-transport/unreadable-collection-omitted]
  - id: UCA-SYNC-SERVE-004
    action: CA-SYNC-SERVE
    type: timing
    text: A reader shows insulin on board from before a dose the controller already gave, because the dose has not reached the hub, and a caregiver sends another dose.
    hazards: [HAZ-3, HAZ-1]
    severity: S4
    constraints: [CM5, CM10]
    status: controller
    evidence: A hub's picture lags the controller by its upload cycle. The controller is the only party that knows its current state and validates each command against it (D18); see UCA-CMD-010.

  - id: UCA-SYNC-STORE-007
    action: CA-SYNC-STORE
    type: provided
    text: Two distinct doses with the same created_at and eventType and no identifier are merged by the natural key, and one disappears from every reader's history.
    hazards: [HAZ-3]
    severity: S3
    constraints: [identity §3, T2]
    status: gap
    open: identity §5
    note: Identity §3 falls back to created_at and eventType for treatments without identity, and T2 keeps the socket's ±2 s similar-treatment match as an option; ID-ABSENT-DECISION is open.
  - id: UCA-SYNC-SERVE-005
    action: CA-SYNC-SERVE
    type: duration
    text: A socket subscription keeps receiving events after its credential is revoked or its permission narrowed.
    hazards: [HAZ-4]
    severity: S3
    constraints: [T11, DR6]
    status: gap
    open: authority §9
  - id: UCA-SYNC-SERVE-006
    action: CA-SYNC-SERVE
    type: provided
    text: A socket event reaches a subscriber whose credential may not read the record.
    hazards: [HAZ-4]
    severity: S3
    constraints: [T11]
    status: uncased
    open: sync-transport §8
  - id: UCA-SYNC-DL-001
    action: CA-SYNC-DOWNLOAD
    type: provided
    text: A controller acts on a carb or bolus entry another client wrote, with no expiry, no destination, no outcome and no record that it acted, so the entry works as an unrecorded command.
    hazards: [HAZ-1, HAZ-5]
    severity: S4
    constraints: [S10]
    status: gap
    open: state-intent §8
  - id: UCA-SYNC-DL-002
    action: CA-SYNC-DOWNLOAD
    type: timing
    text: A controller acts on a downloaded entry long after it was written, such as after an outage.
    hazards: [HAZ-1]
    severity: S3
    constraints: [S10]
    status: controller
    evidence: Whether a controller acts on downloaded treatments, and any age limit, is its own acceptance policy (S10 acceptsFromHub); the hub serves records and does not know who acts on them.
  - id: UCA-SYNC-DL-003
    action: CA-SYNC-DOWNLOAD
    type: provided
    text: An entry is edited or deleted after a controller acted on it, so the record and what was enacted differ for every reader.
    hazards: [HAZ-3]
