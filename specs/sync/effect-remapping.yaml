# Remapping each controller's temporary-effect concept onto TherapyEffect.
#
# The three systems disagree about where a temporary effect lives, what it
# carries, and what its numbers mean. Remapping is possible and is partly
# lossy, and the lossiness is per-rule rather than general — so it is
# recorded per rule.
#
# Measured with `make schema-effects` over the corpus, counting each
# document once across the two overlapping snapshots: 86.1% of
# temporary-effect treatments already carry both an effect and a motivation
# and are separable today; 13.9% carry a motivation and no effect at all.
#
# `lossy: true` means the mapping cannot recover the full effect from what
# is on the wire. It is not a reason to skip the mapping — it is the thing
# to fix in the controller.

version: 0.1-draft
status: >-
  Draft for maintainer and controller-maintainer discussion. The scale-factor
  semantics in particular need confirming against each algorithm by someone
  who maintains it; they are read from source, not from a specification.

rules:
  - id: MAP-LOOP-OVERRIDE
    controller: Loop
    from:
      collection: treatments
      eventType: Temporary Override
      fields: [insulinNeedsScaleFactor, correctionRange, duration, reason]
    to:
      effect:
        insulinNeedsScaleFactor: insulinNeedsScaleFactor
        targetRange: "correctionRange[0], correctionRange[1]"
      motivation:
        label: reason
        classification: inferred-from-label
    lossy: false
    evidence: >-
      2,428 documents across 9 sites, every one carrying both halves.
      `reason` holds the preset name the user chose, which is why it is
      mapped to `label` and not to `classification`.

  - id: MAP-LOOP-DEVICESTATUS-OVERRIDE
    controller: Loop
    from:
      collection: devicestatus
      path: override
      fields: [active, multiplier, currentCorrectionRange, duration, name]
    to:
      effect:
        insulinNeedsScaleFactor: multiplier
        targetRange: "currentCorrectionRange.minValue, currentCorrectionRange.maxValue"
      motivation:
        label: name
    lossy: false
    evidence: >-
      55,938 active overrides; 76.5% carry both halves, 19.5% a name and no
      effect, 3.9% an effect and no name. The same override is often also in
      treatments, so the two views must be reconciled by time span rather
      than both counted.

  - id: MAP-TRIO-EXERCISE
    controller: Trio
    from:
      collection: treatments
      eventType: Exercise
      fields: [duration, notes]
    to:
      effect: {}
      motivation:
        label: notes
    lossy: true
    evidence: >-
      399 distinct documents, one site (counted once across both snapshots),
      and **no effect is present at all**. Trio's `NightscoutExercise` model
      carries duration, eventType, createdAt, enteredBy and notes on the wire;
      its `id` is excluded from the coding keys. `eventType: Exercise` is a
      fixed carrier for every Trio override whatever its purpose, so it is not
      a classification, and `notes` is the preset name (or "Custom Override").
      Trio at e41c9db37, `OverrideStored+helper.swift`, `OverrideStorage.swift`.
    note: >-
      This is the case that matters, and it is backwards from what either
      requirement wants. The record publishes a user-chosen preset name and
      withholds the dosing effect. The applied ISF, CR and target are in
      devicestatus `openaps.suggested/enacted`, unattributed; preset
      percentage and target are in the profile's `overridePresets`, joinable
      by name. Neither is a lossless remap. Fixing this is a Trio change, and
      it is the single highest-value one in this table.

  - id: MAP-AAPS-TEMPTARGET
    controller: AndroidAPS
    from:
      collection: treatments
      eventType: Temporary Target
      fields: [targetTop, targetBottom, duration, reason]
    to:
      effect:
        targetRange: "targetBottom, targetTop"
      motivation:
        classification: from-reason-enum
    lossy: false
    evidence: >-
      42 documents in this corpus, which has no AAPS closed-loop site — this
      rule is read from AAPS's `NSTemporaryTarget`, not confirmed from data.
    note: >-
      AAPS is the only controller with a **closed** motivation vocabulary:
      Custom, Hypo, Activity, Eating Soon, Automation, Wear. That maps
      directly onto `motivation.classification` with no free text, which is
      the design the other two should copy.

  - id: MAP-AAPS-PROFILESWITCH
    controller: AndroidAPS
    from:
      collection: treatments
      eventType: Profile Switch
      fields: [percentage, timeshift, profile, duration]
    to:
      effect:
        insulinNeedsScaleFactor: "percentage / 100"
        timeShiftSeconds: "timeshift / 1000"
      motivation:
        classification: manual
    lossy: false
    evidence: >-
      AndroidAPS at 7e1d537d49 (dev) and the 3.4.2.6 tag:
      `ProfileSealed.convertToNonCustomizedProfile` scales basal by p/100 and
      ISF and IC by 100/p, and only time-shifts targets, pinned by
      `ProfileSealedTest`. `timeshift` is milliseconds on the AAPS 3.x wire
      (`ProfileSwitchExtension.kt`, `T.msecs(timeshift).hours()`). No AAPS
      closed-loop site in the corpus, so this is read from source.
    note: >-
      An AAPS percentage is the same kind of quantity as a Loop override
      multiplier: basal by the factor, ISF and carb ratio by its inverse.
      With Dynamic ISF enabled the percentage enters the TDD-based ISF
      formula instead of scaling profile ISF, so the ISF component is not
      recoverable from the profile switch alone; the effective profile
      switch (uploaded as `eventType: Note` with `originalProfileName`)
      carries the scaled profile the algorithm used.

unmapped:
  - field: smbAllowed
    note: >-
      No controller records whether micro-boluses were permitted under an
      effect, and it is a dosing input (`microBolusAllowed`). Present in
      TherapyEffect so it has somewhere to go once one does.
  - field: suspendDelivery
    note: >-
      Pump suspension is recorded as a device event and as pump state, not as
      an effect span, so "could not dose" and "chose not to dose" still look
      alike to a replay that reads effects only.
