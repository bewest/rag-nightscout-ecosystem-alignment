# The well-known catalogue's shared slot list (D20 rule 2; execution plan §2.6.3,
# hub-sync design §3.7). A hub that ships the catalogue copies it into its capability
# document as `wellKnown.slots`; a definition's `stateSpans[].sameAs` names one of these.
#
# What is listed: only slot names that more than one generated well-known registration
# (specs/sync/registrations/*.yaml) already uses with the same spelling. Equal slot names
# already share a channel and contend for its roles (D19 rule 6, §3.6), so listing them
# adds no contention; it makes them names a later definition can declare `sameAs`.
# Listing a name does not confirm that its users mean the same thing: that, and whether any
# other slot means one of these, is evidence for the controller authors to confirm
# (PROPOSAL-REG-CONTROLLERS; candidates in §3.7). `usedBy` is checked against the
# registrations by tools/nsschema/test_registration_quirks.py.
slots:
  - name: override
    usedBy: [loop, trio]
    note: >-
      Same name, different carriers: Loop's TemporaryScheduleOverride is written as
      treatments `Temporary Override`, Trio's OverrideStored as treatments `Exercise`
      (tools/nsschema/sync_model.py, read 2026-10-16).
  - name: loopMode
    usedBy: [loop, trio]
    note: >-
      Loop's dosingEnabled is carried by the profile, Trio's DosingMode by devicestatus.
      AndroidAPS's RunningMode has the same category (LoopMode) under the slot
      runningMode; that is a candidate, not a listing.
  - name: temporaryTarget
    usedBy: [trio, androidaps]
    note: >-
      Both are written as treatments `Temporary Target` with duration in minutes.
