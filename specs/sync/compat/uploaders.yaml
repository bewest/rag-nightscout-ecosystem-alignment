- app: nightscout-connect
  kind: uploader
  ref: "nightscout-connect@977da8a (v0.1.0-dev.3)"
  source: reports/consumer-impact-15.0.9/clients/uploaders/nightscout-connect.md
  layers:
    L0:
      verdict: gains
      today: "Copies records from a source hub with the source's 24-hex `_id`. On the 15.0.9 candidate a devicestatus or profile re-send that collides with a stored string copy is refused as a duplicate key, and the persist fails until that record leaves the window."
      newer: "Its in-process writes go through the one write step, which keeps a 24-hex `_id` as the ObjectId and matches every stored form of it, so such a re-send is answered with the stored ids, never an error (T1, I2, I4, identity §3)."
      rules: [T1, I2, I4, "identity §3"]
      anchors: ["nightscout-connect@977da8a lib/sources/nightscout.js:258-268", "nightscout-connect@977da8a lib/outputs/internal.js:133-157"]
    L1:
      verdict: unchanged
      today: "Writes entries, treatments, devicestatus and profiles as each source produced them, plus Glooko pump-state `Note` treatments and checkpoint rows keyed by `identifier` and `glookoGuid`."
      newer: "Stored and served as today; decomposition runs above storage and keeps the composite (R1, R3)."
      rules: [R1, R3]
      anchors: ["nightscout-connect@977da8a lib/outputs/glooko-pump-state.js:6-28"]
    L2:
      verdict: unchanged
      today: "Declares nothing; the connector writes no product or instance id of its own."
      newer: "Its writes go to an unregistered instance, and a copied document that matches a well-known registration's structural discriminator (Loop, Trio, AndroidAPS) is attributed to that product's unregistered instance (registration §11, §17, R2)."
      rules: ["registration §11", "registration §17", R2]
    L3:
      verdict: unchanged
      today: "Sends no commands; treatments copied from a source are stored as data whatever their `eventType`, and it creates no profile-switch treatments."
      newer: "Copies stay data (commands §3); active state is derived per product from that product's records (A1)."
      rules: ["commands §3", A1]
    L4:
      verdict: unchanged
      today: "Writes in-process through `ctx.entries/treatments/devicestatus/profile`, with no HTTP and no `count` middleware; these writes reach no API v3 storage-socket event (BF-164). As a source it reads a remote hub over API v1 with `count` and `find[...][$gt]`."
      newer: "Its in-process writes join the one write step with the other paths (T1); whether they reach the socket stays open (T12), and v1 reads of a source stay (sync-transport §7)."
      rules: [T1, T12, "sync-transport §7"]
      anchors: ["nightscout-connect@977da8a lib/outputs/internal.js:159-162", "nightscout-connect@977da8a lib/sources/nightscout.js:60"]
    L5:
      verdict: unchanged
      today: "In-process writes carry no credential. As a source it uses `API-SECRET` to find or create a `nightscout-connect-reader` subject with `readable`, then exchanges its token for a JWT, or uses a `token=` from the source URL."
      newer: "Unchanged under `single`. Under `TENANCY_MODE=multi` the source's subjects and tokens are its tenant's, re-rooted on that tenant's credential (AU3), and `readable` still reads every collection (AU5)."
      rules: [AU3, AU5]
      anchors: ["nightscout-connect@977da8a lib/sources/nightscout.js:146-179"]
  notes: "Runs in-process in cgm-remote-monitor; the standalone forever command's HTTP sink is not the path the hub runs."

