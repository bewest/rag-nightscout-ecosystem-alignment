# Uploaders, bridges and the OpenAPS rig: what each does today with a Nightscout hub, layer by
# layer, and what it sees from a hub that implements the platform specifications without changing.
# Format: FORMAT.md. Sources: reports/consumer-impact-15.0.9/clients/uploaders/*.md (read-derived).

- app: oref0
  kind: controller
  ref: "oref0@88cf032a (master; dev d219baf9 differs in none of the Nightscout files read)"
  source: reports/consumer-impact-15.0.9/clients/uploaders/oref0.md
  layers:
    L0:
      verdict: affected
      today: "Sends no `_id` or `identifier`; re-sent pump-history treatments rely on the server's `created_at`+`eventType` upsert, which replaces the stored treatment, and `ns-dedupe-treatments.sh` reads `_id` back to delete duplicates."
      newer: "A re-sent treatment matches on `created_at`+`eventType` among records without client identity and is merged, not replaced, so fields added in Nightscout that the rig does not send are kept (identity §3, T2). The dedupe tool's deletes by `_id` find every stored form of the id (I2)."
      rules: ["identity §3", T2, I2]
      anchors: ["oref0@88cf032a bin/ns-dedupe-treatments.sh:20-35", "oref0@88cf032a bin/oref0-upload-profile.js:243-271"]
    L1:
      verdict: opt-in
      today: "Writes devicestatus with `openaps.iob`, `suggested`, `enacted`, `pump`, `uploader` and `preferences` every cycle, treatments from pump history, entries, and a whole profile document (`OpenAPS Autosync`) when it changes."
      newer: "Stored and served as today, the composite kept beside its primitives (R1). Its preferences remain configuration repeated per cycle; publishing them as a `ControllerSettings` snapshot on change is open to it if it changes (R5)."
      rules: [R1, R5, "records §5"]
      anchors: ["oref0@88cf032a bin/ns-status.js:28-60", "oref0@88cf032a bin/oref0-upload-profile.js:247-360"]
    L2:
      verdict: unchanged
      today: "Declares nothing; the hub ships no well-known registration for oref0 (specs/sync/registrations covers Loop, Trio and AndroidAPS)."
      newer: "Its writes are carrier writes attributed to the product's unregistered instance and never refused for exclusivity (registration §11, §17)."
      rules: ["registration §11", "registration §17"]
    L3:
      verdict: opt-in
      today: "Downloads `Temporary Target` treatments and carbs from Nightscout every loop and applies them by its own rules; posts a `Profile Switch` treatment with its profile upload. It receives no commands through the hub."
      newer: "Temporary targets stay data it downloads, as today (commands §3). The command record, its outcomes and delivery are for a controller that registers and accepts `command` (commands §4, commands §8, S10)."
      rules: ["commands §3", "commands §4", "commands §8", S10]
      anchors: ["oref0@88cf032a bin/oref0-ns-loop.sh:104-107", "oref0@88cf032a bin/nightscout.sh:240"]
    L4:
      verdict: unchanged
      today: "API v1 only, by curl. Every loop it reads `treatments.json?…&count=1?<secret>`, which 15.0.8 reads as count 1 and 15.0.9 refuses with 400 Bad count; the empty result makes the rig re-POST its whole 24 h of pump-history treatments each loop."
      newer: "API v1 stays (sync-transport §7) and the specifications set no rule for `count`, so the malformed read is answered as the hub release answers it; the re-POSTed treatments are merged as L0 says."
      rules: ["sync-transport §7", T2]
      anchors: ["oref0@88cf032a bin/nightscout.sh:164-165", "oref0@88cf032a bin/ns-get.sh:27-36", "oref0@88cf032a bin/oref0-ns-loop.sh:241-243"]
    L5:
      verdict: unchanged
      today: "Sends the SHA-1 of `API_SECRET` as an `api-secret` header, or appends `token=<t>` to the query; the check script exchanges the token at `/api/v2/authorization/request` and reads `permissionGroups`."
      newer: "Unchanged under `single`. Under `TENANCY_MODE=multi` it keeps a native credential (AU1), and the secret or token it sends is its tenant's, since there is no deployment-wide secret (AU3)."
      rules: [AU1, AU3]
      anchors: ["oref0@88cf032a bin/ns-get.sh:26-36", "oref0@88cf032a bin/oref0_nightscout_check.py:67-85"]
  notes: "The count=1?<secret> read is an oref0 quoting fault in nightscout.sh:165; its effect on 15.0.9 is in the consumer-impact file."

