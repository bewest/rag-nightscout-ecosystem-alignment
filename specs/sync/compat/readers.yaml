- app: Nocturne
  kind: hub
  ref: nocturne@42275c812
  source: reports/consumer-impact-15.0.9/clients/readers/nocturne.md
  layers:
    L0:
      verdict: opt-in
      today: v1 by-id routes accept 24-hex and 32-hex (UUID v7 without dashes) ids, and look up by GUID,
        then by exact `LegacyId`, then by GUID prefix.
      newer: It would serve a 24-hex `_id` on v1 and none in v3 reads, keep a client 24-hex `_id` in lower case on v1
        and refuse a client `_id` on v3 with 400 (I2), answer each write with both ids and `matchedBy` (I4), and match a re-send on `identifier`, then
        `_id`, then the natural key (I5).
      rules:
      - I2
      - I4
      - I5
      - I8
      anchors:
      - nocturne@42275c812 src/API/Nocturne.API/Controllers/V1/EntriesController.cs:171-175
      - nocturne@42275c812 src/API/Nocturne.API/Services/Entries/EntryReadService.cs:163-175
    L1:
      verdict: opt-in
      today: Stores typed V4 records, the source of the records catalogue's sixteen primitives, and routes
        treatments into them by `eventType`; `Suspend Pump` documents are unroutable because the decomposition
        keys on `Pump Suspend` (records §4, measured).
      newer: It already decomposes (R1); R2 has decomposition declared by each registration's `decomposesTo`
        instead of fixed routing, and R4 and R9 add an evidence grade and a sensitivity label to every
        field.
      rules:
      - R1
      - R2
      - R4
      - R9
    L2:
      verdict: opt-in
      today: Serves v1-v3 reads from V4 records through a legacy projection, with no projection marker
        on the projected treatment (registration §13 prior art).
      newer: A projected document carries `projectedFrom`, is read-only (409 `projected-read-only`) and
        keeps one ObjectId stored with the typed record (registration §13, I8); registrations, instances
        and read selection (§11, §12) are new.
      rules:
      - registration §13
      - I8
      - registration §11
      - registration §12
    L3:
      verdict: opt-in
      today: 'Keeps intents as StateSpans; measured: a temporary-target cancel becomes an open span of
        its own, a backfilled earlier override leaves two open spans, Loop''s applied override duration
        is read as minutes and AndroidAPS `timeshift` as hours (state-intent §6.2); its `POST /api/v4/state-spans`
        reaches no controller (state-intent §7).'
      newer: 'The rules answer each of those cases differently: a zero-duration record ends the instance
        (A5), supersession is by start (A7), and units are read only as declared (A11); the outstanding
        list (CM24) and the plan mirror (PN11) are new reads it would serve.'
      rules:
      - A5
      - A7
      - A8
      - A11
      - A2
      - CM24
      - PN11
      anchors:
      - state-intent §6.2 (LAB-HUB-ACTIVE-STATE, run 2026-10-12, Nocturne 42275c812)
    L4:
      verdict: opt-in
      today: Serves API v1 and v3 and a socket.io bridge; v3 pages by offset `Link` headers and clamps
        `limit=0` to 1; on the shared v1 contract it answers a negative `count` and an unsupported operator
        with 200 `[]`, reads `$exists` with an empty or `null` value as absent, and ignores bracket `find`
        on `/count`.
      newer: The merged read across collections (T5), its `srvModified` cursor (T6) and low watermark
        (T9) are new; per-collection reads stay (sync-transport §7), and a socket event never moves the
        history cursor (T10).
      rules:
      - T5
      - T6
      - T9
      - T10
      - sync-transport §7
      anchors:
      - nocturne@42275c812 src/API/Nocturne.API/Controllers/V3/BaseV3Controller.cs:77-82,281-297
      - nocturne@42275c812 src/Core/Nocturne.Core.Models/Queries/FindQuery.cs:551-579
    L5:
      verdict: opt-in
      today: Socket clients authorize with a handshake ticket or a legacy secret or token and join their
        tenant's room, and a credential-less `authorize` is disconnected; subjects are typed, notes are
        not stored, and an edit with no roles leaves the grant unchanged.
      newer: AU3 (per-tenant signing, tenant resolved before any credential) and AU4 (bindings to subjects)
        apply to its subjects; AU5 keeps reading one bit, and DR1-DR7 are requirements no hub implements.
      rules:
      - AU3
      - AU4
      - AU5
      - DR1
      anchors:
      - nocturne@42275c812 src/Web/packages/bridge/src/lib/socketio-server.ts:346-424
      - nocturne@42275c812 src/API/Nocturne.API/Services/Identity/AuthorizationService.cs:435-548
  notes: A fellow hub implementing the Nightscout API; its parity suite runs against Nightscout 15.0.3,
    and its differences from the 15.0.9 candidate are in the consumer-impact survey §6.
