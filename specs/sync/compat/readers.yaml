# Readers, analysis tools, a gateway and a second hub: what each does today with a Nightscout hub,
# and what it sees from a hub that implements the platform specifications without changing.
# Format: FORMAT.md. Every claim is read-derived from the per-client file named in `source`.
- app: nightscout-reporter
  kind: reader
  ref: nightscout-reporter@518d61f (retired AngularDart app; last code change b664fba, 2022-12-22)
  source: reports/consumer-impact-15.0.9/clients/readers/nightscout-reporter.md
  layers:
    L0:
      verdict: gains
      today: Writes nothing; reads treatment `_id` as an opaque string and drops adjacent identical treatments
        and `enteredBy == 'sync'` before summing.
      newer: A re-send is matched on `identifier`, then `_id`, then the natural key on every write path,
        so a treatment re-sent by an uploader is stored once and summed once (I5, T1).
      rules:
      - I5
      - T1
      - I2
      anchors:
      - nightscout-reporter@518d61f lib/src/start_component.dart:1125,1268-1271,1278
    L1:
      verdict: unchanged
      today: Downloads entries, treatments, devicestatus, activity and profiles per day and computes every
        total, COB and IOB client-side.
      newer: The hub keeps each composite document beside its primitives and answers v1 reads from the
        composite, so the documents it parses are served as written (R1).
      rules:
      - R1
      anchors:
      - nightscout-reporter@518d61f lib/src/start_component.dart:1203-1322
    L2:
      verdict: unchanged
      today: Declares nothing and reads no attribution.
      newer: A record a newer controller writes as a typed record reaches it as a projected document in
        the carrier's shape, with both ids and a `projectedFrom` member it does not read (registration
        §13, I8).
      rules:
      - registration §13
      - I8
      - registration §17
    L3:
      verdict: opt-in
      today: Builds synthetic profiles from `Profile Switch` treatments and reads `Temp Basal` treatments,
        deciding what was in effect itself.
      newer: Its own reading of those treatments is unchanged; the hub's derived answer of what was active
        at a time is a new read it would have to call (state-intent §6, A1-A13).
      rules:
      - state-intent §6
      - A1
      - A10
      anchors:
      - nightscout-reporter@518d61f lib/src/start_component.dart:1051-1057,1120-1145,1245
    L4:
      verdict: unchanged
      today: API v1 GETs only, `count` literals from 2 to 100000, `$gte $lte $gt $lt $eq $ne` filters,
        `status.json` at start-up; no socket, no API v3.
      newer: Per-collection API v1 reads stay; nothing is retired (sync-transport §7).
      rules:
      - sync-transport §7
      anchors:
      - nightscout-reporter@518d61f lib/src/globals.dart:1965-1989
    L5:
      verdict: unchanged
      today: Sends an access token as `?token=` on every request; no `api-secret` header, no Bearer.
      newer: On `single` nothing changes and its token still reads every collection (AU5). Under `multi`
        subject tokens are re-rooted on the tenant's credential, so the token a person entered before
        the move stops working and must be re-entered (AU3).
      rules:
      - AU3
      - AU5
      anchors:
      - nightscout-reporter@518d61f lib/src/globals.dart:1978-1979
  notes: The code read is the retired AngularDart app; the maintained Angular successor is not in the
    corpus and is listed under 'Not read'.
