# SYNTHETIC TEST FIXTURE. Describes no real controller, product or person.
#
# A controller-owned registration for a fictional controller ("Example"
# TestController) that exercises every rule of the D18 addendum
# (docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md
# §2.6.1). It is read by tools/nsschema/test_registration_grammar.py and
# validated, never regenerated, by `python -m nsschema.sync_model --check`.
#
# Where each rule is exercised:
#   1 must-ignore     spec.futureGrammarMember, stateSpans[0].futureSpanMember
#   1 extensions      spec.extensions["com.example.testcontroller.adaptiveTargets"]
#   2 typed fields    settings.fields, replayInputs, extension fields
#   2 unlabelled      settings.fields[name=exampleUnlabelledSetting]
#   3 other + term    endedEncoding, transport, replayInputs status,
#                     discriminator test, endReasons
#   4 versions        stateSpans[0] serves 1 and 2, stores 2, no mapping
#   5 horizons        documents, kinds, fields, extension; an experimental
#                     aggregate-horizon kind (stateSpans[1])
#
# State and intent (docs/30-design/platform/spec/state-intent.md S6-S8):
#   typed paths       stateSpans[0].wire.paths and .applied.paths mix bare
#                     strings with {path, unit, type} and {path, typeRef}
#   durations         wire, requested and applied each declare durationField
#                     and durationUnit
#   initiators        stateSpans[0].initiators.values mixes the controller's
#                     strings with {value: other, controllerTerm}
#   acceptance        stateSpans[0].acceptsFromHub takes commands (S10), so an
#                     instance may hold command-sink on the override slot
#
# Commands (docs/30-design/platform/spec/commands.md CM28, CM29):
#   hub path          commands[1] is the hub's command record
#                     (nightscout-commands), with a declared fetch bound and
#                     the live transports it listens on, one in the other form
apiVersion: nightscout.dev/sync/v1
kind: ControllerStateModel
metadata:
  vendor: Example
  product: TestController
  algorithmFamily: other
  tier: controller-owned
  versionRange: "0.0.1-test"
  source: synthetic fixture for tools/nsschema/test_registration_grammar.py
spec:
  cadence:
    nominalSeconds: 300
  futureGrammarMember:
    note: a member a later v1 grammar might define; a v1 reader keeps it and ignores it
  documents:
  - collection: devicestatus
    discriminator:
      path: example
      test:
        value: other
        controllerTerm: has-example-signature
    decomposesTo:
    - ApsSnapshot
    horizon:
      class: cycle
      retention: P90D
  - collection: settings
    decomposesTo:
    - TherapySettings
    horizon:
      class: effective-dated
      retention: indefinite
  stateSpans:
  - category: Override
    kind: ExampleOverride
    futureSpanMember: true
    slot: override
    exclusiveWithinSlot: true
    acceptsFromHub:
      channels:
      - command
      default: false
    states:
    - scheduled
    - active
    - ended
    versions:
      served:
      - "1"
      - "2"
      stored: "2"
    endReasons:
    - reason: expired
    - reason: other
      controllerTerm: replacedByScheduleChange
    wire:
      collection: treatments
      eventType: Temporary Override
      identity:
      - identifier
      paths:
      - reason
      - path: timeOffset
        unit: milliseconds
        type:
          type: integer
      durationField: duration
      durationUnit: minutes
      endedEncoding:
        value: other
        controllerTerm: tombstone-record
      endReasonPath: null
    requested:
      collection: treatments
      eventType: Example Override Request
      durationField: requestedDuration
      durationUnit: minutes
    applied:
      collection: devicestatus
      discriminator:
        path: example.override
        test: is-object
      paths:
      - example.override.name
      - path: example.override.remaining
        unit: seconds
      - path: example.override.maxIob
        typeRef: https://nightscout.dev/schemas/sync/controller-settings.json#/properties/settings/properties/maxIob
      durationField: example.override.remaining
      durationUnit: seconds
      linkToRequest: null
    initiators:
      vocabulary: ExampleTrigger
      values:
      - phone
      - watch
      - value: other
        controllerTerm: example-agent
      wirePath: null
  - category: ExampleAdaptationSummary
    kind: DailyAdaptation
    availability: experimental
    version: "0.1"
    horizon:
      class: aggregate
      cadence:
        nominalSeconds: 86400
      retention: P30D
    wire:
      collection: settings
      documentIdentifier: example-adaptation
  commands:
  - transport:
      value: other
      controllerTerm: example-relay
    hubInPath: optional
    availability: experimental
  - transport: nightscout-commands
    hubInPath: "yes"
    availability: experimental
    fetchIntervalSeconds: 60
    liveTransports:
    - socket
    - value: other
      controllerTerm: example-broker
  replayInputs:
  - input: exampleSensitivityScale
    path: example.sensitivityScale
    collection: devicestatus
    status: recorded
    type:
      type: number
      minimum: 0.1
      maximum: 10
    horizon:
      class: cycle
    sensitivity:
      level: descriptive
      category: health-derived
  - input: exampleTrendModel
    path: null
    collection: null
    status:
      value: other
      controllerTerm: computed-on-device-only
  settings:
    resource: ControllerSettings
    effectiveDated: true
    horizon:
      class: effective-dated
    fields:
    - legacyNameOnlySetting
    - name: maxIob
      typeRef: https://nightscout.dev/schemas/sync/controller-settings.json#/properties/settings/properties/maxIob
      range:
        maximum: 30
      sensitivity:
        level: descriptive
        category: therapy-setting
    - name: exampleUnlabelledSetting
      type:
        type: string
        enum:
        - gentle
        - standard
  extensions:
    com.example.testcontroller.adaptiveTargets:
      version: "1"
      availability: experimental
      horizon:
        class: definition
      carrier:
        collection: settings
        documentIdentifier: example-targets
      fields:
      - name: targetSchedule
        type:
          type: array
          items:
            type: object
            properties:
              startMinute:
                type: integer
                minimum: 0
                maximum: 1439
              target:
                type: number
            required:
            - startMinute
            - target
        unit: mg/dL
        sensitivity:
          level: descriptive
          category: therapy-setting
      - name: adaptationEnabled
        type:
          type: boolean
        sensitivity:
          level: descriptive
          category: therapy-setting
  sensitivity:
    enforcesLocally: false
    defaultProfile: clinical
    unlabelledPolicy: withhold
