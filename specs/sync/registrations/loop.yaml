apiVersion: nightscout.dev/sync/v1
kind: ControllerStateModel
metadata:
  vendor: LoopKit
  product: Loop
  algorithmFamily: loop
  source: generated by tools/nsschema/sync_model.py from the census, vendor-surface.json and
    dosing-input-sources.yaml
spec:
  cadence:
    nominalSeconds: 300
    maxDeferralSeconds: 900
  documents:
  - collection: devicestatus
    discriminator:
      path: loop
      test: is-object
    decomposesTo:
    - ApsSnapshot
    - PumpSnapshot
    - UploaderSnapshot
    paths:
    - loop.automaticDoseRecommendation
    - loop.automaticDoseRecommendation.bolusVolume
    - loop.automaticDoseRecommendation.tempBasalAdjustment
    - loop.automaticDoseRecommendation.tempBasalAdjustment.duration
    - loop.automaticDoseRecommendation.tempBasalAdjustment.rate
    - loop.automaticDoseRecommendation.timestamp
    - loop.cob
    - loop.cob.cob
    - loop.cob.timestamp
    - loop.enacted
    - loop.enacted.bolusVolume
    - loop.enacted.duration
    - loop.enacted.rate
    - loop.enacted.received
    - loop.enacted.timestamp
    - loop.failureReason
    - loop.iob
    - loop.iob.iob
    - loop.iob.timestamp
    - loop.name
    - loop.predicted
    - loop.predicted.startDate
    - loop.predicted.values
    - loop.predicted.values[]
    - loop.recommendedBolus
    - loop.timestamp
    - loop.version
  - collection: entries
    decomposesTo:
    - SensorGlucose
  - collection: treatments
    decomposesTo:
    - Bolus
    - CarbIntake
    - TempBasal
    - BGCheck
    - DeviceEvent
    - Note
  - collection: profile
    decomposesTo:
    - TherapySettings
    - BasalSchedule
    - CarbRatioSchedule
    - SensitivitySchedule
    - TargetRangeSchedule
  stateSpans:
  - category: Override
    states:
    - active
    - inactive
    supersedes: true
  replayInputs:
  - input: automaticBolusApplicationFactor
    path: null
    collection: null
    status: absent
  - input: basal
    path: store.{}.basal[].value
    collection: profile
    status: derivable
  - input: carbAbsorptionModel
    path: null
    collection: null
    status: absent
  - input: carbEntries
    path: carbs
    collection: treatments
    status: derivable
  - input: carbRatio
    path: store.{}.carbratio[].value
    collection: profile
    status: derivable
  - input: doses
    path: insulin
    collection: treatments
    status: derivable
  - input: glucoseHistory
    path: sgv
    collection: entries
    status: derivable
  - input: gradualTransitionsThreshold
    path: null
    collection: null
    status: absent
  - input: includePositiveVelocityAndRC
    path: null
    collection: null
    status: absent
  - input: maxActiveInsulinMultiplier
    path: null
    collection: null
    status: absent
  - input: maxBasalRate
    path: loopSettings.maximumBasalRatePerHour
    collection: profile
    status: recorded
  - input: maxBolus
    path: loopSettings.maximumBolus
    collection: profile
    status: recorded
  - input: predictionStart
    path: created_at
    collection: devicestatus
    status: recorded
  - input: recommendationInsulinModel
    path: null
    collection: null
    status: absent
  - input: recommendationType
    path: loopSettings.dosingStrategy
    collection: profile
    status: partial
  - input: sensitivity
    path: store.{}.sens[].value
    collection: profile
    status: derivable
  - input: suspendThreshold
    path: loopSettings.minimumBGGuard
    collection: profile
    status: recorded
  - input: target
    path: store.{}.target_low[].value
    collection: profile
    status: derivable
  - input: useIntegralRetrospectiveCorrection
    path: null
    collection: null
    status: absent
  - input: useMidAbsorptionISF
    path: null
    collection: null
    status: absent
  settings:
    resource: ControllerSettings
    effectiveDated: true
    fields:
    - automaticBolusApplicationFactor
    - carbAbsorptionModel
    - gradualTransitionsThreshold
    - includePositiveVelocityAndRC
    - maxActiveInsulinMultiplier
    - recommendationInsulinModel
    - recommendationType
    - useIntegralRetrospectiveCorrection
    - useMidAbsorptionISF
  queryProfile:
    filterableFields:
    - date
    - created_at
    - srvModified
    - identifier
    maxPageSize: 1000
    operators:
    - eq
    - gt
    - gte
    - lt
    - lte
    - in
x-declared-but-unobserved:
- forecastError
- rileylinks
- testingDetails
