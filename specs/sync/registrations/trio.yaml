apiVersion: nightscout.dev/sync/v1
kind: ControllerStateModel
metadata:
  vendor: Nightscout Foundation
  product: Trio
  algorithmFamily: oref0
  source: generated by tools/nsschema/sync_model.py from the census, vendor-surface.json and
    dosing-input-sources.yaml
spec:
  cadence:
    nominalSeconds: 300
    maxDeferralSeconds: 900
  documents:
  - collection: devicestatus
    discriminator:
      path: openaps
      test: is-object
    decomposesTo:
    - ApsSnapshot
    - PumpSnapshot
    - UploaderSnapshot
    paths:
    - openaps.enacted
    - openaps.enacted.COB
    - openaps.enacted.CR
    - openaps.enacted.IOB
    - openaps.enacted.ISF
    - openaps.enacted.TDD
    - openaps.enacted.bg
    - openaps.enacted.carbsReq
    - openaps.enacted.current_target
    - openaps.enacted.deliverAt
    - openaps.enacted.duration
    - openaps.enacted.eventualBG
    - openaps.enacted.expectedDelta
    - openaps.enacted.id
    - openaps.enacted.insulinForManualBolus
    - openaps.enacted.insulinReq
    - openaps.enacted.manualBolusErrorString
    - openaps.enacted.minDelta
    - openaps.enacted.predBGs
    - openaps.enacted.predBGs.COB
    - openaps.enacted.predBGs.COB[]
    - openaps.enacted.predBGs.IOB
    - openaps.enacted.predBGs.IOB[]
    - openaps.enacted.predBGs.UAM
    - openaps.enacted.predBGs.UAM[]
    - openaps.enacted.predBGs.ZT
    - openaps.enacted.predBGs.ZT[]
    - openaps.enacted.rate
    - openaps.enacted.reason
    - openaps.enacted.received
    - openaps.enacted.reservoir
    - openaps.enacted.sensitivityRatio
    - openaps.enacted.temp
    - openaps.enacted.threshold
    - openaps.enacted.timestamp
    - openaps.enacted.units
    - openaps.iob
    - openaps.iob.activity
    - openaps.iob.basaliob
    - openaps.iob.bolusinsulin
    - openaps.iob.bolusiob
    - openaps.iob.iob
    - openaps.iob.iobWithZeroTemp
    - openaps.iob.iobWithZeroTemp.activity
    - openaps.iob.iobWithZeroTemp.basaliob
    - openaps.iob.iobWithZeroTemp.bolusinsulin
    - openaps.iob.iobWithZeroTemp.bolusiob
    - openaps.iob.iobWithZeroTemp.iob
    - openaps.iob.iobWithZeroTemp.netbasalinsulin
    - openaps.iob.iobWithZeroTemp.time
    - openaps.iob.lastBolusTime
    - openaps.iob.lastTemp
    - openaps.iob.lastTemp.date
    - openaps.iob.lastTemp.duration
    - openaps.iob.lastTemp.rate
    - openaps.iob.lastTemp.started_at
    - openaps.iob.lastTemp.timestamp
    - openaps.iob.netbasalinsulin
    - openaps.iob.time
    - openaps.recommendedBolus
    - openaps.suggested
    - openaps.suggested.COB
    - openaps.suggested.CR
    - openaps.suggested.IOB
    - openaps.suggested.ISF
    - openaps.suggested.TDD
    - openaps.suggested.bg
    - openaps.suggested.carbsReq
    - openaps.suggested.current_target
    - openaps.suggested.deliverAt
    - openaps.suggested.duration
    - openaps.suggested.eventualBG
    - openaps.suggested.expectedDelta
    - openaps.suggested.id
    - openaps.suggested.insulinForManualBolus
    - openaps.suggested.insulinReq
    - openaps.suggested.manualBolusErrorString
    - openaps.suggested.minDelta
    - openaps.suggested.predBGs
    - openaps.suggested.predBGs.COB
    - openaps.suggested.predBGs.COB[]
    - openaps.suggested.predBGs.IOB
    - openaps.suggested.predBGs.IOB[]
    - openaps.suggested.predBGs.UAM
    - openaps.suggested.predBGs.UAM[]
    - openaps.suggested.predBGs.ZT
    - openaps.suggested.predBGs.ZT[]
    - openaps.suggested.rate
    - openaps.suggested.reason
    - openaps.suggested.received
    - openaps.suggested.reservoir
    - openaps.suggested.sensitivityRatio
    - openaps.suggested.temp
    - openaps.suggested.threshold
    - openaps.suggested.timestamp
    - openaps.suggested.units
    - openaps.version
  - collection: entries
    decomposesTo:
    - SensorGlucose
  - collection: treatments
    decomposesTo:
    - Bolus
    - CarbIntake
    - TempBasal
    - BGCheck
    - DeviceEvent
    - Note
  - collection: profile
    decomposesTo:
    - TherapySettings
    - BasalSchedule
    - CarbRatioSchedule
    - SensitivitySchedule
    - TargetRangeSchedule
  stateSpans:
  - category: Override
    states:
    - active
    - inactive
    supersedes: true
  - category: TemporaryTarget
    states:
    - active
    - inactive
    supersedes: true
  replayInputs:
  - input: autosensData.ratio
    path: openaps.suggested.sensitivityRatio
    collection: devicestatus
    status: recorded
  - input: clock
    path: created_at
    collection: devicestatus
    status: recorded
  - input: currentTemp.duration
    path: openaps.iob.lastTemp.duration
    collection: devicestatus
    status: recorded
  - input: currentTemp.rate
    path: openaps.iob.lastTemp.rate
    collection: devicestatus
    status: recorded
  - input: flatBGsDetected
    path: null
    collection: null
    status: absent
  - input: glucoseStatus.delta
    path: delta
    collection: entries
    status: derivable
  - input: glucoseStatus.direction
    path: direction
    collection: entries
    status: recorded
  - input: glucoseStatus.glucose
    path: openaps.suggested.bg
    collection: devicestatus
    status: recorded
  - input: glucoseStatus.glucoseUnit
    path: units
    collection: profile
    status: recorded
  - input: glucoseStatus.longAvgDelta
    path: sgv
    collection: entries
    status: derivable
  - input: glucoseStatus.noise
    path: noise
    collection: entries
    status: recorded
  - input: glucoseStatus.shortAvgDelta
    path: sgv
    collection: entries
    status: derivable
  - input: glucoseStatus.timestamp
    path: openaps.suggested.timestamp
    collection: devicestatus
    status: recorded
  - input: iob.activity
    path: openaps.iob.activity
    collection: devicestatus
    status: recorded
  - input: iob.basalIob
    path: openaps.iob.basaliob
    collection: devicestatus
    status: recorded
  - input: iob.bolusIob
    path: openaps.iob.bolusiob
    collection: devicestatus
    status: recorded
  - input: iob.bolusSnooze
    path: null
    collection: null
    status: absent
  - input: iob.iob
    path: openaps.iob.iob
    collection: devicestatus
    status: recorded
  - input: iob.iobWithZeroTemp.activity
    path: openaps.iob.iobWithZeroTemp.activity
    collection: devicestatus
    status: recorded
  - input: iob.iobWithZeroTemp.bolussnooze
    path: null
    collection: null
    status: absent
  - input: iob.iobWithZeroTemp.iob
    path: openaps.iob.iobWithZeroTemp.iob
    collection: devicestatus
    status: recorded
  - input: mealData.carbs
    path: carbs
    collection: treatments
    status: derivable
  - input: mealData.cob
    path: openaps.suggested.COB
    collection: devicestatus
    status: recorded
  - input: mealData.lastCarbTime
    path: carbs
    collection: treatments
    status: derivable
  - input: mealData.mealCOB
    path: null
    collection: null
    status: absent
  - input: mealData.slopeFromMaxDeviation
    path: null
    collection: null
    status: absent
  - input: mealData.slopeFromMinDeviation
    path: null
    collection: null
    status: absent
  - input: microBolusAllowed
    path: null
    collection: null
    status: absent
  - input: profile.basalRate
    path: store.{}.basal[].value
    collection: profile
    status: derivable
  - input: profile.carbRatio
    path: openaps.suggested.CR
    collection: devicestatus
    status: recorded
  - input: profile.dia
    path: store.{}.dia
    collection: profile
    status: recorded
  - input: profile.dosingStrategy
    path: loopSettings.dosingStrategy
    collection: profile
    status: partial
  - input: profile.maxBasal
    path: loopSettings.maximumBasalRatePerHour
    collection: profile
    status: partial
  - input: profile.maxDailyBasal
    path: store.{}.basal[].value
    collection: profile
    status: derivable
  - input: profile.maxIob
    path: null
    collection: null
    status: absent
  - input: profile.sensitivity
    path: openaps.suggested.ISF
    collection: devicestatus
    status: recorded
  - input: profile.suspendThreshold
    path: loopSettings.minimumBGGuard
    collection: profile
    status: partial
  - input: profile.targetHigh
    path: store.{}.target_high[].value
    collection: profile
    status: derivable
  - input: profile.targetLow
    path: store.{}.target_low[].value
    collection: profile
    status: derivable
  - input: profile.units
    path: units
    collection: profile
    status: recorded
  settings:
    resource: ControllerSettings
    effectiveDated: true
    fields:
    - profile.dosingStrategy
    - profile.maxBasal
    - profile.maxIob
    - profile.suspendThreshold
  sensitivity:
    labelsSource: specs/jsonschema/generated/ (x-sensitivity, x-data-category)
    enforcesLocally: false
    supportedProfiles:
    - full
    - clinical
    - replay
    - effect-only
    defaultProfile: clinical
    unlabelledPolicy: withhold
  queryProfile:
    filterableFields:
    - date
    - created_at
    - srvModified
    - identifier
    maxPageSize: 1000
    operators:
    - eq
    - gt
    - gte
    - lt
    - lte
    - in
x-declared-but-unobserved:
- batteryVoltage
- minGuardBG
- minPredBG
- timeAsSeconds
- value
