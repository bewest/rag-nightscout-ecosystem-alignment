# Quirks in the `treatments` collection. See README.md for the format.
collection: treatments
quirks:
  - id: QUIRK-TREATMENTS-001
    title: carbs and insulin are present-but-null on most treatments
    status: active
    path: carbs
    kind: nullability
    description: >-
      Nightscout writes `carbs` and `insulin` onto every treatment
      regardless of whether the event has either. The keys are present in
      essentially every document and null in most of them. A schema typing
      them as a bare `number`, or a client deserializing into a
      non-optional numeric, is wrong for the majority case rather than for
      an edge case.
    detect:
      path: carbs
      test: is-null
    expect:
      min_share: 0.8
      min_sites: 10
    reader_guidance: >-
      Treat null and absent identically, and distinguish both from zero. A
      zero-carb treatment is a real, different thing from a treatment that
      carries no carb information.
    writer_guidance: >-
      Omit the key rather than writing null, on collections where that is
      safe. Existing readers tolerate absence.
    references:
      - docs/30-design/platform/nightscout-typed-schema-evidence-2026-09-10.md#42-treatments--null-is-the-common-case

  - id: QUIRK-TREATMENTS-002
    title: insulin is present-but-null on most treatments
    status: active
    path: insulin
    kind: nullability
    description: The `carbs` case above, for the insulin field.
    detect:
      path: insulin
      test: is-null
    expect:
      min_share: 0.4
      min_sites: 10
    reader_guidance: See QUIRK-TREATMENTS-001.
    writer_guidance: See QUIRK-TREATMENTS-001.
    references:
      - docs/30-design/platform/nightscout-typed-schema-evidence-2026-09-10.md#42-treatments--null-is-the-common-case

  - id: QUIRK-TREATMENTS-003
    title: timestamp is an ISO 8601 string, not the declared epoch integer
    status: active
    path: timestamp
    kind: type-union
    description: >-
      The 2025.1.0 spec declared `timestamp` as `integer` epoch
      milliseconds. Every occurrence in the corpus is an ISO 8601 string —
      a duplicate of `created_at` rather than a numeric alternative to it.
    detect:
      path: timestamp
      test: is-string
    expect:
      min_share: 0.6
      min_sites: 8
    reader_guidance: >-
      Accept both a string and a number here. Prefer `created_at` as the
      authoritative time; use `timestamp` only as a fallback.
    writer_guidance: >-
      Do not write `timestamp` at all on new integrations. It duplicates
      `created_at` with no agreed type.
    references:
      - specs/openapi/aid-treatments-2025.yaml

  - id: QUIRK-TREATMENTS-004
    title: bolus subtype is written lower-case as `normal`
    status: active
    path: type
    kind: case-mismatch
    description: >-
      The declared enum is `Normal`, `SMB`, `Priming`. Live data holds
      lower-case `normal` only. A case-sensitive enum check rejects every
      document that carries the field.
    detect:
      path: type
      test: equals
      value: normal
    expect:
      min_share: 0.2
      min_sites: 8
    reader_guidance: Compare this field case-insensitively.
    writer_guidance: >-
      Emit the documented casing. Changing it is safe only once readers
      compare case-insensitively, so the reader fix comes first.
    references:
      - specs/openapi/aid-treatments-2025.yaml#/components/schemas/Treatment/properties/type

  - id: QUIRK-TREATMENTS-005
    title: eventType carries values absent from every declared enum
    status: active
    path: eventType
    kind: enum-gap
    description: >-
      `Bolus` and `Carbs` appear in live data and were in no declared enum,
      alongside the documented `Meal Bolus`, `Correction Bolus` and
      `Carb Correction`. The ecosystem has more names for the same events
      than any one spec lists.
    detect:
      path: eventType
      test: in
      values: [Bolus, Carbs]
    expect:
      min_share: 0.0
      min_sites: 2
    reader_guidance: >-
      Never reject an unknown `eventType`. Classify by the fields present —
      `insulin`, `carbs`, `duration`, `absolute` — and use `eventType` as a
      hint, not a discriminator.
    writer_guidance: Prefer a documented value.
    references:
      - specs/openapi/aid-treatments-2025.yaml#/components/schemas/EventType

  - id: QUIRK-TREATMENTS-006
    title: _id is sent as a string that is not an ObjectId
    status: active
    path: _id
    kind: id-form
    description: >-
      In single-tenant Nightscout on MongoDB `_id` must be an ObjectId, a
      rule that was never written down (D20, execution plan §2.6.3). Some
      writers put their own record id in `_id`. cgm-remote-monitor moves
      such a value to `identifier` when `identifier` is absent and
      `UUID_HANDLING` is on (the default), drops it otherwise, and assigns
      an ObjectId (write contract §2.3 rule 1). Documents stored before that
      handling, or by a path that bypasses it, keep the string. The detector
      counts the string form still stored; a write the hub mapped no longer
      shows it, so recent writes are measured by the hub's recorded mappings
      (rule 3), not by this corpus.
    detect:
      path: _id
      test: matches
      pattern: '^(?![0-9a-fA-F]{24}$).+'
    expect:
      min_share: 0.0
      min_sites: 5
    mapping:
      action: move-to-identifier
      flag: UUID_HANDLING
      erasesEvidence: true
    affects:
      - vendor: LoopKit
        product: Loop
        versions:
          unmeasured: >-
            Treatments carry no version. The source shows one version; the
            corpus shows the Loop versions reporting on the same sites, by
            co-occurrence, not attribution.
          seen:
            - version: 3.14.8
              claim: read-derived
              ref: >-
                externals/LoopWorkspace NightscoutService/NightscoutServiceKit/Extensions/OverrideTreament.swift:59
                (override id: syncIdentifier.uuidString) and NightscoutKit
                Sources/NightscoutKit/Models/Treatments/NightscoutTreatment.swift:111
                (written as _id); LOOP_MARKETING_VERSION in VersionOverride.xcconfig:11
              commit: f8412858
        versionSource:
          collection: devicestatus
          path: loop.version
          window_minutes: 60
        evidence:
          - claim: measured
            ref: >-
              make schema-quirks over the 2026-04-01 and 2026-04-26 snapshots,
              2026-10-16: every stored document it fires on is a Temporary
              Override whose enteredBy is a loop:// scheme with an upper-case
              UUID
    reader_guidance: >-
      Read the record's sync identity from `identifier`, and accept a
      stored `_id` that is not an ObjectId as that record's key. A lookup by
      a UUID resolves through `identifier` (UUID_HANDLING's read half).
    writer_guidance: >-
      Send the record's own id as `identifier` and no `_id`; the hub assigns
      `_id` and returns both (D20 rule 5).
    references:
      - docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md#263-d20--version-scoped-quirks-and-the-two-id-rule-maintainer-2026-10-16
      - docs/30-design/tenancy/write-contract-spec-2026-10-07.md#23-order-of-the-rules
      - docs/backlogs/uuid-identifier-lookup.md
      - externals/cgm-remote-monitor-official/lib/server/treatments.js:394-411 @a8888f0d (normalizeTreatmentId)

  - id: QUIRK-TREATMENTS-007
    title: the client's record id is sent as `id`, a member Nightscout does not read
    status: active
    path: id
    kind: id-form
    description: >-
      Trio's treatment model encodes its UUID record id under the member
      `id` (NightscoutTreatment.swift:62, Trio e41c9db37), while its carbs
      and temporary-target models encode theirs as `_id` (CarbsEntry.swift:29,
      TempTarget.swift:50). cgm-remote-monitor neither reads nor moves `id`:
      `normalizeTreatmentId` handles only `_id`, and the upsert matches
      `identifier`, then `_id`, then `created_at` + `eventType`
      (lib/server/treatments.js:383-405 at crm-write 239f8c25), so a
      treatment that carries only `id` is matched by the write contract's
      `treatment-fallback-key`. Recorded with no new mapping (maintainer,
      2026-10-16, walk-through row 6); whether Trio should send `identifier`
      is for PROPOSAL-REG-CONTROLLERS.
    detect:
      path: id
      test: matches
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    expect:
      min_share: 0.0
      min_sites: 1
    affects:
      - vendor: Nightscout Foundation
        product: Trio
        versions:
          unmeasured: >-
            Treatments carry no version. The stored documents name their
            writer (`enteredBy: Trio`) but not its version. The source shows
            one version; the corpus shows the `openaps.version` that
            devicestatus reports on the same site, by co-occurrence, not
            attribution.
          seen:
            - version: 1.0.1
              claim: read-derived
              ref: >-
                externals/Trio Trio/Sources/Models/NightscoutTreatment.swift:62
                (`case id`, encoded as `id`); CarbsEntry.swift:29 and
                TempTarget.swift:50 encode `case id = "_id"`; APP_VERSION in
                Config.xcconfig:21
              commit: e41c9db37
        versionSource:
          collection: devicestatus
          path: openaps.version
          window_minutes: 60
        evidence:
          - claim: read-derived
            ref: >-
              externals/Trio Trio/Sources/Services/Network/Nightscout/NightscoutManager.swift:658
              (devicestatus `openaps.version` is the app's release version)
            commit: e41c9db37
          - claim: measured
            ref: >-
              make schema-quirks over the 2026-04-01 and 2026-04-26 snapshots,
              2026-10-16: 55,939 stored treatments on one site carry a UUID
              `id`, every one with `enteredBy: Trio`, a server-assigned 24-hex
              `_id` and no `identifier`; eventTypes Temp Basal, SMB, Carb
              Correction and Bolus
    reader_guidance: >-
      Do not read `id` as Nightscout's `_id` or as `identifier`. A treatment
      that carries only `id` is matched on a re-send by `created_at` +
      `eventType` (write contract `treatment-fallback-key`), so two records
      of one type at one time are one record to the server. A reader that
      wants the client's record id may read `id` as written.
    writer_guidance: >-
      Send the record's own id as `identifier` and no `_id`; the hub assigns
      `_id` and returns both (D20 rule 5).
    references:
      - docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md#263-d20--version-scoped-quirks-and-the-two-id-rule-maintainer-2026-10-16
      - docs/30-design/tenancy/write-contract-spec-2026-10-07.md
      - docs/10-domain/client-id-analysis/TRIO_ID_ANALYSIS.md
      - externals/work/crm-write/lib/server/treatments.js:383-405 @239f8c25 (upsertQueryFor)
