# Column map for `nsprobe warehouse`.
#
# These names are the ones tim2000s's public repositories query, read from
# externals/Insulin-Kinetics (gate1_recover_known_curve.py, platform_detect.py,
# extract_integrity.py) at the pin in workspace.lock.json. Adjust them to the
# warehouse actually in hand; a column that does not exist makes only the
# probe that needs it report "skipped" or "error".
#
# PostgreSQL folds unquoted names to lower case. A column created with quotes
# and capitals (dynamic-isf-calculations' oref_v* tables have "sug_ISF" and
# "sug_TDD") must be written here with its quotes: '"sug_ISF"'.
#
# The connection string is read from the environment variable named here.
# Never put a DSN, host or password in this file.
dsn_env: NSPROBE_DSN

decisions:
  table: boost_decisions
  user: user_id
  ts: ts_utc
  iob: iob_iob
  basaliob: iob_basaliob
  bolusiob: iob_bolusiob
  steps: steps_60m

treatments:
  table: boost_treatments
  user: user_id
  ts: ts_utc
  insulin: insulin
  event_type: event_type
  bolus_type: bolus_type
  ns_id: ns_id
