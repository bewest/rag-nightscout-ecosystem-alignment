# L1 · Agents: the three ways a software agent built on a language model reaches the ecosystem.
# Source: docs/30-design/platform/agent-trust-boundaries-2026-10-18.md §1 (the three domains),
# §2 (develop: each project's contribution rules and review), §3 (interpret: one read role, MCP is
# an adapter, the data goes where the model runs) and §4 (act: no path of its own today; the
# proposal → approval → command lifecycle is proposed in spec/commands.md §4-§7, D18 keeps
# validation and enactment in the controller). Drawn 2026-10-18; read-derived.
title: "1·agents · Agents: develop, interpret, act"
nodes:
  - {id: agent, label: "Software agent\n(language model)", kind: entity, level: 0, column: 1, icon: bot}
