  - {id: release, label: "Review and release\n(each project's\nmaintainers)", kind: commons, level: 2, column: 0, icon: badge-check}
  - {id: cred, label: "Interpret: read\ncredential (one role,\nevery record)", kind: commons, level: 1, column: 1, icon: key-round}
  - {id: mcp, label: "MCP server or tool\n(an adapter over\nthe hub's API)", kind: entity, level: 2, column: 1, icon: waypoints}
