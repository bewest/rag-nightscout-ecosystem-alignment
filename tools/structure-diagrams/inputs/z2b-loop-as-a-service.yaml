# Zoom into Z1's "regulated controller operator": Loop-as-a-service, a legal entity that answers to
# a regulator for a controller built from an open-source codebase. Proposal for discussion.
# Sources: the special controls of 21 CFR 862.1356 (iAGC), 862.1355 (iCGM) and 880.5730 (ACE pump)
# as summarised in 60-research/programme/stack-census-2026-09-30/cloud-layer.md; HISTORY.md and
# PRECEDENTS (Tidepool Loop, K203689, cleared 2023-01-23 as an iAGC; twiist 2024-03-18);
# PARTNER-READINESS §2 (tier C) and §7; ECOSYSTEM-PROGRAMME "One codebase, two uses" (no separate
# commercial edition, SQLite's and CNCF's models). Generic: no operator or device is named.
title: "Z2b · One regulated controller · Loop-as-a-service"
nodes:
  - {id: reg, label: "Regulatory authority", kind: authority, level: 0, column: 1}
  - {id: pumpmfr, label: "Pump manufacturer\n(ACE pump)", kind: org, level: 1, column: 0}
  - {id: cgmmfr, label: "CGM manufacturer\n(iCGM)", kind: org, level: 1, column: 2}
  - {id: op, label: "Controller operator:\nthe legal manufacturer\nof the controller", kind: entity, level: 2, column: 1, status: proposed}
  - {id: project, label: "Open-source project\n(DIY track continues)", kind: org, level: 3, column: 0}
  - {id: person, label: "Person or caregiver", kind: human, level: 3, column: 1}
  - {id: hub, label: "Nightscout hub\n(self-run or hosted)", kind: process, level: 3, column: 2}
  - {id: app, label: "Cleared controller app\n(one validated release)", kind: org, level: 4, column: 1, zoom: Z3}
  - {id: pump, label: "ACE pump", kind: process, level: 5, column: 0}
  - {id: cgm, label: "iCGM", kind: process, level: 5, column: 2}
edges:
  - {from: reg, to: op, kind: control, label: "iAGC clearance,\nspecial controls", status: proposed}
  - {from: op, to: reg, kind: feedback, label: "submissions,\nadverse events"}
  - {from: reg, to: pumpmfr, kind: control, label: "ACE pump\nclassification"}
  - {from: reg, to: cgmmfr, kind: control, label: "iCGM\nclassification"}
  - {from: pumpmfr, to: op, kind: control, label: "pump interface spec,\npairing (tier C)", status: proposed}
  - {from: op, to: pumpmfr, kind: feedback, label: "validation of\nthe implementation"}
  - {from: cgmmfr, to: op, kind: control, label: "CGM interface spec", status: proposed}
  - {from: op, to: cgmmfr, kind: feedback, label: "validation of\nthe implementation"}
  - {from: project, to: op, kind: data, label: "releases\n(one codebase)"}
  - {from: op, to: project, kind: data, label: "fixes and validation\nevidence returned", status: proposed}
  - {from: op, to: app, kind: control, label: "validated release,\nlabelling, updates"}
  - {from: app, to: op, kind: feedback, label: "critical-events record,\ncomplaints"}
  - {from: person, to: app, kind: control, label: "settings, boluses"}
  - {from: app, to: person, kind: feedback, label: "alerts, status"}
  - {from: person, to: op, kind: feedback, label: "complaints"}
  - {from: app, to: hub, kind: data, label: "uploads for\nfollowers"}
  - {from: app, to: pump, kind: control, label: "commands\n(ACE pumps only)"}
  - {from: pump, to: app, kind: feedback, label: "state; safe fallback\non lost connection"}
  - {from: cgm, to: app, kind: feedback, label: "glucose\n(iCGMs only)"}
