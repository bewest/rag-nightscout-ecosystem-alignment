# One idea: the requirements are the same for anyone; meeting them in practice takes a legal entity.
# Sources: ACCOUNTABILITY-THRESHOLDS §5 (FDA routes open to any manufacturer; Tidepool, a nonprofit,
# took the same 510(k) route; Dexcom's standard, non-negotiable agreement; Washington's act does not
# exclude nonprofits; Apple's only nonprofit concession is a fee waiver; Apple guideline 5.1.1(ix):
# healthcare apps "submitted by a legal entity ... and not by an individual developer").
