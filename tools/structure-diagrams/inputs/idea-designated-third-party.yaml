# One idea: the person designates a third party, and the data holder must send it there.
# Sources: vendor note §3.1 (EU Data Act, applies since 2025-09-12: user access, real-time where
# feasible, Art. 4; sharing with a third party at the request of "a user, or a party acting on behalf
# of a user", free to the user, Art. 5; the third party may use the data only for the agreed purposes
# and may not share it on, Art. 6) and §5.3 (what the third party has to be or have). EU only.
title: "idea·designated-third-party · The person designates who receives their data"
