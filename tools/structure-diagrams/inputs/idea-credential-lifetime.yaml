# One idea: a credential's lifetime has a defined safe state at every stage. Three panels.
# Sources: PARTNER-READINESS §7 (no single point of failure for therapy: a shared credential service
# must not be able to stop insulin delivery by being unreachable; previously authorised, safely bounded
# local operation continues; permitted offline behaviour, expiry rules and safe states are defined and
# validated with each manufacturer) and §4 (revocation by process: published grounds, notice and
# appeal, except an immediate suspension for an active security incident; revoking a credential must
# leave a person's devices in a defined safe state). The drawing describes requirements, not any
# released system.
title: "idea·credential-lifetime · A credential's lifetime, and its safe states"
base: false
scenarios: [normal, unreachable, revoked]
nodes:
  - {id: person, label: "Person or\ncaregiver", kind: human, level: 0, column: 0, icon: user}
  - {id: auth, label: "Credential authority", kind: entity, level: 0, column: 2, icon: key-round,
     labels: {normal: "Credential authority", unreachable: "Credential authority\n(unreachable)",
              revoked: "Credential authority\n(revokes, by process)"}}
  - {id: app, label: "Controller app\n(holds a bounded,\noffline-valid grant)", kind: org, level: 1, column: 1, icon: smartphone}
  - {id: pump, label: "Pump", kind: process, level: 2, column: 1, icon: syringe}
edges:
  - {from: person, to: app, kind: control, label: "operates"}
  - {from: app, to: person, kind: feedback, label: "alerts",
     labels: {normal: "alerts", unreachable: "alerts; grant\nexpiry ahead",
              revoked: "told why, and\nhow to appeal"}}
  - {from: auth, to: app, kind: discretion, label: "issues, renews", in: [normal, revoked],
     labels: {normal: "issues, renews", revoked: "revokes: published grounds,\nnotice and appeal; at once\nonly for a security incident"}}
  - {from: app, to: auth, kind: feedback, label: "renewal request", in: [normal]}
  - {from: app, to: pump, kind: control, label: "commands",
     labels: {normal: "authenticated\ncommands",
              unreachable: "previously authorised,\nsafely bounded operation\ncontinues",
              revoked: "commands stop; the\npump enters its defined\nsafe state"}}
  - {from: pump, to: app, kind: feedback, label: "status"}
views:
  - {id: normal, title: "issued and renewed", scenario: normal}
  - {id: unreachable, title: "the authority is unreachable", scenario: unreachable}
  - {id: revoked, title: "revoked", scenario: revoked}
