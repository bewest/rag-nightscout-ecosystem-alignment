# One idea: a nonprofit as an oversight layer above companies that build on a commons, without carrying
# their regulatory duties. Sources: ACCOUNTABILITY-THRESHOLDS §5 (the nonprofit's role is oversight,
# not an advantage in meeting requirements); PRECEDENTS (CNCF certifies vendors against one upstream
# with the same public tests; the Open Home Foundation binds partners by contract; TEFCA's one Common
# Agreement; eduGAIN's steering group); COLLABORATION-MODEL rule 3 (listing on published criteria).
