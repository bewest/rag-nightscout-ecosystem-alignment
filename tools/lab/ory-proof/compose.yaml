# T30-ORY-PROOF lab stack. Images pinned by digest (recorded 2026-10-07).
# Secrets come from .secrets.env (gitignored), generated by `./lab.sh secrets`.
# Host ports: 444xx for Ory, 54353 for Postgres, 44825 for the mail catcher; all on 127.0.0.1.
name: ory-proof

x-kratos-image: &kratos_image ${KRATOS_IMAGE:-oryd/kratos:v1.3.1@sha256:fe2428f103a6240c064b6ea77d3088610865c55fcebccb30355857eccdc25b4b}
x-hydra-image: &hydra_image ${HYDRA_IMAGE:-oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b}

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run ./lab.sh secrets}
      POSTGRES_DB: lab
    ports: ["127.0.0.1:54353:5432"]
    volumes:
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:44825:8025"]

  kratos-migrate:
    image: *kratos_image
    environment:
      DSN: postgres://lab:${PG_PASSWORD}@postgres:5432/kratos?sslmode=disable
    volumes: ["./config/kratos:/etc/config/kratos:ro"]
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    depends_on:
      postgres: {condition: service_healthy}

  kratos:
    image: *kratos_image
    environment:
      DSN: postgres://lab:${PG_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRET_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRET_CIPHER}
      SECRETS_DEFAULT: ${KRATOS_SECRET_DEFAULT}
      # Probe variants are compose overlays (variants/*.yaml), selected by LAB_VARIANT in lab.sh.
    volumes: ["./config/kratos:/etc/config/kratos:ro"]
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    ports: ["127.0.0.1:44433:4433", "127.0.0.1:44434:4434"]
    depends_on:
      kratos-migrate: {condition: service_completed_successfully}

  hydra-migrate:
    image: *hydra_image
    environment:
      DSN: postgres://lab:${PG_PASSWORD}@postgres:5432/hydra?sslmode=disable
    volumes: ["./config/hydra:/etc/config/hydra:ro"]
    command: migrate -c /etc/config/hydra/hydra.yml sql -e --yes
    depends_on:
      postgres: {condition: service_healthy}

  hydra:
    image: *hydra_image
    environment:
      DSN: postgres://lab:${PG_PASSWORD}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRET_SYSTEM}
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
    volumes: ["./config/hydra:/etc/config/hydra:ro"]
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    ports: ["127.0.0.1:44444:4444", "127.0.0.1:44445:4445"]
    depends_on:
      hydra-migrate: {condition: service_completed_successfully}
