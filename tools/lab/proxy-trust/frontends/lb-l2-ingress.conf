# L-B LAYER 2 (emulates ingress-nginx with use-proxy-protocol: "true"). It
# CONSUMES the PROXY protocol header, recovers the real client via real_ip, then
# appends to X-Forwarded-For toward layer 3. LB_FRONT_IP / LB3_ADDR substituted.
server {
    listen 8080 proxy_protocol;
    set_real_ip_from LB_FRONT_IP;
    real_ip_header proxy_protocol;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://LB3_ADDR;
    }
}
