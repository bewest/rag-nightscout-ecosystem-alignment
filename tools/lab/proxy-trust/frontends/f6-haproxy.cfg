# F6: HAProxy with `option forwardfor`. By default HAProxy APPENDS an
# X-Forwarded-For header with the client source; with the default (no `if-none`)
# it adds the header even if one is present, i.e. it appends the connection peer.
global
    log stdout format raw local0
defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option forwardfor
frontend fe
    bind *:80
    default_backend be
backend be
    server ns NS_ADDR
