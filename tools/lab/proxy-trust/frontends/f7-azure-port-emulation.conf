# F7: emulates a front end that appends the client as address:port, the form
# Azure App Service is reported to send. Appends to any incoming header.
map $http_x_forwarded_for $f7_xff {
    ""      "$remote_addr:$remote_port";
    default "$http_x_forwarded_for, $remote_addr:$remote_port";
}
server {
    listen 80;
    location / {
        proxy_pass http://NS_ADDR;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $f7_xff;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
