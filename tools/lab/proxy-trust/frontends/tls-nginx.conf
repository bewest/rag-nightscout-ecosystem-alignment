# TLS front end: terminates HTTPS with a self-signed cert, appends XFF, and sets
# X-Forwarded-Proto=https so Nightscout with INSECURE_USE_HTTP=false does NOT
# redirect-loop. Certs are generated by lab.sh into /etc/nginx/certs.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://NS_ADDR;
    }
}
