# F2: nginx that REPLACES X-Forwarded-For with $remote_addr, discarding whatever
# the client sent. This is the "sanitising edge" pattern.
server {
    listen 80;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://NS_ADDR;
    }
}
