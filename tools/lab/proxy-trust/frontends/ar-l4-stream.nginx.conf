# AR chain, L4 FRONT (emulates a cloud TCP / TLS-passthrough load balancer).
# A stream{} proxy: raw TCP to NEXT_ADDR. PP_DIRECTIVE is rendered either as
# "proxy_protocol on;" (LB with PROXY protocol enabled) or empty (LB in plain
# TCP passthrough: the client address is LOST, the next hop sees this box).
# It never reads or writes X-Forwarded-For (it is L4). Substituted by ar_chain.sh.
worker_processes 1;
events { worker_connections 256; }
stream {
    server {
        listen 80;
        PP_DIRECTIVE
        proxy_pass NEXT_ADDR;
    }
}
