# AR chain, GATEWAY (outer perimeter of a multi-tenant hosted platform).
# Consumes PROXY protocol WITHOUT real_ip, and OVERWRITES X-Forwarded-For /
# X-Real-IP with $proxy_protocol_addr (never appends). An auth_request
# subrequest authorizes the public name (<view>.gw.test) and returns the
# upstream ORIGIN the request must go to next (X-Upstream-Origin); nginx then
# proxies to that origin through a variable -- the backend is chosen per request
# by the authorization answer, not by static config.
#
# Deviation from the real shape: the real authorizer returns an origin URL whose
# hostname carries the internal tenant name; the lab has no DNS, so the origin is
# an IP and the internal Host is handed back separately in X-Forwarded-Host.
# Substituted by ar_chain.sh: ROUTER_ADDR, TENANT_ROUTER_ADDR.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- authorizer stub (stands in for the policy service) ---------------------
#   guest  -> next hop is a second auth_request router (3 HTTP hops to NS)
#   hosted -> next hop is the tenant router directly     (2 HTTP hops to NS)
#   other  -> 401 (non-vacuity: the gateway really gates)
map $http_x_accel_view $ar_origin {
    guest   "http://ROUTER_ADDR";
    hosted  "http://TENANT_ROUTER_ADDR";
    default "";
}
map $http_x_accel_view $ar_fwd_host {
    guest   "demo-guest.lab.test";
    hosted  "tenant1.backends.lab.test";
    default "";
}
server {
    listen 127.0.0.1:9000;
    location = /verify {
        if ($ar_origin = "") { return 401; }
        add_header X-Upstream-Origin $ar_origin always;
        add_header X-Forwarded-Host $ar_fwd_host always;
        return 204;
    }
}

# unknown public names
server {
    listen 8080 proxy_protocol default_server;
    return 421;
}

server {
    listen 8080 proxy_protocol;
    server_name ~^(?<expected_name>[^.]+)\.gw\.test$;

    location = /auth/verify {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Accel-View $expected_name;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_method HEAD;
        proxy_pass http://127.0.0.1:9000/verify;
    }

    location / {
        auth_request /auth/verify;
        auth_request_set $lookup $upstream_http_x_upstream_origin;
        auth_request_set $lookup_host $upstream_http_x_forwarded_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $lookup_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass $lookup;
    }
}
