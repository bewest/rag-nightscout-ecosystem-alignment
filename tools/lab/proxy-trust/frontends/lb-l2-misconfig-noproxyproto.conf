# L-B LAYER 2 MISCONFIGURED: listens WITHOUT proxy_protocol, so the PROXY header
# bytes are treated as the start of the HTTP request (nginx rejects/garbles), or
# if the front were in HTTP mode the client address would be the FRONT's, never
# the real client. Emulates enabling PROXY protocol on the LB but forgetting
# use-proxy-protocol on ingress. XFF then carries the wrong source.
server {
    listen 8080;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://LB3_ADDR;
    }
}
