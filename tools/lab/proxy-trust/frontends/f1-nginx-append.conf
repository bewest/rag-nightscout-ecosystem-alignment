# F1: nginx as a reverse proxy that APPENDS to X-Forwarded-For.
# Default nginx behaviour when you use $proxy_add_x_forwarded_for: it takes any
# X-Forwarded-For the client sent and appends the connection's $remote_addr.
# NS_ADDR is the Nightscout upstream (host gateway); lab.sh substitutes it.
server {
    listen 80;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://NS_ADDR;
    }
}
