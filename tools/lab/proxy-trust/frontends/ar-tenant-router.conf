# AR chain, TENANT ROUTER (tenant -> backend host:port), the last hop before
# Nightscout. Host must be "<tenant>.backends..."; an auth_request subrequest
# asks the service-discovery resolver for that tenant and gets back
# X-Selected-Backend (a full origin, IP literal) + X-Worker-Port; nginx proxies
# to "$tenant$request_uri". APPENDS to X-Forwarded-For and deliberately does NOT
# set X-Forwarded-Proto/-Port (the upstream hop's values pass through), matching
# the template this emulates. Substituted: NS_ADDR.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- resolver stub (stands in for the SRV-lookup redirector) ---------------
server {
    listen 127.0.0.1:9000;
    location ~ ^/internal_consul/tenant1/ {
        add_header X-Worker-Port 3866 always;
        add_header X-Selected-Backend "http://NS_ADDR" always;
        return 200;
    }
    location / { return 404; }
}

# Host that is not "<tenant>.backends..."
server {
    listen 80 default_server;
    return 421;
}

server {
    listen 80;
    server_name ~^((?<cluster_user>.*)\.backends.*);

    location = /internal/validate_request {
        internal;
        proxy_pass http://127.0.0.1:9000/internal_consul/$cluster_user/$http_host;
        proxy_set_header Host "$cluster_user";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_method GET;
    }

    location / {
        auth_request /internal/validate_request;
        auth_request_set $backend_port $upstream_http_x_worker_port;
        auth_request_set $tenant $upstream_http_x_selected_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Start $msec;
        proxy_set_header X-Origin-URI $request_uri;
        # proxy_set_header X-Forwarded-Proto $scheme;   (intentionally absent)
        proxy_pass $tenant$request_uri;
    }
}
