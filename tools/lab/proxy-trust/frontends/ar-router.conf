# AR chain, ROUTER (public-name -> tenant). An auth_request subrequest resolves
# the public name to a tenant compute id (X-Accel-Compute); nginx rewrites Host
# to "<compute>.backends..." and proxies to the tenant router. APPENDS to
# X-Forwarded-For.
#
# ROUTER_LISTEN / ROUTER_REALIP are rendered by ar_chain.sh:
#   plain : "listen 80 default_server;"             and ""   (no real_ip)
#   pp    : "listen 8080 proxy_protocol default_server;" and
#           "set_real_ip_from <L4 front>; real_ip_header proxy_protocol;"
#           (the recommended way to consume PROXY protocol then append)
# Also substituted: TENANT_ROUTER_ADDR.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- authorizer stub (stands in for the session/view lookup service) --------
server {
    listen 127.0.0.1:9000;
    location = /views/lb-auth {
        add_header X-Accel-Compute tenant1 always;
        return 200;
    }
}

server {
    ROUTER_LISTEN
    ROUTER_REALIP

    location = /auth-verify {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Accel-View $host;
        proxy_method GET;
        proxy_pass http://127.0.0.1:9000/views/lb-auth;
    }

    location / {
        auth_request /auth-verify;
        auth_request_set $compute $upstream_http_x_accel_compute;
        auth_request_set $lookup_host $compute.backends.service.local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $lookup_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        set $lookup http://TENANT_ROUTER_ADDR;
        proxy_pass $lookup;
    }
}
