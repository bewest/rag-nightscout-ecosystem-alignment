# L-B FRONT (emulates a DigitalOcean load balancer in TCP mode, PROXY protocol
# enabled). A stream{} proxy: it forwards raw TCP to layer 2 and PREPENDS a
# PROXY protocol v1 header carrying the real client address. It does NOT add or
# read X-Forwarded-For (it is L4). LB2_ADDR is substituted by lab.sh.
worker_processes 1;
events { worker_connections 256; }
stream {
    server {
        listen 80;
        proxy_protocol on;
        proxy_pass LB2_ADDR;
    }
}
