  # ---- consent ----
  - pattern: "tools/oref_inv_003_replication/figures/**"
    axis: consent
    reason: "Figures derived from an external data holder's data; published only with the holder's OK."
    decided_by: "maintainer 2026-09-30"
  - pattern: "tools/oref_inv_003_replication/reports/**"
    axis: consent
    reason: "Reports with figures and numbers derived from an external data holder's data; pending the holder's OK."
    decided_by: "maintainer 2026-09-30"
  - pattern: "tools/oref_inv_003_replication/README.md"
    axis: consent
    reason: "Describes the holder-data replication; kept with its figures pending the holder's OK."
    decided_by: "maintainer 2026-09-30"
  - pattern: "reports/nsprobe/**"
    axis: consent
    reason: "nsprobe baseline outputs from a data holder run; pending the holder's OK."
    decided_by: "maintainer 2026-09-30"

  # ---- noise ----
  - pattern: ".copilot/**"
    axis: noise
    reason: "Coding-assistant session state committed by accident; not documentation."
    decided_by: "maintainer 2026-09-30"
  - pattern: "**/.build/**"
    axis: noise
    reason: "Guard: vendored SwiftPM checkouts. None tracked; keeps them out if one is added."
    decided_by: "maintainer 2026-09-30"
  - pattern: "**/node_modules/**"
    axis: noise
    reason: "Guard: vendored npm packages. None tracked."
    decided_by: "maintainer 2026-09-30"
  - pattern: "*VERIFICATION*"
    axis: noise
    reason: "Root-level verification dumps from April 2026 sessions."
    decided_by: "maintainer 2026-09-30"
  - pattern: "verification*"
    axis: noise
    reason: "Root-level verification dumps (lower-case names)."
    decided_by: "maintainer 2026-09-30"
  - pattern: "SESSION_*"
    axis: noise
    reason: "Root-level session checkpoint."
    decided_by: "maintainer 2026-09-30"
  - pattern: "CAMPAIGN_FINAL_REPORT.md"
    axis: noise
    reason: "Root-level session or campaign dump."
    decided_by: "maintainer 2026-09-30"
  - pattern: "PRODUCTIONIZATION-SESSION-2026-04-23.md"
    axis: noise
    reason: "Root-level session or campaign dump."
    decided_by: "maintainer 2026-09-30"
  - pattern: "REVIEW_NOTES.md"
    axis: noise
    reason: "Root-level session or campaign dump."
    decided_by: "maintainer 2026-09-30"
  - pattern: "replit.md"
    axis: noise
    reason: "Root-level session or campaign dump."
    decided_by: "maintainer 2026-09-30"
  - pattern: "_report_list.txt"
    axis: noise
    reason: "Root-level session or campaign dump."
    decided_by: "maintainer 2026-09-30"
  - pattern: "plan_update.txt"
    axis: noise
