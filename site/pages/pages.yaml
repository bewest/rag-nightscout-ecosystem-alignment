    sources: [docs/30-design/platform/next-gen-platform-plan.md, docs/30-design/platform/next-gen-platform-plan.json]
    source_commit: f41389aea
    render: tools/site/render_nextgen.py
  api-aid-commands-2025.html:
    kind: living
    sources: [specs/openapi/aid-commands-2025.yaml]
    source_commit: 635934af3
    render: tools/site/render_apis.py
    api:
      status: superseded
      note: >-
        Describes the remote-commands queue of cgm-remote-monitor pull request #7791, which is open,
        unmerged and in no release. The states, expiry, routing and cancel steps are replaced by the
        platform commands specification. The command path that ships today is not documented here.
      see: docs/30-design/platform/spec/commands.md
