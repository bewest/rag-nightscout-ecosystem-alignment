# Manifest for the committed rich pages in site/pages/ (tools/site/build.py).
#
# Every .html file here needs an entry, keyed by file name. The build fails on
# a page without one, on an entry without its file, or when a rule below fails.
#
#   kind: snapshot   a point-in-time record. Needs `as_of: YYYY-MM-DD`, and the
#                    page must show a banner: an element with
#                    data-site-banner="snapshot" whose text names the as_of date.
#   kind: living     kept in step with repository sources. Needs `sources:` (repo
#                    paths) and `source_commit:` (the commit the page was
#                    rendered at). The build fails, naming the page and source,
#                    if any source changed between source_commit and HEAD:
#                    re-render the page, then move source_commit forward.
#
# API reference pages (render: tools/site/render_apis.py) are living pages with
# one OpenAPI source and an `api:` block: `status` (current, de-facto, proposed,
# draft-pr or superseded), a one-sentence `note`, and optionally `see:` (a
# tracked .md page the banner links to). The page must show an
# element with data-site-banner="api-status" whose data-api-status matches.
pages:
  nightscout-ecosystem-programme.html:
    kind: living
    sources: [docs/00-overview/ECOSYSTEM-PROGRAMME.md]
    source_commit: 59b35119
    render: tools/site/render_programme.py
  cgm-remote-monitor-15.0.9-release-readiness-2026-09-27.html:
    kind: snapshot
    as_of: 2026-09-27
  cgm-remote-monitor-15.0.9-journeys-2026-09-27.html:
    kind: snapshot
    as_of: 2026-09-27
  cgm-remote-monitor-15.0.9-colophon.html:
    kind: living
    sources: [releases/cgm-remote-monitor-15.0.9/colophon.md, releases/cgm-remote-monitor-15.0.9/colophon-data.json]
    source_commit: 59b35119
    render: tools/site/render_colophon.py
  clinical-decision-support-synthetic-demo-2026-10-16.html:
