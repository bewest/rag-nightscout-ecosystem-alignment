      status: proposed
      note: >-
        The API v4 surface the platform specifications define: discovery, per-tenant controller
        registration, instances on one flat root, commands and proposals, and statistics reads matching
        Nocturne's (maintainer decisions, 2026-10-26). Each operation names its listener and whether it
        is served in pull request #8857, specified only, or still open.
      see: docs/30-design/platform/v4-surface-and-nocturne-2026-10-26.md
