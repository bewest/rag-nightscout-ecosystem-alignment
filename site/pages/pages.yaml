    sources: [specs/openapi/aid-entries-2025.yaml]
    source_commit: b7874a1ab
    render: tools/site/render_apis.py
    api:
      status: de-facto
      note: >-
        Describes the stored entries documents that shipping apps upload, reconciled against the 2026-04 corpus; the operation follows API v3 on cgm-remote-monitor dev 47723cda, though not every v3 search parameter is declared. Schemas named as 2026 extensions are this repository's proposals, not shipping fields.
      see: specs/openapi/README.md
