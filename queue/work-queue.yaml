        describe: trial-merge into origin/dev is conflict-free
      - run: git -C externals/cgm-remote-monitor-official merge-tree --write-tree bf/throttle origin/chore/nightscout-modernization >/dev/null
        kind: static
        describe: >
          THE GATE THIS BRANCH EXISTS FOR - it merges clean with PR #8605. The
          pre-split draft conflicted in five files (index.js, storage.js,
          alarmSocket.js, security.js, websocket.js) and four of those were the
