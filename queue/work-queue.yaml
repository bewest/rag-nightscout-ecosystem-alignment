    blocks_on: []
    evidence:
      - docs/60-research/tenancy/auth-plane-ory-vs-inhouse-2026-09-16.md
      - docs/30-design/tenancy/tenant-owner-config-surface-2026-09-15.md
    notes: >
      DECIDED 2026-09-16 (maintainer). D16 ADOPTED WHOLE, including the
      prerequisite - tenant resolution and credential verification extract to one
      module BEFORE the third listener exists, which lands on T30-WIRING. D17
      ADOPTED IN THREE ROWS OF FOUR: devices and the data path keep a native
      per-tenant credential permanently (forced by D1, an uploader cannot run an
      OAuth flow); Hydra deferred; D7 unchanged. ROW 2 - Ory Kratos as one
      cohort-wide pool for human identity - is recorded as DIRECTION OF TRAVEL,
      NOT ADOPTED, because every Ory claim behind it is read and not run and
      because a shared identity pool is irreversible once identities exist. It is
      gated on T30-ORY-PROOF. Commissioned the same day by the maintainer, who
      settled the deployment shape mid-research - ONE Kratos and ONE Hydra for the
      whole cohort, unified auth FOR Nightscout tenants, not a Kratos tenant PER
      Nightscout tenant - which settles the largest open question against Ory OSS,
      because OSS multi-tenancy is exactly what we are not asking for. The three
      findings a reader should not have to dig for - Nocturne uses no Ory at all
      and built identity in-house; Ory OSS is single-tenant and its multi-tenancy
      is the paid boundary, which does not bind us; and we already shipped this
      integration once and stopped one component short of finishing it. A fourth
      was MEASURED after the decision and is in the research document at section
      3.5: Nocturne's identity plane is deployment-scoped too, arrived at
      independently and with no Ory in the tree, which is the nearest thing to
      corroboration this decision has.

