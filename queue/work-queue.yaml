      1 commit at 435419ce, 3 files, +388/-45. lib/authorization/delaylist.js,
      lib/authorization/index.js, tests/authdelay.test.js.
    review: >
      maintainer. SPLIT OUT OF bf/auth 2026-09-16 on the maintainer's
      instruction, and the split is the point. The earlier draft added
      lib/server/peer-address.js and threaded a second address through
      alarmSocket, security, websocket and index, which CONFLICTED WITH PR #8605
      IN FIVE FILES - that PR replaces the client-address derivation wholesale
      with a TRUST_PROXY-driven module. Re-cut without the peer plumbing this
      branch merges CLEAN against #8605, measured, and the throttle keys on
      data.ip, which #8605 then makes trustworthy with no further change here.
      What a reviewer needs and cannot read off the diff: THE DEFAULT IS TODAY'S
      BEHAVIOUR BY DESIGN, an attacker varying both credential and header is
      still not throttled, and that gap is asserted by a test rather than left
      implied.
    operator_visible: >
      Two fixes to the delay Nightscout applies after a failed login, and one
      thing it now tells you. Until now that delay was applied on the way IN to
      every request, so a device presenting the CORRECT password could be made to
      wait for somebody else's failed attempts - and if your Nightscout sits
      behind a proxy or a CDN, where many devices can look like they share one
      address, a single misconfigured uploader could slow everything down. The
      delay now applies only to the request that actually failed. Separately, the
      list of recent failures was not being cleared properly and grew for as long
      as Nightscout kept running. THERE IS ALSO A NEW MESSAGE IN YOUR LOG, and it
      is telling you something true - the protection against password guessing is
      weaker than it looks, because the address it counts against can be set by
      whoever is connecting. Nothing you configured has changed and nothing you
      rely on stops working. Restricting access at your proxy or hosting provider
      is the thing that actually helps today. None of this is medical advice.
    semver: patch
    semver_reason: >
      no declared surface moves and no default changes. For any given request the
      delay only ever SHRINKS - a successful authentication is no longer delayed
      at all - so nothing that worked stops working. An added log line is not a
      surface. The secure default is a later and deliberate bump.
