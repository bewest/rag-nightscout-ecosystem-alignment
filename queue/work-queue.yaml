  - id: P0-J
    title: bf/throttle - BF-30, failed-auth throttling, compatibility default
    parcel: phase0
    repo: cgm-remote-monitor
    branch: bf/throttle
    base: origin/dev@a8888f0d
    worktree: externals/work/crm-bf-throttle
    state: gate-not-met
