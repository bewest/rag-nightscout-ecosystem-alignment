  - id: RT-NODE-FLOOR-TESTED
    title: BF-58, BF-59 - the enforced Node floor is not the Node anything exercises
    parcel: release-train
    repo: cgm-remote-monitor
    branch: chore/compose-mongodb6, chore/mime-exposure-review, chore/nightscout-modernization
    base: origin/dev@a8888f0d
    worktree: externals/cgm-remote-monitor-official
    state: gate-not-met
    ships_to_operators_today: false
    blast_radius: >
      Dockerfile (builder and runtime FROM lines) and the .github/workflows
      test-job matrix, on the cut tips. No production source.
    review: maintainer
    operator_visible: >
      From the first maintenance release onward Nightscout refuses to start on
      Node older than 22.23.2 or 24.20.0, and exits immediately with a message.
      The container image it ships is built on a floating "node 22" tag, so a
      cached or mirrored older layer produces a container that starts, prints
      that message and stops. That looks like a crash and is not data loss. The
      release notes should name the message so you recognise it.
    semver: n/a
    semver_reason: >
      CI and image configuration. It changes no declared surface. The Node floor
      itself is classified on RT-1 and this item does not restate it.
    register: [BF-58, BF-59]
    gates:
      - run: 'git -C externals/cgm-remote-monitor-official show origin/chore/retire-jsdom:.github/workflows/main.yml | grep -q "''22.23.2''" && git -C externals/cgm-remote-monitor-official show origin/chore/retire-jsdom:.github/workflows/main.yml | grep -q "''24.20.0''"'
        kind: static
        describe: >
          CONTROL, and it PASSES - cut 1's test matrix is
          ['22.23.2','22','24.20.0','24'], so the two floor versions the runtime
          policy refuses to start below are exercised. A green here is what
          makes the red below a fact about cut 3 rather than about the grep.
      - run: 'git -C externals/cgm-remote-monitor-official show origin/chore/compose-mongodb6:.github/workflows/main.yml | grep -q "''22.23.2''" && git -C externals/cgm-remote-monitor-official show origin/chore/compose-mongodb6:.github/workflows/main.yml | grep -q "''24.20.0''"'
        kind: static
        describe: >
          BF-59. FAILS - from cut 3 onward the matrix is ['22','24'] and the two
          exact versions the software refuses to start below are exercised by no
          test job. engines is byte-identical across all five cuts, so this is
          LOST COVERAGE rather than a changed requirement.
      - no-gate: >
          BF-58 is not reproducible against a current image and no image was
          built - rule 0 forbids pulling one. node:22-alpine tracks the latest
          22.x and satisfies the floor today; the exposure is cached, mirrored
          or explicitly pinned older 22.x layers. Nothing checks a Dockerfile
          base tag against an engines range, and that is the missing instrument.
      - no-gate: >
          PARTIAL MITIGATION ALREADY IN CI, recorded so the residual is not
          overstated - from cut 1 the docker-build-pr job builds the image and
          runs runtime-policy against it plus a start-up smoke test. The gap is
          narrower: the docker-build job that PUBLISHES to Docker Hub on
          master/dev has no such step and builds with no-cache, so it
          re-resolves node:22-alpine at publish time without re-validating.
    blocks_on: [RT-1]
    evidence:
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      MEASURED 2026-09-21 WITH `n exec` AND `docker run`, and the two halves came out
      differently - one confirmed low, one re-graded to high.

      BF-59 CONFIRMED low. The concern is that a regression exactly at the floor would go
      uncaught from cut 3 onward, where the matrix drops to ['22','24']. There is no such
      regression today: cut 4's unit suite is 310 passing / 0 failing on 22.23.2, the exact
      floor those cuts stopped testing, and 310 on 24.20.0. Cut 1, whose matrix still
      carries both floors, gives the same count on each. Lost coverage, not a live defect.

      RESOLVED 2026-09-21 ON THE MAINTAINER'S DECISION: engines.node is now
      `^22.12 || >=24`, committed as ed21961f on rt/cut1 and merged up the stack to
      rt/cut2 b5bf7d77, rt/cut3 c313f5b1, rt/cut4 95bb6295. NOT PUSHED.

      Node 20 was left out deliberately and in that order - it WORKS (310/0) and is not
      supported, because it reached end of life 2026-04-30 and gets no security updates.
      `>= 24` admits odd and future majors (25.x, 26.x) which the old policy excluded by
      name; that is deliberate and tests/runtime-policy.test.js says so, so a reader who
      expects them refused finds out why they are not. Prereleases stay out via semver's
      default.

      VERIFIED, not asserted: the image that could not boot now boots - `runtime ACCEPTED
      inside node:22-alpine (v22.22.0)`, run in the image. Boundary re-measured: 18.20.8 and
      20.20.0 refused, 22.12.0 / 22.22.0 / 24.15.0 / 24.20.0 accepted. Cut 4's suite
      including tests/runtime-policy.test.js is 332 passing / 0 failing at BOTH 22.12.0 and
      24.20.0. The boundary test is non-vacuous: widening engines to >=18 as an ablation
      takes it from 22 passing to 11 passing / 11 failing.

      THE DOCKERFILE WAS NOT TOUCHED, which was the point. Under a minor floor the floating
      major tag is correct and is the strategy docs/runtime-upgrade.md always described.

      TWO INSTRUMENTS WERE WRONG AND ARE FIXED. node-floor-consistency.js scraped
      /(\d+)\.\d+\.\d+/ out of the range, which only works at patch precision - given
      "^22.12 || >=24" it found no majors and called all six downstream files strays, 6
      failures on a correct manifest. It now asks semver whether a major is permitted. It
      also asserted the Dockerfile must be pinned to a patch, which encoded the old policy;
      it now gates the actual incompatibility - a floating major tag plus a patch floor
      inside that major. NODE_FLOOR_REF lets it measure a prepared branch; it defaults to
      the published ref so CI keeps measuring what operators would get.

      REFRAMED after the maintainer challenged the premise, and the reframing moved the
      defect from the image to the FLOOR. Measured with runtime-policy.js stubbed to a no-op,
      so actual compatibility is visible instead of policy: cut 4's unit suite is 310 passing
      / 0 failing on 20.20.0, 22.12.0, 22.22.0, 22.23.2, 24.15.0 and 24.20.0 - IDENTICAL on
      every version the floor rejects - and cut 1's Playwright suite is 21/0 on Node 20.20.0.
      The only real break is 18.20.8, and it is not Nightscout's code: all 15 failures are
      ERR_REQUIRE_ESM from sanitize-html requiring the ESM-only htmlparser2. require(esm) is
      unflagged in 22.12 and backported to 20.19, which is exactly where the results flip.
      So the dependency-derived floor is ^20.19 || ^22.12 || >=24.

      THE FLOOR IS SELF-IMPOSED AND ITS RATIONALE SAYS SO. docs/runtime-upgrade.md, added by
      the same commit a95c2ce5 (Andy Low, 2026-09-05), states "These minimum patches reflect
      the supported release baseline at the time of this change" - latest LTS patch at time of
      writing. 22.23.2 was 8 days old and 24.20.0 was 10 days old that day. The same document
      says the image should track "the official major tag", which a patch-level floor makes
      impossible. The floor and the documented image strategy are mutually incompatible.

      SO FIXING THE DOCKERFILE TAG ALONE WOULD HIDE THIS, not resolve it. Under a justified
      floor node:22-alpine at v22.22.0 passes 310/310. The required change is the range;
      the tag is downstream of it. Decision is the maintainer's - the position on record is
      that Node compatibility has historically been good and over-restricting has harmed this
      project, and nothing measured here contradicts that.

      BF-58 RE-GRADED low -> high, and the entry's own caveat is why it was wrong. It read
      "not reproducible against a current image, which satisfies the floor" and "No image
      was built". An image was built: `node:22-alpine` resolves to v22.22.0, which violates
      ^22.23.2, and runtime-policy.js refused it INSIDE THAT IMAGE with exit 1. So a
      container built today from cut 1's own Dockerfile does not boot, and the same holds for
      all five cuts - every one pins node:22-alpine and every one enforces
      ^22.23.2 || ^24.20.0. origin/dev is unaffected at >=20.x.

      WHY IT IS WORSE THAN A BROKEN BUILD: pushing to dev or master fires main.yml's
      docker-build and publishes to Docker Hub, so merging any cut PUBLISHES the non-booting
      image rather than failing CI. It is the whole containerised install path on the first
      modernization release, and it is one line in a Dockerfile.

      FOUR CANDIDATE TAGS, all measured the same day: node:22.23.2-alpine -> v22.23.2,
      node:24.20.0-alpine -> v24.20.0, node:24-alpine -> v24.21.0, node:lts-alpine ->
      v24.21.0. All four satisfy the floor today. NO FIX IS CLAIMED - choosing between an
      exact pin and a floating major is the same trade this item is about, one level up, and
      it is the maintainer's.

      THE BOUNDARY ITSELF IS EXACT AND CORRECT, which is worth stating because it is the
      part that works: across six versions via `n exec`, 20.20.0 / 22.12.0 / 22.22.0 /
      24.15.0 are refused and 22.23.2 / 24.20.0 boot, confirmed by running
      lib/server/server.js - the `npm start` entry - on each rather than only the module.

      WORTH KNOWING FOR ANY FUTURE RUN: `n` is installed (N_PREFIX=/home/bewest/n). Use
      `n exec <version> <cmd>`, NOT `n install`, which switches the machine default - it did,
      and had to be put back while another session was live.
      BATCHED because both are one question - is the floor the software enforces
      the floor anything actually runs? - and because fixing one without the
      other leaves the question open. RT-1 carries BF-58 as a no-gate already;
      this item is the work, that is the measurement.

