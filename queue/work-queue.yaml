  - id: BFQ-67
    title: BF-67 - an alarm threshold is quietly changed and only the server log says so
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/dev@a8888f0d
    worktree: externals/cgm-remote-monitor-official
    state: gate-not-met
    ships_to_operators_today: true
    blast_radius: >
      lib/settings.js verifyThresholds(), four branches. Unconditional at
      settings load on every deployment.
    review: >
      maintainer, and it is a DECISION with a safety dimension before it is
      code. Refusing a contradictory threshold set, correcting it and
      announcing it, and unit-checking the input are three different products.
    operator_visible: >
      Nightscout checks that your four glucose thresholds are in a sensible
      order. If they are not, it does not tell you and ask - it changes one of
      them by one unit and carries on, and the only record is a line in the
      server log, which on many hosting setups you will never see. The case this
      actually reaches is a units mix-up. If you think in mmol/L and set your
      high alarm to 14, Nightscout is reading mg/dL unless you have told it
      otherwise, 14 is below the target range, and it is stored as 181 mg/dL.
      You believe you have set a high alarm and you have set a different one.
      The same happens if you ask for a low alarm at 90 while the target range
      still starts at 80 - it is stored as 79. If you have set thresholds and
      the alarms do not behave as you expect, check what Nightscout actually
      stored, and please discuss your alarm settings with your care team. This
      is not medical advice.
    semver: minor
    semver_reason: >
      Every option changes what a deployment with contradictory thresholds does
      at boot - refuse, announce, or convert. Alarm thresholds are what alarms
      fire on, so this cannot arrive as a silent patch under any of the three.
