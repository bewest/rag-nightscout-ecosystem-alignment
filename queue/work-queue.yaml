  - id: BFQ-41
    title: BF-41 - a reading dated ahead of the clock silences the stale-data alarm
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/dev@a8888f0d
    worktree: externals/cgm-remote-monitor-official
    state: gate-not-met
    ships_to_operators_today: true
    blast_radius: >
      lib/plugins/timeago.js - the :26 early return in checkNotifications and
      isStale at :97. The browser alarm decision at lib/client/index.js:918-919
      reads the same status.
    review: >
      maintainer, and it needs a DECISION before it needs code. The register
      deliberately prescribes no fix: a small forward skew is normal and a large
      one is not, and "clamp the timestamp" and "a reading ahead of the clock is
      itself an alarm condition" are different products.
    operator_visible: >
      Nightscout can warn you when no new glucose reading has arrived for a
      while - the "minutes ago" warning, which is switched on by default in the
      browser at 15 and 30 minutes. If a reading arrives stamped with a time in
      the FUTURE, that warning stops working, and it stays off. A future
      timestamp usually comes from a clock or timezone problem on the device or
      uploader sending the data - which is the same kind of fault most likely to
      have stopped your readings in the first place. So the warning can go quiet
      exactly when you need it. What you would see instead is the "minutes ago"
      pill reading "future", or stuck at "1m". If you rely on that warning to
      tell you your data has stopped, please make sure you have another way to
      notice, and talk to your care team about what you rely on Nightscout for.
      This is not medical advice.
    semver: minor
    semver_reason: >
      Whichever way the decision goes, it changes when an alarm that is on by
      default fires. That is a behaviour change on a safety-adjacent surface and
      it cannot arrive as a silent patch.
    register: [BF-41]
    gates:
      - run: node tools/queue/gates/timeago-future-reading.js
        kind: static
        describe: >
          Executes the SHIPPING timeago plugin. FAILS today - a reading 5 and
          120 minutes ahead of the server clock both return checkStatus
          'current', so neither alarm path fires. Three controls come out the
          other way through the same harness (2 min = current, 20 min = warn,
          40 min = urgent), and the gate was proven to go green against an
          isolated copy carrying a future guard. This gate is also what upgrades
          BF-41's provenance from read-derived to REPRODUCED.
      - no-gate: >
          Nothing here exercises the PUSH path end to end. checkNotifications
          returns early at :26 for the same reason, but it is opt-in
          (sbx.extendedSettings.enableAlerts) and driving it needs a booted
          notification stack. The claim "the stale-data alarm is on by default
          and this turns it off" is true of the BROWSER alarm and false of the
          push alarm; the gate measures the one that is on by default.
    blocks_on: []
    evidence:
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      BF-44 is a concrete, shipping way to produce a future-dated reading, which
      is why BFQ-MINIMED carries the same severity argument from the other end.

  - id: BFQ-CONNECTOR
    title: BF-42, BF-43 - master pins the leaking connector, with a violated axios override
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/master
