    operator_visible: ""
    semver: n/a
    semver_reason: research and decision, no shipped surface
    register: []
    gates:
      - run: test -f docs/60-research/tenancy/auth-plane-ory-vs-inhouse-2026-09-16.md
        kind: static
        describe: >
