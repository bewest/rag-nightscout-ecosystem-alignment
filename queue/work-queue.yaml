    operator_visible: >
      The connector version that today's release installs writes your CGM
      service's username and password, its session tokens, and your glucose
      readings into Nightscout's log. It does this every time Nightscout starts,
      for every data source, before it contacts anything, and there is no
      setting that turns it off. Anyone who can read your logs - which on many
      hosting platforms is more people than you might expect - can read those
      credentials. If you have been running this, treat the password for your
      CGM account as exposed and change it, and change it anywhere else you have
      used it. This is a fix to which version is installed; it does not change
      how your data is collected.
    semver: patch
    semver_reason: >
      A dependency pin moves to a newer patch of the same package. No declared
      surface of cgm-remote-monitor moves. It nonetheless needs a security note,
      which is a different obligation from a version number.
