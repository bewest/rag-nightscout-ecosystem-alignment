      regress a fix that landed a week earlier to gain nothing - it executes
      nothing and reads nothing outside the document. $type is now ALLOWED and
      is the one departure from the storage seam's set; the cost is priced,
      not discovered: when the seam lands its AST needs a $type node or v1
      narrows by one operator then. $not and $text stay refused - both were
      FIXTURES in #8737's tests rather than subjects, and their assertions are
      rewritten, not deleted.
