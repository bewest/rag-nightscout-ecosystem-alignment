  - id: P0-F
    title: "fix/connect-timer-jitter - PR #68, BF-34 backoff precedence and start jitter"
    parcel: phase0
    repo: nightscout-connect
    branch: fix/connect-timer-jitter
    base: b77e5bb
    worktree: externals/work/nc-jitter
    state: in-flight-upstream
    blast_radius: lib/backoff.js, lib/machines/cycle.js. 19 new tests, 135
      pass / 0 fail, every part reverted in turn and caught.
