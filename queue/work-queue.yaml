      description.
    review: >
      maintainer DONE 2026-09-16; SECURITY still owes D17 row 2 a look, and that
      row is the one deliberately left provisional. Under the one-deployment
      shape the authentication plane is cohort-wide by construction, so tenant
      isolation rests entirely on the authorization layer and RLS - which is now
