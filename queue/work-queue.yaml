  - id: P0-TAG
    title: nightscout-connect release/v0.0.14 and tag - prepared, needs a human push
    parcel: phase0
    repo: nightscout-connect
    branch: release/v0.0.14
    base: v0.0.13@b394411
    worktree: externals/nightscout-connect
    state: needs-decision
    pr: []
    blast_radius: >
      RE-GRADED ready-to-push -> needs-decision 2026-09-21, AND THE GATES DID NOT
      CATCH IT. All five still pass. What changed is outside every question they
      ask: upstream `dev` has independently declared itself 0.0.14.

      MEASURED. official/dev moved 6dfc4f0 -> fe51c6d today and carries e231600
      "Bump version to 0.0.14" (Andy Low), so `git show official/dev:package.json`
      and `git show release/v0.0.14:package.json` BOTH say 0.0.14 for two different
      trees. release/v0.0.14 is 11 ahead of dev and 13 behind it; the 13 are the
      Glooko work merged as PR #71, the CI restore as #72, and the main->dev merge
      #69. A trial merge of dev into release/v0.0.14 CONFLICTS in six files:
      .github/workflows/test.yml (added in both), README.md, index.js,
      lib/machines/cycle.js, lib/outputs/internal.js, lib/sources/glooko/convert.js
      and lib/sources/glooko/index.js.

      SO PUSHING THE PREPARED TAG WOULD MINT A v0.0.14 THAT IS NOT DEV'S 0.0.14,
      and the tarball P0-PIN pins would omit the Glooko fixes that upstream believes
      are in this version. That is not a mechanical reconciliation and it is not the
      programme's call to make alone, which is what moves this out of ready-to-push.
      Three shapes, none obviously right: reconcile release/v0.0.14 onto dev and cut
      the tag from there; abandon the prepared branch and let upstream tag dev; or
      cut ours as 0.0.15 and leave 0.0.14 to dev.

      RULE 0 IS INTACT - nothing was pushed, and the "tag is not on origin" gate
      below still passes. The remote's newest tag is still v0.0.13.

      PRIOR MEASUREMENT: 11 commits, 29 files, +1362/-312, of which 887 lines are
      new test files. b394411 FAST-FORWARDS to 649a7de. Both still true.
    review: maintainer - pushing the tag is the deliberate human act; the
      connector repository has no release workflow, so the tag publishes nothing
      by itself
    operator_visible: >
      A new version of the CGM connector. See P0-F for what changes in behaviour.
    semver: minor
    semver_reason: >
      see P0-F. GT4 argues the version should be 0.1.0; the tag as cut says
      0.0.14. UNRESOLVED and deliberately left visible.
    register: [BF-08, BF-34]
    gates:
      - run: git -C externals/nightscout-connect merge-base --is-ancestor v0.0.13 release/v0.0.14
        kind: static
        describe: v0.0.13 fast-forwards to the release - no divergence to reconcile
      - run: test "$(git -C externals/nightscout-connect cat-file -t v0.0.14)" = tag
        kind: static
        describe: v0.0.14 is an ANNOTATED tag, not a lightweight one
      - run: test "$(git -C externals/nightscout-connect rev-parse v0.0.14^{commit})" = "$(git -C externals/nightscout-connect rev-parse release/v0.0.14)"
        kind: static
        describe: the tag points at the release branch tip
      - run: test "$(git -C externals/nightscout-connect show release/v0.0.14:package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 0.0.14
        kind: static
        describe: package.json version matches the tag
      - run: git -C externals/nightscout-connect ls-remote --tags origin v0.0.14 | grep -q . && exit 1 || exit 0
        kind: network
        describe: >
          RULE 0. This gate PASSES only while the tag is NOT on origin. It is the
          machine-checkable form of "nothing has been pushed". Read-only.
      - run: git -C externals/nightscout-connect merge-base --is-ancestor official/dev release/v0.0.14
        kind: static
        describe: >
          ADDED 2026-09-21, AND IT IS RED, which is the point - five green gates
          described a release that had been overtaken and none of them could say so.
          The release branch must contain everything on upstream dev, or the tag
          names a tree that is missing work upstream already considers released.
          Red today by 13 commits. This is the gate that should have existed before
          the divergence, not after it.
      - no-gate: >
          Whether all seven connector commits are the RIGHT content for a release
          is a release-content decision, not a mechanical bump, and it is the
          maintainer's. Nothing can gate it.
    blocks_on: [P0-F]
    evidence:
      - docs/30-design/remedial/phase0-pr-sequencing-2026-09-15.md
    notes: >
      v0.0.14 is the FIRST ref carrying all seven connector commits - both the
      debug-logging narrowing that dev's pin has and the three log-redaction
      fixes that cut 4's pin has. GT4 found the two mitigations split across the
      two release trains. STILL TRUE, and it is why abandoning the branch outright
      is not obviously the right shape either: dev at fe51c6d does NOT carry
      c1cce2a, the backoff-and-jitter commit, because PR #68 is still open. Whatever
      is decided has to keep all seven.

      WHAT THIS COST, written down because the lesson is cheaper than the incident:
      this item sat at ready-to-push for five days with a complete set of passing
      gates, and every one of them measured the prepared artefact against itself -
      tag type, tag target, version string, fast-forward from the previous tag. None
      measured it against the world it was going to be pushed into. The gate added
      above is the missing question and it was one line.

