      is landed first. OPENED 2026-09-16 as nightscout-connect PR #68, base dev.
      One approval there covers four PRs' worth of change; see notes.
    operator_visible: >
      When a CGM vendor's service is refusing requests, Nightscout's connector
      used to retry roughly 586 times faster than it was configured to, and every
      account retried at the same instant. It now waits the interval it was told
      to wait and spreads the retries out. COUNTER-INTUITIVE: after this fix a
      vendor outage will look like it recovers MORE SLOWLY, because the connector
      has stopped retrying in a burst that could not have worked. Your data is
      not arriving any later than it would have; the burst was never getting
      through. Also, on restart the connector no longer reaches the vendor all at
      once - both jitter windows default to 0, so nothing changes for anyone who
      does not set them.
    semver: minor
    semver_reason: >
      GT4 argues for 0.1.0 rather than 0.0.14 and the argument is sound - option
      precedence reversed, a changed default (use_random_slot:false -> jitter:'equal'),
      a new throw on an unknown jitter mode, and duration_for became
      non-deterministic. Each is breaking for a caller. It costs nothing because
      ^0.0.13 matches only 0.0.13 and cgm-remote-monitor pins by tarball anyway.
      RECORDED AS A DISAGREEMENT, not resolved - the tag as cut says 0.0.14.
    register: [BF-08, BF-34]
    gates:
      - run: npm test
        cwd: externals/work/nc-jitter
        kind: unit
        describe: 135 passing / 0 failing; the connector suite needs no database
      - run: node -e "const b=require('./lib/backoff.js'); try { b({jitter:'wild'}); process.exit(1); } catch(e) { process.exit(/unknown jitter mode/.test(e.message)?0:1); }"
        cwd: externals/work/nc-jitter
        kind: unit
        describe: >
          the new throw on an unknown jitter mode is the observable half of the
          precedence fix - if options were still being discarded, the bad mode
          would never be read and this would not throw
      - no-gate: >
          Vendor rate limits are unmeasured (EXP-MT-051) and need real
          credentials, which rule 0 forbids here. T0.4 shipped
          CONNECT_START_JITTER_MS so the pool CAN be spread - but the window to
          set it is exactly the number that is unmeasured.
