  - id: ADV-RETRO
    title: "GHSA-gjhc - loadRetro serves devicestatus to any socket (BF-79)"
    parcel: register-open
    repo: cgm-remote-monitor
    branch: bf/ws-loadretro-auth
    base: origin/dev@59430336
    worktree: externals/work/crm-adv-retro
    state: merged-upstream
    pr: [8744]
    ships_to_operators_today: true
    register: [BF-79]
    blast_radius: >
      1 commit at 9765e8cd. lib/server/websocket.js (+36/-4) and one new test
      file, tests/websocket.loadretro-authorization.test.js (210 lines, 4
      cases). No other file. The change adds resolveReadAccess(), which calls
      the verifyAuthorization() already in that file with an empty message, so
      an anonymous socket resolves through the same AUTH_DEFAULT_ROLES shiros
      the REST surface uses. Verified NOT to interact with the failed-login
      throttle - an empty auth message takes authorization.resolve()'s
      !authAttempted branch and never records a failure.
    review: >
      SECURITY. The advisory is a GitHub draft with no CVSS vector and a bare
      `high`, and three of its statements need correcting before publication.
      (1) AFFECTED RANGE IS WRONG. It says >0.8.1; loadRetro is absent from
      tags 0.8.1 through 0.8.4 and first appears in 0.9.0 - which is also the
      first tag carrying DataReceivers and authDefaultRoles, so the handler and
      the authorization it skips shipped together. Should be >=0.9.0.
      (2) "This does not require any specific configuration on the system" is
      true of reachability and false as an impact claim. On the shipped
      readable default the payload is a STRICT SUBSET of what
      GET /api/v1/devicestatus.json already serves anonymously - measured field
      by field: 0 socket record _ids absent from the REST answer, 0 JSON field
      paths present only on the socket, and REST returned 1730 records to the
      socket's 574. Marginal disclosure on a default install is zero.
      (3) It understates the hardened case. Under AUTH_DEFAULT_ROLES=denied,
      with every REST read answering 401 in the same run, the handler returns
      576 records - 28.8x MORE than an authorized reader gets on connect, because
      authorize() trims to 10 per device-and-type. No setting stops it: denied,
      status-only, AUTHENTICATION_PROMPT_ON_LOAD and TREATMENTS_AUTH=off were
      each measured. DEVICESTATUS_DAYS=2, the only knob touching the path,
      DOUBLES it to 1150.
      Recommended: score CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N = 7.5 and
      say it scores the hardened configuration; the default arm is 0.0 and
      publishing a high score against it would alarm the majority of
      self-hosters about their own public output.
      PATCHED-VERSION FIELD: LEAVE EMPTY until a tagged release carries this.
      STILL TRUE AFTER THE MERGE, which is exactly why `merged-upstream` is not
      called done: origin/master is 308 commits behind dev at 92d08342, the
      shipping tag is 15.0.8, and no operator is carrying this fix.
    operator_visible: >
      Nightscout's live connection had one message that answered anybody. If you
      run the default setup, where your site is already readable by anyone with
      the address, this changes nothing you can see and leaked nothing you were
      not already publishing - it returned less than your own web address does.
      If you followed the documentation and turned off unauthorised access, it
      did matter: about a day of pump and loop information - insulin on board,
      reservoir and battery levels, whether the pump was delivering or stopped,
      your pump's serial number and your phone's name - could still be read by
      anyone who knew your address, even though every other way in was refused.
      After this change that message follows the same rule as everything else.
      Nightscout is not a medical device and this is not medical advice.
    semver: patch
    semver_reason: >
      No route removed, no input added, no documented contract changed. The
      only behaviour that disappears is behaviour nobody was entitled to: on a
      `readable` instance an anonymous client still receives retroUpdate, which
      was confirmed as a live positive control on the fixed build.
    gates:
      - run: git -C externals/cgm-remote-monitor-official merge-base --is-ancestor bf/ws-loadretro-auth origin/dev
        kind: static
        describe: >
          The branch's work is IN origin/dev. REPLACED 2026-09-21, and the
          direction of the ancestry test is the whole change. Until the merge the
          question was "is this branch still on dev's tip", which goes red when dev
          moves and correctly says rebase-before-review. After the merge that gate
          was red for the wrong reason - dev had moved BECAUSE this branch landed
          in it - and a gate that cannot tell those two apart is worse than none.
          This is the form P0-K has carried since it merged.
      - run: test -f externals/work/crm-adv-retro/tests/websocket.loadretro-authorization.test.js
        kind: static
        describe: >
          The regression test exists in the worktree. Deliberately a file-
          existence check rather than a suite run - see the unit gate below.
      - no-gate: >
          NO GATE RUNS THE SUITE HERE. `npm test` on this tree needs a my.test.env
          and a mongod of its own, and the two sessions that ran it on 2026-09-21
          both had to raise the container's nofile limit first (the default 1024
          exhausts mongod's descriptors part-way through, which is BF-10's failure
          mode arriving in the lab). Measured by hand on a healthy mongod 7.0.43:
          2311 passing / 3 pending / 0 failing before, 2315 / 3 / 0 after, delta
          exactly the four new cases. Ablation - revert lib/server/websocket.js to
          origin/dev, keep the test - turns the two negative cases red printing the
          symptom itself, canaried devicestatus arriving at a socket the server had
          already resolved as unable to read, while the two positive cases stay
          green. Automating this needs a fixture that owns its own mongod.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/ghsa-gjhc-loadretro-2026-09-21.md
      - docs/60-research/remedial/advisory-auth-configuration-matrix-2026-09-21.md
      - docs/30-design/remedial/security-advisory-disposition-2026-09-21.md
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      REPRODUCED on v15.0.7, v15.0.8 and dev 59430336, both arms, mongod 7.0.43,
      with the isolating control in every run: the same unauthenticated socket
      that never emits loadRetro sees only the event `clients`. Six of the seven
      handlers on that namespace DO check - dbAdd, dbUpdate, dbUpdateUnset and
      dbRemove all answer "Not authorized" and write nothing, confirmed against
      the collection rather than the reply string. loadRetro is the single
      unguarded one, which is why it is cheap to fix and easy to have missed.
      The attacker never calls `authorize`: trying and failing disconnects the
      socket, so the gate is one to walk around rather than through.

      MERGED 2026-09-21 as PR #8744 into dev, merge commit a9acd313, from
      bf/ws-loadretro-auth at 9765e8cd - the exact tip this item was measured
      against, with no integration merge added on the way in. dev moved
      59430336 -> 74fc6619 carrying this and the two advisory PRs behind it.
      The reply to the reporter, including the two corrections to the advisory
      that are still ours to send, is
      docs/30-design/remedial/advisory-response-2026-09/advisories/ghsa-gjhc-comment.md
      and it is NOT yet posted.

  - id: ADV-ALARM
    title: "GHSA-8849 - /alarm broadcasts to the whole namespace (BF-75, BF-76)"
    parcel: register-open
    repo: cgm-remote-monitor
    branch: bf/alarm-socket-scope
    base: origin/dev@59430336
    worktree: externals/work/crm-adv-alarm
    state: merged-upstream
    pr: [8745]
    ships_to_operators_today: true
    register: [BF-75, BF-76, BF-80]
    blast_radius: >
      REBUILT 2026-09-21 on fix shape B after the maintainer decision; the old
      shape-A tip is preserved at refs/backup/alarm-shapeA = 842d81fb in that
      worktree and can be deleted once the rebuild is accepted. 2 commits at
      012f1623. fd80e6a2 is the broadcast fix as ONE coherent shape-B change
      plus a 49-case regression test; 012f1623 is the ack-authorization fix
      plus 2 cases. There is deliberately no A-then-B pair in the history.
      lib/api3/alarmSocket.js (+74/-19), lib/client/hashauth.js (+8), two new
      test files. The client change is the part to look at hardest: it re-runs
      subscribeForAlarms from hashauth.updateSocketAuth, because
      client.subscribeForAlarms had exactly ONE call site - the socket's connect
      handler - and nothing re-subscribed when a viewer authenticated in the
      page. Without it, load -> refused -> prompt -> enter secret would leave
      that socket in no room, silently receiving no alarms, for the one user who
      had just proved entitlement. The source was already asking this at
      alarmSocket.js:150: "TODO: how will perms get updated after authorizing?".
    review: >
      SECURITY. THE SHAPE DECISION IS TAKEN - Ben West, 2026-09-21, SHAPE B:
      admit at connection time when the deployment's anonymous default role
      already permits reading, re-evaluate on subscribe, and gate delivery on
      api:*:read. He separately judged the shipped web client to be the only
      consumer of /alarm - the fact that would have argued for the strict
      shape - and chose B anyway, as insurance against that judgement being
      wrong. The paragraph below is kept as the record of what was weighed.
      THERE IS A SECOND PR IN PLAY: the advisory's reporter opened one in
      GitHub's private fork (nightscout/cgm-remote-monitor-ghsa-8849-qjp5-vrrj
      PR #1, based on v15.0.8) on 2026-09-18. Measured, it does NOT close the
      bypass: it gates on AUTHENTICATION_PROMPT_ON_LOAD rather than
      AUTH_DEFAULT_ROLES, so on a hardened instance with the prompt flag at its
      default a never-subscribing socket still receives everything; and even
      where it engages it never consults api:*:read, so a token granting only
      api:treatments:create hears every alarm while getting 401 on every REST
      read in the same run. Any reviewer of this branch should read
      ghsa-8849-reporter-pr-evaluation-2026-09-21.md and decide how the two
      PRs are reconciled and how the reporter is credited.
      THE SUPERSEDED SHAPE, FOR THE RECORD: shape A required
      SUBSCRIBED AND AUTHORIZED. On the shipped `readable` default, receiving
      without subscribing is behaviour third-party clients have observed for five
      releases: the /alarm protocol is in no swagger file and nothing under
      docs/, so implementers had only the observed behaviour to go on. Measured,
      the marginal CONTENT disclosure on that default is zero - every field in
      all five payloads is already in treatments.json, entries.json or
      status.json, and notifyhash/key are sha1 over already-readable fields. So
      the strict version breaks non-subscribing clients for no confidentiality
      gain on the majority configuration. A one-line variant - join at CONNECTION
      time when the anonymous default role already permits reading, re-evaluate on
      subscribe - closes the `denied` bypass identically and changes nothing on a
      default install. Too tight and a follower app silently stops delivering hypo
      alarms; too loose and the bypass stays open. THAT WAS THE DECISION, AND IT
      WENT TO B.
      Second thing the reviewer should be told: BF-76 is NOT part of the
      advisory. It was found while fixing BF-75 - the access-token branch of
      subscribe registered socket.on('ack') with no permission check, so any
      valid token of any role could silence every alarm on the instance, with a
      caller-supplied silenceTime that has no upper bound. Authorization is
      fixed; the unbounded silence is left open on purpose, because what a
      legitimately authorized client may ask for is a product decision.
      Third: no automated test drives hashauth against a live socket. A human
      must load a `denied` instance, authenticate at the prompt, force an alarm
      and confirm it arrives. That is the one path the 28 new cases do not cover.
    operator_visible: >
      Nightscout sends alarms and treatment notifications over a live
      connection. That connection was sending them to everyone attached to it,
      whether or not they had signed in. If you run the default setup your site
      already publishes this information to anyone with the address, so nothing
      new was exposed - what it added was that someone could watch it arrive in
      real time without ever making a request your logs would record. If you had
      turned off unauthorised access, it did matter: carb entries, insulin
      doses, loop activity, and your high and low alarms were still going out to
      anyone who connected. After this change, only viewers your site has
      authorised receive them. If you use a third-party follower app that shows
      Nightscout alarms and it stops showing them after this update, that is
      this change - please report it, because the connection it uses has never
      been documented. Nightscout is not a medical device and this is not
      medical advice; if you rely on these alarms, keep a second way of being
      alerted until you have confirmed yours still works.
    semver: minor
    semver_reason: >
      It removes reachable behaviour that undocumented third-party clients may
      depend on - receiving alarms without subscribing - so it is not a patch by
      the project's own reading, whichever variant of the fix is chosen. Not
      major: no route removed, no required input added, and the shipped web
      client is unaffected because it subscribes.
    gates:
      - run: git -C externals/cgm-remote-monitor-official merge-base --is-ancestor bf/alarm-socket-scope origin/dev
        kind: static
        describe: >
          The branch's work is IN origin/dev. REPLACED 2026-09-21 for the reason
          written out under ADV-RETRO: the pre-merge form of this gate asks
          whether the branch is still on dev's tip, and after the merge it goes
          red BECAUSE the branch landed. Same question, opposite direction.
      - run: test -f externals/work/crm-adv-alarm/tests/api3.alarm-socket.security.test.js -a -f externals/work/crm-adv-alarm/tests/api3.alarm-socket.ack.test.js
        kind: static
        describe: Both regression test files exist in the worktree.
      - no-gate: >
          NO GATE RUNS THE SUITE, for the same reason as ADV-RETRO: it needs a
          my.test.env and a dedicated mongod whose nofile limit has been raised.
          Measured by hand on mongod 7.0.43, SHAPE B: 2311 passing / 3 pending /
          0 failing before, 2362 / 3 / 0 after, delta exactly the 51 alarm cases.
          The 2311 is derived twice over and agrees: 2339-28 from the superseded
          shape-A run and 2362-51 from this one. Run against UNFIXED dev code the
          new tests go 29 passing / 22 failing, and the 29 that pass are the
          positive-delivery and REST-control assertions - which is what makes the
          22 attributable to the defect rather than to the harness.
          FIVE ablations, each breaking one thing, each red for its own reason:
          A1 reverts the five to(ROOM) emits -> 20 fail, symptom named on the
          never-subscribed socket, all 25 delivery assertions green; A2 forces the
          read check true -> 21; A3 forces entitlement true ONLY on the subscribe
          path -> exactly the 15 unauthorized-subscriber cases plus the ack report,
          never-subscribed rows green; A4 removes the connect-time admission, i.e.
          REVERTS TO SHAPE A -> exactly the five [SHAPE B] cases, which is the
          regression guard for the maintainer's decision; A5 removes the ack guard
          -> 2. A1 and A3 are the two independently load-bearing halves. A suite
          asserting only non-delivery would sail through a too-tight room, so the
          value is in the delivery rows.
          FIVE CASES CHANGED THEIR EXPECTATION FROM SHAPE A and only those five -
          a never-subscribed socket on a readable instance must now RECEIVE. They
          are tagged [SHAPE B] in their names so a reviewer sees them in the runner
          output, and A4 proves they are the ones that go red if anyone re-tightens
          the room. Two cases were DELETED: anonymous REST controls against
          /api/v3/entries, which were wrong - v3 demands a bearer token on every
          value of AUTH_DEFAULT_ROLES, so they measured nothing.
      - no-gate: >
          NO GATE COVERS THE CLIENT HALF. Nothing drives lib/client/hashauth.js
          against a live socket, and the client change is the part that could
          silently drop a real hypo alarm. Human verification required - see the
          review field.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/ghsa-8849-alarm-socket-2026-09-21.md
      - docs/60-research/remedial/advisory-auth-configuration-matrix-2026-09-21.md
      - docs/30-design/remedial/security-advisory-disposition-2026-09-21.md
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      REPRODUCED on v15.0.8 and dev 59430336, both arms, all FIVE event classes
      (notification, announcement, alarm, urgent_alarm, clear_alarm), each caused
      through the real server path - threshold crossings via POST /api/v1/entries
      into simplealarms, treatment writes into treatmentnotify. No ctx.bus.emit
      was used for any matrix cell. In every `denied` row the four v1 REST routes
      answered 401 in the same process at the same moment; that is the control
      that makes it a bypass rather than the documented default.
      Sharpest datum: under `denied` the server answers a subscribing anonymous
      socket {"success":true,...,"read":false,"ack":false} - it computes the
      correct authorization decision, sends it to the client, and delivers
      everything anyway. subscribe gates acknowledgement rights and nothing on
      the receive side.
      The advisory's authenticationPromptOnLoad claim is CONFIRMED exactly: the
      subscribe is refused, the socket is not disconnected, and it still receives
      all five. Range >=15.0.0 is correct; 89d7eb679 is first contained in tag
      15.0.0. Turning careportal off via ENABLE= removes notification and
      announcement by removing the feature, and alarm/urgent_alarm/clear_alarm
      still arrive - so that is not a mitigation either.
      BF-80 IS THE COST OF THIS FIX AND IS FILED AGAINST IT DELIBERATELY. Once
      delivery depends on a resolved entitlement it inherits the failed-login
      delay list: a socket from an address that recently failed an
      authentication sits outside the delivery room for the accumulated
      penalty, 5 s per failure, and the list is keyed on the remote address so
      a household behind one NAT address is one key. Measured on the fixed
      build with the alarm fired 2 s after connect: 0 failures -> received at
      2.0 s (clean control), 1 -> 4.9 s, 3 -> 10.0 s, 6 -> 15.0 s. A shape
      assertion, not a threshold. NO shape of this fix avoids it - the pre-fix
      code avoided it only by checking nothing - so it is not a reason to
      prefer a different shape. Deliberately NOT fixed here: narrowing a
      brute-force control needs its own change and its own review.

      MERGED 2026-09-21 as PR #8745 into dev, merge commit 2b22c0ce. Note the
      difference from ADV-RETRO: origin's bf/alarm-socket-scope is at a198e308,
      NOT at this item's measured tip 012f1623, because an integration merge of
      dev was added to the branch before it went in. Nothing was re-measured on
      a198e308. That is why the ancestry gate above tests containment in dev
      rather than tip equality - tip equality would have been red here and green
      on ADV-RETRO for a difference that is upstream's merge habit, not ours.

      STILL NOT SHIPPED. dev is 308 ahead of master and the tag operators run is
      15.0.8, so BF-75 and BF-76 remain open against every live instance, and
      BF-80 - the failed-login delay this fix inherits - is not yet a cost anyone
      is paying either. The reply to the GHSA-8849 reporter at
      docs/30-design/remedial/advisory-response-2026-09/pull-requests/reply-to-reporter-ghsa-8849.md
      is drafted and NOT sent.

  - id: ADV-XSS-META
    title: "GHSA-5mrq + GHSA-mjp4 - both closed in 15.0.8; metadata is wrong (BF-73, BF-74)"
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/master@92d08342
    worktree: externals/work/crm-adv-xss
    state: needs-decision
    ships_to_operators_today: true
    register: [BF-73, BF-74]
    blast_radius: >
      NO CODE CHANGE PROPOSED for the two advisories - the fixes shipped in
      15.0.8 (72a2257e, a6835ca3, da548d2a, all contained in tag v15.0.8). What
      is outstanding is advisory metadata plus two decisions, BF-73 and BF-74,
      that were found beside them and that neither advisory covers.
    review: >
      MAINTAINER, plus whoever owns the GitHub advisory drafts. Four metadata
      corrections, all derived rather than estimated:
      GHSA-mjp4-84fw-gj4v - affected <= 15.0.7 confirmed; set patched_versions
      to 15.0.8, which currently sits BLANK against a closed vulnerable range,
      saying "fixed in something" and "fixed in nothing" at once. Severity high
      unchanged. Add CVSS 4.0 AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N
      = 8.4 (its own proposed vector with UI:P corrected to UI:A) and CVSS 3.1
      AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N = 8.7.
      GHSA-5mrq-gpqw-q5v5 - `critical` OVERSTATES IT; recommend `high` at the
      same 8.4. The arithmetic matters and the intuitive answer is wrong:
      correcting UI:P to UI:A moves 9.3 to 9.2, still Critical. What produces
      Critical is SC:H/SI:H, and that is a double count - the stolen API
      secret's entire blast radius IS the Nightscout instance, which is the
      vulnerable system and is already counted by VC:H/VI:H. There is no
      subsequent system. The escalation itself must NOT be softened:
      lib/client/hashauth.js stores sha1(API_SECRET) in localStorage and that
      hash IS the value the api-secret header accepts, so same-origin script
      gets admin. That belongs in VC:H/VI:H, where it now is.
      BOTH should state that no stored-data remediation is needed after
      upgrading from 15.0.7 - see notes. The current state, one `critical` with
      SC:H/SI:H and one `high` with SC:N/SI:N for the identical credential
      theft, is the thing most needing correction.
      Then two decisions that are contract questions, not bugs. BF-73: express's
      errorhandler is mounted with its NODE_ENV === 'development' guard
      COMMENTED OUT, identically at v15.0.7, v15.0.8 and dev, and git log -L
      carries those four lines back to 7947e300 in 2019 - so it was deliberate,
      and restoring the guard is a decision about what a production error page
      owes an operator debugging their own site. BF-74: API v3 `settings` writes
      skip the purifier every other v3 collection gets; purifying
      UI-configuration values could corrupt them, and no first-party sink
      consumes the field, so the right answer may be a comment rather than a fix.
    operator_visible: >
      Two reported ways of storing malicious content in your Nightscout were
      fixed in release 15.0.8. If you are on 15.0.8 or later you need do
      nothing, including nothing about entries that were already saved: a
      payload stored by an older version does not run on a patched server. This
      was checked by putting one straight into the database and then opening the
      pages that display it. If you are still on 15.0.7 or earlier, upgrading is
      the fix. Nightscout is not a medical device and this is not medical advice.
    semver: n/a
    semver_reason: No code change is proposed by this item; the fixes already shipped.
    gates:
      - run: git -C externals/work/crm-adv-shipping tag --contains a6835ca3 | grep -qx v15.0.8
        kind: static
        describe: >
          The purification commit really is in the 15.0.8 tag. This is the claim
          the whole item rests on - that operators on the shipping release are
          already fixed - so it is the one thing gated rather than asserted.
      - run: git -C externals/work/crm-adv-shipping grep -q "purifyObject" v15.0.8 -- lib/server/websocket.js
        kind: static
        describe: The socket write path calls the purifier at v15.0.8; it does not at v15.0.7.
      - no-gate: >
          THE RENDER-SIDE AND STORED-PAYLOAD RESULTS ARE NOT GATED and cannot
          cheaply be. They needed a real headless Chromium against /report and a
          jsdom+d3 harness loading each ref's own renderer.js, with the payload
          inserted straight into mongo to bypass every write path. Recorded in the
          evidence document with their v15.0.7 positive controls; re-running them
          is a half-day, not a gate.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/ghsa-xss-pair-verification-2026-09-21.md
      - docs/reports/security-hotfix-eval-2026/report-01-stored-xss.md
      - docs/30-design/remedial/security-advisory-disposition-2026-09-21.md
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      VERIFIED, NOT ASSUMED, and every "fixed" cell is paired with a positive
      v15.0.7 control from the same run - four write paths across three refs,
      end-to-end over real HTTP and socket, with the document read back out of
      mongo, and v3 driven with a real JWT on all three refs. The fix is BROADER
      than either advisory claims: PUT /api/v1/treatments/, POST /api/v1/food and
      POST /api/v1/activity also had no purification at 15.0.7 and now do.
      THE HEADLINE, and the one thing source-reading could not have answered: a
      payload a 15.0.7 server had ALREADY STORED does not fire on a patched
      server. At 15.0.7 the day-to-day report executed it in a real browser
      (document.title changed, three live img[onerror]); at 15.0.8 and dev it
      renders as visible text. That is true only because the output-escaping half
      of the fix (da548d2a) landed alongside the purification half - had only the
      purifier shipped, the answer would be the opposite. Both advisories should
      say so.
      Residual sinks: NONE. 32 `.html(` sites on dev classified; a mechanical scan
      for unescaped free-text interpolation found 25 hits across 10 files at
      v15.0.7 and ZERO at v15.0.8 and dev. The earlier internal report's sweep
      claim is understated - it names 4 files, the shipped sweep covers 10.
      Sanitizer bounds: a string over 64 KiB is NOT passed through unsanitized -
      it throws RangeError and the write is REFUSED on all four paths, fail-closed.
      The POSSIBLE_HTML_MARKUP pre-filter IS evadable, but none of the three
      evading forms executes at any sink on any ref, including v15.0.7 - which is
      the defence-in-depth argument the purifier's own header makes, now measured.
      BF-73 was filed BECAUSE the XSS fix created its trigger: the new RangeError
      escapes uncaught to the error page. Independently reproduced against v15.0.8
      by the coordinating session - the 500 body named six absolute paths and the
      deployment's directory layout.

  - id: ADV-CONFIG
    title: "The readable-by-world warning, the careportal role, and the two settings behind both (BF-77, BF-78, BF-81)"
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/master@92d08342
    worktree: externals/work/crm-advisory
    state: needs-decision
    pr: [8746]
    ships_to_operators_today: true
    register: [BF-77, BF-78, BF-81]
    blast_radius: >
      ONE OF THE THREE IS DONE AND THE ITEM STAYS `needs-decision` FOR THE OTHER
      TWO. BF-77 merged 2026-09-21 as PR #8746 - bf/readable-warning, measured here
      at 74731433, merged as 74fc6619, with an integration merge of dev (91ed8d95)
      added to the branch on the way in. It was the one-line-shaped half: rather than string equality
      at lib/server/bootevent.js:149 it adds a second notice wording for the
      readable+careportal configuration, wording the maintainer approved the same
      day. 2311 -> 2331 passing / 0 failing; the ablation goes red on exactly the
      three careportal cases with thirteen still passing, so the new cases are
      not vacuous.

      BF-78 IS UNTOUCHED BY THAT MERGE and is still the reason this item is not
      closed. Three possible shapes and none obviously right: give the careportal
      role the read permission its routes require; move the router-wide read gate
      at lib/api/treatments/index.js:26 below the create route at :146; or
      document that careportal only functions alongside `readable` and say so at
      boot when it does not. BF-81 is prose - README.md and the swagger documents
      - with no branch, and the wording is a maintainer's to write.
    review: >
      MAINTAINER - the two that remain are contract questions about the
      configuration surface, not bugs with an obvious patch. THE "DECIDE THEM
      TOGETHER" ARGUMENT WAS OVERTAKEN BY EVENTS on 2026-09-21: BF-77 was
      separated out and merged on its own, leaving BF-78 and BF-81 as the pair.
      That is worth stating rather than quietly editing, because the paragraph
      below is the argument for keeping them together and it still reads as
      though nothing has shipped. TREATMENTS_AUTH=off appends ' careportal' to
      authDefaultRoles; the boot warning compares that string for equality with
      'readable'; so the notice is suppressed in exactly the configuration that is
      both world-readable AND anonymously writable. Meanwhile careportal alone
      grants only api:treatments:create and is refused by the router's
      api:treatments:read gate before reaching the create route - so the ONLY
      configuration in which careportal does anything is the one whose warning
      BF-77 suppresses. An operator who wants anonymous careportal entry is
      steered, by the only route that works, into the configuration that stops
      warning them. Note BF-78 fails CLOSED - nothing is exposed - which is why it
      is low; the defect is silence, not access.
    operator_visible: >
      Two things about the settings that control who can see your Nightscout.
      First, if you set TREATMENTS_AUTH=off, the warning that normally tells you
      "your Nightscout is readable by anyone who knows the address" stops
      appearing - even though that setting also lets anyone add treatments. The
      site is not more exposed than you asked for, but you stop being told.
      Second, setting AUTH_DEFAULT_ROLES=careportal on its own does nothing at
      all: the documentation says any valid role name works, and this one is
      silently ignored, with no error anywhere. If you wanted "nobody can read my
      site, but my family can enter carbs without a token", that combination does
      not currently exist. Nightscout is not a medical device and this is not
      medical advice.
    semver: patch
    semver_reason: >
      BF-77 restores a notice that was intended; no interface changes. BF-78's
      semver depends on which of the three shapes is chosen - giving careportal
      a read permission would widen a documented role and is at least minor, so
      that half is deliberately left unscored until the decision is taken.
    gates:
      - run: git -C externals/work/crm-adv-shipping grep -q "authDefaultRoles == 'readable'" v15.0.8 -- lib/server/bootevent.js
        kind: static
        describe: >
          The exact-string compare is still present on the shipping release. Goes
          green->red when BF-77 is fixed, which is the point.
      - run: git -C externals/work/crm-adv-shipping grep -q "isPermitted('api:treatments:read')" v15.0.8 -- lib/api/treatments/index.js
        kind: static
        describe: The router-wide read gate BF-78 is about is still present on the shipping release.
      - no-gate: >
          THE BEHAVIOURAL HALF IS NOT GATED. Both findings were measured by booting
          the tree in three and four configurations respectively and reading
          GET /api/v2/adminnotifies and the result of an anonymous treatment POST.
          Automating that needs a fixture that boots the app per configuration,
          which does not exist in this repo. The measurements and their controls
          are in the evidence document; the two source gates above are the cheap
          proxy and they measure presence, not behaviour.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/advisory-auth-configuration-matrix-2026-09-21.md
      - docs/30-design/remedial/security-advisory-disposition-2026-09-21.md
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      FOUND WHILE BUILDING THE CONTROL, not while looking for them - the
      configuration matrix exists to answer "were the right flags set when the
      five advisories were evaluated", and these two fell out of enumerating what
      AUTH_DEFAULT_ROLES actually gates.
      REPRODUCED on v15.0.8 AND dev 59430336, mongod 7.0, with both controls in
      the same run. BF-77: default -> notifyCount 1, title "Nightscout readable by
      world" (POSITIVE CONTROL, the notice does fire when it should);
      TREATMENTS_AUTH=off -> notifyCount 0 while anonymous read is 200 and
      anonymous POST /api/v1/treatments is 200 with the record stored;
      AUTH_DEFAULT_ROLES=denied -> notifyCount 0, correctly (NEGATIVE CONTROL, so
      absence in the middle row is attributable to the string compare and not to
      the notice being broken generally).
      BF-78, anonymous POST /api/v1/treatments: `readable careportal` 200 stored,
      `careportal` 401, `denied careportal` 401, `denied` 401.
      BF-77 IS FIXED AND OPEN AS A PR: bf/readable-warning 74731433, PR #8746
      against dev, 2311 -> 2331 passing / 0 failing, ablation red on exactly the
      three careportal cases with thirteen still passing. It adds a second
      notice wording for the readable+careportal configuration; the maintainer
      approved that wording on 2026-09-21. BF-78 is untouched by it and still
      needs its decision between three shapes.
      BF-81 WAS FILED ON THE MAINTAINER'S INSTRUCTION, 2026-09-21, as the shared
      root of the other two: the configuration surface carries two
      authorization-shaped settings with adjacent names - AUTH_DEFAULT_ROLES,
      which is the boundary, and AUTHENTICATION_PROMPT_ON_LOAD, which is a
      client prompt that grants nothing - and nothing documents the difference.
      Its strongest evidence is that the external reviewer who reported
      GHSA-8849 keyed their own security patch to the wrong one. It is prose in
      README.md and the swagger documents, there is no branch, and the wording
      is a maintainer's to write.
