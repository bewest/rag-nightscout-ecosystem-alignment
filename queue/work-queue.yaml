          say whether the recommendation is right, only that it was written.
      - run: grep -q '\*\*D16\*\*' docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md
          && grep -q '\*\*D17\*\*' docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md
        kind: static
        describe: >
          the decision reached the DECISIONS TABLE, not just a research document.
          T30-RESEARCH's gate failed for three weeks because it named a file that
          never existed, so a written deliverable read as not-started; this gate
          is deliberately pointed at the place a later reader will look first.
          It cannot tell whether the rows say the right thing.
      - no-gate: >
          EVERY ORY CLAIM IN IT IS READ, NOT RUN. No Kratos and no Hydra instance
          was started. This programme has measured five register entries whose
          read-derived claims did not survive contact with running code, and twice
          a prescribed fix measured as a regression. The discharge is specific:
          stand up Kratos 1.x and Hydra 2.x, register two tenants against one
          pool, and confirm a session for tenant A cannot be exchanged for a
          Nightscout token on tenant B.
      - no-gate: >
          nightscout-roles-gateway was READ, not executed. Its dependencies are
          2022-era - @ory/kratos-client 0.9.0-alpha.3 and @ory/hydra-client 1.11.8
          - and V0alpha2Api, which lib/privy/index.js:20 constructs, no longer
          exists under that name in Kratos 1.x. Whether its decision pipeline
          still works is unknown, and it is the first thing a port would measure.
      - no-gate: >
          Nothing measures what a cohort-wide identity pool costs in isolation
          risk. Section 3.1 names the hazard - one identity, one session, one
          login spanning every tenant - and bounds nothing. A gate would need a
          cross-tenant session test, which needs the running stack the first
          no-gate asks for.
      - no-gate: >
          No cost model. Ory Network pricing is not analysed and does not need to
          be under the one-deployment shape, which needs no Enterprise License -
          but the compliance question of any third-party processor adjacent to
          health data is not analysed either, and that one does not go away by
