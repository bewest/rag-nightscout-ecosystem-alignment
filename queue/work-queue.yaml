          regression. A gate whose failure mode is breaking other items' gates
          does not belong in a runner other sessions share. Evidence recorded in
          the register's BF-10 detail instead.

          TWO THINGS THE REPRODUCTION ADDS. It is not specific to the 4.4/5.0
          images the shipped compose files pin - 7.0.43 does it too. And it does
          not need tenant scale: EXP-MT-040b reached it at 50 tenant databases,
          one ordinary test run is enough.
