      - run: TEST=authdelay npm run test-single
        cwd: externals/work/crm-bf-throttle
        kind: integration
        describe: >
          THE BRANCH'S OWN TEST, 11 passing, measured 2026-09-16. Needs MongoDB -
          this worktree names 27031. It is in NEITHER local brace list, so a green
