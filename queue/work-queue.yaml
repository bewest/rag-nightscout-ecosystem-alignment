    blocks_on: []
    evidence:
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      THE SPLIT, AND WHY IT WAS NOT TIDINESS. bf/auth carried BF-17 and BF-30
      together. Asked whether the delaylist was already handled in the
      modernization work, the measurement said something more useful than yes or
      no: Andy does not touch lib/authorization/delaylist.js at all - it is
