  - id: BFQ-MINIMED
    title: BF-44, BF-45 - the two MiniMed ingestion divergences
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/dev@a8888f0d
    worktree: externals/cgm-remote-monitor-official
    state: not-started
    ships_to_operators_today: true
    blast_radius: >
      BF-44 - nightscout-connect's CareLink source reassign_zone, against the
      retired minimed-connect-to-nightscout transform.js:41-85. BF-45 -
      setupMMConnect in lib/server/bootevent.js, which references Connect
      nowhere while setupBridge stands down for it.
    review: maintainer, plus somebody who actually runs a MiniMed pump, because
      the open question is about real CareLink payloads
    operator_visible: >
      Two problems that affect people using a MiniMed pump with CareLink.
      First, the old built-in CareLink connection and the newer connector work
      out WHEN a reading happened in different ways, so the same reading can be
      filed at a different time by each. If it is filed in the future, the
      "no new data" warning stops working - see the separate item on that.
      Second, if you set up the new connector while the old CareLink connection
      is still switched on, BOTH run at once. For Dexcom the old one stands
      aside automatically; for MiniMed it does not. So any advice to "set up the
      new connection before removing the old one" is safe for Dexcom and NOT
      safe for MiniMed. Your glucose data continuing to arrive, and at the right
      time, is what is at stake here. This is not medical advice; if you are
      changing how your data reaches Nightscout, plan it with your care team.
    semver: minor
    semver_reason: >
      BF-45's repair adds a stand-down guard to a boot stage, which changes what
      a deployment with both configurations does. BF-44's repair changes the
      timestamp a reading is stored with, which is a data-affecting change and
      cannot be a silent patch.
    register: [BF-44, BF-45]
    gates:
      - no-gate: >
          The divergence itself IS reproduced and recorded in the register -
          both shipping implementations loaded side by side, three arms diverging
          by exactly the offset (UTC+2, UTC-7, UTC+5:30) and two controls
          agreeing (UTC+0, and UTC+2 with a zone-bearing lastConduitDateTime).
          It is not re-run as a queue gate because the arm/control roles INVERT
          with the server's own timezone: the magnitude is (pump offset minus
          SERVER offset) whenever the payload carries no zone designator, so
          under TZ=Europe/Berlin the Berlin arm agrees and the UTC control
          diverges. A gate that did not pin TZ would report the opposite result
          on a differently configured machine, which is worse than no gate.
      - no-gate: >
          What decides ACTIVE versus LATENT cannot be measured from here at all
          - do real CareLink payloads omit lastConduitDateTime, and do
          sgs[].datetime, markers[].dateTime and sMedicalDeviceTime carry zone
          designators of their own? That needs a real CareLink account, which
          rule 0 forbids. Coverage is thin in exactly the way that hides it:
          lastConduitDateTime appears ZERO times in
          tests/fixtures/minimed-cutover.json and in
          tests/connect-minimed-cutover.test.js, and the one connector test that
          sets the field passes a Z-suffixed value, which makes the rewrite a
          no-op - that test is a control, not coverage.
      - no-gate: >
          BF-45's double ingestion is derived from reading both function bodies
          in full on master and dev, not run as a live double-ingestion. Medium
          alone, because the sysTime+type upsert absorbs duplicate writes; HIGH
          in combination with BF-44, where the two paths compute different keys
          and nothing absorbs them. That combination is the reason these two are
          one item.
    blocks_on: []
    evidence:
      - docs/30-design/remedial/nightscout-backfix-register.md
      - docs/40-migration/legacy-cgm-ingestion-to-connect-2026-09-15.md
    notes: >
      Also recorded on BF-44 and not separately filed - pump.clock is not parsed
      at all, deviceStatusEntry assigns data['sMedicalDeviceTime'] verbatim, so
      a client doing new Date(pump.clock) can get Invalid Date. And the legacy
      transform THROWS RangeError on a Z-suffixed payload outside the
      MMCONNECT_SERVER=EU / GUARDIAN branch rather than producing a comparison
      value, so the reproduction arms hold only with MMCONNECT_SERVER=EU.

