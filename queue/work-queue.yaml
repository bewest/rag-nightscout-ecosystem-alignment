      MERGED UP 2026-09-21 ON THE MAINTAINER'S INSTRUCTION, alongside P0-C and for the
      same reason. Tip is now a0823c4f, a merge of origin/dev 59430336 into 435419ce.
      Back to ready-to-push, packet regenerated.

      ZERO OVERLAP, MEASURED BEFORE MERGING: dev has no commit touching any of this
