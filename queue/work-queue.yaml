          deletion from commenting-out.
      - no-gate: >
          No runtime failure is claimed for the axios override and no axios API
          was identified that the connector uses and 1.16.0 lacks. The defect is
          the silent constraint violation - `overrides` exists precisely to
          suppress the ERESOLVE that would report it - and nothing gates
