# work-queue.yaml — the single source of truth for programme work state.
#
# ONE queue across ALL programmes (maintainer's choice, 2026-09-15): a tenancy
# task colliding with a release train has to be visible in one place, so there
# is one file and the `parcel` field does the separating.
#
# WHY A MANIFEST AND NOT A MARKDOWN TABLE. A hand-maintained `state` column is
# an ASSERTION. `queue/QUEUE.md` is GENERATED from this file, and `state` here
# is only ever a claim about what the `gates` will say. The gates are the
# measurement. That is the register's non-vacuity rule applied to bookkeeping.
#
# THE RULE THAT MATTERS: a gate is either a runnable command or an explicit
# `no-gate:` marker carrying a reason. There is no third option, and
# `queue-validate` refuses a manifest where `gates` is missing or empty,
# because a missing gate that renders as blank looks exactly like a passing one.
#
# Field reference and how to add an item: queue/README.md
# Schema check:  make queue-validate
# Regenerate:    make queue
# Run gates:     make queue-status

meta:
  schema_version: 1
  generated_view: queue/QUEUE.md
  repo_root: /home/bewest/src/rag-nightscout-ecosystem-alignment
  measured_at: "2026-09-21"
  measured_against:
    cgm-remote-monitor-official: "74fc6619"        # origin/dev, re-fetched 2026-09-21 evening
    nightscout-connect: "fe51c6d"                  # official/dev, re-fetched the same run
    main_repo_head: fd632602
  # Gate kinds. `static` and `unit` run by default. The other two never run
  # unless asked for, and the runner says so rather than silently passing them.
  gate_kinds:
    static: cheap, local, read-only; runs by default
    unit: a local test suite that needs no database; runs by default
    integration: needs MongoDB. Worktrees share mongod ports and other sessions
      are live, so this runs ONLY with `--integration`.
    network: contacts a remote. Runs ONLY with `--network`. Rule 0 still applies -
      a network gate may READ (ls-remote) and may never push.
  states:
    not-started: no branch, no commits
    in-progress: work exists, gates not all defined yet
    gate-not-met: the work exists and a declared gate fails; this is a measured
      state, not an opinion
    ready-to-push: every runnable gate passes and the next step is a HUMAN push
    blocked: waiting on an item in blocks_on
    in-flight-upstream: handed to upstream, not ours to land
    merged-upstream: >
      merged into origin/dev and NOT released. Added 2026-09-21, when ten Phase 0
      PRs landed and `in-flight-upstream` stopped being able to say what had
      happened to them. It is deliberately not called `done`: origin/master is
      308 commits behind dev at 92d08342 and the shipping tag is 15.0.8, so an
      operator is not carrying any of this yet. Only a release moves an item out
      of here. The count was 299 when this state was written and 308 the same
      evening, after three advisory PRs merged - it grows until RT-0 is answered,
      and it is re-measured rather than carried forward.
    needs-decision: waiting on a maintainer decision, not on work
    unsettled: it is not yet established that this is a defect at all

parcels:
  phase0:
    title: Phase 0 backfixes - ships to every existing operator
    summary: >
      LARGELY LANDED, 2026-09-21. Eight of the ten cgm-remote-monitor branches
      merged into origin/dev between 2026-09-17 and 2026-09-20 as PRs #8733 to
      #8743, and their items are `merged-upstream` - which means in dev and NOT
      released. origin/master is 308 commits behind dev and the shipping tag is
      15.0.8, so no operator carries any of this yet, and RT-0 is the item that
      changes that. WHAT IS LEFT: bf/auth (P0-C) and bf/throttle (P0-J), both
      behind dev AGAIN as of the evening of 2026-09-21, both still trial-merging
      clean; and the entire connector half.

      THE CONNECTOR HALF STOPPED BEING STALLED AND STARTED BEING CONTESTED,
      2026-09-21 evening, and that is a bigger change than it looks. The sentence
      this paragraph replaces read "has not moved at all since 2026-09-15". It
      moved: upstream dev took the Glooko work (PR #71), restored connector
      regression CI (#72), and BUMPED ITS OWN package.json TO 0.0.14 - the same
      version the programme has had a prepared, unpushed tag for since the 15th,
      on a tree that conflicts with dev in six files. PR #68 is still open, so the
      backoff-and-jitter fix is in neither. P0-TAG is therefore no longer
      ready-to-push but needs-decision, and P0-PIN and P0-LOCK stay blocked behind
      a question that is now about which 0.0.14 is the real one. Still no tenancy
      decision required by any of them.
  release-train:
    title: Modernization release train
    summary: >
      The adopted order (maintainer, 2026-09-15): 15.0.9, then cut 1, then
      cut 2, then cuts 3+5 combined, then a deprecation release, then cut 4.
      GT2 measured the premise of "zero rebase work" false; the rebase items
      here are what that costs.
  register-open:
    title: Open backfix-register entries
    summary: >
      The §1 / §1b distinction is preserved in `ships_to_operators_today`.
      That distinction is the only thing that makes the register mean anything -
      widening §1's criterion would destroy it.
  tenancy:
    title: Multitenancy programme
    summary: >
      T3.0 and the DONE-EXCEPT remainders it amends, T4.3, T4.4, the four open
      §7a alarm-readiness items, and the seam branch refresh.
  docs-truth:
    title: Document-truth sweeps
    summary: >
      Rule 6 work. Agents read SECTIONS, not documents, so a fact stated twice
      and differently is a live hazard, not untidiness. GT1/GT3/GT4 enumerated
      these.

items:

# ---------------------------------------------------------------------------
# PARCEL: phase0
# ---------------------------------------------------------------------------

  - id: P0-A
    title: "bf/alarms - PR #8739, BF-28, BF-29, BF-31"
    parcel: phase0
    repo: cgm-remote-monitor
    branch: bf/alarms
    base: origin/dev@a8888f0d
    worktree: externals/work/crm-bf-alarms
    state: merged-upstream
    blast_radius: 3 commits. lib/plugins/insulinage.js, lib/plugins/index.js,
      lib/api/googlehome/index.js, lib/api/alexa/index.js. Zero file overlap
      with any other Phase 0 branch.
    review: >
      maintainer, plus one reviewer who has never merged their own PR in this
      stack (the governance finding - 100 self-merged PRs, zero human reviews).
      OPENED 2026-09-16 as PR #8739, base dev. THIS ONE NEEDS AN EXPLICIT YES,
      not only a review: it starts an alarm that has never fired in any
      deployment, with no grace period, and it removes per-request locale from
      two HTTP endpoints with no replacement. Dropping 5dcf783f leaves a clean
      minor, which is the option to offer if Phase 0 should land as 15.1.0.
    operator_visible: >
      Three alarm fixes. The "insulin reservoir change overdue" reminder could
      never appear at all and now can. If you list a plugin by its file name in
      ENABLE - for example "cannulaage" instead of "cage" - Nightscout used to
      switch it off without telling you, and now says so and names the plugin it
      thinks you meant. These do not change when any alarm fires, only whether
      it can. This is not medical advice; if an alarm you rely on has been silent,
      talk it through with your care team as well as checking your settings.
    semver: minor
    semver_reason: >
      MAINTAINER RULING 2026-09-17: the per-request locale handling on
      POST /api/v1/alexa and POST /api/v1/googlehome is a DEFECT, not a
      capability. ctx.language.set and moment.locale are process-global, so a
      request carrying request.locale re-languaged every later request for every
      other user - which was never the intent. Removing it is a correction.
      This entry previously graded the branch `major` on a capability-removal
      reading and asked for an explicit yes before merge; that reading is
      withdrawn and the branch needs an ordinary review.
    register: [BF-28, BF-29, BF-31]
    gates:
      - run: git -C externals/cgm-remote-monitor-official merge-base --is-ancestor bf/alarms origin/dev
        kind: static
        describe: >
          REPLACED 2026-09-21, and the reversed direction IS the change. This gate used to read
          `--is-ancestor origin/dev bf/alarms`, "the branch has not fallen behind dev" - the right
          question for a branch waiting to be pushed and the wrong one for a branch already
          merged. PR #8739 merged on 2026-09-20, dev moved on, and the old gate went permanently red for
          the best possible reason. It now asserts CONTAINMENT: this tip is an ancestor of
          origin/dev, so the fix is in dev and cannot silently leave it. An upstream revert or
          force-push turns it red again, which is precisely when someone should be told.
      - run: git -C externals/cgm-remote-monitor-official merge-tree --write-tree origin/dev bf/alarms >/dev/null
        kind: static
        describe: trial-merge into origin/dev is conflict-free
      - run: TEST=insulinage npm run test-single
        cwd: externals/work/crm-bf-alarms
        kind: unit
        describe: >
          BF-28, measured. 5 passing, and E3 ABLATED it - with
          lib/plugins/insulinage.js put back to origin/dev the same file gives
          3 passing / 2 failing. Database-free: re-run with the mongo URL
          pointed at a dead port, still 5 passing.
      - run: TEST=plugins npm run test-single
        cwd: externals/work/crm-bf-alarms
        kind: unit
        describe: >
          BF-29, measured. 13 passing, and E3 ABLATED it - with
          lib/plugins/index.js put back to origin/dev the same file gives
          5 passing / 8 failing. Database-free.
      - run: TEST=api.alexa npm run test-single
        cwd: externals/work/crm-bf-alarms
        kind: integration
        describe: >
          BF-31, the branch's own test for the locale removal. 4 passing,
          MEASURED 2026-09-16 - the previous text here said it CANNOT BE RUN IN
          THIS ENVIRONMENT because nothing listened on port 27034. That was a
          fact about the machine and it was fixed by starting a mongod on 27034,
          not by changing the branch. ABLATED: lib/api/alexa/index.js restored to
          origin/dev gives 3 passing / 1 failing.
      - run: TEST=api.googlehome npm run test-single
        cwd: externals/work/crm-bf-alarms
        kind: integration
        describe: >
          BF-31's sibling. 2 passing, MEASURED 2026-09-16 on the same mongod.
          ABLATED: lib/api/googlehome/index.js restored to origin/dev gives
          1 passing / 1 failing.
      - no-gate: >
          THE GATE THAT WAS HERE - `npm run test:unit` - ASSERTED LESS THAN IT
          LOOKED LIKE. It resolves to a 44-file brace list, it needs MongoDB
          (verifyauth x4 and API_SECRET x2 fail without it even on pristine
          dev), and tests/api.alexa.test.js and tests/api.googlehome.test.js -
          two of the four files this branch adds - are in NEITHER local script,
          so it never ran half the branch's own evidence. CI's `test-ci` runs
          all 159 files and does cover them; a gate that mirrors the local
          script is weaker than CI, not equal to it.
      - run: test -f externals/work/crm-bf-alarms/node_modules/.cache/_ns_cache/public/js/bundle.app.js
        kind: static
        describe: >
          GT1 found this worktree is the only one missing the client bundle, and
          that absence produced a seventh test failure that looked like a defect.
          `npm run bundle` in that worktree fixes it.
      - no-gate: >
          Nothing exercises the ENABLE warning through a booted plugin registry.
          GT4 had to hand-reconstruct the plugin-name list to test it, and a
          reconstructed registry is not the registry. Needs a boot-level test.
      - run: git -C externals/cgm-remote-monitor-official ls-remote --heads origin bf/alarms | grep -q 5dcf783fdbb20188c378d79121dcbe860425eede
        kind: network
        describe: >
          the branch behind PR #8739 is on the remote at the exact tip this item
          was measured against. Read-only. Verified 2026-09-16.
      - no-gate: >
          Review and merge state of PR #8739 is upstream's, and cannot be gated
          from here without a GitHub API call. Tracked, not driven.
      - run: node tools/queue/gates/pr-body-parity.js --only 8739
        kind: network
        describe: >
          the live body of PR #8739 still matches the file it was posted
          from. Bodies drift in one direction - a correction gets written into
          the file first - and the only previous record that one was owed was a
          sentence in a notes: field, which is what let #8738 stay wrong in
          public for a day. It does NOT measure whether the body is TRUE:
          parity with a wrong file is still parity, and every figure in these
          bodies has been wrong at least once. NON-VACUITY, reproduced
          2026-09-16: one altered file gives 1 failing, an empty body dir gives
          6 failing. SKIPS with exit 0 when gh is unauthenticated.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/bf28-29-31-alarm-delivery-2026-09-15.md
      - docs/30-design/remedial/phase0-pr-sequencing-2026-09-15.md
      - docs/30-design/remedial/nightscout-backfix-register.md
    notes: >
      THE TWO INTEGRATION GATES ARE NOW MEASURED, 2026-09-16, AND THE CAVEAT IS
      THE SAME SHAPE AS THE BUNDLE GATE'S. api.alexa and api.googlehome had never
      been run anywhere in this programme - the branch's own evidence for BF-31,
      the commit that grades it major, was unexecuted. Nothing was listening on
      port 27034, which crm-bf-alarms' my.test.env names. A mongod was started on
      27034 with a scratch dbpath and both gates went green (4 and 2 passing),
      each ablated against origin/dev (3/1 and 1/1 failing). THAT MONGOD IS NOT
      PERSISTENT: its dbpath is under this session's scratchpad and it dies with
      the machine. Anyone who sees these two gates red should check for a listener
      on 27034 before reading it as a regression - green here is a property of the
      branch AND of a running database, and only the first half travels.
      ---
      Sequencing letter A. §7a items 5 and 6 are these commits; neither may be
      read as making alarms safe to turn on under TENANCY_MODE=multi.
      STATE CORRECTED 2026-09-15 from ready-to-push to gate-not-met, by the
      manifest's own definition: a declared gate fails. The failing gate is the
      client-bundle check, and what it catches is a LOCAL worktree artifact, not
      a defect in the branch - crm-bf-alarms is the only worktree missing
      node_modules/.cache/_ns_cache/public/js/bundle.app.js, and that absence is
      what produced the seventh test failure GT1 had to rule out by hand.
      `npm run bundle` in that worktree clears it. The branch CONTENT is ready;
      this entry is not a doubt about the three commits. It was not fixed here
      because crm-bf-alarms belongs to another session and rule 5 forbids
      writing into a worktree this session did not create.
      RESOLVED 2026-09-16 on the maintainer's instruction: `npm run bundle` was
      run in crm-bf-alarms (webpack exit 0, 1.76 MB artifact), the gate passes,
      and the state is back to ready-to-push with all 5 runnable gates green.
      No commit was needed and the worktree is still clean - the artifact is
      build output under node_modules, not tracked content.
      CAVEAT ON WHAT THIS GATE MEASURES: it tests for a LOCAL build product, so
      it goes red again in any fresh worktree or after `npm ci`, and green here
      is NOT a property of the branch. Anyone who sees it red elsewhere should
      run `npm run bundle` before reading it as a regression.

  - id: P0-B
    title: "bf/cache - PR #8740, T0.2 and T0.3 read-path cost"
    parcel: phase0
    repo: cgm-remote-monitor
    branch: bf/cache
    base: origin/dev@a8888f0d
    worktree: externals/work/crm-bf-cache
    state: merged-upstream
    blast_radius: 2 commits at 4f86bab1, 6 files, +385/-8. lib/server/cache.js,
      lib/data/dataloader.js, lib/api/entries/index.js, plus three test files.
      NOTE the dataloader path - this entry said lib/server/dataloader.js, which
      does not exist; the file is lib/data/dataloader.js.
    review: >
      maintainer. OPENED 2026-09-16 as PR #8740, base dev. No decision is asked of
      the reviewer, which makes it the odd one out in this set - but it is the
      branch that ships with a target it did not hit, and the body says so in the
      operator-facing text rather than only in the technical detail. What cannot be
      read off the diff: T0.2's gate is MET (0.7x against a 2x budget, dev fails at
      42x) and T0.3's is NOT (2.66 ms against 1 ms), and both are now re-runnable
      from this repository with one command each.
    operator_visible: >
      Pages that read recent glucose values get faster. Nothing you see changes
      value or meaning.
    semver: patch
    semver_reason: performance only; no declared surface moves.
    register: [BF-06, BF-07]
    gates:
      - run: git -C externals/cgm-remote-monitor-official merge-base --is-ancestor bf/cache origin/dev
        kind: static
        describe: >
          REPLACED 2026-09-21, and the reversed direction IS the change. This gate used to read
          `--is-ancestor origin/dev bf/cache`, "the branch has not fallen behind dev" - the right
          question for a branch waiting to be pushed and the wrong one for a branch already
          merged. PR #8740 merged on 2026-09-20, dev moved on, and the old gate went permanently red for
          the best possible reason. It now asserts CONTAINMENT: this tip is an ancestor of
          origin/dev, so the fix is in dev and cannot silently leave it. An upstream revert or
          force-push turns it red again, which is precisely when someone should be told.
      - run: git -C externals/cgm-remote-monitor-official merge-tree --write-tree origin/dev bf/cache >/dev/null
        kind: static
        describe: trial-merge into origin/dev is conflict-free
      - run: node tools/queue/gates/t02-read-ratio.js
        kind: integration
        describe: >
          T0.2's stated gate, RUN LIVE, AND IT IS MET - an untyped
          /api/v1/entries read must come within 2x of a typed one at count=10,
          and it is 0.7x. It is carried beside the T0.3 gate on purpose: that one
          is red and this one is green, and an item showing only the failure would
          misrepresent this branch as much as one showing only the win.
          NON-VACUITY IS STRUCTURAL: the harness reads lib/api/entries/index.js
          out of the worktree and names the shape it found - clone-then-slice on
          dev, slice-then-clone on the branch. Measured 2026-09-16: dev FAILS at
          42.3x, the branch PASSES at 0.7x, so it distinguishes them. SKIPS when
          the worktree has no node_modules.
      - run: node tools/queue/gates/t03-cycle-clone-budget.js
        kind: integration
        describe: >
          T0.3's stated gate, RUN LIVE, AND IT IS RED ON PURPOSE - the budget is
          under 1 ms and the three cycle calls are 2.66. THE MARKER THAT WAS HERE
          SAID THIS COULD NOT BE RE-RUN, because "the workload that produced those
          two figures is not recorded anywhere in this repository". That was FALSE
          when it was written: docs/60-research/remedial/t02-t03-cache-clone-2026-09-15.md
          §2 names the harness (tools/mt-bench/apitier.js, arm `cycle`) and the
          fixture - 576 entries, 600 treatments of which 361 survive retention, 576
          device statuses with 72-point prediction arrays, DEVICESTATUS_DAYS=2 -
          and §10 gives the command. The cost of the wrong marker was that
          queue-status printed CLAIM UNBACKED on this item: the state said
          gate-not-met while every runnable gate passed and the failing property
          hid behind a marker nobody could run. RE-MEASURED 2026-09-16 on Node
          v24.15.0: branch 2.656 ms against a recorded 2.657, origin/dev 3.929
          against a recorded 3.747 - ordinary variance on a timing bench, same
          direction and magnitude. NON-VACUITY IS STRUCTURAL: the harness reads
          the live call sites out of the worktree and prints them (dev
          entries=insertData, branch entries=insertDataRef) and throws on a tree
          it cannot recognise, so it cannot report the branch's number for dev's
          code. Reproduced anyway - --budget 5 passes, proving it can go green.
          SKIPS when the worktree has no node_modules.
      - no-gate: >
          The 98% of the remaining cost is devicestatus, whose caller rewrites
          fields in place. Taking it needs proof that nothing in the plugin tier
          writes to a device-status document. A grep is not that proof when the
          failure mode is a field silently vanishing from every API read served
          out of the cache. There is no test that would catch it.
      - run: git -C externals/cgm-remote-monitor-official ls-remote --heads origin bf/cache | grep -q 4f86bab1637e926502c9b02af008cbba4f424c28
        kind: network
        describe: >
          the branch behind PR #8740 is on the remote at the exact tip this item
          was measured against. Read-only. Verified 2026-09-16.
      - run: node tools/queue/gates/pr-body-parity.js --only 8740
        kind: network
        describe: >
          the live body of PR #8740 still matches the file it was posted from.
          It does NOT measure whether the body is true - and this body's headline
          figure WAS wrong once, in the branch's own favour: it claimed 33x where
          the measurement is 64x, which is the direction nobody checks.
      - no-gate: >
          Review and merge state of PR #8740 is upstream's, and cannot be gated
          from here without a GitHub API call. Tracked, not driven.
    blocks_on: []
    evidence:
      - docs/60-research/remedial/t02-t03-cache-clone-2026-09-15.md
      - docs/30-design/tenancy/nightscout-multitenancy-execution-plan-2026-09-14.md
      - tools/mt-bench/apitier.js
    notes: >
      THIS ITEM WILL REPORT FAIL FOREVER UNDER INTEGRATION=1, AND THAT IS THE
      DESIGN. The T0.3 gate asserts a budget of under 1 ms and the branch ships at
      2.66 ms. The target was deliberately not met - 98% of the remainder is
      devicestatus and taking it needs a proof nobody has produced - and the branch
      was opened saying so in its operator-facing text. So the red is the record of
      a decision, not a regression, and anyone who sees it should read the gate's
      own output, which says as much in its first line. The risk this creates is
      that a permanently-red gate becomes background noise and stops being read at
      all; the counterweight is that T0.2's gate sits beside it and is GREEN, so
      the pair moves if either target does.
      THE EARLIER NOTE ABOUT CLAIM UNBACKED IS NOW OBSOLETE and is removed rather
      than left to confuse: that warning fires when a state of gate-not-met is
      contradicted by passing gates, and this item is no longer gate-not-met. What
      remains true from it is the operational bit - both performance gates are
      kind: integration because they run a benchmark, so a default queue-status
      skips them. Use `make queue-status ID=P0-B INTEGRATION=1` before drawing any
      conclusion from this row.
      ---
      Sequencing letter B. T0.2 passed its gate (0.837 -> 0.025 ms, asserted
      identical over HTTP). T0.3 did not. A dead `mills` write at
      dataloader.js:203 was found and removed with a test that goes red if it
      returns.

  - id: P0-C
    title: bf/auth - BF-17 plaintext token (BF-30 split out to P0-J)
    parcel: phase0
    repo: cgm-remote-monitor
    branch: bf/auth
    base: origin/dev@a8888f0d
    worktree: externals/work/crm-bf-auth
    state: gate-not-met
    pr: []
    blast_radius: >
      2 commits at ce82f0cd, 3 files, +310/-18. lib/authorization/endpoints.js,
      lib/authorization/storage.js, tests/authsubjects.test.js. SPLIT 2026-09-16
      - the BF-30 throttle commit that used to sit underneath this one is now
      P0-J on bf/throttle, and the old tip 56ed29d2 no longer exists.
    review: SECURITY - a human security reviewer first, before any other Phase 0
      branch. This is the one the sequencing document singles out.
    operator_visible: >
      Two security fixes. Editing a subject through the admin page used to write
      that subject's API access token into the database in readable form, which
      turned read access to your database into API access; it no longer does.
      IMPORTANT: tokens already written that way are still in your database -
      fixing the code does not remove them. Brute-force slowdown on failed logins
      was keyed on a value the caller could choose, so it never engaged; it now
      is. Existing access tokens keep working - they are re-derived on every load
      and are not invalidated by this change.
    semver: major
    semver_reason: >
      GT4: beyond the two fixes, the branch narrows lib/authorization/storage.js
      to write only an allow-list of fields (name, roles, notes, created_at), so
      any field a third-party admin tool has stored is dropped on the next edit
      with NO error. It also adds `notes` to the GET /api/v1/subjects response.
      The throttle change alone would be minor - the sleep moved to the failure
      path, so no request that authenticates is delayed by another client's
      failures behind a shared proxy.
    register: [BF-17]
    gates:
      - run: git -C externals/cgm-remote-monitor-official merge-base --is-ancestor origin/dev bf/auth
        kind: static
        describe: >
          bf/auth has not fallen behind origin/dev. GREEN AGAIN 2026-09-21. It went red when dev
          moved 45 commits (fdd08706..59430336) taking the eight sibling Phase 0 branches with
          it while this one did not follow, and the remedy was the `git merge dev` recorded in
          notes. Unlike the eight merged siblings the question here is still the right one -
          this branch is waiting to be pushed, so falling behind dev is a real defect in it and
          this gate should go red again if it happens.
      - run: git -C externals/cgm-remote-monitor-official merge-tree --write-tree origin/dev bf/auth >/dev/null
        kind: static
        describe: trial-merge into origin/dev is conflict-free
      - run: grep -nE "console\\.log\\('Loading',[[:space:]]*opts\\)" lib/authorization/storage.js && exit 1 || exit 0
        cwd: externals/work/crm-bf-auth
        kind: static
        describe: >
          BF-05's unfixed sibling, a TRACKING gate: it is meant to FAIL while
          the residual is present, and the describe it replaces said so in
          as many words. IT DID NOT FAIL. The pattern was
          `console.log('Loading', opts)` with a space after the comma; the code
          at storage.js:113 has NO space, so the grep never matched, the
          `|| exit 0` arm fired, and P0-C reported 3/3 PASS on a property that
          is false. The pattern is now whitespace-tolerant and this gate is red,
          which is the honest reading. DO NOT loosen the pattern again.
          SETTLED 2026-09-16: of the two ways to green this gate offered, the
