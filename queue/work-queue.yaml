      default set at :47-48 (TWO_DAYS * 2). One function. Server-side, so a restart
      carries it; no rebundle.
    review: >
      maintainer, and READ THE SEVERITY BEFORE THE MECHANISM. This item exists partly to
      correct the programme's own record: until 2026-09-21 the only description of this
      behaviour was P0-K's review note, which called it the advisory's primary evidence and
      a full-history PHI dump and treated it as the larger of the two PoCs still open. That
      was read off the code. Reproduced with its control in the same run it is NOT a
      privilege boundary, and a reviewer who arrives expecting an unauthenticated hole will
      mis-size it in the other direction. What is left is a real but ordinary correctness
