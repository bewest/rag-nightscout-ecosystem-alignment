    gates:
      - run: node tools/queue/gates/connector-pin-exposure.js --refs origin/master,origin/dev
        kind: static
        describe: >
          FAILS on origin/master for both arms - the v0.0.13 tag tarball (112
          live console.* sites, 101 passing a non-literal argument, no debug
          guard anywhere) and an axios override of 1.16.0 against the
          connector's declared ^1.18.1. origin/dev is the CONTROL and passes
          both, which is what proves the gate is reading the pins and not the
          command: dev's 234d47c8 DELETES the leaking call sites, so redaction
          does not improve monotonically with release order and the widely
          repeated "dev only makes the logging opt-in" is inverted.
      - no-gate: >
          No live run and no vendor account. The census is a source census of a
          git archive extraction, and rule 0 forbids creating an account or
          contacting a vendor. It is non-vacuous in the way that matters - the
          same scanner returns 112/101 on the leaking tree, 22/20 on the
