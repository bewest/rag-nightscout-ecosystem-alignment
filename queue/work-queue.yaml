      THE CONNECTOR PIN AT CUT 4 WAS A REAL FORK, not a mechanical pick. dev's
      234d47c8 and cut 4's c962a13f are neither one an ancestor of the other, so
      either side loses something; resolved to b77e5bb7, which has both, is
