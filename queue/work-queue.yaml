      again.

      A REAL CONTROL WAS ADDED BELOW rather than leaving five red gates with nothing
      proving the command still works. See the gate list.

      PRIOR MEASUREMENT, 2026-09-21 against dev 59430336, kept because the reasoning
      is still the argument. The cost has roughly TRIPLED since the
      2026-09-15 figure this field used to carry (59 behind, 4-5 conflicting files each).
      Now 124 commits behind, and under merge-tree: cut 1 SEVEN conflicts
      (lib/plugins/pluginbase.js, lib/server/bootevent.js, package.json,
      package-lock.json, plus THREE modify/delete - tests/clock-client.test.js,
      tests/pluginbase.modern.test.js, tests/profile-sinks.test.js); cut 2 FOURTEEN;
      cut 3 SIXTEEN; cut 4 EIGHTEEN. The 124 missing commits are 139 files, +7135/-274.

