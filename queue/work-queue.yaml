      If you run Nightscout with the bundled Docker setup, the database can stop
      with a fatal error because the container is allowed too few open files.
      Adding one setting to the compose file fixes it.
    semver: patch
    semver_reason: a configuration file the project ships
    register: [BF-10]
    gates:
      - run: grep -q 'ulimits' docker-compose.yml
        cwd: externals/cgm-remote-monitor-official
        kind: static
        describe: >
          FAILS today. GT3 verified the mongo service carries no ulimits block on
          EITHER master (mongo:5.0.32) or dev (mongo:4.4), and grep for
          ulimit/nofile over the whole released tree returns nothing.
      - no-gate: >
          REPRODUCED 2026-09-21, unplanned, so this marker no longer says nothing
          reaches it - but it stays a no-gate because the reproduction is not
          something to run on demand. What happened: one branch's full suite
          (~2200 tests) against a plain `docker run -d mongo:7` with no ulimits
          killed the server. Startup warning `Soft rlimits for open file
          descriptors too low` (currentValue 1024, recommendedMinimum 64000),
          then during index creation `__posix_directory_sync` / `Too many open
