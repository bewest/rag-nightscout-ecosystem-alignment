      The low-side rewrite is real from the other direction (BG_LOW=90 -> 79).
      The refuted half leaves a DIFFERENT and worse residue that no entry owns -
      a low alarm set to 3.9 mg/dL can never fire, and is stored with no warning
      of any kind. Also relevant to T3.0: the per-tenant configuration spec
      proposes a CHECK constraint as a backstop for this, and it is not one -
      a partial override leaves absent paths SQL NULL, the AND chain evaluates
      to NULL rather than FALSE, and PostgreSQL accepts the row.

