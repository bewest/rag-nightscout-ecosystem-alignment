  - id: BFQ-09
    title: BF-09 - socket dedup truthiness skips a falsy value
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/dev@a8888f0d
    worktree: externals/work/crm-bf-alarms
    state: unsettled
    ships_to_operators_today: true
    blast_radius: lib/server/websocket.js:538-566 (the register cites 535-568).
    review: maintainer - this needs a decision on intent before it needs code
    operator_visible: >
      When two treatment records arrive within two seconds of each other,
      Nightscout decides whether they are the same one. That check ignores a
      value of zero. A zero temporary basal rate - the suspend an automated
      insulin delivery system sends - is exactly such a value. It is not settled
      whether this ever discards a real record.
    semver: patch
    semver_reason: if it is a defect at all, the fix is a bug fix
    register: [BF-09]
    gates:
      - run: node tools/queue/gates/bf09-corpus-divergence.js
        kind: static
        describe: >
          GT3's corpus sweep, re-runnable. 277,690 treatments across 11 sites,
          0 outcome divergences within the ±2s window, AND a four-case injection
          harness proving the comparison is not vacuous (2 DIVERGES, 2 agree).
          De-identified counts only.
      - no-gate: >
          The corpus is SURVIVORSHIP-BIASED in exactly the direction that hides
          this defect: it counts stored data, and the defect's effect is to
          suppress an insert. A suppressed insert cannot appear in stored data.
          The one arm that would settle it is a live uploader-burst replay, which
          nothing here can run.
      - no-gate: >
          No test in the suite exercises a zero-valued dedup field. The only
          values in tests/websocket.*.test.js are insulin: 1 and carbs: 9/10/15/18.
    blocks_on: []
    evidence:
      - docs/60-research/gt3-register-truth-2026-09-15.md
      - docs/30-design/nightscout-backfix-register.md
    notes: >
      CORRECTS THE REGISTER ENTRY. BF-09 names the wrong fields. Measured over
      277,690 treatments: ZERO zero-valued `insulin` (0 of 107,732) and ZERO
      zero-valued `carbs` (0 of 12,394). The field that actually carries falsy
      values is `absolute` - 67,521 of 153,315, 44% - the zero temp basal.
      `duration:0` adds 2,094. The entry also omits the ±2s window (maxtimediff).
      GT3's reading: a bug, not intent - the author built an explicit
      selected/fallback mechanism, so truthiness on `absolute` means the code
      treats a zero temp as "no value here", which is false in AID terms.

