    review: >
      MAINTAINER. OPENED 2026-09-18 as PR #8743, base dev, and MERGED UP to
      dev fdd08706 the same day. Three things the reviewer should be told
      rather than left to find:
      (1) THIS DOES NOT CLOSE THE REPORTED NoSQL-INJECTION ADVISORY. Of its
      three PoCs only $where is refused. REVISED 2026-09-21: the other two are
      now filed as BFQ-71 and BFQ-72 and re-measured, and the revision REVERSES
      what this field used to say. It called the date-window path the
      advisory's primary evidence and a full-history PHI dump. Reproduced with
      a control in the same run, it is not a privilege boundary at all - the
      allowlisted, documented find[date][$gte]=0 returns the identical records
      on the identical authorisation, and every form is 401 under
      AUTH_DEFAULT_ROLES=denied. The unauthenticated full-history read is what
      the shipped `readable` default means, not something that code path
      grants; BF-71 is low. BF-72 is the one that survives, and it is an
      AVAILABILITY defect rather than the extraction the advisory describes:
      60-71 s of database CPU from one unauthenticated request against a 22 ms
      control. Against the advisory's five remediation items this does 1 and 2,
      not 3, 4 or 5, and item 3 as the advisory frames it is now disputed on
      measurement rather than outstanding. The PR body as merged still carries
      the old framing - see BFQ-71's notes for what that costs.
      (2) BF-70 has NO advisory of its own. It is a second unauthenticated read
      path with the same reachability, and the advisory covers find[...] only.
      (3) The $type question this item used to hold open is CLOSED - see
      semver_reason.
    operator_visible: >
      Nightscout's older API let a web address ask the database to run
      JavaScript, and let one particular address ask questions about parts of
      the database it had no business reading - including, on a default setup,
      without any password or token. Both are closed. What you may notice: a
      filter using an unusual option now answers with a clear error instead of
      appearing to work, and the "count" address no longer accepts a `pipeline`
      setting, which was never documented and which no known app uses. Ordinary
      filters - date ranges, event types, glucose thresholds - are unchanged.
      Your stored data is not touched. Nightscout is not a medical device and
      this is not medical advice; if a report or app you rely on starts showing
      an error after this lands, it is telling you the request was malformed,
      not that your data is gone.
    semver: minor
    semver_reason: >
      It removes reachable behaviour - $expr on /profiles/ and the undocumented
      pipeline parameter - so it is not a patch by the project's own reading.
      It is not major either: no route is removed, no required input is added,
      no documented contract breaks, and the census of 14 client projects found
      zero senders of anything now refused.
      $type RESOLVED 2026-09-18, and the resolution reversed this item's
      earlier position. The allowlist refused $type, and this field recorded
      the collision with PR #8737 as the maintainer's call, taken by nobody.
      #8737 then MERGED, which settled it: readTypeOperand() is on dev because
      find[sgv][$type]=2 must arrive as the number 2 or the request becomes an
