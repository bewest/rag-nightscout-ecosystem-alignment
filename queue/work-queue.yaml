    operator_visible: >
      Nothing changes for you, and nothing you are running is less safe than you thought.
      Nightscout's older API returns about four days of data when a request does not say
      what period it wants. A request that mentions the date field in a particular way gets
      the whole history instead - but so does a request that simply asks for the whole
      history, which the API has always allowed and documents. Both need whatever password
      or token your site requires; on a site that allows anonymous reading, which is
      Nightscout's default setting, both work without one. If it matters to you that
      strangers cannot read your glucose history, the setting to look at is
