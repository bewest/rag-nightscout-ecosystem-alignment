  - id: BFQ-67
    title: BF-67 - an alarm threshold is quietly changed and only the server log says so
    parcel: register-open
    repo: cgm-remote-monitor
    branch: ""
    base: origin/dev@a8888f0d
    worktree: externals/cgm-remote-monitor-official
    state: gate-not-met
    ships_to_operators_today: true
    blast_radius: >
      lib/settings.js verifyThresholds(), four branches. Unconditional at
      settings load on every deployment.
    review: >
      maintainer, and it is a DECISION with a safety dimension before it is
      code. Refusing a contradictory threshold set, correcting it and
      announcing it, and unit-checking the input are three different products.
    operator_visible: >
      Nightscout checks that your four glucose thresholds are in a sensible
      order. If they are not, it does not tell you and ask - it changes one of
      them by one unit and carries on, and the only record is a line in the
      server log, which on many hosting setups you will never see. The case this
      actually reaches is a units mix-up. If you think in mmol/L and set your
      high alarm to 14, Nightscout is reading mg/dL unless you have told it
      otherwise, 14 is below the target range, and it is stored as 181 mg/dL.
      You believe you have set a high alarm and you have set a different one.
      The same happens if you ask for a low alarm at 90 while the target range
      still starts at 80 - it is stored as 79. If you have set thresholds and
      the alarms do not behave as you expect, check what Nightscout actually
      stored, and please discuss your alarm settings with your care team. This
      is not medical advice.
    semver: minor
    semver_reason: >
      Every option changes what a deployment with contradictory thresholds does
      at boot - refuse, announce, or convert. Alarm thresholds are what alarms
      fire on, so this cannot arrive as a silent patch under any of the three.
    register: [BF-67]
    gates:
      - run: node tools/queue/gates/threshold-silent-rewrite.js
        kind: static
        describe: >
          EXECUTES the shipping settings layer. FAILS today on both arms -
          BG_HIGH=14 with UNITS at the mg/dL default is stored as 181, and
          BG_LOW=90 against the shipped bgTargetBottom of 80 is stored as 79,
          each with two console.warn lines and no other surface. Four controls
          come out the other way through the same harness, and the gate was
          proven to go green against an isolated copy with the two rewrite sites
          removed. This gate upgrades BF-67 from read-derived to REPRODUCED.
      - no-gate: >
          Nothing checks that a corrected setting is SURFACED. The gate proves
          the value changes; the defect is that the only evidence is stdout.
          Grep over lib/client/ and views/ finds no surface that reports the
          rewrite, and building one is the fix, not the measurement.
    blocks_on: []
    evidence:
      - docs/30-design/remedial/nightscout-backfix-register.md
      - docs/60-research/remedial/e4-queue-register-reconciliation-2026-09-15.md
    notes: >
      CORRECTS BF-67, measured while building the gate. The entry says "The same
      applies at the bottom - a BG_LOW of 3.9 becomes bgTargetBottom - 1 = 79".
      IT DOES NOT. The low check is `bgLow >= bgTargetBottom`, so a value far
      BELOW the band passes through untouched and BG_LOW=3.9 is stored as 3.9.
      The low-side rewrite is real from the other direction (BG_LOW=90 -> 79).
      The refuted half leaves a DIFFERENT and worse residue that no entry owns -
      a low alarm set to 3.9 mg/dL can never fire, and is stored with no warning
      of any kind. Also relevant to T3.0: the per-tenant configuration spec
      proposes a CHECK constraint as a backstop for this, and it is not one -
      a partial override leaves absent paths SQL NULL, the AND chain evaluates
      to NULL rather than FALSE, and PostgreSQL accepts the row.

