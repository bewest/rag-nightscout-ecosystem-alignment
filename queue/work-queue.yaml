      - no-gate: >
          NOTHING MEASURES THE BOOT WARNING'S WORDS. init() logs that the throttle
          is keyed on an address the caller may control, and that restricting
          access at the proxy is what helps today. That text IS the notification
          half of the maintainer's compatibility decision, and it is prose - the
          same shape as P0-C-REMEDIATE, whose prose turned out to be wrong twice
          before a gate caught it. A real gate would check that the message names
          no setting that does not exist on this branch, and that it never claims
          the throttle protects against credential guessing.
      - no-gate: >
          THE ADDRESS KEY IS STILL CALLER-CONTROLLED, DELIBERATELY. This branch
          does not close BF-30. It makes the control cheap for legitimate clients,
          bounds the list, stops retaining the credentials people tried, adds a
          second key, and says so out loud. An attacker who varies both the
          credential and the forwarded header is throttled by neither key.
