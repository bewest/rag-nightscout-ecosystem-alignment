# gate-controls.yaml — the NEGATIVE CONTROL for every runnable gate in
# queue/work-queue.yaml.
#
# Contributor-facing.
#
# WHY THIS FILE EXISTS
#
# `queue/work-queue.yaml` requires every gate to be a runnable command or an
# explicit `no-gate:` with a reason. That rule says nothing about whether a
# runnable gate can FAIL, and a gate that cannot fail is not a measurement.
# Two such gates were in the manifest on 2026-09-15, both green:
#
#   P0-C  grepped for `console.log('Loading', opts)` while the code reads
#         `console.log('Loading',opts)` (no space). The pattern never matched,
#         the `|| exit 0` arm always fired, and the item reported 3/3 PASS on a
#         false property.
#   P0-E  `git log --format=%H bf/reads | grep -q .` asserted only that the
#         branch has at least one commit; it passes for origin/dev,
#         origin/master and bf/alarms too.
#
# So every gate carries, here, either a CONTROL — the same instrument applied
# to a state where the property is FALSE, which must therefore exit NON-ZERO —
# or a `control-exempt` with a reason. `python3 tools/queue/vacuity.py` runs
# them and reports VACUOUS, STUCK-RED, CONTROL-ERROR, EXEMPT or UNCONTROLLED.
# UNCONTROLLED is never treated as a pass.
#
# CONTROLS ARE AUTHORED, NEVER DERIVED
#
# Most entries follow a pattern — reverse an ancestry question, merge against a
# branch measured to conflict, revert the fix and re-run the test — but each
# one is RUN, and a derived control would be wrong in at least two places.
# P0-PIN's lockfile gate is DELIBERATELY INVERTED and passes against
# origin/dev, which a mechanical "does it pass on the base?" rule would flag as
# vacuous. RT-D3's suite runs inside the shipping checkout, which no control
# may modify.
#
# A known-negative control can stop being negative when its subject moves (two
# branches measured to conflict are later reconciled). Nothing announces that;
# queue-vacuity then reports the GATE vacuous when it is the control that went
# stale. Re-check the control before concluding anything about the gate.
#
# FIELDS
#   gate               the gate's command, EXACTLY as work-queue.yaml spells it
#                      (whitespace-normalised). Editing a gate makes its
#                      control stop matching, which forces the control to be
#                      re-authored rather than silently inherited.
#   cwd                the GATE's cwd, and part of the lookup key: the same
#                      command against two different trees is two different
#                      measurements.
#   control-cwd        where the CONTROL runs, if that is somewhere else (the
#                      branch ablations run from the repo root).
#   control            must exit NON-ZERO. Required unless control-exempt.
#   positive-control   optional; must exit ZERO. It catches the opposite
#                      failure — a gate that can never go green.
#   control-kind       static (default) | unit | slow | integration | network.
#                      `slow` is the branch ablations: each builds a throwaway
#                      worktree and runs a suite. Off unless --slow.
#   proves             what breaking it looked like, and what was measured.
#   control-exempt     a reason, where no control can honestly be written.
#
# Rule 3: every `proves` below describes something that was RUN (on the date
# given, 2026-09-15 unless stated), not something read out of the source.
#
# An entry whose `gate` no longer appears in work-queue.yaml is an orphan: it
# is never run. `proves` says so where known.
#
#   Run them:  make queue-vacuity           (add SLOW=1 for the ablations)
#   Coverage:  python3 tools/queue/vacuity.py --list-uncontrolled
#   Self-test: python3 tools/queue/vacuity.py --self-test

controls:
  - gate: |-
      TEST=dependency-d3 npm run test-single
    cwd: externals/cgm-remote-monitor-official
    control-exempt: >
      This gate's cwd is the SHIPPING CHECKOUT, which 19 worktrees hang
      off. Ablating it means editing that tree, and rule 6 forbids it.
      The gate fails against the live tree (RT-D3 0/2 in queue-status,
      2026-09-22), so it is not silently green, and RT-D3's companion
      instrument (d3-drag-clamp-covered.js) carries its own internal
      CONTROL finding and is the non-vacuous measurement for this item.

  - gate: |-
      bash -c 's=$(git -C externals/cgm-remote-monitor-official show origin/dev:lib/api/alexa/index.js); echo "$s" | grep -q "switch (req.body.request.type)" || exit 1; echo "$s" | grep -q "default:"'
    cwd: .
    control: |-
      bash -c 's=$(git -C externals/cgm-remote-monitor-official show origin/dev:lib/api/index.js); echo "$s" | grep -q "switch (req.body.request.type)" || exit 1; echo "$s" | grep -q "default:"'
    control-kind: static
    proves: >
      the identical pair of greps against a file that contains neither
      (lib/api/index.js) exits 1. It shows the greps read the file they
      are given rather than matching anything.

  - gate: |-
