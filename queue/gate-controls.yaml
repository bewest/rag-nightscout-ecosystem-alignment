      exit 1 whether or not the comparison worked.

      It also exercises the direction logic: the control's output reads
      "live-only 0, file-only 1", the one case in which this gate suggests an
      overwrite. Pointing --body-dir at an empty directory is NOT an adequate
      control: every pair then reports "body file missing" and exits non-zero
      without ever comparing two bodies.

      READS ONLY. The control writes to a temporary directory and never to
      reports/phase0-pr-bodies/, and pr-body-parity.js has no code path that edits
