      git -C externals/cgm-remote-monitor-official cat-file -e bf/reads:lib/server/count.js 2>/dev/null && git -C externals/cgm-remote-monitor-official show bf/reads:lib/api3/generic/collection.js | grep -q "maxLimit" && exit 1 || exit 0
    control-kind: static
    proves: >
      the same conjunction with a pattern that IS present in
      collection.js (`maxLimit`) on a ref where count.js DOES exist
      (bf/reads) exits 1. The state this gate is meant to go red in -
      count.js present AND collection.js delegating to it - does not
      exist on any ref yet, which is precisely the follow-up it tracks,
      so the instrument is exercised with a stand-in pattern instead.

  - gate: |-
