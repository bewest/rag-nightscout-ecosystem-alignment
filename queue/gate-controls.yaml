    control-kind: slow
    proves: >
      the same test file against a throwaway worktree of bf/reads with
      the shipping code put back to origin/dev — measured non-zero. Rule
      6: the control creates and removes its own worktree under $TMPDIR
      and never writes into externals/work/crm-bf-reads, which it reads
      node_modules and my.test.env from.

