# Text and labels for the fresh v15.0.9-to-merged-dev comparison.
title: 16.0.0 write compatibility
measured: 2026-11-01
harness: tools/qc/write-contract-matrix.js
trees:
  - {name: v15.0.9, commit: c6a0d8ed, note: release baseline}
  - {name: pre-identity dev, commit: 37b2280f, note: historical attribution anchor; not a fresh run}
  - {name: merged dev, commit: 497d08c9, note: index off for intentional duplicate-state fixtures}
environment: Node 22.23.4, MongoDB 7.0.43; two runs per endpoint tree
settings: >-
  All settings default except the merged-dev endpoint uses WRITE_IDENTIFIER_INDEX=off so the matrix
  can seed intentional duplicate-identifier states. The default try index and duplicate-key races
  are assessed separately: the completed --batch --no-idf matrix has 3,443 cells per off/try lane
  on MongoDB 5.0.32 and 8.0.34, with the same 33 expected batch differences on both versions.
origin_labels:
  "8879": changed after pre-identity dev
  dev: already changed on pre-identity dev
  both: changed in both comparison intervals
lede: >-
  Compared **{cells}** write cells; **{differ}** differ from v15.0.9 and **{unexplained}** have no
  classified cause. The endpoint trees were each run twice. The pre-identity dev pin is a historical
  reference for attribution, not an additional fresh endpoint. Differences after that pin are
  reported as one combined interval through merged dev `497d08c9`, not attributed to individual PRs.
tiles:
  - {metric: cells, label: cells in each endpoint run}
  - {metric: differ, label: "cells with changed output from v15.0.9"}
  - {metric: by_8879, label: "changed after pre-identity dev"}
  - {metric: on_dev, label: "already changed on pre-identity dev"}
  - {metric: both, label: changed in both intervals}
  - {metric: format_cells, label: identifier-format cases}
  - {metric: defect_cells, label: "defect-group cells in this comparison", bad: true}
  - {metric: unexplained, label: differences without a classified cause}
defect:
  heading: Defect findings and controls
  text: >-
    The group and cell tables distinguish unexpected defects from deliberate compatibility decisions
    and fixes. Check the per-cell cause and before/after record and reply; a large difference count
    alone does not mean the same number of clients or production writes will break.
why: >-
  Each cell is a synthetic combination of collection, write path, seed, resend shape and expected
  stored/reply outcome. Cell counts measure coverage of those combinations, not production volume,
  active sites, or unique client versions.
reconsider_intro: >-
  These cards document compatibility alternatives and the behavior each would restore in this
  measured comparison. They are decision context, not automatic recommendations to revert.
limits:
  - "The 37b2280f attribution anchor is an earlier single pin, not a fresh repeated measurement; changes after it are not bisected by PR."
  - "Six ws idread-fail cells are excluded because the injected read failure does not exist on v15.0.9."
  - "The retained 2026-10-31 v15.0.9 pin differs from the fresh baseline in 23 batch cells outside cache/wire; only the two matching fresh baseline runs are used for repeatability."
  - "WRITE_IDENTIFIER_INDEX=off on the merged-dev endpoint is a measurement accommodation for intentional duplicate-state fixtures, not the release default. Separate --batch --no-idf evidence covers the index setting and races; it does not include the full identifier-field matrix."
  - "WRITE_RESEND alternatives, strict validation, and index drop/rollback behavior require separate matrices."
  - "Client matches are predicted from documented client request shapes. No Loop, Trio, AAPS, xDrip+, or other client application ran against these trees."
  - "The matrix measures synthetic writes and does not model every field-level, nested-merge, deployment, or live-data condition."
verdicts:
  - {verdict: Defect, text: unplanned behavior in the measured comparison that is not accepted as intended.}
  - {verdict: Decided, text: an intentional behavior change backed by a recorded maintainer decision.}
  - {verdict: Bug fix, text: a defect or data-loss behavior corrected in the later tree.}
  - {verdict: No value change, text: "the write follows a different path, but the measured stored values do not change."}
verdicts_note: >-
  Defaults are compared as shipped on each tree. The merged tree defaults WRITE_IDENTIFIER_INDEX
  to try; the prior batch-only index-on/off evidence is a separate, bounded experiment.
