# Text for the 16.0.0 write-compatibility page. The comparison data is pinned
# to the measured trees below; present-day status is stated separately.
title: 16.0.0 write compatibility
measured: 2026-10-31
harness: tools/qc/write-contract-matrix.js
trees:
  - {name: v15.0.9, commit: c6a0d8ed, note: release baseline}
  - {name: dev, commit: 37b2280f, note: pre-identity baseline}
  - {name: "#8879", commit: 6960bfb7, note: identity branch measurement}
environment: Node 22.23.4, MongoDB 7.0.43, two runs per tree
settings: >-
  Defaults only (WRITE_VALIDATION off, WRITE_IDENTIFIER lenient, WRITE_DELETED_EDIT ignore,
  UUID_HANDLING on)
lede: >-
  This comparison covers the pinned trees above, not the current release candidate. It measured
  **{cells}** writes; **{differ}** differed from v15.0.9. The three BF-225 cells below were fixed
  in #8888 and #8890. #8890 also shipped compatibility decisions A and B; #8892 later added the
  resend settings and merged as 3c773ee5. Its default-mode matrix differed in 0 of 4,916 cells
  from its base, f54941b5. That result is not a refreshed v15.0.9 comparison; the table below
  remains limited to the pinned trees.
tiles:
  - {metric: differ, label: writes that differ from v15.0.9 in this measurement}
  - {metric: by_8879, label: "changed by #8879 only"}
  - {metric: on_dev, label: already changed on dev}
  - {metric: both, label: "changed on dev, then again by #8879"}
  - {metric: format_cells, label: "identifier-format cases"}
  - {metric: defect_cells, label: "BF-225 cells in this measurement (fixed)", bad: true}
  - {metric: unexplained, label: differences with no cause found}
defect:
  heading: "BF-225: fixed before the current dev"
  text: >-
    The pinned #8879 tree stored a second treatment when a socket re-send omitted an identifier
    present on the stored record. The three affected cells are included in this measurement.
    #8888 and #8890 fixed the defect; it is not an open finding on current dev.
why: >-
  The matrix tests each write form and path. Identifier-format forms account for most measured
  differences; these totals describe only the pinned trees.
reconsider_intro: >-
  Each card records a measured compatibility alternative and its effect on the pinned comparison.
  Current implementation status is shown in the card.
limits:
  - "The results are not a post-#8890 or post-#8892 comparison."
  - "Field-level and nested merge behavior, null handling, and races without the unique index were not measured."
  - "A live and deleted record sharing one identifier, or an edit whose _id and identifier name different records, were not measured."
  - "Re-sends after delete keyed by syncIdentifier, id or uuid were not measured."
  - "Non-default settings and the unique index were not run."
  - "Client shapes were read from code; only nightscout-connect was run against a server."
verdicts:
  - {verdict: Defect, text: unplanned behavior in the pinned comparison; fixed on current dev as noted.}
  - {verdict: Decided, text: an intentional behavior change, with its decision named in the table.}
  - {verdict: Bug fix, text: a defect or data-loss behavior that was fixed in a later compared tree.}
  - {verdict: No value change, text: "the write takes another path; stored values do not change."}
verdicts_note: >-
  WRITE_RESEND and WRITE_DELETED_RESEND are implemented in #8892. The unique index and Q-IDX retry
  merged in #8894; they were not measured in this pinned compatibility comparison. Per-client D20
  overrides remain unimplemented.
