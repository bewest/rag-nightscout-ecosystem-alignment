<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1725" viewBox="0 0 1600 1725" role="img" aria-labelledby="title desc"><title id="title">current stream runtime topology</title><desc id="desc">Top-to-bottom trust zones, logical endpoints and role instances. Communication planes are listed explicitly to avoid ambiguous crossing connections. Physical placement is stated separately.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365aa2"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="2400" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="48" y="56" fill="#203248" font-size="34" font-weight="700" text-anchor="start">Current stream runtime: accepted input and completed output</text><text x="48" y="93" fill="#52647a" font-size="20" font-weight="400" text-anchor="start">Selected local branch architecture • bounded clinical state • independent raw storage events</text><rect x="48" y="118" width="1504" height="55" rx="12" fill="#e7f4ef" stroke="none" stroke-width="1.5"/><text x="68" y="153" fill="#24654a" font-size="21" font-weight="700" text-anchor="start">READ-DERIVED  |  core 5e112547; reproduced qualification remains source/profile-specific</text><rect x="32" y="198" width="1536" height="178" rx="14" fill="#f1f5fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="228" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">1  CANONICAL INPUT AND CHANGE TRANSPORT</text><text x="1548" y="228" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Platform owns pgstream lifecycle</text><rect x="64" y="246" width="700" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="278" fill="#203248" font-size="23" font-weight="700" text-anchor="start">API → PostgreSQL committed source</text><text x="82" y="306" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Original JSONB + generated typed columns</text><text x="82" y="331" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Existing tenant identity, ordering and write contracts</text><rect x="800" y="246" width="736" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="818" y="278" fill="#203248" font-size="23" font-weight="700" text-anchor="start">WAL → maintained pgstream service</text><text x="818" y="306" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">One active slot consumer → current private receiver</text><text x="818" y="331" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Independent platform restart policy; no app-owned Go child</text><rect x="32" y="414" width="1536" height="178" rx="14" fill="#eef6f6" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="444" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">2  RECOVERABLY ACCEPTED TRANSACTION COHORT</text><text x="1548" y="444" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Transport ACK follows durable input commit</text><rect x="64" y="462" width="700" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="494" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Bounded clinical working state</text><text x="82" y="522" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Existing input checkpoint + observed-work receipt</text><text x="82" y="547" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Warm streamed changes; historical recovery when needed</text><rect x="800" y="462" width="736" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="818" y="494" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Independent bounded raw mutation tail</text><text x="818" y="522" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Source create / update / delete, including old-history rows</text><text x="818" y="547" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Shares accepted input transaction; no extra clinical projection</text><rect x="32" y="630" width="1536" height="178" rx="14" fill="#f0f7f3" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="660" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">3  CLINICAL EVALUATOR AND DURABLE COMPLETION</text><text x="1548" y="660" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Accepted position is not completed coverage</text><rect x="64" y="678" width="700" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="710" fill="#203248" font-size="23" font-weight="700" text-anchor="start">One bounded pending / due scheduler</text><text x="82" y="738" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Serial tenant execution; fair neighbor progress</text><text x="82" y="763" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Actual due work completes after cache loss or restart</text><rect x="800" y="678" width="736" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="818" y="710" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Atomic completed result / checkpoint</text><text x="818" y="738" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Covered input/settings versions + frame/revision + next due</text><text x="818" y="763" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Current owner, authority and restore fences before RAM advances</text><rect x="32" y="846" width="1536" height="178" rx="14" fill="#f8f9fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="876" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">4  REALTIME AND CLIENT EFFECTS</text><text x="1548" y="876" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Current tenant/client authority at publication</text><rect x="64" y="894" width="700" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="926" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime consumes completed output</text><text x="82" y="954" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Durable owed-delivery receipts; watched-client demand</text><text x="82" y="979" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Storage subscribers consume the separate raw mutation tail</text><rect x="800" y="894" width="736" height="108" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="818" y="926" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Existing browser and storage contracts</text><text x="818" y="954" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Main frames; live storage events; independent alarm retries</text><text x="818" y="979" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Original credentials / mutation callbacks forwarded to API</text><rect x="48" y="1050" width="1504" height="80" rx="12" fill="#fff4dd" stroke="none" stroke-width="1.5"/><text x="68" y="1082" fill="#203248" font-size="20" font-weight="600" text-anchor="start">RECOVERY: cold start, GAP, settings expansion or missing history may read consistent source state.</text><text x="68" y="1110" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Disposable cache generations may change. Durable pending/completed/due/authority/restore outcomes govern correctness.</text><text x="48" y="1170" fill="#203248" font-size="25" font-weight="700" text-anchor="start">Communication planes — exact bindings, separate from placement</text><rect x="48" y="1192" width="1504" height="43" rx="0" fill="#e8edf4" stroke="none" stroke-width="1.5"/><text x="60" y="1220" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">PLANE</text><text x="177" y="1220" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">FROM → TO</text><text x="620" y="1220" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">BOUNDARY / TRANSPORT</text><rect x="48" y="1235" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1264" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">INPUT</text><text x="177" y="1264" fill="#203248" font-size="18" font-weight="400" text-anchor="start">pgstream → evaluator receiver</text><text x="620" y="1264" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Validate and persist coherent accepted cohorts before HTTP success; computation</text><text x="620" y="1289" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">and client/provider I/O are separate.</text><rect x="48" y="1309" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1338" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">OUTPUT</text><text x="177" y="1338" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Completed checkpoint → realtime</text><text x="620" y="1338" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Output hints accelerate delivery; durable completed state and receipts recover</text><text x="620" y="1363" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">missed wakes. No second raw clinical projection.</text><rect x="48" y="1383" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1412" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">RAW</text><text x="177" y="1412" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Accepted mutation tail → storage</text><text x="177" y="1437" fill="#203248" font-size="18" font-weight="400" text-anchor="start">subscribers</text><text x="620" y="1412" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Independent of clinical window membership. Live cursor, bounded continuity and</text><text x="620" y="1437" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">current-authority checks preserve source events.</text><rect x="48" y="1457" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1486" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">ALARM</text><text x="177" y="1486" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Evaluator notification state →</text><text x="177" y="1511" fill="#203248" font-size="18" font-weight="400" text-anchor="start">realtime</text><text x="620" y="1486" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Stable request identity, suppression, due retry and current authority; handoff is</text><text x="620" y="1511" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">not device acknowledgement or exactly-once delivery.</text><rect x="48" y="1531" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1560" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">LIFE</text><text x="177" y="1560" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Operator → exact current participant</text><text x="177" y="1585" fill="#203248" font-size="18" font-weight="400" text-anchor="start">roster</text><text x="620" y="1560" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Drain/invalidation and ownership/restore fences remain. Explicit recovery and</text><text x="620" y="1585" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">revision-pair admission precede reopening.</text><text x="48" y="1641" fill="#52647a" font-size="17" font-weight="400" text-anchor="start">Source: core 5e112547b31252ec428747c821d3cd1b3684ce2b; architecture: evaluator-realtime-communication.md.</text><text x="48" y="1669" fill="#956116" font-size="18" font-weight="600" text-anchor="start">Functional qualification is distinct from capacity, production trust, live provider delivery, HA and fleet admission.</text><polyline points="800,376 800,414" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,405 805,405 800,414" fill="#365aa2"/><polyline points="800,592 800,630" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,621 805,621 800,630" fill="#365aa2"/><polyline points="800,808 800,846" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,837 805,837 800,846" fill="#365aa2"/></g></svg>
