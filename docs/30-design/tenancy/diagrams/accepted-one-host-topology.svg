<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1929" viewBox="0 0 1600 1929" role="img" aria-labelledby="title desc"><title id="title">accepted one host topology</title><desc id="desc">Top-to-bottom trust zones, logical endpoints and role instances. Communication planes are listed explicitly to avoid ambiguous crossing connections. Physical placement is stated separately.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365aa2"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="2400" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="48" y="56" fill="#203248" font-size="34" font-weight="700" text-anchor="start">Accepted one-host reference</text><text x="48" y="93" fill="#52647a" font-size="20" font-weight="400" text-anchor="start">Source-attributed structure • synthetic deployment • no production admission</text><rect x="48" y="118" width="1504" height="55" rx="12" fill="#e7f4ef" stroke="none" stroke-width="1.5"/><text x="68" y="153" fill="#24654a" font-size="21" font-weight="700" text-anchor="start">ACCEPTED BOUNDED REFERENCE  |  ed2 cold Compose/UI/restore; c23 native restart proof</text><rect x="32" y="198" width="1536" height="134" rx="14" fill="#f1f5fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="228" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">1  CLIENT / LAB INGRESS</text><text x="1548" y="228" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Reachability is not tenant authority</text><rect x="300" y="246" width="1000" height="70" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="318" y="273" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Synthetic clients, browsers and tenant aliases</text><text x="318" y="296" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Lab DNS / hosts → host-published HTTP address; no accepted external L4 load balancer</text><rect x="32" y="350" width="1536" height="167" rx="14" fill="#eef6f6" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="380" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">2  EDGE TRUST BOUNDARY</text><text x="1548" y="380" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Accepted public-facing protocol: HTTP</text><rect x="64" y="392" width="1472" height="94" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="424" fill="#203248" font-size="23" font-weight="700" text-anchor="start">nginx — logical routing</text><text x="82" y="452" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Preserve configured Host; strip selector headers; public owner/operator paths refused</text><rect x="32" y="535" width="1536" height="105" rx="14" fill="#f3f5fa" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="565" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">3  LOGICAL PUBLIC ENDPOINTS</text><text x="1548" y="565" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Endpoints are not extra processes</text><rect x="64" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI / assets</text><text x="82" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Shipping UI</text><rect x="572" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">REST APIs</text><text x="590" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Admitted versioned routes</text><rect x="1080" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">DATA / realtime</text><text x="1098" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Main and alarm sockets</text><rect x="32" y="659" width="1536" height="330" rx="14" fill="#f8f9fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="689" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">4  PRIVATE APPLICATION RUNTIME</text><text x="1548" y="689" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Separate role processes; fixed participant roster</text><rect x="64" y="706" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI process</text><text x="82" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Templates and assets</text><text x="82" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No DB credentials</text><text x="82" y="811" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">DATA: public edge only</text><rect x="572" y="706" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">REST APIs process</text><text x="590" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Admitted v1 / v2 / v3 adapters</text><text x="590" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Stateless request serving</text><text x="590" y="811" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG: role grant  ·  Vault: scoped</text><rect x="1080" y="706" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime process</text><text x="1098" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Owns connections / frames</text><text x="1098" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Forwards mutations to API</text><text x="1098" y="811" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG: reader grant  ·  U1 / U2</text><rect x="64" y="846" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="878" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Evaluator process</text><text x="82" y="906" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Clinical projection / intents</text><text x="82" y="931" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">One active reference instance</text><text x="82" y="951" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG: declared grant  ·  U2</text><rect x="572" y="846" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="878" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Tenant-admin process</text><text x="590" y="906" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">OWNER control, private</text><text x="590" y="931" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separate audience / listener</text><text x="590" y="951" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG: management grant  ·  C</text><rect x="1080" y="846" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="878" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Maintenance controller</text><text x="1098" y="906" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Private operator invocation</text><text x="1098" y="931" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Addresses each participant</text><text x="1098" y="951" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG: maintenance grant  ·  C</text><rect x="48" y="1006" width="1504" height="55" rx="12" fill="#edf1f6" stroke="none" stroke-width="1.5"/><text x="68" y="1040" fill="#203248" font-size="19" font-weight="600" text-anchor="start">PHYSICAL PLACEMENT: one host / Compose backend network; private shared Unix-socket directory.</text><rect x="32" y="1079" width="1536" height="157" rx="14" fill="#f0f7f3" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="1109" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">5  BACKING RESOURCES</text><text x="1548" y="1109" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Authority and durable state; per-role grants, no implied all-to-all access</text><rect x="64" y="1121" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="1153" fill="#203248" font-size="23" font-weight="700" text-anchor="start">PostgreSQL</text><text x="82" y="1181" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Tenant data, authority, operations</text><text x="82" y="1206" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Direct connections / forced RLS</text><rect x="572" y="1121" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="1153" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Vault Transit — TLS</text><text x="590" y="1181" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Scoped protected keys / secrets</text><text x="590" y="1206" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Generated lab credentials</text><rect x="1080" y="1121" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="1153" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Recovery artifacts</text><text x="1098" y="1181" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Explicit operator-owned snapshots</text><text x="1098" y="1206" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separate from disposable runtime</text><text x="48" y="1280" fill="#203248" font-size="25" font-weight="700" text-anchor="start">Communication planes — exact bindings, separate from placement</text><rect x="48" y="1302" width="1504" height="43" rx="0" fill="#e8edf4" stroke="none" stroke-width="1.5"/><text x="60" y="1330" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">PLANE</text><text x="177" y="1330" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">FROM → TO</text><text x="620" y="1330" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">BOUNDARY / TRANSPORT</text><rect x="48" y="1345" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1374" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">DATA</text><text x="177" y="1374" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Edge → UI / API / realtime</text><text x="620" y="1374" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">HTTP public origin inside the synthetic reference. Owner and operator routes are</text><text x="620" y="1399" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">refused at this edge.</text><rect x="48" y="1419" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1448" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">U1</text><text x="177" y="1448" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Realtime → API</text><text x="620" y="1448" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">HTTP POST/JSON over private Unix socket; authorization and mutation forwarding</text><text x="620" y="1473" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">preserve current tenant/client authority.</text><rect x="48" y="1493" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1522" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">U2</text><text x="177" y="1522" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Evaluator → realtime</text><text x="620" y="1522" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Private Unix socket alarm/notification handoff. Raw socket frames and evaluator-</text><text x="620" y="1547" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">derived values remain different products.</text><rect x="48" y="1567" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1596" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">C</text><text x="177" y="1596" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Controller → API, realtime,</text><text x="177" y="1621" fill="#203248" font-size="18" font-weight="400" text-anchor="start">evaluator, tenant-admin</text><text x="620" y="1596" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Private Unix control sockets: fixed per-instance roster, pinned incarnation, drain</text><text x="620" y="1621" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">and invalidation acknowledgement. Never a load-balanced substitute.</text><rect x="48" y="1641" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1670" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">STORE</text><text x="177" y="1670" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Role → PostgreSQL / scoped Vault</text><text x="620" y="1670" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Each role uses its own effective grant. API uses the scoped secret provider.</text><text x="620" y="1695" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">UI/nginx have no DB credentials. Bootstrap is explicit operator work.</text><rect x="48" y="1715" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1744" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">OWNER</text><text x="177" y="1744" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Private owner client → tenant-admin</text><text x="620" y="1744" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separate authenticated owner listener/audience. No public owner route in the</text><text x="620" y="1769" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">accepted Compose edge; maintenance is never a public endpoint.</text><text x="48" y="1825" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Source scope: ed2ced00 cold image/UI/restore/client evidence; c23cf1f3 native separate-role restart evidence.</text><text x="48" y="1853" fill="#956116" font-size="18" font-weight="600" text-anchor="start">No OIDC capability, external ingress TLS, multi-host transport, HA or capacity acceptance is implied.</text><text x="48" y="1881" fill="#52647a" font-size="17" font-weight="400" text-anchor="start">Evidence: reports/tenancy/operation-window-acceptance-2026-11-07/README.md</text><polyline points="800,316 800,350" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,341 805,341 800,350" fill="#365aa2"/><polyline points="292,486 292,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="287,526 297,526 292,535" fill="#365aa2"/><polyline points="800,486 800,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,526 805,526 800,535" fill="#365aa2"/><polyline points="1308,486 1308,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1303,526 1313,526 1308,535" fill="#365aa2"/><polyline points="292,637 292,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="287,650 297,650 292,659" fill="#365aa2"/><polyline points="800,637 800,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,650 805,650 800,659" fill="#365aa2"/><polyline points="1308,637 1308,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1303,650 1313,650 1308,659" fill="#365aa2"/></g></svg>
