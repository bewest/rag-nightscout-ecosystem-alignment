<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2116" viewBox="0 0 1600 2116" role="img" aria-labelledby="title desc"><title id="title">current internal api topology</title><desc id="desc">Top-to-bottom trust zones, logical endpoints and role instances. Communication planes are listed explicitly to avoid ambiguous crossing connections. Physical placement is stated separately.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365aa2"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="2400" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="48" y="56" fill="#203248" font-size="34" font-weight="700" text-anchor="start">Current private API composition</text><text x="48" y="93" fill="#52647a" font-size="20" font-weight="400" text-anchor="start">Read-derived from joined dc795bd1 • reference bindings, not universal port defaults</text><rect x="48" y="118" width="1504" height="55" rx="12" fill="#e7f4ef" stroke="none" stroke-width="1.5"/><text x="68" y="153" fill="#24654a" font-size="21" font-weight="700" text-anchor="start">IMPLEMENTED CONTRACTS  |  UDS reference + explicit HTTP adapter; one contract per listener</text><rect x="32" y="198" width="1536" height="134" rx="14" fill="#f1f5fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="228" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">1  CLIENT / REFERENCE INGRESS</text><text x="1548" y="228" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Network reachability and application authority are separate</text><rect x="300" y="246" width="1000" height="70" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="318" y="273" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Browsers, apps, uploaders and owner/operator clients</text><text x="318" y="296" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Only nginx is host-published by the synthetic Compose binding</text><rect x="32" y="350" width="1536" height="167" rx="14" fill="#eef6f6" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="380" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">2  EDGE TRUST BOUNDARY</text><text x="1548" y="380" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">nginx already handles HTTP proxying and WebSocket upgrade/tunnel</text><rect x="64" y="392" width="1472" height="94" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="424" fill="#203248" font-size="23" font-weight="700" text-anchor="start">nginx — reference container :8080; host 127.0.0.1:18080</text><text x="82" y="452" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Routes consumer API / UI / Socket.IO; does not publish private service or operator control endpoints</text><rect x="32" y="535" width="1536" height="105" rx="14" fill="#f3f5fa" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="565" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">3  CONSUMER CONTRACTS</text><text x="1548" y="565" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Consumer/management HTTP is separate from private API listeners</text><rect x="64" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI / assets</text><text x="82" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Backend HTTP :1340</text><rect x="572" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">REST APIs</text><text x="590" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Backend HTTP :1337</text><rect x="1080" y="577" width="456" height="60" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="604" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime / Socket.IO</text><text x="1098" y="627" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Backend HTTP :1339</text><rect x="32" y="659" width="1536" height="450" rx="14" fill="#f8f9fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="689" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">4  ACTUAL ROLE PROCESSES</text><text x="1548" y="689" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Application and lifecycle are both PRIVATE API categories</text><rect x="64" y="706" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI process</text><text x="82" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Page / assets listener :1340</text><text x="82" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No private API in this binding</text><text x="82" y="816" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No database credentials</text><text x="82" y="869" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Consumer HTTP only</text><rect x="572" y="706" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">REST APIs process</text><text x="590" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Consumer HTTP :1337</text><text x="590" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Application: api.sock</text><text x="590" y="816" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Lifecycle: cohort-api.sock</text><text x="590" y="841" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Current authority + mutation executor</text><text x="590" y="869" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Private: socket-authority + lifecycle</text><rect x="1080" y="706" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="738" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime process</text><text x="1098" y="766" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Consumer Socket.IO :1339</text><text x="1098" y="791" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Application: alarm.sock</text><text x="1098" y="816" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Lifecycle: cohort-realtime.sock</text><text x="1098" y="841" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Owns sessions / fanout / messages</text><text x="1098" y="869" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Private: alarm-delivery + lifecycle</text><rect x="64" y="904" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="936" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Evaluator process</text><text x="82" y="964" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No consumer HTTP listener</text><text x="82" y="989" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Lifecycle: cohort-evaluator.sock</text><text x="82" y="1014" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">health() is in-process</text><text x="82" y="1039" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No ring / metrics API yet</text><text x="82" y="1067" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Calls realtime notification delivery</text><rect x="572" y="904" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="936" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Tenant-admin process</text><text x="590" y="964" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Management HTTP :1341</text><text x="590" y="989" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Not routed by reference edge</text><text x="590" y="1014" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">cohort-tenant-admin.sock</text><text x="590" y="1039" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Scoped owner / management authority</text><text x="590" y="1067" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Private lifecycle listener is separate</text><rect x="1080" y="904" width="456" height="178" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="936" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Maintenance jobs</text><text x="1098" y="964" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Operator-invoked bootstrap / restore</text><text x="1098" y="989" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">No inbound listener</text><text x="1098" y="1014" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Direct participant endpoints</text><text x="1098" y="1039" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Pins actual process incarnations</text><text x="1098" y="1067" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">Consumes private lifecycle API</text><rect x="48" y="1126" width="1504" height="72" rx="12" fill="#edf1f6" stroke="none" stroke-width="1.5"/><text x="68" y="1155" fill="#203248" font-size="18" font-weight="600" text-anchor="start">REFERENCE: one host / Compose backend; private socket files carry HTTP, not a separate wire protocol.</text><text x="68" y="1181" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">ALTERNATIVE: explicit private HTTP origin + optional bind address. Network access policy belongs to deployment.</text><rect x="32" y="1216" width="1536" height="157" rx="14" fill="#f0f7f3" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="1246" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">5  BACKING RESOURCES</text><text x="1548" y="1246" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Role-scoped authority is unchanged by listener or transport choice</text><rect x="64" y="1258" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="1290" fill="#203248" font-size="23" font-weight="700" text-anchor="start">PostgreSQL</text><text x="82" y="1318" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Clinical / authority / lifecycle state</text><text x="82" y="1343" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separate role-scoped connections</text><rect x="572" y="1258" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="1290" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Vault Transit — HTTPS</text><text x="590" y="1318" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Configured API provider / bootstrap</text><text x="590" y="1343" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Deployment-managed access</text><rect x="1080" y="1258" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="1290" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Recovery artifacts</text><text x="1098" y="1318" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Operator-owned snapshots</text><text x="1098" y="1343" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Claim-bound restore operations</text><text x="48" y="1417" fill="#203248" font-size="25" font-weight="700" text-anchor="start">Communication planes — exact bindings, separate from placement</text><rect x="48" y="1439" width="1504" height="43" rx="0" fill="#e8edf4" stroke="none" stroke-width="1.5"/><text x="60" y="1467" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">PLANE</text><text x="177" y="1467" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">FROM → TO</text><text x="620" y="1467" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">BOUNDARY / TRANSPORT</text><rect x="48" y="1482" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1511" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">DATA</text><text x="177" y="1511" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Client → nginx → consumer listener</text><text x="620" y="1511" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Reference HTTP routing and WebSocket upgrade. Realtime still owns application</text><text x="620" y="1536" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">protocol, subscriptions, fanout and exact message authorization.</text><rect x="48" y="1556" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1585" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">APP-1</text><text x="177" y="1585" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Evaluator → realtime</text><text x="620" y="1585" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">deliverAlarm: notification handoff, not an arbitrary proxy. Reference alarm.sock;</text><text x="620" y="1610" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">a private HTTP endpoint can bind the same contract.</text><rect x="48" y="1630" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1659" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">APP-2</text><text x="177" y="1659" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Realtime → API</text><text x="620" y="1659" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">authorizeSocket and executeSocketMutation: current permissions and authorized</text><text x="620" y="1684" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">writes/ACKs. Delivery can itself check recipient authority.</text><rect x="48" y="1704" width="1504" height="99" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1733" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">LIFE</text><text x="177" y="1733" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Controller → each role instance</text><text x="620" y="1733" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Private getStatus / invalidateTenant. Exact instance roster, actual incarnation</text><text x="620" y="1758" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">and drain/invalidation rules remain. Lifecycle is purpose, not a different</text><text x="620" y="1783" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">transport.</text><rect x="48" y="1803" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1832" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">OPS</text><text x="177" y="1832" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Process health / future operational</text><text x="177" y="1857" fill="#203248" font-size="18" font-weight="400" text-anchor="start">APIs</text><text x="620" y="1832" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Evaluator health is in-process. General remote readiness/metrics contracts and</text><text x="620" y="1857" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">shared private-listener composition are not implemented here.</text><rect x="48" y="1877" width="1504" height="99" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1906" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">TRUST</text><text x="177" y="1906" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Deployment → private listener</text><text x="177" y="1931" fill="#203248" font-size="18" font-weight="400" text-anchor="start">reachability</text><text x="620" y="1906" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">UDS uses protected paths/service UID; HTTP uses explicit network trust.</text><text x="620" y="1931" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Service/version headers identify contracts, not credentials. No new bearer</text><text x="620" y="1956" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">protocol.</text><text x="48" y="2012" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Source: dc795bd1 shared transport, contracts and consuming roles; later 692bd507 changes application documentation only.</text><text x="48" y="2040" fill="#956116" font-size="18" font-weight="600" text-anchor="start">Acceptance: joined dc795bd1 campaign; HTTP beyond loopback, Kubernetes and multi-host admission remain UNMEASURED.</text><text x="48" y="2068" fill="#52647a" font-size="17" font-weight="400" text-anchor="start">Evidence: reports/tenancy/m6a-join-2026-11-09/dc795bd1-acceptance/; diagram is a read-derived view.</text><polyline points="800,316 800,350" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,341 805,341 800,350" fill="#365aa2"/><polyline points="292,486 292,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="287,526 297,526 292,535" fill="#365aa2"/><polyline points="800,486 800,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,526 805,526 800,535" fill="#365aa2"/><polyline points="1308,486 1308,535" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1303,526 1313,526 1308,535" fill="#365aa2"/><polyline points="292,637 292,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="287,650 297,650 292,659" fill="#365aa2"/><polyline points="800,637 800,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,650 805,650 800,659" fill="#365aa2"/><polyline points="1308,637 1308,659" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1303,650 1313,650 1308,659" fill="#365aa2"/></g></svg>
