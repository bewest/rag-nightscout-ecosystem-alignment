<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2174" viewBox="0 0 1600 2174" role="img" aria-labelledby="title desc"><title id="title">proposed fixed roster network topology</title><desc id="desc">Top-to-bottom trust zones, logical endpoints and role instances. Communication planes are listed explicitly to avoid ambiguous crossing connections. Physical placement is stated separately.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365aa2"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="2400" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="48" y="56" fill="#203248" font-size="34" font-weight="700" text-anchor="start">Proposed fixed-roster network target</text><text x="48" y="93" fill="#52647a" font-size="20" font-weight="400" text-anchor="start">Logical service endpoints • explicit instances • topology and transport require acceptance</text><rect x="48" y="118" width="1504" height="55" rx="12" fill="#fff4dd" stroke="none" stroke-width="1.5"/><text x="68" y="153" fill="#956116" font-size="21" font-weight="700" text-anchor="start">PROPOSED — NOT IMPLEMENTED / NOT ACCEPTED  |  Fixed API scale-out; singleton evaluator and realtime</text><rect x="32" y="198" width="1536" height="115" rx="14" fill="#f1f5fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="228" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">1  PUBLIC / DMZ</text><text x="1548" y="228" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">DNS supplies reachability, not permission</text><rect x="300" y="241" width="1000" height="64" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="318" y="268" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Clients / browsers → public DNS name</text><text x="318" y="291" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Permanent or temporary name binds to current tenant/access policy</text><rect x="32" y="332" width="1536" height="115" rx="14" fill="#eef3fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="362" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">2  PUBLIC REACHABILITY</text><text x="1548" y="362" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">L4 transport routing, not application authority</text><rect x="300" y="369" width="1000" height="70" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="318" y="396" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Public address / L4 load balancer</text><text x="318" y="419" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Forwards to the declared trusted edge; peer/source-address behavior must be measured</text><rect x="32" y="466" width="1536" height="126" rx="14" fill="#eef6f6" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="496" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">3  TRUSTED HTTP EDGE</text><text x="1548" y="496" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">TLS + Host / client identity / access-policy boundary</text><rect x="64" y="503" width="1472" height="76" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="530" fill="#203248" font-size="23" font-weight="700" text-anchor="start">nginx — TLS termination and logical routing</text><text x="82" y="553" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">DATA paths and socket upgrades; OWNER only through separately authenticated route/listener</text><rect x="32" y="610" width="1536" height="100" rx="14" fill="#f3f5fa" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="640" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">4  LOGICAL SERVICE ENDPOINTS</text><text x="1548" y="640" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Not an all-role load-balancing layer</text><rect x="64" y="650" width="330" height="58" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="677" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI endpoint</text><text x="82" y="700" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Pages / assets</text><rect x="436" y="650" width="728" height="58" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="454" y="677" fill="#203248" font-size="23" font-weight="700" text-anchor="start">API service endpoint</text><text x="454" y="700" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Selects one admitted API1 / API2 instance</text><rect x="1206" y="650" width="330" height="58" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1224" y="677" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime endpoint</text><text x="1224" y="700" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">One connection owner</text><rect x="32" y="730" width="1536" height="327" rx="14" fill="#f8f9fb" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="760" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">5  PRIVATE APPLICATION RUNTIME</text><text x="1548" y="760" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Fixed roster; no autoscaling / dynamic membership claim</text><rect x="64" y="780" width="356" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="812" fill="#203248" font-size="23" font-weight="700" text-anchor="start">UI process</text><text x="82" y="840" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Templates / assets</text><text x="82" y="885" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">No DB grant</text><rect x="436" y="780" width="356" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="454" y="812" fill="#203248" font-size="23" font-weight="700" text-anchor="start">API1</text><text x="454" y="840" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Stateless request serving</text><text x="454" y="865" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Reconstructible local state</text><text x="454" y="885" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG role grant  ·  N1 / C1</text><rect x="808" y="780" width="356" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="826" y="812" fill="#203248" font-size="23" font-weight="700" text-anchor="start">API2</text><text x="826" y="840" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Stateless request serving</text><text x="826" y="865" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Reconstructible local state</text><text x="826" y="885" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG role grant  ·  N1 / C2</text><rect x="1180" y="780" width="356" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1198" y="812" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Realtime</text><text x="1198" y="840" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Owns connected sockets</text><text x="1198" y="865" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Single target instance</text><text x="1198" y="885" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG reader grant  ·  N2 / C3</text><rect x="64" y="920" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="952" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Evaluator — one producer</text><text x="82" y="980" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Singleton; no replication</text><text x="82" y="1005" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Stable partitions are future work</text><text x="82" y="1025" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG declared grant  ·  N2 / C4</text><rect x="572" y="920" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="952" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Owner REST module</text><text x="590" y="980" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">May co-locate with API</text><text x="590" y="1005" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separate auth and listener</text><text x="590" y="1025" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG management grant  ·  C5</text><rect x="1080" y="920" width="456" height="120" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="952" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Private maintenance controller</text><text x="1098" y="980" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Platform/config roster input</text><text x="1098" y="1005" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">C1…C5 per-instance fanout</text><text x="1098" y="1025" fill="#147d83" font-size="16" font-weight="600" text-anchor="start">PG maintenance grant  ·  C</text><rect x="48" y="1073" width="1504" height="62" rx="12" fill="#fff4dd" stroke="none" stroke-width="1.5"/><text x="68" y="1100" fill="#203248" font-size="18" font-weight="600" text-anchor="start">PLACEMENT IS FLEXIBLE: role boxes do not require separate deployments; REST modules may co-locate.</text><text x="68" y="1125" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Host count does not select replica ownership. L4/API load balancing never replaces per-instance maintenance endpoints.</text><rect x="32" y="1153" width="1536" height="158" rx="14" fill="#f0f7f3" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="1183" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">6  BACKING RESOURCES</text><text x="1548" y="1183" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Durability, recovery and effective grants remain explicit</text><rect x="64" y="1195" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="82" y="1227" fill="#203248" font-size="23" font-weight="700" text-anchor="start">PostgreSQL</text><text x="82" y="1255" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Tenant / operation authority</text><text x="82" y="1280" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Aggregate API pools need limits</text><rect x="572" y="1195" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="590" y="1227" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Vault Transit — TLS</text><text x="590" y="1255" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Scoped keys / service login</text><text x="590" y="1280" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Renewal and recovery admission</text><rect x="1080" y="1195" width="456" height="100" rx="12" fill="#fff" stroke="#c8d3e0" stroke-width="1.5"/><text x="1098" y="1227" fill="#203248" font-size="23" font-weight="700" text-anchor="start">Durable recovery artifacts</text><text x="1098" y="1255" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Declared store and ownership</text><text x="1098" y="1280" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Verify restores and retained keys</text><rect x="32" y="1328" width="1536" height="101" rx="14" fill="#f8f0fc" stroke="#d8e0e9" stroke-width="1.5"/><text x="52" y="1358" fill="#52647a" font-size="18" font-weight="700" text-anchor="start">EXTERNAL HUMAN IDENTITY — SEPARATE CAPABILITY</text><text x="1548" y="1358" fill="#52647a" font-size="17" font-weight="400" text-anchor="end">Source capability; not accepted in ed2</text><text x="68" y="1387" fill="#52647a" font-size="19" font-weight="400" text-anchor="start">OIDC IdP ↔ optional shared human-session integration: separate current-authority adapter; no implicit DATA/root grant.</text><text x="48" y="1472" fill="#203248" font-size="25" font-weight="700" text-anchor="start">Communication planes — exact bindings, separate from placement</text><rect x="48" y="1494" width="1504" height="43" rx="0" fill="#e8edf4" stroke="none" stroke-width="1.5"/><text x="60" y="1522" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">PLANE</text><text x="177" y="1522" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">FROM → TO</text><text x="620" y="1522" fill="#52647a" font-size="16" font-weight="700" text-anchor="start">BOUNDARY / TRANSPORT</text><rect x="48" y="1537" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1566" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">DATA</text><text x="177" y="1566" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Edge → UI / API service / realtime</text><text x="620" y="1566" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">TLS public ingress; tenant selection, current access policy and client authority</text><text x="620" y="1591" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">still apply. Public operator ingress is forbidden.</text><rect x="48" y="1611" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1640" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">N1</text><text x="177" y="1640" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Realtime → API service → API1 or</text><text x="177" y="1665" fill="#203248" font-size="18" font-weight="400" text-anchor="start">API2</text><text x="620" y="1640" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Proposed configurable Unix or HTTP(S) client/listener binding. Network trust</text><text x="620" y="1665" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">authenticates the internal caller; tenant/client authorization stays unchanged.</text><rect x="48" y="1685" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1714" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">N2</text><text x="177" y="1714" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Evaluator singleton → realtime</text><text x="177" y="1739" fill="#203248" font-size="18" font-weight="400" text-anchor="start">singleton</text><text x="620" y="1714" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Proposed qualified network alarm/notification handoff. Replicating realtime would</text><text x="620" y="1739" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">separately require fanout/delivery ownership; not included here.</text><rect x="48" y="1759" width="1504" height="99" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1788" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">C1…C5</text><text x="177" y="1788" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Controller → each exact role</text><text x="177" y="1813" fill="#203248" font-size="18" font-weight="400" text-anchor="start">instance</text><text x="620" y="1788" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Address API1, API2, realtime, evaluator and tenant-admin individually with</text><text x="620" y="1813" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">authenticated identity and pinned incarnation. Status/drain/invalidate cannot use</text><text x="620" y="1838" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">API load balancing.</text><rect x="48" y="1858" width="1504" height="74" rx="0" fill="#f5f8fb" stroke="none" stroke-width="1.5"/><text x="60" y="1887" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">STORE</text><text x="177" y="1887" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Each role → declared backing</text><text x="177" y="1912" fill="#203248" font-size="18" font-weight="400" text-anchor="start">capabilities</text><text x="620" y="1887" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Effective per-role PostgreSQL grants; scoped API/secret-provider Vault access. No</text><text x="620" y="1912" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">blanket all-role database, Vault or artifact-store authority.</text><rect x="48" y="1932" width="1504" height="74" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="60" y="1961" fill="#147d83" font-size="18" font-weight="700" text-anchor="start">OWNER</text><text x="177" y="1961" fill="#203248" font-size="18" font-weight="400" text-anchor="start">Owner client → authenticated private</text><text x="177" y="1986" fill="#203248" font-size="18" font-weight="400" text-anchor="start">control</text><text x="620" y="1961" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Separately authenticated listener or admitted edge route. Optional OIDC requires</text><text x="620" y="1986" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">its own joined provider/session acceptance; operator control remains private.</text><text x="48" y="2042" fill="#956116" font-size="18" font-weight="600" text-anchor="start">Network adapter is proposed. HTTP requires an admitted private trust profile; HTTPS still requires caller authorization.</text><text x="48" y="2070" fill="#52647a" font-size="18" font-weight="400" text-anchor="start">Acceptance: concurrent APIs, current authority, all-instance drains/invalidation, replacement, partition, ambiguity and pool/load bounds.</text><text x="48" y="2098" fill="#956116" font-size="18" font-weight="600" text-anchor="start">No custom membership service/scheduler, dynamic roster, replicated evaluator/realtime or production/HA claim.</text><text x="48" y="2126" fill="#52647a" font-size="17" font-weight="400" text-anchor="start">Design source: docs/30-design/tenancy/deployment-bindings-and-public-names.md (2026-11-08).</text><polyline points="800,305 800,332" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,323 805,323 800,332" fill="#365aa2"/><polyline points="800,439 800,466" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,457 805,457 800,466" fill="#365aa2"/><polyline points="229,579 229,610" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="224,601 234,601 229,610" fill="#365aa2"/><polyline points="800,579 800,610" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="795,601 805,601 800,610" fill="#365aa2"/><polyline points="1371,579 1371,610" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1366,601 1376,601 1371,610" fill="#365aa2"/><polyline points="229,708 229,730" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="224,721 234,721 229,730" fill="#365aa2"/><polyline points="614,708 614,730" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="609,721 619,721 614,730" fill="#365aa2"/><polyline points="986,708 986,730" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="981,721 991,721 986,730" fill="#365aa2"/><polyline points="1358,708 1358,730" fill="none" stroke="#365aa2" stroke-width="2.4"/><polygon points="1353,721 1363,721 1358,730" fill="#365aa2"/></g></svg>
