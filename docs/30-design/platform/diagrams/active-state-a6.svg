<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A6 · Deletion</title>
<desc>A6 · Deletion: A delete removes the write it names: by _id, as a delete by id carries no other field, or by identity. A soft delete (a write with isValid: false) removes its identity. An instance with no live write left is listed as ended deletedBeforeStart, and is never active and ends nothing, when the delete was received before its start; otherwise it is not reported, as a deleted document is not today. A re-post received before the delete of the record it replaces still amends the instance. Cases drawn: deleted-before-start: A record deleted before its start is listed as ended, deleted before start, and is never active; scheduled-not-deleted: The same scheduled record, not deleted, is active from its start; delete-after-start-withdraws: A record deleted after its start and not re-posted is not reported; delete-and-repost-amends: A delete followed by a re-post of the same identity amends the instance; soft-delete-before-start: A soft delete before the start is a deletion before start.</desc>
<rect x="0" y="0" width="720" height="1104" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A6 · Deletion</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
