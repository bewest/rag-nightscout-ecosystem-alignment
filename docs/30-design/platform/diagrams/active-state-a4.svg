<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A4 · End from the declared duration</title>
<desc>A4 · End from the declared duration: An instance ends at its start plus durationField in durationUnit. A record carrying the indefinite sentinel, or no duration, is open-ended. Cases drawn: running-mode-original-duration: A loop-disabled mode shortened in originalDuration ends, whatever its placeholder wire duration; running-mode-open-ended: The same mode, not shortened, stays active; permanent-profile-switch-returns: A permanent profile switch (duration 0) stays active and applies again after a temporary one.</desc>
<rect x="0" y="0" width="720" height="740" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A4 · End from the declared duration</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
