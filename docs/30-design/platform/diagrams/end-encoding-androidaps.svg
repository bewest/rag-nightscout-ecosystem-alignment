<text x="18" y="797" font-size="12" fill="#555555">duration: originalDuration in milliseconds; open-ended: originalDuration = 0</text>
<text x="18" y="813" font-size="12" fill="#555555">slot runningMode · exclusiveWithinSlot · supersedes · overlay · coexists with profileSwitch, temporaryTarget, scene</text>
