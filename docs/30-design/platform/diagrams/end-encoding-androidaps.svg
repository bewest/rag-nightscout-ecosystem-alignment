<text x="162" y="462" font-size="12" fill="#111111">cancelBeforeStartEncoding: soft-delete</text>
<text x="18" y="482" font-size="12" fill="#111111">scheduled, then</text>
<line x1="204.9" y1="468" x2="204.9" y2="488" stroke="#555555" stroke-width="1" stroke-dasharray="2,2"/>
<rect x="290.6" y="472" width="107.2" height="12" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M200.4,473.5 L209.4,482.5 M200.4,482.5 L209.4,473.5" stroke="#d03b3b" stroke-width="2" fill="none"/>
