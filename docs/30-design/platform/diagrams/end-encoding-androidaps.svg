<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1013" viewBox="0 0 720 1013" font-family="Helvetica, Arial, sans-serif" role="img">
<title>How AndroidAPS encodes an end, per intent kind</title>
<desc>How AndroidAPS encodes an end, per intent kind. ProfileState: ended amend-duration; TemporaryTarget: ended amend-duration; LoopMode: ended amend-duration; Scene: ended not declared. read-derived, specs/sync/registrations/androidaps.yaml; controller source cited by its evidence: AndroidAPS 7e1d537d49.</desc>
<rect x="0" y="0" width="720" height="1013" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">How AndroidAPS encodes an end, per intent kind</text>
<text x="12" y="44" font-size="12" fill="#555555">Schematic, not to scale. Black bars are the records the controller writes (dashed: scheduled, not yet started); the blue bar is the</text>
<text x="12" y="59" font-size="12" fill="#555555">instance a hub derives from them under the state and intent rules named in brackets. k is one identity value, D a duration.</text>
<rect x="12" y="82" width="696" height="246" rx="6" fill="#f4f4f4"/>
<text x="18" y="100" font-size="12.5" fill="#111111" font-weight="bold">ProfileState · ProfileSwitch</text>
<text x="18" y="122" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="122" font-size="12" fill="#111111">endedEncoding: amend-duration</text>
<text x="18" y="142" font-size="12" fill="#111111">write 1</text>
<rect x="183.4" y="132" width="214.4" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="405.8" y="142" font-size="12" fill="#111111">identifier = k, duration D</text>
<text x="18" y="162" font-size="12" fill="#111111">write 2 (amend)</text>
<rect x="183.4" y="152" width="107.2" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="298.6" y="162" font-size="12" fill="#111111">same identifier = k, duration shortened</text>
<text x="18" y="182" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="172" width="107.2" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<line x1="290.6" y1="170" x2="290.6" y2="186" stroke="#1f5fa8" stroke-width="2"/>
<text x="298.6" y="182" font-size="12" fill="#111111">ends early: cancelled (A5)</text>
<text x="18" y="206" font-size="12" fill="#555555" font-weight="bold">cancelled before start</text>
<text x="162" y="206" font-size="12" fill="#111111">cancelBeforeStartEncoding: soft-delete</text>
<text x="18" y="226" font-size="12" fill="#111111">scheduled, then</text>
<line x1="204.9" y1="212" x2="204.9" y2="232" stroke="#555555" stroke-width="1" stroke-dasharray="2,2"/>
<rect x="290.6" y="216" width="107.2" height="12" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M200.4,217.5 L209.4,226.5 M200.4,226.5 L209.4,217.5" stroke="#d03b3b" stroke-width="2" fill="none"/>
