<text x="18" y="694" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="684" width="107.2" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<line x1="290.6" y1="682" x2="290.6" y2="698" stroke="#1f5fa8" stroke-width="2"/>
