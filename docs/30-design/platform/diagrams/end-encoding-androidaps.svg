<text x="18" y="525" font-size="12" fill="#555555">carrier: treatments, eventType Temporary Target; identity: identifier</text>
<text x="18" y="541" font-size="12" fill="#555555">duration: duration in minutes</text>
<text x="18" y="557" font-size="12" fill="#555555">slot temporaryTarget · exclusiveWithinSlot · supersedes · coexists with profileSwitch, runningMode, scene</text>
<text x="18" y="573" font-size="12" fill="#555555">end reasons: superseded</text>
<rect x="12" y="594" width="696" height="246" rx="6" fill="#f4f4f4"/>
<text x="18" y="612" font-size="12.5" fill="#111111" font-weight="bold">LoopMode · RunningMode</text>
<text x="18" y="634" font-size="12" fill="#555555" font-weight="bold">ended early</text>
