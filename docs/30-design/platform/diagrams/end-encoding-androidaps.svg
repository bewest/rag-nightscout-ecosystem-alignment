<text x="18" y="246" font-size="12" fill="#1f5fa8">instance</text>
<text x="183.4" y="246" font-size="12" fill="#111111">ended deletedBeforeStart, never active (A6)</text>
<text x="18" y="269" font-size="12" fill="#555555">carrier: treatments, eventType Profile Switch; identity: identifier</text>
<text x="18" y="285" font-size="12" fill="#555555">duration: duration in minutes; open-ended: duration = 0</text>
<text x="18" y="301" font-size="12" fill="#555555">slot profileSwitch · exclusiveWithinSlot · supersedes · overlay · coexists with temporaryTarget, runningMode, scene</text>
<text x="18" y="317" font-size="12" fill="#555555">end reasons: not declared</text>
<rect x="12" y="338" width="696" height="246" rx="6" fill="#f4f4f4"/>
