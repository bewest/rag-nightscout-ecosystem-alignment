<title>Two hubs, one record set: Loop's devicestatus override and profile switches</title>
<desc>Two hubs, one record set: Loop's devicestatus override and profile switches. c3-loop-ds-override: 2 of 3 Nocturne readings differ from cgm-remote-monitor; c4-ps-timed-after-permanent: 1 of 3 Nocturne readings differ from cgm-remote-monitor; c5-aaps-timeshift-ms: 2 of 2 Nocturne readings differ from cgm-remote-monitor. measured, tools/lab/hub-active-state, run 2026-10-12: cgm-remote-monitor fade2299 (15.0.9), Nocturne 42275c812. Synthetic records; T0 = 2026-01-15T00:00:00.000Z.</desc>
