<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">Two hubs, one record set: Loop's devicestatus override and profile switches</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel: the records as written (arrival order, top to bottom); the windows cgm-remote-monitor reported at the query times and</text>
<text x="12" y="59" font-size="12" fill="#555555">the spans Nocturne stored; then what each hub reports as active at each query time. A red cell marked ≠ is a Nocturne reading</text>
<text x="12" y="74" font-size="12" fill="#555555">that differs from cgm-remote-monitor's.</text>
