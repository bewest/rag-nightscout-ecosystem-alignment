<svg xmlns="http://www.w3.org/2000/svg" width="720" height="381" viewBox="0 0 720 381" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A13 · Sampled state</title>
<desc>A13 · Sampled state: A kind whose endedEncoding is sampled-state has no instance records: each record carries the current value, which holds from the record's time until the next record of the kind and product. The value reported is the first declared path's. Cases drawn: sampled-state-latest-value: A sampled-state kind is the latest sample's value, each sample holding until the next.</desc>
<rect x="0" y="0" width="720" height="381" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A13 · Sampled state</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
<rect x="12" y="97" width="696" height="236" rx="6" fill="#f4f4f4"/>
<line x1="195.8" y1="157" x2="195.8" y2="303" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="283.5" y1="157" x2="283.5" y2="303" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="18" y="115" font-size="12.5" fill="#111111" font-weight="bold">sampled-state-latest-value — A sampled-state kind is the latest sample's value, each sample holding until the</text>
<text x="18" y="131" font-size="12.5" fill="#111111" font-weight="bold">next</text>
