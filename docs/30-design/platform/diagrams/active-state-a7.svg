<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1014" viewBox="0 0 720 1014" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A7 · Supersession by start</title>
<desc>A7 · Supersession by start: Under supersedes, an instance ends at the start of the next instance of the same kind and product that starts after it and before its end, with superseded. Order is by start, never by arrival, so a backfilled earlier instance is ended by the later one whichever arrived first. Two instances that start at the same instant: the one whose last write was received later supersedes. Cases drawn: backfill-supersedes-by-start: An earlier instance received later is still ended by the later-starting one; in-order-same-result: Received in time order, the same instances; equal-start-last-write-wins: At an equal start, the instance whose last write was received later supersedes; deleted-before-start-does-not-supersede: A record deleted before its start ends nothing.</desc>
<rect x="0" y="0" width="720" height="1014" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A7 · Supersession by start</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
