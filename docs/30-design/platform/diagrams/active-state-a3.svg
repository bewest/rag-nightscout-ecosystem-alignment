<svg xmlns="http://www.w3.org/2000/svg" width="720" height="421" viewBox="0 0 720 421" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A3 · Start is the record's own time</title>
<desc>A3 · Start is the record's own time: An instance starts at its record's timeField (created_at when none is declared), never at the time in its _id or the time the hub received it ([identity I3](identity.md#1-rules)). Cases drawn: applied-duration-in-declared-unit: An applied sample is in effect from its own time, for its duration in the declared unit.</desc>
<rect x="0" y="0" width="720" height="421" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A3 · Start is the record's own time</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
