<svg xmlns="http://www.w3.org/2000/svg" width="720" height="563" viewBox="0 0 720 563" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A9 · Overlap is reported, not resolved</title>
<desc>A9 · Overlap is reported, not resolved: For a kind that is exclusiveWithinSlot and declares neither supersedes nor overlay, overlapping instances are all reported active, each marked overlap. Cases drawn: exclusive-overlap-reported: Overlapping instances of an exclusive kind that does not supersede are both reported, as an overlap; exclusive-supersedes: The same records under a superseding kind: one instance.</desc>
<rect x="0" y="0" width="720" height="563" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A9 · Overlap is reported, not resolved</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
<rect x="12" y="97" width="696" height="212" rx="6" fill="#f4f4f4"/>
