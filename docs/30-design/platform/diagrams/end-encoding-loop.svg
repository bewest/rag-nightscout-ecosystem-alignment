<svg xmlns="http://www.w3.org/2000/svg" width="720" height="632" viewBox="0 0 720 632" font-family="Helvetica, Arial, sans-serif" role="img">
<title>How Loop encodes an end, per intent kind</title>
<desc>How Loop encodes an end, per intent kind. Override: ended amend-duration; PreMealTarget: ended not on the wire; LoopMode: ended sampled-state. read-derived, specs/sync/registrations/loop.yaml; controller source cited by its evidence: LoopKit 325bd820, Loop c2fddb76, NightscoutKit 4ec9fd1, NightscoutService fe075ef.</desc>
<rect x="0" y="0" width="720" height="632" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">How Loop encodes an end, per intent kind</text>
<text x="12" y="44" font-size="12" fill="#555555">Schematic, not to scale. Black bars are the records the controller writes (dashed: scheduled, not yet started); the blue bar is the</text>
<text x="12" y="59" font-size="12" fill="#555555">instance a hub derives from them under the state and intent rules named in brackets. k is one identity value, D a duration.</text>
<rect x="12" y="82" width="696" height="246" rx="6" fill="#f4f4f4"/>
<text x="18" y="100" font-size="12.5" fill="#111111" font-weight="bold">Override · TemporaryScheduleOverride</text>
<text x="18" y="122" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="122" font-size="12" fill="#111111">endedEncoding: amend-duration</text>
<text x="18" y="142" font-size="12" fill="#111111">write 1</text>
<rect x="183.4" y="132" width="214.4" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="405.8" y="142" font-size="12" fill="#111111">_id = k, duration D</text>
<text x="18" y="162" font-size="12" fill="#111111">write 2 (amend)</text>
<rect x="183.4" y="152" width="107.2" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="298.6" y="162" font-size="12" fill="#111111">same _id = k, duration shortened</text>
<text x="18" y="182" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="172" width="107.2" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<line x1="290.6" y1="170" x2="290.6" y2="186" stroke="#1f5fa8" stroke-width="2"/>
<text x="298.6" y="182" font-size="12" fill="#111111">ends early: cancelled (A5)</text>
<text x="18" y="206" font-size="12" fill="#555555" font-weight="bold">cancelled before start</text>
<text x="162" y="206" font-size="12" fill="#111111">cancelBeforeStartEncoding: delete</text>
<text x="18" y="226" font-size="12" fill="#111111">scheduled, then</text>
<line x1="204.9" y1="212" x2="204.9" y2="232" stroke="#555555" stroke-width="1" stroke-dasharray="2,2"/>
<rect x="290.6" y="216" width="107.2" height="12" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M200.4,217.5 L209.4,226.5 M200.4,226.5 L209.4,217.5" stroke="#d03b3b" stroke-width="2" fill="none"/>
<text x="405.8" y="226" font-size="12" fill="#111111">delete received before the start</text>
<text x="18" y="246" font-size="12" fill="#1f5fa8">instance</text>
<text x="183.4" y="246" font-size="12" fill="#111111">ended deletedBeforeStart, never active (A6)</text>
<text x="18" y="269" font-size="12" fill="#555555">carrier: treatments, eventType Temporary Override; identity: _id</text>
<text x="18" y="285" font-size="12" fill="#555555">duration: duration in minutes; open-ended: durationType = indefinite</text>
<text x="18" y="301" font-size="12" fill="#555555">slot override · exclusiveWithinSlot · supersedes · coexists with preMeal</text>
<text x="18" y="317" font-size="12" fill="#555555">end reasons: expired (natural), cancelled (early), superseded (early), deletedBeforeStart (deleted)</text>
<rect x="12" y="338" width="696" height="90" rx="6" fill="#f4f4f4"/>
<text x="18" y="356" font-size="12.5" fill="#111111" font-weight="bold">PreMealTarget · TemporaryScheduleOverride (context preMeal)</text>
<text x="18" y="378" font-size="12" fill="#555555" font-weight="bold">on the wire</text>
<text x="162" y="378" font-size="12" fill="#111111">wire: null, the controller keeps the intent and publishes no instance record</text>
<text x="18" y="401" font-size="12" fill="#555555">slot preMeal · exclusiveWithinSlot · coexists with override</text>
<text x="18" y="417" font-size="12" fill="#555555">end reasons: expired, cancelled, endedByTrigger (triggers carbs, loopOff)</text>
<rect x="12" y="438" width="696" height="146" rx="6" fill="#f4f4f4"/>
<text x="18" y="456" font-size="12.5" fill="#111111" font-weight="bold">LoopMode · dosingEnabled</text>
<text x="18" y="478" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="478" font-size="12" fill="#111111">endedEncoding: sampled-state</text>
<text x="18" y="498" font-size="12" fill="#111111">profile records</text>
<circle cx="183.4" cy="494" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="189.4" y="498" font-size="12" fill="#111111">a</text>
<circle cx="237" cy="494" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="243" y="498" font-size="12" fill="#111111">a</text>
<circle cx="290.6" cy="494" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="296.6" y="498" font-size="12" fill="#111111">a</text>
<circle cx="344.2" cy="494" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="350.2" y="498" font-size="12" fill="#111111">b</text>
<circle cx="397.8" cy="494" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="403.8" y="498" font-size="12" fill="#111111">b</text>
<text x="417.8" y="498" font-size="12" fill="#111111">loopSettings.dosingEnabled on every record</text>
<text x="18" y="518" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="508" width="160.8" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<text x="187.4" y="518" font-size="12" fill="#111111">a</text>
<rect x="344.2" y="508" width="53.6" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<path d="M397.8,511 L403.8,514 L397.8,517 Z" fill="#1f5fa8"/>
<text x="348.2" y="518" font-size="12" fill="#111111">b</text>
<text x="411.8" y="518" font-size="12" fill="#111111">each value holds until the next (A13)</text>
<text x="18" y="541" font-size="12" fill="#555555">carrier: profile; identity: no identity</text>
<text x="18" y="557" font-size="12" fill="#555555">slot loopMode · exclusiveWithinSlot</text>
<text x="18" y="573" font-size="12" fill="#555555">end reasons: not declared</text>
<text x="12" y="598" font-size="12" fill="#555555" font-style="italic">read-derived, specs/sync/registrations/loop.yaml; controller source cited by its evidence: LoopKit 325bd820, Loop c2fddb76,</text>
<text x="12" y="613" font-size="12" fill="#555555" font-style="italic">NightscoutKit 4ec9fd1, NightscoutService fe075ef.</text>
</svg>
