<svg xmlns="http://www.w3.org/2000/svg" width="720" height="938" viewBox="0 0 720 938" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A5 · End encodings</title>
<desc>A5 · End encodings: An amendment that shortens an instance (amend-duration, repost-same-created_at, or delete-and-repost under one identity) ends it early, with end reason cancelled; one that runs its duration ends expired. Under zero-duration-record, a zero-duration record ends the latest-starting instance of the kind and product that started strictly before it and is active at its time, with cancelled, and is not an instance itself; an instance starting at the marker's own time is not ended. The end reason describes an instance once it has ended; an amendment that shortens an instance is read as an early end, and an edit that only shortens it reads the same. Cases drawn: zero-duration-ends-instance: A zero-duration record ends the instance active at its time and is not an instance; no-end-marker: Without an end marker the instance runs its duration; marker-at-next-start: An end marker at the instant the next target starts ends only the earlier one; repost-same-identity-amends: A re-post with the same identity amends the instance it names.</desc>
<rect x="0" y="0" width="720" height="938" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A5 · End encodings</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
