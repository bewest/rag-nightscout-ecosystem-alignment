<svg xmlns="http://www.w3.org/2000/svg" width="720" height="784" viewBox="0 0 720 784" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A8 · Overlay</title>
<desc>A8 · Overlay: Under overlay, a timed instance applies over an open-ended one without ending it; the open-ended one is not active while the timed one is, and is active again when it ends. Cases drawn: overlay-returns-to-open-ended: A timed instance applies over an open-ended one, which applies again when it ends; supersedes-without-overlay: Without overlay, a superseding kind ends the open-ended instance for good; permanent-after-temporary-supersedes: A permanent switch that starts during a temporary one supersedes it.</desc>
<rect x="0" y="0" width="720" height="784" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">A8 · Overlay</text>
<text x="12" y="44" font-size="12" fill="#555555">Each panel is one conformance case: the records in the order the hub received them, the instances the case expects (blue), and</text>
<text x="12" y="59" font-size="12" fill="#555555">what it expects to be active at each dashed line. A hollow dot is created_at, where the record's time comes from another declared</text>
<text x="12" y="74" font-size="12" fill="#555555">field.</text>
