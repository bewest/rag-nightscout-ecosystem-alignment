<svg xmlns="http://www.w3.org/2000/svg" width="720" height="733" viewBox="0 0 720 733" font-family="Helvetica, Arial, sans-serif" role="img">
<title>How Trio encodes an end, per intent kind</title>
<desc>How Trio encodes an end, per intent kind. Override: ended delete-and-repost; TemporaryTarget: ended repost-same-created_at; LoopMode: ended sampled-state. read-derived, specs/sync/registrations/trio.yaml; controller source cited by its evidence: Trio e41c9db37.</desc>
<rect x="0" y="0" width="720" height="733" fill="#ffffff"/>
<text x="12" y="24" font-size="14" fill="#111111" font-weight="bold">How Trio encodes an end, per intent kind</text>
<text x="12" y="44" font-size="12" fill="#555555">Schematic, not to scale. Black bars are the records the controller writes (dashed: scheduled, not yet started); the blue bar is the</text>
<text x="12" y="59" font-size="12" fill="#555555">instance a hub derives from them under the state and intent rules named in brackets. k is one identity value, D a duration.</text>
<rect x="12" y="82" width="696" height="246" rx="6" fill="#f4f4f4"/>
<text x="18" y="100" font-size="12.5" fill="#111111" font-weight="bold">Override · OverrideStored</text>
<text x="18" y="122" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="122" font-size="12" fill="#111111">endedEncoding: delete-and-repost</text>
<text x="18" y="142" font-size="12" fill="#111111">write 1, then delete</text>
<rect x="183.4" y="132" width="214.4" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<path d="M286.1,133.5 L295.1,142.5 M286.1,142.5 L295.1,133.5" stroke="#d03b3b" stroke-width="2" fill="none"/>
<text x="405.8" y="142" font-size="12" fill="#111111">deleted when it ends early</text>
<text x="18" y="162" font-size="12" fill="#111111">write 2 (re-post)</text>
<rect x="183.4" y="152" width="107.2" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="298.6" y="162" font-size="12" fill="#111111">new _id, same created_at + eventType, duration shortened</text>
<text x="18" y="182" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="172" width="107.2" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<line x1="290.6" y1="170" x2="290.6" y2="186" stroke="#1f5fa8" stroke-width="2"/>
<text x="298.6" y="182" font-size="12" fill="#111111">ends early: cancelled (A5)</text>
<text x="18" y="206" font-size="12" fill="#555555" font-weight="bold">cancelled before start</text>
<text x="162" y="206" font-size="12" fill="#111111">cancelBeforeStartEncoding: delete</text>
<text x="18" y="226" font-size="12" fill="#111111">scheduled, then</text>
<line x1="204.9" y1="212" x2="204.9" y2="232" stroke="#555555" stroke-width="1" stroke-dasharray="2,2"/>
<rect x="290.6" y="216" width="107.2" height="12" rx="2" fill="#ffffff" stroke="#555555" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M200.4,217.5 L209.4,226.5 M200.4,226.5 L209.4,217.5" stroke="#d03b3b" stroke-width="2" fill="none"/>
<text x="405.8" y="226" font-size="12" fill="#111111">delete received before the start</text>
<text x="18" y="246" font-size="12" fill="#1f5fa8">instance</text>
<text x="183.4" y="246" font-size="12" fill="#111111">ended deletedBeforeStart, never active (A6)</text>
<text x="18" y="269" font-size="12" fill="#555555">carrier: treatments, eventType Exercise; identity: created_at + eventType</text>
<text x="18" y="285" font-size="12" fill="#555555">duration: duration in minutes; open-ended: duration = 43200</text>
<text x="18" y="301" font-size="12" fill="#555555">slot override · exclusiveWithinSlot · supersedes · coexists with temporaryTarget</text>
<text x="18" y="317" font-size="12" fill="#555555">end reasons: not declared</text>
<rect x="12" y="338" width="696" height="206" rx="6" fill="#f4f4f4"/>
<text x="18" y="356" font-size="12.5" fill="#111111" font-weight="bold">TemporaryTarget</text>
<text x="18" y="378" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="378" font-size="12" fill="#111111">endedEncoding: repost-same-created_at</text>
<text x="18" y="398" font-size="12" fill="#111111">write 1</text>
<rect x="183.4" y="388" width="214.4" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="405.8" y="398" font-size="12" fill="#111111">created_at + eventType = k, duration D</text>
<text x="18" y="418" font-size="12" fill="#111111">write 2 (re-post)</text>
<rect x="183.4" y="408" width="107.2" height="12" rx="2" fill="#e6e6e6" stroke="#111111" stroke-width="1"/>
<text x="298.6" y="418" font-size="12" fill="#111111">same created_at + eventType = k, duration shortened</text>
<text x="18" y="438" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="428" width="107.2" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<line x1="290.6" y1="426" x2="290.6" y2="442" stroke="#1f5fa8" stroke-width="2"/>
<text x="298.6" y="438" font-size="12" fill="#111111">ends early: cancelled (A5)</text>
<text x="18" y="462" font-size="12" fill="#555555" font-weight="bold">cancelled before start</text>
<text x="162" y="462" font-size="12" fill="#111111">cancelBeforeStartEncoding: not declared</text>
<text x="18" y="485" font-size="12" fill="#555555">carrier: treatments, eventType Temporary Target; identity: created_at + eventType</text>
<text x="18" y="501" font-size="12" fill="#555555">duration: duration in minutes</text>
<text x="18" y="517" font-size="12" fill="#555555">slot temporaryTarget · exclusiveWithinSlot · supersedes · coexists with override</text>
<text x="18" y="533" font-size="12" fill="#555555">end reasons: not declared</text>
<rect x="12" y="554" width="696" height="146" rx="6" fill="#f4f4f4"/>
<text x="18" y="572" font-size="12.5" fill="#111111" font-weight="bold">LoopMode · DosingMode</text>
<text x="18" y="594" font-size="12" fill="#555555" font-weight="bold">ended early</text>
<text x="162" y="594" font-size="12" fill="#111111">endedEncoding: sampled-state</text>
<text x="18" y="614" font-size="12" fill="#111111">devicestatus records</text>
<circle cx="183.4" cy="610" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="189.4" y="614" font-size="12" fill="#111111">a</text>
<circle cx="237" cy="610" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="243" y="614" font-size="12" fill="#111111">a</text>
<circle cx="290.6" cy="610" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="296.6" y="614" font-size="12" fill="#111111">a</text>
<circle cx="344.2" cy="610" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="350.2" y="614" font-size="12" fill="#111111">b</text>
<circle cx="397.8" cy="610" r="3.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<text x="403.8" y="614" font-size="12" fill="#111111">b</text>
<text x="417.8" y="614" font-size="12" fill="#111111">openaps.dosingMode on every record</text>
<text x="18" y="634" font-size="12" fill="#1f5fa8">instance</text>
<rect x="183.4" y="624" width="160.8" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<text x="187.4" y="634" font-size="12" fill="#111111">a</text>
<rect x="344.2" y="624" width="53.6" height="12" rx="2" fill="#dce7f5" stroke="#1f5fa8" stroke-width="1"/>
<path d="M397.8,627 L403.8,630 L397.8,633 Z" fill="#1f5fa8"/>
<text x="348.2" y="634" font-size="12" fill="#111111">b</text>
<text x="411.8" y="634" font-size="12" fill="#111111">each value holds until the next (A13)</text>
<text x="18" y="657" font-size="12" fill="#555555">carrier: devicestatus; identity: no identity</text>
<text x="18" y="673" font-size="12" fill="#555555">slot loopMode · exclusiveWithinSlot</text>
<text x="18" y="689" font-size="12" fill="#555555">end reasons: not declared</text>
<text x="12" y="714" font-size="12" fill="#555555" font-style="italic">read-derived, specs/sync/registrations/trio.yaml; controller source cited by its evidence: Trio e41c9db37.</text>
</svg>
