<text x="200.9" y="244.8" font-size="11" text-anchor="middle" fill="#111111">A named operator, with its</text>
<text x="200.9" y="258.2" font-size="11" text-anchor="middle" fill="#111111">own contract, insurance</text>
<text x="200.9" y="271.8" font-size="11" text-anchor="middle" fill="#111111">and successor</text>
