<g class="node" data-id="law"><rect x="48.0" y="52.0" width="172.7" height="54.5" rx="5" fill="#dfe7f2" stroke="#333333" stroke-width="1"/>
<use href="#icon-landmark" x="57.0" y="71.2" width="16" height="16" color="#3a4656"/>
<text x="145.4" y="69.8" font-size="11" text-anchor="middle" fill="#111111">Privacy and copyright law</text>
<text x="145.4" y="83.2" font-size="11" text-anchor="middle" fill="#111111">(HIPAA, GDPR, DMCA</text>
<text x="145.4" y="96.8" font-size="11" text-anchor="middle" fill="#111111">data exemption)</text>
</g>
<g class="node" data-id="mfr"><rect x="70.9" y="177.2" width="126.9" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-factory" x="79.9" y="189.8" width="16" height="16" color="#3a4656"/>
<text x="145.4" y="195.0" font-size="11" text-anchor="middle" fill="#111111">Pump and CGM</text>
<text x="145.4" y="208.5" font-size="11" text-anchor="middle" fill="#111111">manufacturers</text>
</g>
<g class="node" data-id="clinic"><rect x="676.7" y="170.5" width="121.4" height="54.5" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-stethoscope" x="685.7" y="189.8" width="16" height="16" color="#3a4656"/>
<text x="748.4" y="188.2" font-size="11" text-anchor="middle" fill="#111111">Clinic or care</text>
<text x="748.4" y="201.8" font-size="11" text-anchor="middle" fill="#111111">team (holds</text>
<text x="748.4" y="215.2" font-size="11" text-anchor="middle" fill="#111111">health records)</text>
</g>
<g class="node" data-id="cloud"><rect x="65.4" y="317.5" width="137.8" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-cloud" x="74.4" y="330.0" width="16" height="16" color="#3a4656"/>
<text x="145.4" y="335.2" font-size="11" text-anchor="middle" fill="#111111">Vendor cloud and</text>
<text x="145.4" y="348.8" font-size="11" text-anchor="middle" fill="#111111">its follower service</text>
</g>
<g class="node" data-id="person"><rect x="276.7" y="305.0" width="150.1" height="66.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-user" x="285.7" y="330.0" width="16" height="16" color="#3a4656"/>
<text x="362.8" y="335.2" font-size="11" text-anchor="middle" fill="#111111">Person with diabetes</text>
<text x="362.8" y="348.8" font-size="11" text-anchor="middle" fill="#111111">or their family</text>
</g>
<g class="node" data-id="helper"><rect x="677.4" y="451.0" width="120.0" height="54.5" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-users" x="686.4" y="470.2" width="16" height="16" color="#3a4656"/>
<text x="748.4" y="468.8" font-size="11" text-anchor="middle" fill="#111111">Caregivers,</text>
<text x="748.4" y="482.2" font-size="11" text-anchor="middle" fill="#111111">followers and</text>
<text x="748.4" y="495.8" font-size="11" text-anchor="middle" fill="#111111">clinicians</text>
</g>
<g class="node" data-id="site"><rect x="282.5" y="569.5" width="138.5" height="41.0" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-server" x="291.5" y="582.0" width="16" height="16" color="#3a4656"/>
<text x="362.8" y="587.2" font-size="11" text-anchor="middle" fill="#111111">Nightscout site</text>
<text x="362.8" y="600.8" font-size="11" text-anchor="middle" fill="#111111">(the person's own)</text>
</g>
<g class="elabel" data-k="0">
<text x="352.8" y="149.3" font-size="10" text-anchor="end" fill="#00796b">access from clinics (HIPAA),</text>
<text x="352.8" y="161.3" font-size="10" text-anchor="end" fill="#00796b">copies (GDPR); DMCA data</text>
<text x="352.8" y="173.3" font-size="10" text-anchor="end" fill="#00796b">exemption is a defence</text>
</g>
<g class="elabel" data-k="1">
<text x="123.4" y="270.9" font-size="10" text-anchor="end" fill="#1f5fa8">runs</text>
</g>
<g class="elabel" data-k="2">
<text x="336.8" y="231.5" font-size="10" text-anchor="end" fill="#7b3294">consumer terms: no automated</text>
<text x="336.8" y="243.5" font-size="10" text-anchor="end" fill="#7b3294">access, no unauthorized</text>
<text x="336.8" y="255.5" font-size="10" text-anchor="end" fill="#7b3294">apps (Dexcom §5.11)</text>
</g>
<g class="elabel" data-k="3">
<text x="344.8" y="431.5" font-size="10" text-anchor="end" fill="#1f5fa8">vendor login and API</text>
<text x="344.8" y="443.5" font-size="10" text-anchor="end" fill="#1f5fa8">secret kept in the</text>
<text x="344.8" y="455.5" font-size="10" text-anchor="end" fill="#1f5fa8">site's configuration</text>
</g>
<g class="elabel" data-k="4">
<text x="125.4" y="494.0" font-size="10" text-anchor="start" fill="#555555">a bridge logs in as the</text>
<text x="125.4" y="506.0" font-size="10" text-anchor="start" fill="#555555">person to a follower</text>
<text x="125.4" y="518.0" font-size="10" text-anchor="start" fill="#555555">service not documented</text>
<text x="125.4" y="530.0" font-size="10" text-anchor="start" fill="#555555">for this use</text>
</g>
<g class="elabel" data-k="5">
<text x="579.2" y="546.0" font-size="10" text-anchor="middle" fill="#555555">anyone with the address</text>
<text x="579.2" y="558.0" font-size="10" text-anchor="middle" fill="#555555">(default role readable),</text>
<text x="579.2" y="570.0" font-size="10" text-anchor="middle" fill="#555555">or the secret or a token:</text>
<text x="579.2" y="582.0" font-size="10" text-anchor="middle" fill="#555555">all data, or none</text>
</g>
<g class="elabel" data-k="6">
<text x="628.7" y="360.0" font-size="10" text-anchor="middle" fill="#1f5fa8">shares the address, the</text>
<text x="628.7" y="372.0" font-size="10" text-anchor="middle" fill="#1f5fa8">secret or a token; no</text>
<text x="628.7" y="384.0" font-size="10" text-anchor="middle" fill="#1f5fa8">scoped grant exists</text>
</g>
<g class="elabel" data-k="7">
<text x="435.9" y="425.0" font-size="10" text-anchor="middle" fill="#555555">vendor follower app</text>
<text x="435.9" y="437.0" font-size="10" text-anchor="middle" fill="#555555">(MiniMed: up to five</text>
<text x="435.9" y="449.0" font-size="10" text-anchor="middle" fill="#555555">care partners)</text>
</g>
<g class="elabel" data-k="8">
<text x="432.3" y="257.0" font-size="10" text-anchor="middle" fill="#555555">clinic upload</text>
</g>
<g class="elabel" data-k="9">
<text x="628.7" y="310.0" font-size="10" text-anchor="middle" fill="#555555">copy of records on</text>
<text x="628.7" y="322.0" font-size="10" text-anchor="middle" fill="#555555">request (HIPAA)</text>
</g>
</g></svg>
