<g class="node" data-id="writers"><rect x="38.4" y="79.5" width="144.6" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-smartphone" x="47.4" y="92.0" width="16" height="16" color="#3a4656"/>
<text x="121.7" y="97.2" font-size="11" text-anchor="middle" fill="#111111">Writers: controller</text>
<text x="121.7" y="110.8" font-size="11" text-anchor="middle" fill="#111111">apps and uploaders</text>
</g>
<g class="node" data-id="decl"><rect x="288.3" y="66.0" width="155.6" height="68.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1" stroke-dasharray="5,3"/>
<use href="#icon-clipboard-list" x="297.3" y="92.0" width="16" height="16" color="#3a4656"/>
<text x="377.1" y="83.8" font-size="11" text-anchor="middle" fill="#111111">Definitions: what each</text>
<text x="377.1" y="97.2" font-size="11" text-anchor="middle" fill="#111111">writer's data means</text>
<text x="377.1" y="110.8" font-size="11" text-anchor="middle" fill="#111111">(registration, L2)</text>
<text x="377.1" y="124.2" font-size="11" text-anchor="middle" fill="#111111">(proposed)</text>
</g>
<g class="node" data-id="hub"><rect x="50.0" y="242.0" width="121.4" height="54.5" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-server" x="59.0" y="261.2" width="16" height="16" color="#3a4656"/>
<text x="121.7" y="259.8" font-size="11" text-anchor="middle" fill="#111111">Nightscout hub</text>
<text x="121.7" y="273.2" font-size="11" text-anchor="middle" fill="#111111">(binds, routes,</text>
<text x="121.7" y="286.8" font-size="11" text-anchor="middle" fill="#111111">records)</text>
</g>
<g class="node" data-id="quirks"><rect x="287.4" y="242.0" width="157.4" height="54.5" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-database" x="296.4" y="261.2" width="16" height="16" color="#3a4656"/>
<text x="377.1" y="259.8" font-size="11" text-anchor="middle" fill="#111111">Quirks scoped to the</text>
<text x="377.1" y="273.2" font-size="11" text-anchor="middle" fill="#111111">versions that write</text>
<text x="377.1" y="286.8" font-size="11" text-anchor="middle" fill="#111111">them (D20)</text>
</g>
<g class="node" data-id="readers"><rect x="32.0" y="374.5" width="157.4" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-monitor-smartphone" x="41.0" y="387.0" width="16" height="16" color="#3a4656"/>
<text x="121.7" y="392.2" font-size="11" text-anchor="middle" fill="#111111">Readers: followers,</text>
<text x="121.7" y="405.8" font-size="11" text-anchor="middle" fill="#111111">reports, research tools</text>
</g>
<g class="elabel" data-k="0">
<text x="113.7" y="154.0" font-size="10" text-anchor="start" fill="#555555">typed records with</text>
<text x="113.7" y="166.0" font-size="10" text-anchor="start" fill="#555555">an identifier</text>
<text x="113.7" y="178.0" font-size="10" text-anchor="start" fill="#555555">(L0, L1)</text>
</g>
<g class="elabel" data-k="1">
<text x="235.7" y="80.0" font-size="10" text-anchor="middle" fill="#1f5fa8">declares its</text>
<text x="235.7" y="92.0" font-size="10" text-anchor="middle" fill="#1f5fa8">own definitions</text>
</g>
<g class="elabel" data-k="2">
<text x="242.8" y="202.0" font-size="10" text-anchor="middle" fill="#1f5fa8">accepted per element;</text>
<text x="242.8" y="214.0" font-size="10" text-anchor="middle" fill="#1f5fa8">bound to the writer's</text>
<text x="242.8" y="226.0" font-size="10" text-anchor="middle" fill="#1f5fa8">credential</text>
</g>
<g class="elabel" data-k="3">
<text x="229.4" y="283.2" font-size="10" text-anchor="middle" fill="#555555">a mapping applied is</text>
<text x="229.4" y="295.2" font-size="10" text-anchor="middle" fill="#555555">recorded on the record</text>
<text x="229.4" y="307.2" font-size="10" text-anchor="middle" fill="#555555">(quirksApplied)</text>
</g>
<g class="elabel" data-k="4">
<text x="103.7" y="326.5" font-size="10" text-anchor="end" fill="#555555">records attributed to</text>
<text x="103.7" y="338.5" font-size="10" text-anchor="end" fill="#555555">the writer and the</text>
<text x="103.7" y="350.5" font-size="10" text-anchor="end" fill="#555555">definition</text>
</g>
</g></svg>
