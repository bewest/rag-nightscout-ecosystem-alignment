<use href="#icon-factory" x="27.0" y="178.5" width="16" height="16" color="#3a4656"/>
<text x="89.0" y="183.8" font-size="11" text-anchor="middle" fill="#111111">Manufacturer</text>
<text x="89.0" y="197.2" font-size="11" text-anchor="middle" fill="#111111">(data holder)</text>
</g>
<g class="node" data-id="person"><rect x="194.0" y="271.0" width="120.0" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-user" x="203.0" y="283.5" width="16" height="16" color="#3a4656"/>
<text x="265.0" y="288.8" font-size="11" text-anchor="middle" fill="#111111">The person</text>
<text x="265.0" y="302.2" font-size="11" text-anchor="middle" fill="#111111">(the user)</text>
</g>
<g class="node" data-id="third"><rect x="370.0" y="376.0" width="132.4" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-building-2" x="379.0" y="388.5" width="16" height="16" color="#3a4656"/>
<text x="447.2" y="393.8" font-size="11" text-anchor="middle" fill="#111111">The third party</text>
<text x="447.2" y="407.2" font-size="11" text-anchor="middle" fill="#111111">the person chose</text>
</g>
<g class="elabel" data-k="0">
<text x="136.0" y="83.0" font-size="10" text-anchor="middle" fill="#1f5fa8">share at the user's</text>
<text x="136.0" y="95.0" font-size="10" text-anchor="middle" fill="#1f5fa8">request; real-time</text>
<text x="136.0" y="107.0" font-size="10" text-anchor="middle" fill="#1f5fa8">where feasible</text>
</g>
<g class="elabel" data-k="1">
<text x="265.8" y="175.5" font-size="10" text-anchor="start" fill="#00796b">a right to access</text>
<text x="265.8" y="187.5" font-size="10" text-anchor="start" fill="#00796b">and designate</text>
</g>
<g class="elabel" data-k="2">
<text x="512.4" y="258.2" font-size="10" text-anchor="end" fill="#1f5fa8">agreed purposes only;</text>
<text x="512.4" y="270.2" font-size="10" text-anchor="end" fill="#1f5fa8">no onward sharing</text>
</g>
<g class="elabel" data-k="3">
<text x="192.0" y="166.5" font-size="10" text-anchor="middle" fill="#1f5fa8">send my data to</text>
<text x="192.0" y="178.5" font-size="10" text-anchor="middle" fill="#1f5fa8">the party I choose</text>
</g>
<g class="elabel" data-k="4">
<text x="180.2" y="384.5" font-size="10" text-anchor="middle" fill="#555555">the same data,</text>
<text x="180.2" y="396.5" font-size="10" text-anchor="middle" fill="#555555">free to the user</text>
</g>
<g class="elabel" data-k="5">
<text x="312.0" y="368.5" font-size="10" text-anchor="middle" fill="#1f5fa8">the service the</text>
<text x="312.0" y="380.5" font-size="10" text-anchor="middle" fill="#1f5fa8">person chose</text>
</g>
</g></svg>
