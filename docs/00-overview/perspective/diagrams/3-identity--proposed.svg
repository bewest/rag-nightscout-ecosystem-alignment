<g class="node" data-id="owner"><rect x="194.0" y="52.0" width="147.0" height="54.5" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-user" x="203.0" y="71.2" width="16" height="16" color="#3a4656"/>
<text x="278.5" y="69.8" font-size="11" text-anchor="middle" fill="#111111">Site owner (person</text>
<text x="278.5" y="83.2" font-size="11" text-anchor="middle" fill="#111111">or family; the tenant</text>
<text x="278.5" y="96.8" font-size="11" text-anchor="middle" fill="#111111">owner when hosted)</text>
</g>
<g class="node" data-id="hoster"><rect x="578.1" y="58.8" width="129.3" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1" stroke-dasharray="5,3"/>
<use href="#icon-building-2" x="587.1" y="71.2" width="16" height="16" color="#3a4656"/>
<text x="653.7" y="76.5" font-size="11" text-anchor="middle" fill="#111111">Hosting operator</text>
<text x="653.7" y="90.0" font-size="11" text-anchor="middle" fill="#111111">(proposed)</text>
</g>
<g class="node" data-id="people"><rect x="18.0" y="186.5" width="120.0" height="54.5" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-users" x="27.0" y="205.8" width="16" height="16" color="#3a4656"/>
<text x="89.0" y="204.2" font-size="11" text-anchor="middle" fill="#111111">Caregivers,</text>
<text x="89.0" y="217.8" font-size="11" text-anchor="middle" fill="#111111">followers and</text>
<text x="89.0" y="231.2" font-size="11" text-anchor="middle" fill="#111111">clinicians</text>
</g>
<g class="node" data-id="apps"><rect x="397.0" y="186.5" width="120.1" height="54.5" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-smartphone" x="406.0" y="205.8" width="16" height="16" color="#3a4656"/>
<text x="468.1" y="204.2" font-size="11" text-anchor="middle" fill="#111111">Uploaders,</text>
<text x="468.1" y="217.8" font-size="11" text-anchor="middle" fill="#111111">controllers and</text>
<text x="468.1" y="231.2" font-size="11" text-anchor="middle" fill="#111111">client apps</text>
</g>
<g class="node" data-id="hub"><rect x="205.3" y="311.8" width="124.4" height="41.0" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-server" x="214.3" y="324.2" width="16" height="16" color="#3a4656"/>
<text x="278.5" y="329.5" font-size="11" text-anchor="middle" fill="#111111">Nightscout hub:</text>
<text x="278.5" y="343.0" font-size="11" text-anchor="middle" fill="#111111">data API</text>
</g>
<g class="node" data-id="tadmin"><rect x="573.2" y="305.0" width="139.1" height="54.5" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1" stroke-dasharray="5,3"/>
<use href="#icon-settings" x="582.2" y="324.2" width="16" height="16" color="#3a4656"/>
<text x="653.7" y="322.8" font-size="11" text-anchor="middle" fill="#111111">ns-tenant-admin:</text>
<text x="653.7" y="336.2" font-size="11" text-anchor="middle" fill="#111111">the owner's socket</text>
<text x="653.7" y="349.8" font-size="11" text-anchor="middle" fill="#111111">(proposed)</text>
</g>
<g class="node" data-id="reg"><rect x="397.1" y="423.5" width="120.0" height="54.5" rx="5" fill="#e8e8e8" stroke="#333333" stroke-width="1" stroke-dasharray="5,3"/>
<use href="#icon-clipboard-list" x="406.1" y="442.8" width="16" height="16" color="#3a4656"/>
<text x="468.1" y="441.2" font-size="11" text-anchor="middle" fill="#111111">Controller</text>
<text x="468.1" y="454.8" font-size="11" text-anchor="middle" fill="#111111">registration</text>
<text x="468.1" y="468.2" font-size="11" text-anchor="middle" fill="#111111">(proposed)</text>
</g>
<g class="elabel" data-k="1">
<text x="399.1" y="47.2" font-size="10" text-anchor="middle" fill="#1f5fa8">a native per-subject</text>
<text x="399.1" y="59.2" font-size="10" text-anchor="middle" fill="#1f5fa8">credential; never Ory</text>
<text x="399.1" y="71.2" font-size="10" text-anchor="middle" fill="#1f5fa8">(D17)</text>
</g>
<g class="elabel" data-k="2">
<text x="85.0" y="123.9" font-size="10" text-anchor="start" fill="#1f5fa8">per-person login (Ory</text>
<text x="85.0" y="135.9" font-size="10" text-anchor="start" fill="#1f5fa8">Kratos, gated); scoped</text>
<text x="85.0" y="147.9" font-size="10" text-anchor="start" fill="#1f5fa8">grants not yet decided</text>
</g>
<g class="elabel" data-k="3">
<text x="389.4" y="300.2" font-size="10" text-anchor="middle" fill="#1f5fa8">per-tenant token signed</text>
<text x="389.4" y="312.2" font-size="10" text-anchor="middle" fill="#1f5fa8">with the tenant's own</text>
<text x="389.4" y="324.2" font-size="10" text-anchor="middle" fill="#1f5fa8">key (D13, D14)</text>
</g>
<g class="elabel" data-k="4">
<text x="137.7" y="354.2" font-size="10" text-anchor="middle" fill="#1f5fa8">a token Nightscout mints</text>
<text x="137.7" y="366.2" font-size="10" text-anchor="middle" fill="#1f5fa8">after login (D17)</text>
</g>
<g class="elabel" data-k="5">
<text x="93.0" y="273.6" font-size="10" text-anchor="start" fill="#555555">read by role, inside</text>
<text x="93.0" y="285.6" font-size="10" text-anchor="start" fill="#555555">the tenant's own rows</text>
<text x="93.0" y="297.6" font-size="10" text-anchor="start" fill="#555555">(RLS, D3)</text>
</g>
<g class="elabel" data-k="6">
<text x="654.5" y="193.4" font-size="10" text-anchor="start" fill="#1f5fa8">mints the tenant root</text>
<text x="654.5" y="205.4" font-size="10" text-anchor="start" fill="#1f5fa8">credential from ns-admin,</text>
<text x="654.5" y="217.4" font-size="10" text-anchor="start" fill="#1f5fa8">an unreachable port (D7, D13)</text>
</g>
<g class="elabel" data-k="7">
<text x="401.8" y="114.5" font-size="10" text-anchor="middle" fill="#1f5fa8">root credential, which</text>
<text x="401.8" y="126.5" font-size="10" text-anchor="middle" fill="#1f5fa8">the owner can rotate;</text>
<text x="401.8" y="138.5" font-size="10" text-anchor="middle" fill="#1f5fa8">no deployment secret</text>
</g>
<g class="elabel" data-k="8">
<text x="468.9" y="295.9" font-size="10" text-anchor="start" fill="#1f5fa8">registers; bound to the</text>
<text x="468.9" y="307.9" font-size="10" text-anchor="start" fill="#1f5fa8">creating subject, not</text>
<text x="468.9" y="319.9" font-size="10" text-anchor="start" fill="#1f5fa8">the token (§3.5)</text>
</g>
<g class="elabel" data-k="9">
<text x="481.7" y="376.6" font-size="10" text-anchor="start" fill="#1f5fa8">retire, block, release,</text>
<text x="481.7" y="388.6" font-size="10" text-anchor="start" fill="#1f5fa8">transfer; api-secret</text>
<text x="481.7" y="400.6" font-size="10" text-anchor="start" fill="#1f5fa8">bindings move to the</text>
<text x="481.7" y="412.6" font-size="10" text-anchor="start" fill="#1f5fa8">root credential</text>
</g>
</g></svg>
