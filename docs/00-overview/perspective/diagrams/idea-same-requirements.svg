<g class="elabel" data-k="1">
<text x="279.2" y="137.2" font-size="10" text-anchor="end" fill="#1f5fa8">same criteria;</text>
<text x="279.2" y="149.2" font-size="10" text-anchor="end" fill="#1f5fa8">no exemption</text>
</g>
<g class="elabel" data-k="2">
<text x="432.8" y="47.2" font-size="10" text-anchor="middle" fill="#1f5fa8">same criteria;</text>
