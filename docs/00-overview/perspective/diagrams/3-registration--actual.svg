<g class="node" data-id="owner"><rect x="445.5" y="52.0" width="158.7" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-user" x="454.5" y="64.5" width="16" height="16" color="#3a4656"/>
<text x="535.8" y="69.8" font-size="11" text-anchor="middle" fill="#111111">Site owner (the person</text>
<text x="535.8" y="83.2" font-size="11" text-anchor="middle" fill="#111111">or a parent)</text>
</g>
<g class="node" data-id="agent"><rect x="25.3" y="174.0" width="131.8" height="34.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-bot" x="34.3" y="183.0" width="16" height="16" color="#3a4656"/>
<text x="102.2" y="195.0" font-size="11" text-anchor="middle" fill="#111111">Automated agent</text>
</g>
<g class="node" data-id="remote"><rect x="244.9" y="170.5" width="120.0" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-monitor-smartphone" x="253.9" y="183.0" width="16" height="16" color="#3a4656"/>
<text x="315.9" y="188.2" font-size="11" text-anchor="middle" fill="#111111">Caregiver's</text>
<text x="315.9" y="201.8" font-size="11" text-anchor="middle" fill="#111111">remote app</text>
</g>
<g class="node" data-id="hub"><rect x="464.1" y="289.0" width="121.4" height="66.0" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-server" x="473.1" y="314.0" width="16" height="16" color="#3a4656"/>
<text x="535.8" y="326.0" font-size="11" text-anchor="middle" fill="#111111">Nightscout hub</text>
</g>
<g class="node" data-id="uploader"><rect x="18.0" y="432.5" width="146.4" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-upload" x="27.0" y="445.0" width="16" height="16" color="#3a4656"/>
<text x="102.2" y="450.2" font-size="11" text-anchor="middle" fill="#111111">CGM uploaders and</text>
<text x="102.2" y="463.8" font-size="11" text-anchor="middle" fill="#111111">other writers</text>
</g>
<g class="node" data-id="app"><rect x="673.9" y="432.5" width="140.3" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-smartphone" x="682.9" y="445.0" width="16" height="16" color="#3a4656"/>
<text x="755.0" y="450.2" font-size="11" text-anchor="middle" fill="#111111">Controller app</text>
<text x="755.0" y="463.8" font-size="11" text-anchor="middle" fill="#111111">(Loop, Trio, AAPS)</text>
</g>
<g class="elabel" data-k="0">
<text x="505.8" y="182.0" font-size="10" text-anchor="end" fill="#1f5fa8">shares API_SECRET or</text>
<text x="505.8" y="194.0" font-size="10" text-anchor="end" fill="#1f5fa8">tokens; relay permission</text>
<text x="505.8" y="206.0" font-size="10" text-anchor="end" fill="#1f5fa8">only in admin role</text>
</g>
<g class="elabel" data-k="6">
<text x="277.7" y="360.0" font-size="10" text-anchor="middle" fill="#555555">entries, treatments;</text>
<text x="277.7" y="372.0" font-size="10" text-anchor="middle" fill="#555555">known by a free-text</text>
<text x="277.7" y="384.0" font-size="10" text-anchor="middle" fill="#555555">device string</text>
</g>
<g class="elabel" data-k="7">
<text x="547.8" y="391.0" font-size="10" text-anchor="start" fill="#b5541b">devicestatus; told apart</text>
<text x="547.8" y="403.0" font-size="10" text-anchor="start" fill="#b5541b">by key ('loop', 'openaps');</text>
<text x="547.8" y="415.0" font-size="10" text-anchor="start" fill="#b5541b">Trio = AAPS by key</text>
</g>
<g class="elabel" data-k="8">
<text x="599.3" y="475.0" font-size="10" text-anchor="middle" fill="#1f5fa8">push or download;</text>
<text x="599.3" y="487.0" font-size="10" text-anchor="middle" fill="#1f5fa8">no command record,</text>
<text x="599.3" y="499.0" font-size="10" text-anchor="middle" fill="#1f5fa8">no id to acknowledge</text>
</g>
<g class="elabel" data-k="9">
<text x="289.9" y="253.8" font-size="10" text-anchor="end" fill="#1f5fa8">relay request, or an</text>
<text x="289.9" y="265.8" font-size="10" text-anchor="end" fill="#1f5fa8">entity written as</text>
<text x="289.9" y="277.8" font-size="10" text-anchor="end" fill="#1f5fa8">the request</text>
</g>
<g class="elabel" data-k="10">
<text x="319.9" y="251.8" font-size="10" text-anchor="start" fill="#b5541b">the resulting record,</text>
<text x="319.9" y="263.8" font-size="10" text-anchor="start" fill="#b5541b">or a free-text Note</text>
</g>
<g class="elabel" data-k="11">
<text x="221.7" y="298.0" font-size="10" text-anchor="middle" fill="#1f5fa8">uses a shared credential:</text>
<text x="221.7" y="310.0" font-size="10" text-anchor="middle" fill="#1f5fa8">looks like whoever</text>
<text x="221.7" y="322.0" font-size="10" text-anchor="middle" fill="#1f5fa8">shared it</text>
</g>
</g></svg>
