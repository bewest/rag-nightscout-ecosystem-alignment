<use href="#icon-hand-heart" x="404.9" y="64.5" width="16" height="16" color="#3a4656"/>
<text x="486.0" y="69.8" font-size="11" text-anchor="middle" fill="#111111">Nightscout Foundation</text>
<text x="486.0" y="83.2" font-size="11" text-anchor="middle" fill="#111111">(501(c)(3))</text>
</g>
<g class="node" data-id="xbody"><rect x="18.0" y="163.8" width="143.4" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-network" x="27.0" y="176.2" width="16" height="16" color="#3a4656"/>
<text x="100.7" y="181.5" font-size="11" text-anchor="middle" fill="#111111">Cross-project body:</text>
<text x="100.7" y="195.0" font-size="11" text-anchor="middle" fill="#111111">none named</text>
</g>
<g class="node" data-id="projects"><rect x="402.0" y="163.8" width="145.8" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-users" x="411.0" y="176.2" width="16" height="16" color="#3a4656"/>
<text x="486.0" y="181.5" font-size="11" text-anchor="middle" fill="#111111">20 repositories,</text>
<text x="486.0" y="195.0" font-size="11" text-anchor="middle" fill="#111111">each deciding alone</text>
</g>
<g class="node" data-id="ops"><rect x="804.5" y="157.0" width="145.2" height="54.5" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-shield-alert" x="813.5" y="176.2" width="16" height="16" color="#3a4656"/>
<text x="888.1" y="174.8" font-size="11" text-anchor="middle" fill="#111111">Shared operations:</text>
<text x="888.1" y="188.2" font-size="11" text-anchor="middle" fill="#111111">no named runner</text>
<text x="888.1" y="201.8" font-size="11" text-anchor="middle" fill="#111111">for intake or registry</text>
</g>
<g class="node" data-id="hub"><rect x="395.9" y="275.5" width="158.0" height="54.5" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
<use href="#icon-server" x="404.9" y="294.8" width="16" height="16" color="#3a4656"/>
<text x="486.0" y="293.2" font-size="11" text-anchor="middle" fill="#111111">Nightscout hub</text>
<text x="486.0" y="306.8" font-size="11" text-anchor="middle" fill="#111111">(stores what it is sent;</text>
<text x="486.0" y="320.2" font-size="11" text-anchor="middle" fill="#111111">writer guessed by key)</text>
</g>
<g class="node" data-id="writers"><rect x="217.4" y="394.0" width="122.6" height="41.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<use href="#icon-smartphone" x="226.4" y="406.5" width="16" height="16" color="#3a4656"/>
<text x="289.6" y="411.8" font-size="11" text-anchor="middle" fill="#111111">Controller apps</text>
<text x="289.6" y="425.2" font-size="11" text-anchor="middle" fill="#111111">and uploaders</text>
</g>
<g class="node" data-id="readers"><rect x="610.0" y="394.0" width="138.5" height="41.0" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
<use href="#icon-monitor-smartphone" x="619.0" y="406.5" width="16" height="16" color="#3a4656"/>
<text x="690.2" y="411.8" font-size="11" text-anchor="middle" fill="#111111">Followers, reports,</text>
<text x="690.2" y="425.2" font-size="11" text-anchor="middle" fill="#111111">research tools</text>
</g>
<g class="elabel" data-k="1">
<text x="490.0" y="119.4" font-size="10" text-anchor="start" fill="#2e7d32">support by resource</text>
<text x="490.0" y="131.4" font-size="10" text-anchor="start" fill="#2e7d32">request; events,</text>
<text x="490.0" y="143.4" font-size="10" text-anchor="start" fill="#2e7d32">awards</text>
</g>
<g class="elabel" data-k="5">
<text x="468.0" y="231.1" font-size="10" text-anchor="end" fill="#1f5fa8">each display plugin</text>
<text x="468.0" y="243.1" font-size="10" text-anchor="end" fill="#1f5fa8">reads its family's key</text>
<text x="468.0" y="255.1" font-size="10" text-anchor="end" fill="#1f5fa8">(loop, openaps)</text>
</g>
<g class="elabel" data-k="6">
<text x="337.3" y="316.8" font-size="10" text-anchor="middle" fill="#555555">each team's own shape:</text>
<text x="337.3" y="328.8" font-size="10" text-anchor="middle" fill="#555555">20 recorded quirks,</text>
<text x="337.3" y="340.8" font-size="10" text-anchor="middle" fill="#555555">five id conventions</text>
</g>
<g class="elabel" data-k="7">
<text x="616.6" y="270.8" font-size="10" text-anchor="middle" fill="#555555">every shape as sent:</text>
<text x="616.6" y="282.8" font-size="10" text-anchor="middle" fill="#555555">readers handle</text>
<text x="616.6" y="294.8" font-size="10" text-anchor="middle" fill="#555555">each writer</text>
</g>
</g></svg>
