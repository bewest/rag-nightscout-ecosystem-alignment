<text x="261.5" y="680.0" font-size="10" text-anchor="middle" fill="#1f5fa8">one secret or token</text>
<text x="261.5" y="692.0" font-size="10" text-anchor="middle" fill="#1f5fa8">per site, per app</text>
</g>
<g class="elabel" data-k="9">
<text x="331.6" y="726.8" font-size="10" text-anchor="middle" fill="#555555">an app holding the</text>
