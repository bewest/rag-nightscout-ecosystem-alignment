<g class="elabel" data-k="0">
<text x="106.8" y="265.2" font-size="10" text-anchor="end" fill="#00796b">rules for data</text>
<text x="106.8" y="277.2" font-size="10" text-anchor="end" fill="#00796b">held there</text>
</g>
<g class="elabel" data-k="1">
<text x="447.5" y="258.5" font-size="10" text-anchor="middle" fill="#00796b">rules for data</text>
<text x="447.5" y="270.5" font-size="10" text-anchor="middle" fill="#00796b">held there</text>
</g>
<g class="elabel" data-k="6">
<text x="198.0" y="576.2" font-size="10" text-anchor="middle" fill="#1f5fa8">its own sign-in;</text>
