<text x="89.0" y="204.2" font-size="11" text-anchor="middle" fill="#111111">Caregivers,</text>
<text x="89.0" y="217.8" font-size="11" text-anchor="middle" fill="#111111">followers and</text>
<text x="89.0" y="231.2" font-size="11" text-anchor="middle" fill="#111111">clinicians</text>
</g>
<g class="node" data-id="apps"><rect x="397.0" y="186.5" width="120.1" height="54.5" rx="5" fill="#e3f0e3" stroke="#333333" stroke-width="1"/>
