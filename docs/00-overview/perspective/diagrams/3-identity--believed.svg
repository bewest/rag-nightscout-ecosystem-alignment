<text x="468.1" y="204.2" font-size="11" text-anchor="middle" fill="#111111">Uploaders,</text>
<text x="468.1" y="217.8" font-size="11" text-anchor="middle" fill="#111111">controllers and</text>
<text x="468.1" y="231.2" font-size="11" text-anchor="middle" fill="#111111">client apps</text>
</g>
<g class="node" data-id="hub"><rect x="205.3" y="311.8" width="124.4" height="41.0" rx="5" fill="#f3e7d3" stroke="#333333" stroke-width="1"/>
