<text x="278.5" y="329.5" font-size="11" text-anchor="middle" fill="#111111">Nightscout hub:</text>
<text x="278.5" y="343.0" font-size="11" text-anchor="middle" fill="#111111">data API</text>
</g>
<g class="elabel" data-k="0">
<text x="270.5" y="200.1" font-size="10" text-anchor="start" fill="#1f5fa8">sets API_SECRET, a</text>
<text x="270.5" y="212.1" font-size="10" text-anchor="start" fill="#1f5fa8">passphrase of 12 or</text>
<text x="270.5" y="224.1" font-size="10" text-anchor="start" fill="#1f5fa8">more characters</text>
</g>
<g class="elabel" data-k="1">
<text x="399.1" y="47.2" font-size="10" text-anchor="middle" fill="#1f5fa8">gives the API secret</text>
<text x="399.1" y="59.2" font-size="10" text-anchor="middle" fill="#1f5fa8">so the app can upload</text>
</g>
<g class="elabel" data-k="2">
<text x="85.0" y="123.9" font-size="10" text-anchor="start" fill="#1f5fa8">shares the address,</text>
<text x="85.0" y="135.9" font-size="10" text-anchor="start" fill="#1f5fa8">and the secret with</text>
<text x="85.0" y="147.9" font-size="10" text-anchor="start" fill="#1f5fa8">those who help</text>
</g>
<g class="elabel" data-k="3">
<text x="389.4" y="300.2" font-size="10" text-anchor="middle" fill="#1f5fa8">upload with</text>
<text x="389.4" y="312.2" font-size="10" text-anchor="middle" fill="#1f5fa8">the secret</text>
</g>
<g class="elabel" data-k="4">
<text x="137.7" y="354.2" font-size="10" text-anchor="middle" fill="#1f5fa8">open the site</text>
</g>
<g class="elabel" data-k="5">
<text x="93.0" y="273.6" font-size="10" text-anchor="start" fill="#555555">glucose and treatments</text>
</g>
