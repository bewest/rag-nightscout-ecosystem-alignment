name: CI

# Checks that run on a plain checkout, with no externals/ clones.
# Reproduce locally with Python 3.12:
#   python -m compileall -q tools/
#   pip install pyyaml==6.0.3 jsonschema==4.26.0
#   python tools/validate_json.py
#   python tools/validate_telemetry_schema.py
#   make openapi-lint            # Node 22; fetches @redocly/cli 1.34.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # 3.12 or later: tools/ uses PEP 701 f-strings (nested quotes, backslashes)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile every Python file under tools/
        run: python -m compileall -q tools/

  specs-and-fixtures:
    name: Specs and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      - name: OpenAPI specs (specs/openapi/*.yaml)
        run: python tools/validate_json.py

      - name: Telemetry schema fixtures (valid pass, invalid fail)
        run: python tools/validate_telemetry_schema.py

      # validate_json.py above checks only that the top-level keys exist.
      # This lints every spec against the OpenAPI specification and Redocly's
      # recommended rules (config: redocly.yaml, .redocly.lint-ignore.yaml);
      # the CLI version is pinned in the Makefile (REDOCLY_CLI).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: OpenAPI lint (make openapi-lint)
        run: make openapi-lint

  # After the checks above pass on a push to main, build the site, run
  # make site-check, append one commit to gh-pages and push it (the same steps
  # as make site-publish locally; tools/site/README.md). Needs the repository
  # secret SITE_PSEUDONYM_KEY, the same key as the maintainer's
  # ~/.config/nightscout-alignment/pseudonym.key, so participant pseudonyms on
  # the site stay stable. Without the secret the job skips the publish.
  site:
    name: Site (build, check, publish to gh-pages)
    needs: [python-syntax, specs-and-fixtures]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # One publish at a time; a later push waits instead of cancelling a
    # publish part-way.
    concurrency:
      group: site-publish
      cancel-in-progress: false
    steps:
      # Full history, blobs on demand: the living-page check diffs each page's
      # source_commit against HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the pseudonym key secret is set
        id: key
        env:
          SITE_PSEUDONYM_KEY: ${{ secrets.SITE_PSEUDONYM_KEY }}
        run: |
          if [ -n "$SITE_PSEUDONYM_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SITE_PSEUDONYM_KEY is not set; the site is not published"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, check and commit to gh-pages (make site-publish)
        if: steps.key.outputs.present == 'true'
        env:
          SITE_PSEUDONYM_KEY: ${{ secrets.SITE_PSEUDONYM_KEY }}
          SITE_PAGES_WORKTREE: ${{ runner.temp }}/gh-pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          make site-publish

      # A plain fast-forward of the gh-pages that make site-publish fetched; if
      # a local publish landed in between, the push is rejected, not forced.
      - name: Push gh-pages
        if: steps.key.outputs.present == 'true'
        run: |
          WT="$RUNNER_TEMP/gh-pages"
          if git -C "$WT" rev-parse -q --verify refs/heads/gh-pages >/dev/null \
             && ! git -C "$WT" diff --quiet origin/gh-pages gh-pages 2>/dev/null; then
            git -C "$WT" push origin gh-pages:gh-pages
          else
            echo "No new build to push."
          fi
