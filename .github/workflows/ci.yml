name: CI

# Checks that run on a plain checkout, with no externals/ clones.
# Reproduce locally with Python 3.12:
#   python -m compileall -q tools/
#   pip install pyyaml==6.0.3 jsonschema==4.26.0
#   python tools/validate_json.py
#   python tools/validate_telemetry_schema.py

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # 3.12 or later: tools/ uses PEP 701 f-strings (nested quotes, backslashes)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile every Python file under tools/
        run: python -m compileall -q tools/

  specs-and-fixtures:
    name: Specs and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      - name: OpenAPI specs (specs/openapi/*.yaml)
        run: python tools/validate_json.py

      - name: Telemetry schema fixtures (valid pass, invalid fail)
        run: python tools/validate_telemetry_schema.py
